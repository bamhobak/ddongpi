<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12131a">
<title>이피재피똥피</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='52' font-size='84' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%92%A9%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #12131a;
    color: #fff;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  body { position: fixed; inset: 0; }
  #app {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    /* 노치·둥근 모서리·홈바에 화면이 잘리지 않도록 */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 520px;
    max-height: 780px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  @media (min-width: 560px) and (min-height: 700px) { #stage { border-radius: 16px; } }
  canvas { display: block; width: 100%; height: 100%; }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(10px, 2.2vh, 16px);
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    text-align: center;
    background: rgba(10,11,16,.84);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .screen.hidden { display: none; }
  .screen { overflow-y: auto; }

  /* ---- 랭킹판 ---- */
  .board {
    width: 100%; max-width: 320px;
    background: rgba(255,255,255,.06);
    border-radius: 14px; padding: 12px 14px;
  }
  .board h3 {
    font-size: 13px; font-weight: 700; color: #ffd23f;
    letter-spacing: .5px; margin-bottom: 8px;
  }
  .board ol { list-style: none; }
  .board li {
    display: flex; align-items: center; gap: 8px;
    font-size: clamp(12px, 3.4vw, 14px);
    padding: 4px 0; color: #d5d8e2;
  }
  .board li + li { border-top: 1px solid rgba(255,255,255,.06); }
  .board .rk { width: 22px; text-align: center; flex: none; color: #8b90a0; font-weight: 700; }
  .board .nm {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left; color: #fff;
  }
  /* 4위 이하는 굵게 하지 않는다 — 굵기는 1~3위 전용 */
  .board .sc { flex: none; font-weight: 400; color: #ffd23f; font-variant-numeric: tabular-nums; }

  /* 1~3위는 금·은·동으로 따로 */
  .board li.p1, .board li.p2, .board li.p3 {
    margin: 3px 0; padding: 6px 8px; border-radius: 9px;
    border-left: 3px solid;
  }
  .board li.p1 + li, .board li.p2 + li, .board li.p3 + li { border-top: 0; }
  .board li.p1 {
    border-left-color: #ffcc33;
    background: linear-gradient(90deg, rgba(255,204,51,.26), rgba(255,204,51,.04));
    box-shadow: 0 0 14px rgba(255,204,51,.18);
  }
  .board li.p1 .nm { color: #ffe9a8; font-weight: 800; text-shadow: 0 0 10px rgba(255,204,51,.45); }
  .board li.p1 .sc { color: #ffcc33; font-size: 1.12em; font-weight: 800; text-shadow: 0 0 10px rgba(255,204,51,.4); }

  .board li.p2 {
    border-left-color: #cfd6e0;
    background: linear-gradient(90deg, rgba(207,214,224,.20), rgba(207,214,224,.03));
  }
  .board li.p2 .nm { color: #eef2f7; font-weight: 700; }
  .board li.p2 .sc { color: #dfe6ef; font-size: 1.05em; font-weight: 700; }

  .board li.p3 {
    border-left-color: #e0894a;
    background: linear-gradient(90deg, rgba(224,137,74,.20), rgba(224,137,74,.03));
  }
  .board li.p3 .nm { color: #ffd6b0; font-weight: 700; }
  .board li.p3 .sc { color: #f0a166; font-size: 1.03em; font-weight: 700; }

  .board li.p1 .rk, .board li.p2 .rk, .board li.p3 .rk { font-size: 1.15em; }
  /* 내 기록 강조 — 금·은·동 색을 덮지 않도록 테두리로만 표시 */
  .board li.me {
    outline: 2px solid rgba(255,210,63,.9);
    outline-offset: -2px;
    border-radius: 9px;
    padding: 5px 7px;
  }
  .board .empty { font-size: 13px; color: #7f8494; padding: 6px 0; }
  .board[hidden] { display: none; }
  .board.last { background: rgba(255,210,63,.09); }
  .board.last h3 { color: #ffe08a; }
  .board .note {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 11px; color: #7f8494;
  }

  /* ---- 이름 등록 ---- */
  #nameRow { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #nameRow.on { display: flex; }
  #nameRow .tag {
    font-size: 14px; font-weight: 700; color: #ffd23f;
  }
  #nameForm { display: flex; gap: 8px; width: 100%; max-width: 320px; }
  #nameInput {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px;
    padding: 12px 14px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #nameInput::placeholder { color: #757a8a; }
  #nameInput:focus { outline: none; border-color: #ffd23f; }
  #btnSave { padding: 12px 20px; font-size: 15px; flex: none; }
  .screen h1 { font-size: clamp(26px, 7vw, 36px); letter-spacing: -1px; }
  .screen h2 { font-size: clamp(22px, 6vw, 30px); }
  .screen p { font-size: clamp(13px, 3.6vw, 15px); line-height: 1.6; color: #c8cbd6; }
  button {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700;
    font-size: clamp(16px, 4.4vw, 18px);
    color: #12131a; background: #ffd23f;
    padding: 14px 36px; border-radius: 999px;
    transition: transform .08s ease, filter .15s ease;
  }
  button:active { transform: scale(.96); }

  /* ---- 🌙 증강 선택 ---- */
  #augList { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
  .augCard {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 13px 15px; border-radius: 14px;
    background: rgba(255,255,255,.07);
    border: 2px solid rgba(255,255,255,.12);
    color: #fff; font: inherit; font-weight: 400;
    cursor: pointer; transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .augCard:hover { background: rgba(255,210,63,.14); border-color: #ffd23f; }
  .augCard:active { transform: scale(.97); }
  .augCard .ic { font-size: 30px; flex: none; line-height: 1; }
  .augCard .tx { flex: 1; min-width: 0; }
  .augCard .nm2 { font-size: 15px; font-weight: 700; color: #ffd23f; }
  .augCard .ds { font-size: 13px; color: #c8cbd6; margin-top: 2px; }
  .augCard .cnt {
    flex: none; font-size: 11px; font-weight: 700; color: #12131a;
    background: #ffd23f; border-radius: 999px; padding: 3px 8px;
  }
  #augScreen h2 { color: #ffd23f; }
  /* 히든 증강 — 조건을 만족했을 때만 후보에 오른다 */
  .augCard.hid {
    border-color: #c86bff;
    background: linear-gradient(90deg, rgba(200,107,255,.22), rgba(200,107,255,.06));
    box-shadow: 0 0 16px rgba(200,107,255,.25);
  }
  .augCard.hid:hover { background: rgba(200,107,255,.3); border-color: #d99cff; }
  .augCard.hid .nm2 { color: #e0b3ff; }
  .augCard .badge {
    flex: none; font-size: 10px; font-weight: 800; letter-spacing: .5px;
    color: #12131a; background: #c86bff; border-radius: 999px; padding: 3px 8px;
  }

  /* ---- 개발자 통계 패널 (제목 오른쪽 💩 → 비밀번호) ---- */
  #devDot { cursor: pointer; }
  #devScreen { justify-content: flex-start; padding-top: 28px; gap: 12px; }
  #devScreen h2 { font-size: 20px; color: #ffd23f; }
  #devPwRow { display: flex; gap: 8px; align-items: center; }
  #devPw {
    font: inherit; font-size: 16px; text-align: center; letter-spacing: 4px;
    padding: 11px 14px; border-radius: 12px; width: 160px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #devGo { padding: 11px 18px; font-size: 14px; }
  #devPw:focus { outline: none; border-color: #ffd23f; }
  #devBody { width: 100%; max-width: 340px; font-size: 12px; color: #d5d8e2; }
  #devBody .sec {
    background: rgba(255,255,255,.06); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  #devBody h4 { font-size: 12px; color: #ffd23f; margin-bottom: 6px; }
  #devBody table { width: 100%; border-collapse: collapse; }
  #devBody th, #devBody td { padding: 3px 2px; text-align: right; white-space: nowrap; }
  #devBody th { color: #8b90a0; font-weight: 600; font-size: 11px; }
  #devBody td:first-child, #devBody th:first-child { text-align: left; }
  #devBody .lft { text-align: left; white-space: normal; word-break: keep-all; }
  #devBody tr + tr td { border-top: 1px solid rgba(255,255,255,.06); }
  #devBody .num { color: #fff; font-variant-numeric: tabular-nums; }
  #devMsg { font-size: 12px; color: #ff8f8f; min-height: 14px; }
  #devBody .del {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 700;
    color: #fff; background: rgba(255,80,80,.5);
    border-radius: 7px; padding: 3px 8px;
  }
  #devBody .del:hover { background: rgba(255,80,80,.85); }
  #devBody .del:disabled { opacity: .4; cursor: default; }

  #ver {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    font-size: 10px; letter-spacing: 1px;
    color: rgba(255,255,255,.26);
  }

  .big { font-size: clamp(38px, 11vw, 48px); font-weight: 800; color: #ffd23f; }
  .sub { font-size: 14px; color: #9aa0ae; }
  .hint {
    position: absolute; left: 0; right: 0;
    bottom: max(12px, env(safe-area-inset-bottom));
    font-size: 12px; color: #6d7383; text-align: center; padding: 0 16px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="startScreen" class="screen">
      <div id="ver"></div>
      <h1>💩 이피재피똥피 <span id="devDot">💩</span></h1>
      <div class="board">
        <h3>🏆 이번 주 TOP 10</h3>
        <ol id="boardStart"><li class="empty">불러오는 중…</li></ol>
        <div class="note" id="noteStart"></div>
      </div>
      <div class="board last" id="lastBoard" hidden>
        <h3 id="lastTitle">👑 지난주 명예의 전당</h3>
        <ol id="boardLast"></ol>
      </div>
      <button id="btnStart">시작하기</button>
    </div>

    <div id="devScreen" class="screen hidden">
      <h2>개발자 페이지</h2>
      <div id="devPwRow">
        <input id="devPw" type="password" inputmode="numeric" maxlength="16" autocomplete="off">
        <button id="devGo">확인</button>
      </div>
      <div id="devMsg"></div>
      <div id="devBody"></div>
      <button id="devClose">닫기</button>
    </div>

    <div id="augScreen" class="screen hidden">
      <h2 id="augTitle">⭐ 증강 선택 🌙</h2>
      <div id="augList"></div>
    </div>

    <div id="overScreen" class="screen hidden">
      <h2 id="overTitle">게임 오버!</h2>
      <div class="big" id="finalScore">0</div>
      <p id="rankLine"></p>

      <div id="nameRow">
        <div class="tag" id="nameTag">🎉 TOP 10 진입! 이름을 남기세요</div>
        <div id="nameForm">
          <input id="nameInput" type="text" maxlength="12" placeholder="이름 (최대 12자)"
                 autocomplete="off" autocorrect="off" spellcheck="false">
          <button id="btnSave">등록</button>
        </div>
      </div>

      <div class="board">
        <h3>🏆 이번 주 TOP 10</h3>
        <ol id="boardOver"><li class="empty">불러오는 중…</li></ol>
        <div class="note" id="noteOver"></div>
      </div>

      <button id="btnRetry">다시 하기</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* roundRect 미지원 브라우저(구형 사파리) 대비 */
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (typeof r === "number") r = [r, r, r, r];
      const [a, b, c, d] = r.length === 1 ? [r[0], r[0], r[0], r[0]] : r;
      this.moveTo(x + a, y);
      this.arcTo(x + w, y, x + w, y + h, b);
      this.arcTo(x + w, y + h, x, y + h, c);
      this.arcTo(x, y + h, x, y, d);
      this.arcTo(x, y, x + w, y, a);
      this.closePath();
      return this;
    };
  }

  const BASE_H = 720;     // 기준 논리 높이
  let H = BASE_H;         // 논리 높이 — 화면 비율에 맞춰 유동
  let W = 480;            // 논리 너비 — 화면 비율에 맞춰 유동
  let items = [], particles = [], floats = [], clouds = [];
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const stage = document.getElementById("stage");

  const startScreen = document.getElementById("startScreen");
  const overScreen  = document.getElementById("overScreen");
  const elFinal = document.getElementById("finalScore");
  const elRank  = document.getElementById("rankLine");
  const elTitle = document.getElementById("overTitle");

  const GAME_VERSION = "v1.0.22";   // 코드를 고칠 때마다 뒤 두 자리를 올린다
  document.getElementById("ver").textContent = GAME_VERSION;

  const LS_NAME = "epjpddongpi_name";
  const LS_DEV  = "epjpddongpi_device";   // 기기 식별자 (한 기기당 랭킹 한 줄)

  /* ---------- 화면 크기 맞추기 ---------- */
  const DRAW_R = 40;                 // 캐릭터 도안 기준 반지름
  const GROUND_H = 85;               // 잔디 높이 — 이만큼 캐릭터가 위로 올라간다
  const FOOT = 62;                   // player.y 에서 '발이 닿는 선'까지의 거리 (화면 고정)
  const PLAYER_MAX_SPEED = 780;      // 좌우 이동 최고 속도 (논리 px/초)
  const PLAYER_UP = GROUND_H + 54;   // 화면 바닥에서 캐릭터 머리 중심까지
  const player = { x: 240, y: H - 139, r: 32, tx: 240, tilt: 0, hy: 0 };
  // hy = 발을 바닥에 고정했을 때 머리(판정 중심)가 player.y 에서 얼마나 떨어지는지.
  // 그림마다 머리·다리 비율이 달라서 이 값으로 보정해야 그림자 높이와 판정이 어긋나지 않는다.
  function currentSprite(now) {
    if (now < hurtUntil && SPR.hurt.img) return SPR.hurt;
    return SPR[facing].img ? SPR[facing] : null;
  }
  function spriteHeight(spr) { return (player.r * 2 * aug.hitboxMul) / spr.head * spr.adj; }
  function headOffset(spr) { return spr ? FOOT - spriteHeight(spr) * (1 - spr.cy) : 0; }  // 실제 크기 = 도안의 80%

  const MIN_W = 340, MAX_W = 620;    // 논리 가로 허용 범위

  /* 전체 난이도 배율. 낙하 속도와 낙하 빈도에 각각 제곱근을 적용해서
     둘을 합친 체감 난이도가 정확히 이 배율이 되게 한다. 값 하나만 고치면 된다. */
  const DIFF = 1.0;
  const DIFF_F = Math.sqrt(DIFF);    // 1.0488

  function layout() {
    const rect = stage.getBoundingClientRect();
    const bw = Math.max(1, rect.width), bh = Math.max(1, rect.height);
    const ratio = bw / bh;

    // 화면 비율과 논리 캔버스 비율을 '항상 똑같이' 맞춘다.
    // 가로가 범위를 벗어나면 가로를 자르는 대신 세로를 늘리고 줄여서 비율을 유지 → 잘림/찌그러짐 없음
    H = BASE_H;
    W = Math.round(H * ratio);
    if (W < MIN_W)      { W = MIN_W; H = Math.round(W / ratio); }
    else if (W > MAX_W) { W = MAX_W; H = Math.round(W / ratio); }

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    baseScale = dpr;

    player.y  = H - PLAYER_UP;
    player.x  = Math.max(player.r, Math.min(W - player.r, player.x));
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
    for (const it of items) it.x = Math.max(it.r, Math.min(W - it.r, it.x));
    for (const c of clouds) if (c.x > W + c.s) c.x = Math.random() * W;
  }
  let baseScale = 1;
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 250));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
  layout();

  /* ---------- 주인공 스프라이트 ----------
     왼쪽으로 갈 때 player_left.png, 오른쪽으로 갈 때 player_right.png.
     cx/cy 는 이미지 안에서 '머리 중심' 위치(비율) — 판정 원과 머리를 맞추는 기준점.
     headRatio 는 머리 지름 / 이미지 높이. 실제 이미지를 측정해 넣은 값이다.
     이미지가 없으면 코드로 그린 기본 캐릭터로 넘어간다. */
  const SPR = {
    // adj = 전체 크기 보정. 왼쪽 그림이 머리에 비해 몸이 커서 오른쪽과 크기가 안 맞아
    // 왼쪽을 0.947배로 줄여 둘의 몸 크기를 일치시킨다.
    left:  { img: null, aspect: 0.683, head: 0.642, cx: 0.474, cy: 0.381, adj: 0.947 },
    right: { img: null, aspect: 0.692, head: 0.678, cx: 0.549, cy: 0.397, adj: 1 },
    hurt:  { img: null, aspect: 0.544, head: 0.536, cx: 0.502, cy: 0.378, adj: 0.86 }
  };
  let facing = "right";

  for (const key of ["left", "right", "hurt"]) {
    const img = new Image();
    img.onload = () => { SPR[key].img = img; };
    img.src = "player_" + key + ".png";
  }

  // 도와줘 정연핑 — 아래에서 위로 날아가며 지나간 자리의 똥을 부순다
  let helperImg = null;
  {
    const img = new Image();
    img.onload = () => { helperImg = img; };
    img.src = "helper.png";
  }
  const HELPER_ASPECT = 0.793;   // 이미지 가로/세로
  const HELPER_H = 110;          // 화면에 그릴 높이 (기존 96에서 15% 확대)
  const HELPER_R = 53;           // 똥을 부수는 반경 (크기에 맞춰 함께 확대)
  function helperScale() { return aug.helperRush ? 1.3 : 1; } // 히든 '대폭주' 시 1.3배 (면적 1.69배)
  let helpers = [];
  let helperTimer = 0;
  let fetchers = [];        // 배고픈 정연핑 — 아이템을 대신 먹으러 가는 정연핑

  /* ---------- 사운드 ---------- */
  let ac = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, ac.currentTime);
      g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  const augScreen = document.getElementById("augScreen");
  const augList   = document.getElementById("augList");
  const augTitle  = document.getElementById("augTitle");

  let augRemain = 0;      // 남은 연속 선택 횟수
  let augTotal = 1;

  let augPauseAt = 0;      // 증강 고르는 동안 흘러간 시간을 나중에 되돌려주기 위한 기준

  function openAugment(times) {
    augTotal = times || 1;
    augRemain = augTotal;
    augPauseAt = performance.now();
    state = STATE.AUG;
    showAugmentPick();
    beep(1100, .1, "triangle", .05);
    if (navigator.vibrate) navigator.vibrate(augTotal > 1 ? [40, 50, 40, 50, 40] : 40);
  }

  function showAugmentPick() {
    augTitle.textContent = augTotal > 1
      ? "🌕 보름달! 증강 " + augTotal + "연속 (" + (augTotal - augRemain + 1) + "/" + augTotal + ")"
      : "⭐ 증강 선택 🌙";
    // once 증강은 이미 가진 것이면 제외하고, 조건이 붙은 증강은 조건을 만족할 때만 넣는다
    const pool = AUGMENTS.filter(a =>
      !(a.once && augCount[a.id]) && (!a.cond || a.cond()));
    // 뽑히는 가중치: 따로 지정한 값이 우선, 히든은 일반의 1/3, 나머지는 1
    const wOf = a => (a.w !== undefined ? a.w : (a.hidden ? (1 / 3) : 1));
    const picks = [];
    while (picks.length < 3 && pool.length) {
      let total = 0;
      for (const a of pool) total += wOf(a);
      let n = Math.random() * total, idx = pool.length - 1;
      for (let i = 0; i < pool.length; i++) {
        const w = wOf(pool[i]);
        if (n < w) { idx = i; break; }
        n -= w;
      }
      picks.push(pool.splice(idx, 1)[0]);
    }
    augList.innerHTML = "";
    for (const a of picks) {
      const card = document.createElement("button");
      card.className = "augCard";
      const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = a.ic;
      const tx = document.createElement("span"); tx.className = "tx";
      const nm = document.createElement("div");  nm.className = "nm2"; nm.textContent = a.nm;
      const ds = document.createElement("div");  ds.className = "ds";  ds.textContent = a.ds;
      tx.append(nm, ds);
      card.append(ic, tx);
      if (a.hidden) {
        card.classList.add("hid");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "히든";
        card.appendChild(badge);
      }
      if (augCount[a.id] && !a.noCount) {
        const cnt = document.createElement("span");
        cnt.className = "cnt";
        cnt.textContent = "보유 " + augCount[a.id];
        card.appendChild(cnt);
      }
      card.addEventListener("click", () => {
        a.go();
        augCount[a.id] = (augCount[a.id] || 0) + 1;
        beep(900, .09, "square", .05);
        beep(1350, .13, "square", .05);
        augRemain--;
        if (augRemain > 0) {           // 보름달: 남은 횟수만큼 이어서 고른다
          showAugmentPick();
          return;

        augScreen.classList.add("hidden");
        state = STATE.PLAY;
        /* 증강을 고르는 동안 게임은 멈춰 있었지만 뚜니핑 타임·무적 시간은
           실제 시계로 재고 있어서 그대로 두면 고민한 만큼 깎여 나간다.
           멈춰 있던 시간만큼 마감 시각을 뒤로 밀어 원래 남은 시간을 돌려준다. */
        const paused = performance.now() - augPauseAt;
        if (powerUntil > 0) powerUntil += paused;
        if (invUntil  > 0) invUntil  += paused;
        if (hurtUntil > 0) hurtUntil += paused;
        // 멈춰 있던 똥이 코앞에 있을 수 있으니 0.5초 무적으로 빠져나갈 틈을 준다
        invUntil = Math.max(invUntil, performance.now() + 500);
        popText(player.x, player.y - 70, a.ic + " " + a.nm, "#ffd23f", 24);
      });
      augList.appendChild(card);
    }
    augScreen.classList.remove("hidden");
  }
  let state = STATE.READY;

  let score = 0, lives = 3, level = 1, elapsed = 0, starCount = 0;
  let spawnTimer = 0;
  let invUntil = 0, powerUntil = 0;
  let shields = 0;                 // 남은 방패 수 — 우산 아이템은 최대 1, 증강으로만 여러 개
  let shieldTimer = 5;             // 우산 로켓배송: 방패가 없을 때 다음 하나까지 남은 시간

  let skyT = 0;                    // 0 = 맑은 하늘, 1 = 가장 어두운 하늘 (레벨에 따라)
  let shake = 0, flash = 0, feverFlash = 0;
  let fever = false, feverT = 0, feverDur = 10000;
  let last = 0;

  const keys = {};
  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === " " || e.key === "Enter") {
      // 증강 선택 중에는 재시작되면 안 된다
      if (state === STATE.READY || state === STATE.OVER) { e.preventDefault(); reset(); }
    }
  });
  window.addEventListener("keyup", e => { keys[e.key] = false; });

  /* 터치: 손가락을 화면 어디에 대도 좌우로 끌어서 조작 */
  function pointerX(e) {
    const r = cv.getBoundingClientRect();
    const cx = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - r.left;
    return cx / r.width * W;
  }
  function movePointer(e) {
    if (state !== STATE.PLAY) return;
    player.tx = Math.max(player.r, Math.min(W - player.r, pointerX(e)));
    if (e.cancelable) e.preventDefault();
  }
  cv.addEventListener("mousemove", movePointer);
  cv.addEventListener("touchstart", movePointer, { passive: false });
  cv.addEventListener("touchmove", movePointer, { passive: false });

  document.getElementById("btnStart").addEventListener("click", reset);
  document.getElementById("btnRetry").addEventListener("click", reset);

  function reset() {
    layout();
    items = []; particles = []; floats = [];
    score = 0; lives = 3; level = 1; elapsed = 0; starCount = 0;
    spawnTimer = 0;
    resetBonusTimers();
    invUntil = 0; powerUntil = 0; hurtUntil = 0; shields = 0;
    shake = 0; flash = 0; feverFlash = 0; fever = false; feverT = 0;

    aug.feverScoreMul = 1; aug.fallMul = 1; aug.hitboxMul = 1; aug.poopMul = 1;

  }

  for (let i = 0; i < 6; i++) {
    clouds.push({ x: Math.random() * W, y: Math.random() * H * .7, s: 30 + Math.random() * 50, v: 4 + Math.random() * 10 });
  }

  /* ---------- 스폰 ---------- */
  /* 뚜니핑 타임 낙하물 크기 등급 — 클수록 드물고 점수가 크다 */
  const FEVER_SIZES = [
    { min: 14, max: 18, score: 2,  w: 22 },
    { min: 18, max: 22, score: 3,  w: 22 },
    { min: 22, max: 26, score: 5,  w: 18 },
    { min: 26, max: 31, score: 8,  w: 14 },
    { min: 31, max: 37, score: 10, w: 11 },
    { min: 37, max: 44, score: 15, w: 8  },
    { min: 44, max: 52, score: 25, w: 5  },
    { min: 52, max: 62, score: 40, w: 3  }   // 초대형 — 가장 드물다
  ];
  // 대왕 뚜니핑 — 기존 최대(52~62)의 2배 크기, 점수는 최대 등급(75)의 3배
  const GIANT = { min: 104, max: 124, score: 110, w: 3, giant: true };
  function pickFeverSize() {
    const list = aug.giant > 0
      ? FEVER_SIZES.concat([{ min: GIANT.min, max: GIANT.max, score: GIANT.score,
                              w: GIANT.w * aug.giant, giant: true }])
      : FEVER_SIZES;
    const total = list.reduce((a, b) => a + b.w, 0);
    let n = Math.random() * total;
    for (const s of list) { if (n < s.w) return s; n -= s.w; }
    return list[0];
  }

  /* 낙하 각도. 좌우 속도를 낙하 속도에 비례시켜서 레벨이 올라도 기울기 느낌이 일정하다.
     (Math.random() - Math.random()) 은 0 근처가 흔하고 양 끝이 드문 삼각분포 →
     대부분은 적당히 기울고 일부만 크게 비스듬히 떨어진다. */
  const SPREAD_POOP  = 0.22;   // 최대 약 12도
  const SPREAD_BONUS = 0.28;   // 아이템은 조금 얌전하게 (약 16도)

  const FEVER_VY = 245;      // 뚜니핑 낙하물 기준 속도 — 레벨이 올라도 그대로 유지한다

  /* 레벨 7부터 섞여 나오는 까다로운 똥들
     split  = 내려오다 둘로 쪼개진다 (쪼개진 조각은 평범한 똥)
     zigzag = 좌우로 크게 흔들리며 내려온다
     accel  = 처음엔 느리다가 점점 빨라진다 */
  const SPECIAL_KINDS = ["split", "zigzag", "accel"];

  function spawnPoop(mul, special) {
    const m = (mul || 1) * (H / BASE_H);   // 화면이 길면 그만큼 빨리 떨어져야 체감이 같다
    // 뚜니핑 타임에 나온 것은 외형·점수를 스스로 기억한다 → 뚜니핑 타임이 끝나도 모습이 바뀌지 않는다
    const inFever = fever;
    const cls = inFever ? pickFeverSize() : null;
    let r = (cls ? cls.min + Math.random() * (cls.max - cls.min)
                 : 12.6 + Math.random() * 11.7) * aug.poopMul;   // 기본 크기 10% 축소
    r = Math.min(r, (W - 24) / 2);        // 화면보다 커지지 않게
    // 일반 똥은 레벨이 오를수록 빨라지지만, 뚜니핑 낙하물은 처음이나 나중이나 같은 속도로 떨어진다
    const baseVy = inFever ? FEVER_VY + Math.random() * 110
                           : 215 + level * 30 + Math.random() * 110;
    let vy = baseVy * m * DIFF_F * aug.fallMul;
    if (special === "accel") vy *= 0.55;      // 느리게 시작해서 점점 빨라진다
    items.push({
      type: "poop", emoji: "💩",
      x: r + Math.random() * (W - r * 2), y: -r - 10,
      r: r * 0.82,
      vx: (Math.random() - Math.random()) * vy * SPREAD_POOP,
      vy: vy,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * 5,
      size: r * 2, sz: r, fast: m > 1,
      skin: inFever ? "fever" : "poop",
      special: special || null,
      phase: Math.random() * 6.28,
      splitAt: H * (0.32 + Math.random() * 0.26),   // 분열똥이 쪼개지는 높이
      sz0: 0,
      face: Math.floor(Math.random() * 8),   // 표정 장식 (0~1은 기본 얼굴)
      gain: cls ? cls.score : 0,
      giant: !!(cls && cls.giant)
    });
  }
  const BONUS = [
    { type: "moon",     emoji: "🌙", w: 80 },   // 증강 선택 — 가장 자주 나온다
    { type: "fullmoon", emoji: "🌕", w: 6  },   // 보름달 — 증강 3연속. 초승달의 10%
    { type: "paper",    emoji: "🧻", w: 26 },
    { type: "umbrella", emoji: "☂️", w: 22 },
    { type: "star",     emoji: "⭐", w: 56 },
    { type: "heart",    emoji: "❤️", w: 14 }
  ];
  /* 아이템은 종류마다 자기 타이머로 따로 굴러간다.
     각자의 평균 간격 = 기본 10초 ÷ 그 아이템의 비중 → 전체 등장 빈도는 예전과 같지만
     서로 독립이라 운이 맞으면 두세 개가 한꺼번에 쏟아진다. */
  const BONUS_W_TOTAL = BONUS.reduce((a, b) => a + b.w, 0);
  const BONUS_BASE = 7.5;                // 아이템 전체의 평균 등장 간격(초)

  function bonusInterval(b) {
    const lvFactor = Math.max(0.5, 1 / (1 + (level - 1) * 0.06));   // 레벨이 오르면 더 자주
    const mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul * lvFactor;
    /* 얼랑분포(지수 3개의 합). 평균 간격은 그대로 두고 편차만 줄인다.
       지수분포 하나만 쓰면 "한참 안 나오다가 갑자기 몰리는" 편차가 너무 컸다.
       종류별로 따로 도는 건 그대로라 여러 개가 한꺼번에 나오는 일은 여전히 생긴다.
       (0.4초 하한은 완전히 겹쳐 떨어지는 것만 막는 장치) */
    const u = Math.random() * Math.random() * Math.random();
    return Math.max(0.4, -(mean / 3) * Math.log(u));
  }
  function resetBonusTimers() {
    // 판이 시작될 때 첫 등장까지는 편차가 큰 지수분포로 — 매판 시작이 다르게 느껴지도록
    const lvFactor = 1;
    for (const b of BONUS) {
      const mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul * lvFactor;
      b.t = Math.max(0.4, -mean * Math.log(1 - Math.random()));
    }
  }

  function spawnBonus(picked) {
    let pick = picked;
    if (pick.type === "heart" && lives >= aug.maxLives) {
      pick = BONUS.find(b => b.type === "star");    // 목숨 꽉 차면 별로 대체
    }
    const r = 20;
    // 낙하 속도에 변화를 주되, 너무 빠르면 못 먹고 지나가버려서 위쪽을 눌러 잡았다
    const vy = (110 + level * 6) * (H / BASE_H) * (0.6 + Math.random() * 0.5);
    items.push({
      type: pick.type, emoji: pick.emoji,
      x: r + Math.random() * (W - r * 2), y: -r - 10,
      r: r,
      vx: (Math.random() - Math.random()) * vy * SPREAD_BONUS,
      vy: vy,
      rot: 0, vr: 0, size: r * 2, bob: Math.random() * 6.28,
      born: elapsed          // 배고픈 정연핑이 몇 초 뒤에 출발할지 재는 기준
    });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, sp = 60 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                       life: .6 + Math.random() * .4, t: 0, c: color, r: 2 + Math.random() * 4 });
    }
  }
  function popText(x, y, text, color, size) {
    floats.push({ x, y, text, color, t: 0, life: 1, size: size || 22 });
  }

  /* ---------- 업데이트 ---------- */
  function update(dt, now) {
    for (const c of clouds) {
      c.x += c.v * dt;
      if (c.x - c.s > W) { c.x = -c.s; c.y = Math.random() * H * .7; }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt; p.vy += 700 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.life) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt; f.y -= 40 * dt;
      if (f.t > f.life) floats.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    if (feverFlash > 0) feverFlash = Math.max(0, feverFlash - dt * 2.5);

    const wasFever = fever;
    fever = state === STATE.PLAY && now < powerUntil;
    // 겹쳐 먹어 남은 시간이 한 번 분량을 넘으면 게이지가 넘치므로 1로 묶는다
    feverT = fever ? Math.min(1, (powerUntil - now) / feverDur) : 0;
    // 뚜니핑 타임 끝나는 순간엔 화면이 똥으로 가득 차 있으니 1초 무적으로 숨 돌릴 틈을 준다
    if (wasFever && !fever && state === STATE.PLAY) {
      invUntil = Math.max(invUntil, now + 1500);
      for (let i = items.length - 1; i >= 0; i--) {
        if (items[i].giant) {                     // 대왕은 피할 수 없는 크기라 같이 사라진다
          burst(items[i].x, items[i].y, "#c86bff", 26);
          items.splice(i, 1);
        }
      }
      popText(player.x, player.y - 70, "휴… 세이프", "#fff");
      beep(520, .12, "triangle", .04);
    }

    if (state !== STATE.PLAY) return;

    elapsed += dt;
    level = 1 + Math.floor(elapsed / 10);
    score += dt * Math.pow(1.7, level - 1) * aug.timeMul * aug.scoreMul;  // 생존 점수: 레벨마다 1.7배

    // 레벨이 오를수록 하늘이 진해진다. 단계마다 값이 바뀌지만 색은 부드럽게 따라간다.
    const skyTarget = Math.min(1, (level - 1) / 14);   // 레벨 15에서 완전한 밤
    skyT += (skyTarget - skyT) * Math.min(1, dt * 2);

    const kSpeed = 560 * dt;
    if (keys.ArrowLeft  || keys.a || keys.A) player.tx -= kSpeed;
    if (keys.ArrowRight || keys.d || keys.D) player.tx += kSpeed;
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));

    const prev = player.x;
    // 손가락을 반대편에 찍어도 순간이동하지 않도록 최고 속도를 제한한다
    const want = (player.tx - player.x) * Math.min(1, dt * 20);
    const maxStep = PLAYER_MAX_SPEED * dt;
    player.x += Math.max(-maxStep, Math.min(maxStep, want));
    if (player.x - prev < -0.25) facing = "left";
    else if (player.x - prev > 0.25) facing = "right";   // 멈춰 있으면 마지막 방향 유지
    player.tilt += (((player.x - prev) / Math.max(dt, .001) / 900) - player.tilt) * Math.min(1, dt * 10);
    player.tilt = Math.max(-.35, Math.min(.35, player.tilt));

    player.hy = headOffset(currentSprite(now));

    // ---- 우산 로켓배송: 방패가 하나도 없을 때만 시간을 재서 하나 배송한다 ----
    if (aug.steelUmb) {
      if (shields <= 0) {
        shieldTimer -= dt;
        if (shieldTimer <= 0) {
          shields = 1;
          shieldTimer = 5;
          popText(player.x, player.y - 60, "☔ 우산 도착!", "#7ec8ff");
          beep(880, .12, "triangle", .05);
        }
      } else {
        shieldTimer = 5;
      }
    }

    // ---- 도와줘 정연핑 ----
    if (aug.helper > 0) {
      // 1명이면 4초, 2명이면 5.5초, 3명이면 7초… 인원이 늘수록 주기도 함께 길어진다
      const cycle = 2.5 + 1.5 * aug.helper;
      helperTimer -= dt;
      if (helperTimer <= 0 && helperQueue <= 0) {
        helperTimer = cycle;
        helperQueue = aug.helper;                 // 이번 차례 출격 인원
        helperGap = 0;                            // 첫 명은 바로
      }
      if (helperQueue > 0) {
        helperGap -= dt;
        if (helperGap <= 0) {
          // 한 차례 안에서 인원을 고르게 나눠 내보낸다 (2명 = 4초에 2명, 3명 = 5초에 3명)
          helperGap = cycle / aug.helper;
          helperQueue--;
          const fromLeft = Math.random() < 0.5;   // 아래 좌/우에서 비스듬히 솟아오른다
          // 수직에서 8~34도 사이. 너무 눕히면 옆으로 금방 빠져나가서 범위를 좁혔다
          const speed = 744 + Math.random() * 216;   // 기존 620~800 에서 20% 빠르게
          const ang = (8 + Math.random() * 26) * Math.PI / 180;
          helpers.push({
            x: fromLeft ? -30 + Math.random() * (W * 0.45)
                        : W + 30 - Math.random() * (W * 0.45),
            y: H + 60,
            vx: (fromLeft ? 1 : -1) * speed * Math.sin(ang),
            vy: -speed * Math.cos(ang)
          });
          beep(760, .12, "triangle", .05);
          beep(1140, .14, "triangle", .04);
        }
      }
    }
    for (let k = helpers.length - 1; k >= 0; k--) {
      const hp = helpers[k];
      hp.x += hp.vx * dt;
      hp.y += hp.vy * dt;
      smashPoopsAround(hp.x, hp.y, HELPER_R * helperScale());   // 지나가는 자리의 똥
      if (hp.y < -HELPER_H - 40 || hp.x < -160 || hp.x > W + 160) helpers.splice(k, 1);
    }

    // ---- 배고픈 정연핑: 아이템이 뜨고 3초 뒤에 화면 아래 중앙에서 출발 ----
    if (aug.hungry) {
      for (const it of items) {
        if (it.type === "poop" || it.claimed) continue;
        if (elapsed - it.born >= FETCH_DELAY) {
          it.claimed = true;
          fetchers.push({ x: W / 2, y: H + 50, vx: 0, vy: -FETCH_SPEED, t: it });
          beep(660, .1, "sine", .05);
          beep(990, .12, "sine", .04);
        }
      }
    }
    for (let k = fetchers.length - 1; k >= 0; k--) {
      const f = fetchers[k];
      const alive = items.indexOf(f.t) >= 0;
      let dx = 0, dy = -1;
      if (alive) { dx = f.t.x - f.x; dy = f.t.y - f.y; }   // 목표가 사라지면 그대로 위로 빠진다
      const d = Math.hypot(dx, dy) || 1;
      f.vx = dx / d * FETCH_SPEED;
      f.vy = dy / d * FETCH_SPEED;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      smashPoopsAround(f.x, f.y, HELPER_R * helperScale());   // 가는 길의 똥도 부순다
      if (alive && Math.hypot(f.t.x - f.x, f.t.y - f.y) < HELPER_R * 0.9) {
        const idx = items.indexOf(f.t);
        if (idx >= 0) items.splice(idx, 1);
        fetchers.splice(k, 1);
        burst(f.x, f.y, "#ffd23f", 24);
        if (collectItem(f.t, now)) return;    // 달이면 화면이 멈춘다
        continue;
      }
      if (f.y < -HELPER_H * 2 || f.x < -260 || f.x > W + 260) fetchers.splice(k, 1);
    }

    const powered = now < powerUntil;      // 🔥 뚜니핑 타임
    const invincible = now < invUntil;

    // 화면이 좁으면 그만큼 똥도 덜 떨어지게(체감 난이도 유지)
    const widthFactor = 480 / W;
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (powered) {
        // 뚜니핑 타임: 똥이 폭포처럼 쏟아지고 속도도 2배 이상
        const n = 3 + Math.floor(Math.random() * 4);   // 스폰당 3~6개 (평균 4.5개)
        // 증강으로 낙하량이 늘면 화면 상한도 같이 올려야 늘린 만큼이 깎이지 않는다
        const cap = Math.min(220, Math.round(100 / aug.feverRateMul));
        if (items.length < cap) {
          for (let k = 0; k < n; k++) spawnPoop(2.2 + Math.random() * 0.9);
        }
        spawnTimer = (0.14 / 1.3) * aug.feverRateMul * widthFactor;   // 간격 ÷1.3 → 낙하량 +30%
      } else {
        spawnPoop();
        if (level >= 3 && Math.random() < .35) spawnPoop();
        if (level >= 6 && Math.random() < .30) spawnPoop(1.6);   // 초고속 똥
        // 까다로운 똥 — 레벨 7에 아주 드물게 시작해서 레벨마다 조금씩 늘어난다
        if (level >= 7 && Math.random() < Math.min(0.45, (level - 6) * 0.04)) {
          spawnPoop(1, SPECIAL_KINDS[Math.floor(Math.random() * SPECIAL_KINDS.length)]);
        }
        spawnTimer = Math.max(0.13, 0.52 - level * 0.042) / DIFF_F * widthFactor * (0.7 + Math.random() * 0.6);
      }
    }
    if (!powered) {
      for (const b of BONUS) {           // 종류별로 따로 세다가 각자 때가 되면 떨어진다
        b.t -= dt;
        if (b.t <= 0) {
          spawnBonus(b);
          b.t = bonusInterval(b);
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.special === "split") {
        // 정해진 높이까지 내려오면 둘로 쪼개진다. 조각은 평범한 똥이라 정연핑이 부술 수 있다.
        if (it.y > it.splitAt) {
          const r2 = it.sz * 0.62;
          for (const dir of [-1, 1]) {
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: dir * (150 + Math.random() * 100), vy: it.vy * 0.9,
              rot: Math.random() * 6.28, vr: (Math.random() - .5) * 5,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", special: null, phase: 0, splitAt: 0,
              face: Math.floor(Math.random() * 8), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#c86bff", 20);
          beep(300, .08, "square", .04);
          items.splice(i, 1);
          continue;
        }
      } else if (it.special === "zigzag") {
        it.phase += dt * 3.0;
        it.vx = Math.sin(it.phase) * 230;
      } else if (it.special === "accel") {
        it.vy = Math.min(it.vy * (1 + 0.75 * dt), 1500);
      }
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.rot += it.vr * dt;
      if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx); }
      if (it.x > W - it.r) { it.x = W - it.r; it.vx = -Math.abs(it.vx); }
      if (it.bob !== undefined) it.bob += dt * 4;

      const dx = it.x - player.x, dy = it.y - (player.y + player.hy);
      if (aug.magnet > 0 && it.type !== "poop") {
        const d = Math.hypot(dx, dy);
        if (d < aug.magnet && d > 1) {
          const pull = 520 * dt * (1 - d / aug.magnet) + 60 * dt;
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.55;
        }
      }
      const hit = Math.hypot(dx, dy) < it.r + player.r * .78 * aug.hitboxMul;

      if (hit) {
        if (it.type === "poop") {
          // 뚜니핑 타임 낙하물은 타임이 끝난 뒤에도 먹을 수 있다.
          // (끝나는 순간 화면에 떠 있던 것들이 그냥 스쳐 지나가면 아까우니까)
          if (powered || it.skin === "fever") {
            // 크기가 곧 점수. 뚜니핑 타임 중 생성된 건 자기 점수를 갖고 있고,
            // 뚜니핑 타임 전에 떨어지던 일반 똥은 크기로 환산한다.
            const gain = feverGain(it);
            let tone, burstN, note, textSize;
            if (gain >= 110)     { tone = "#c86bff"; burstN = 80; note = 2200; textSize = 48; }
            else if (gain >= 40) { tone = "#ff2170"; burstN = 54; note = 2000; textSize = 40; }
            else if (gain >= 25) { tone = "#ff3b3b"; burstN = 42; note = 1800; textSize = 34; }
            else if (gain >= 15) { tone = "#ff6a2a"; burstN = 34; note = 1650; textSize = 30; }
            else if (gain >= 10) { tone = "#ff8f3a"; burstN = 26; note = 1500; textSize = 27; }
            else if (gain >= 8)  { tone = "#ffcc33"; burstN = 18; note = 1350; textSize = 24; }
            else if (gain >= 5)  { tone = "#ffd23f"; burstN = 12; note = 1150; textSize = 22; }
            else                 { tone = "#ffe3a8"; burstN = 8;  note = 900;  textSize = 22; }
            score += gain;
            burst(it.x, it.y, tone, burstN);
            // 큰 건 항상, 중간은 절반만 표시 — 작은 건 화면이 지저분해지니 생략
            if (gain >= 8 || (gain >= 5 && Math.random() < .5)) {
              popText(it.x, it.y, "+" + gain, tone, textSize);
            }
            if (gain >= 15) {
              shake = Math.max(shake, gain >= 110 ? 32 : (gain >= 40 ? 22 : (gain >= 25 ? 16 : 10)));
            }
            items.splice(i, 1);
            if (gain >= 25 || Math.random() < .5) beep(note + Math.random() * 200, .06, "square", .04);
            continue;
          }
          if (!invincible) {
            if (shields > 0) {
              shields--;
              invUntil = now + 1500;        // 목숨을 잃었을 때와 같은 무적 시간
              shake = Math.max(shake, 14);
              burst(it.x, it.y, "#7ec8ff", 20);
              popText(player.x, player.y - 60, "☂️ 방어!", "#7ec8ff");
              beep(400, .12, "triangle", .06);
              if (navigator.vibrate) navigator.vibrate(60);
            } else {
              lives--;
              invUntil = now + 1500;
              hurtUntil = now + 1500;   // 무적 시간 동안 아픈 그림으로
              shake = 22; flash = 1;
              burst(it.x, it.y, "#8a5a2b", 22);
              popText(player.x, player.y - 60, "으악!", "#ff5d5d");
              beep(140, .25, "sawtooth", .07);
              if (lives <= 0) { items.splice(i, 1); return gameOver(); }
            }
            items.splice(i, 1);
            continue;
          }
        } else {
          items.splice(i, 1);
          if (collectItem(it, now)) return;   // 달이면 화면이 멈추므로 여기서 끝
          continue;
        }
      }

      if (it.y - it.r > H + 20) {
        // 뚜니핑 타임 낙하물은 워낙 많이 쏟아져서, 안 먹고 흘려보낸 것에 점수를 주면
        // 가만히 있어도 점수가 폭등한다. 뚜니핑 타임 것은 0점 — 직접 받아야만 점수가 오른다.
        if (it.type === "poop" && it.skin !== "fever") score += 3 * aug.scoreMul;
        items.splice(i, 1);
      }
    }
  }

  /* 아이템 효과 적용. 플레이어가 직접 먹을 때와 '배고픈 정연핑'이 대신 먹을 때 모두 쓴다.
     달을 먹으면 게임이 멈추므로 true 를 돌려주고, 부른 쪽은 그 프레임 처리를 중단한다. */
  function collectItem(it, now) {
    if (it.type === "paper") {
      feverDur = 10000 + aug.feverBonus;
      // 이미 뚜니핑 중이면 남은 시간에 이어붙인다 (초기화하면 남은 시간이 버려진다)
      powerUntil = Math.max(powerUntil, now) + feverDur;
      feverFlash = 1;
      popText(player.x, player.y - 70, "🔥 뚜니핑 타임!", "#ffd23f", 26);
      beep(700, .1, "square", .05);
      beep(1100, .12, "square", .05);
      beep(1500, .18, "square", .05);
      if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
    }
    if (it.type === "umbrella") {
      shields = Math.max(shields, Math.min(shields + 1, 3));   // 아이템으로는 3개까지 누적
      popText(player.x, player.y - 60, "☂️ 방패!", "#7ec8ff");
      beep(900, .12, "triangle", .05);
    }
    if (it.type === "star") {
      // 먹을 때마다 2배: 1번째 1,500 → 2번째 3,000 → 3번째 6,000 → 4번째 12,000 …
      starCount++;
      const gain = Math.round(1500 * Math.pow(2, starCount - 1) * aug.starMul * aug.scoreMul);
      score += gain;
      popText(it.x, it.y, "⭐×" + starCount + "  +" + gain.toLocaleString(), "#ffd23f");
      beep(1400, .1, "square", .05);
      beep(1750, .12, "square", .04);
      if (aug.starburst) {
        // 화면의 똥을 전부 없애고, 각각 제 점수의 10배를 받는다 (까다로운 똥도 함께)
        let cnt = 0, bonus = 0;
        for (let k = items.length - 1; k >= 0; k--) {
          const q = items[k];
          if (q.type !== "poop") continue;
          bonus += ((q.skin === "fever") ? feverGain(q) : 3 * aug.scoreMul) * 10;
          burst(q.x, q.y, "#ffe9a8", 10);
          items.splice(k, 1);
          cnt++;
        }
        if (cnt) {
          score += bonus;
          invUntil = Math.max(invUntil, now + 1500);   // 쓸어낸 직후 다시 쏟아지므로 숨 돌릴 틈
          shake = Math.max(shake, 18);
          feverFlash = Math.max(feverFlash, 0.7);
          popText(player.x, player.y - 110,
                  "🌠 " + cnt + "개 쓸어버림 +" + Math.round(bonus).toLocaleString(), "#ffe9a8", 26);
          beep(2000, .18, "square", .05);
        }
      }
    }
    if (it.type === "moon" || it.type === "fullmoon") {
      const full = it.type === "fullmoon";
      burst(it.x, it.y, full ? "#ffe9a8" : "#cfe4ff", full ? 40 : 20);
      if (full) { flash = 0; feverFlash = 1; shake = Math.max(shake, 14); }
      openAugment(full ? 3 : 1);     // 보름달은 3연속 선택
      return true;
    }
    if (it.type === "heart") {
      lives = Math.min(aug.maxLives, lives + 1);
      popText(it.x, it.y, "❤️ +1", "#ff8fb0");
      beep(1000, .15, "sine", .06);
    }
    burst(it.x, it.y, "#ffd23f", 16);
    return false;
  }

  /* 뚜니핑 낙하물 점수. 크기 등급 점수에 레벨 보정을 곱한다.
     레벨이 하나 오를 때마다 10%씩 (레벨1 기준, 레벨10이면 약 2.4배). */
  function feverGain(it) {
    const base = it.gain || (it.sz < 16.2 ? 2 : (it.sz < 20.7 ? 5 : 10));
    return Math.max(1, Math.round(base * aug.feverScoreMul * aug.scoreMul * Math.pow(1.1, level - 1)));
  }

  // 정연핑이 지나간 자리의 똥을 부순다 (뚜니핑 낙하물은 제 점수를 그대로 준다)
  function smashPoopsAround(x, y, radius) {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.type !== "poop") continue;
      if (it.special) continue;              // 까다로운 똥은 정연핑도 부수지 못한다
      if (Math.hypot(it.x - x, it.y - y) >= radius + it.r) continue;
      if (it.skin === "fever") {
        const g = feverGain(it);
        score += g;
        burst(it.x, it.y, g >= 25 ? "#ff3b3b" : "#ffd23f", g >= 25 ? 30 : 16);
        if (g >= 15) popText(it.x, it.y, "+" + g, "#ffd23f", g >= 40 ? 30 : 24);
      } else {
        score += 3 * aug.scoreMul;
        burst(it.x, it.y, "#ffd23f", 14);
      }
      items.splice(i, 1);
    }
  }

  /* 랭킹은 매주 월요일 0시(한국시간)에 새로 시작한다.
     기록을 지우는 게 아니라 '이번 주 것만' 보여주는 방식이라 초기화가 실패할 일이 없다.
     보는 사람 폰의 시간대와 무관하게 항상 한국시간 기준으로 계산한다. */
  const KST = 9 * 60 * 60 * 1000;
  function weekStartMs(weeksAgo) {                        // 0 = 이번 주, 1 = 지난주
    const k = new Date(Date.now() + KST);                 // UTC 값으로 읽으면 한국 벽시계
    const mondayIndex = (k.getUTCDay() + 6) % 7;          // 월=0 … 일=6
    const kstMidnight = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(),
                                 k.getUTCDate() - mondayIndex - (weeksAgo || 0) * 7);
    return kstMidnight - KST;                             // 실제 UTC 시각
  }
  function kstDateLabel(ms) {                             // "8.10" 형태
    const k = new Date(ms + KST);
    return (k.getUTCMonth() + 1) + "." + k.getUTCDate();
  }
  function resetNote() {
    const left = weekStartMs(0) + 7 * 24 * 3600 * 1000 - Date.now();
    const d = Math.floor(left / 86400000);
    const h = Math.floor(left / 3600000) % 24;
    const m = Math.floor(left / 60000) % 60;
    const remain = d > 0 ? d + "일 " + h + "시간" : (h > 0 ? h + "시간 " + m + "분" : m + "분");
    return "월요일 0시에 새로 시작 · 초기화까지 " + remain;
  }

  async function fetchRange(fromMs, toMs, limit) {
    // 기기별 최고 기록만 남기는 건 SQL 함수 쪽에서 처리한다 (한 사람이 순위를 도배하지 않도록)
    try {

        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({
          since: new Date(fromMs).toISOString(),
          until: toMs ? new Date(toMs).toISOString() : null,
          lim: limit
        })
      });
      if (res.ok) return await res.json();
    } catch (e) { /* 아래 방식으로 넘어간다 */ }
    // 함수가 아직 없으면 예전처럼 표에서 바로 읽는다 (기기 중복 제거는 안 됨)
    let url = SB_URL + "/rest/v1/" + SB_TABLE +
      "?select=name,score,level,created_at" +
      "&created_at=gte." + encodeURIComponent(new Date(fromMs).toISOString());
    if (toMs) url += "&created_at=lt." + encodeURIComponent(new Date(toMs).toISOString());
    url += "&order=score.desc,created_at.asc&limit=" + limit;
    const r2 = await fetch(url, { headers: sbHeaders() });
    if (!r2.ok) throw new Error("HTTP " + r2.status);
    return r2.json();
  }

  async function submitScore(name, sc, lv) {
    // DB 제약(최대 1억점)에 걸려 등록이 실패하지 않도록 방어
    const base = {
      name: name,
      score: Math.min(100000000, Math.max(0, sc)),
      level: lv
    };
    /* 아래 두 값은 나중에 추가한 컬럼이라 DB에 아직 없을 수 있다.
       컬럼이 없으면 요청 전체가 거부되므로, 실패하면 기본 항목만으로 다시 보낸다. */
    const tries = [
      Object.assign({}, base, { device: deviceId, augs: augCount }),
      Object.assign({}, base, { device: deviceId }),
      base
    ];
    let lastErr = "";
    for (const body of tries) {
      const res = await fetch(SB_URL + "/rest/v1/" + SB_TABLE, {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return;
      lastErr = "HTTP " + res.status + " " + (await res.text()).slice(0, 120);
      if (res.status !== 400) break;      // 컬럼 문제(400)일 때만 다시 시도한다
    }
    throw new Error(lastErr);
  }

  function renderBoard(el, list, msg) {
    el.innerHTML = "";
    if (msg) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = msg;
      el.appendChild(li);
      return;
    }
    if (!list.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "이번 주 기록이 아직 없습니다. 첫 주인공이 되어보세요!";
      el.appendChild(li);
      return;
    }
    const medal = ["🥇", "🥈", "🥉"];
    list.forEach((row, i) => {
      const li = document.createElement("li");
      const cls = [];
      if (i < 3) cls.push("p" + (i + 1));                                   // 금·은·동
      if (myRowKey && row.name + "|" + row.score === myRowKey) cls.push("me");
      li.className = cls.join(" ");
      const rk = document.createElement("span");
      rk.className = "rk";
      rk.textContent = i < 3 ? medal[i] : (i + 1);
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = row.name;               // textContent → HTML 삽입 불가
      const sc = document.createElement("span");
      sc.className = "sc";
      sc.textContent = Number(row.score).toLocaleString();
      li.append(rk, nm, sc);
      el.appendChild(li);
    });
  }

  const AUG_NAMES = {};

  function kstStamp(iso) {                      // "8.19 14:03" 형태 (한국시간)

    return (k.getUTCMonth() + 1) + "." + k.getUTCDate() + " " +
           p2(k.getUTCHours()) + ":" + p2(k.getUTCMinutes());

  function rankOf(s) {
    // 생존 점수를 1.7배로 낮춘 뒤의 분포 기준
    // (중간값 약 6,700 / 상위25% 약 24,000 / 상위10% 약 52,000).

    if (s < 4500)   return "🧻 그래도 휴지는 챙겼다";
    if (s < 9000)   return "🏃 제법 잘 피하는데?";
    if (s < 20000)  return "😎 똥 회피 고수";
    if (s < 45000)  return "⚡ 똥을 초월한 자";
    if (s < 120000) return "👑 똥피하기 마스터";
    return "💩 똥신(糞神) 강림";
  }

  /* ---------- 그리기 ---------- */
  /* 레벨이 오를수록 낮 → 노을 → 땅거미 → 밤으로 넘어간다 (레벨 15에서 완전한 밤).
     각 구간의 [하늘 위, 중간, 지평선] 색을 정해두고 사이를 이어서 계산한다. */
  const SKY_KEYS = [
    { t: 0.00, c: [[137, 198, 255], [191, 224, 255], [233, 244, 255]] },  // 한낮
    { t: 0.38, c: [[ 92, 146, 214], [206, 150, 150], [252, 194, 126]] },  // 노을
    { t: 0.68, c: [[ 34,  40,  92], [ 82,  56, 112], [146,  84, 112]] },  // 땅거미
    { t: 1.00, c: [[  5,   7,  22], [ 11,  15,  40], [ 26,  30,  62]] }   // 한밤
  ];
  function skyColor(i) {
    let k = 0;
    while (k < SKY_KEYS.length - 2 && skyT > SKY_KEYS[k + 1].t) k++;
    const a = SKY_KEYS[k], b = SKY_KEYS[k + 1];
    const f = Math.max(0, Math.min(1, (skyT - a.t) / (b.t - a.t)));
    const ca = a.c[i], cb = b.c[i];
    return "rgb(" + Math.round(ca[0] + (cb[0] - ca[0]) * f) + ","
                  + Math.round(ca[1] + (cb[1] - ca[1]) * f) + ","
                  + Math.round(ca[2] + (cb[2] - ca[2]) * f) + ")";
  }

  // 밤이 될수록 드러나는 별. 위치는 매판 고정이라 반짝임만 움직인다.
  const STARS = [];
  for (let i = 0; i < 46; i++) {
    STARS.push({ fx: (i * 0.6180339887) % 1, fy: ((i * 0.7548776662) % 1) * 0.62,
                 r: 0.7 + (i % 5) * 0.32, ph: i * 1.7 });
  }
  function lerpHex(t, from, to) {                 // 땅·구름을 하늘에 맞춰 같이 어둡게
    const f = from, o = to;
    return "rgb(" + Math.round(f[0] + (o[0] - f[0]) * t) + ","
                  + Math.round(f[1] + (o[1] - f[1]) * t) + ","
                  + Math.round(f[2] + (o[2] - f[2]) * t) + ")";
  }

  function drawBackground(now) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (fever) {
      const p = 0.5 + Math.sin(now / 70) * 0.5;
      g.addColorStop(0, "#ff5a2e");
      g.addColorStop(.5, p > .5 ? "#ff9d2e" : "#ffb92e");
      g.addColorStop(1, "#ffe08a");
    } else {
      g.addColorStop(0, skyColor(0));
      g.addColorStop(.55, skyColor(1));
      g.addColorStop(1, skyColor(2));
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 뚜니핑 타임 속도선
    if (fever) {
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 3;
      for (let i = 0; i < 14; i++) {
        const x = ((i * 137 + now * 0.05) % (W + 40)) - 20;
        const y = ((i * 311 + now * 1.6) % (H + 160)) - 80;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 70); ctx.stroke();
      }
    }

    // 밤이 깊어질수록 별이 드러난다
    if (!fever && skyT > 0.45) {
      const sa = Math.min(1, (skyT - 0.45) / 0.4);
      for (const st of STARS) {
        ctx.globalAlpha = sa * (0.45 + 0.55 * Math.abs(Math.sin(now / 900 + st.ph)));
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(st.fx * W, st.fy * H, st.r, 0, 6.283);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 하늘이 어두워지면 구름도 같이 가라앉는다
    ctx.fillStyle = fever ? "rgba(255,255,255,.75)"
                          : "rgba(255,255,255," + Math.max(0.06, 0.75 - skyT * 0.72).toFixed(2) + ")";
    for (const c of clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.s * .5, 0, 6.283);
      ctx.arc(c.x + c.s * .45, c.y + 6, c.s * .38, 0, 6.283);
      ctx.arc(c.x - c.s * .45, c.y + 8, c.s * .32, 0, 6.283);
      ctx.fill();
    }
    const gt = fever ? 0 : skyT;
    ctx.fillStyle = lerpHex(gt, [123, 191, 106], [16, 30, 24]);
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = lerpHex(gt, [106, 173, 91], [26, 46, 32]);
    ctx.fillRect(0, H - GROUND_H, W, 6);
  }

  function drawPlayer(now) {
    const hurting = now < hurtUntil && SPR.hurt.img;
    const blink = now < invUntil && Math.floor(now / 90) % 2 === 0;
    const spr = hurting ? SPR.hurt : (SPR[facing].img ? SPR[facing] : null);

    if (spr) {
      // 머리 지름을 판정원 지름과 일치시킨다 — 그림마다 머리 비율이 달라 각자의 값을 쓴다
      const sh = spriteHeight(spr);   // 판정이 작아지면 그림도 같이 작아진다
      const sw = sh * spr.aspect;
      ctx.save();
      ctx.translate(player.x, player.y);
      // 맞은 직후엔 제자리에서 아파하는 그림이라 기울이지 않는다
      ctx.rotate(hurting ? 0 : player.tilt * 0.35);
      // 아픈 그림은 잘 보이도록 깜빡임을 약하게
      ctx.globalAlpha = blink ? (hurting ? .62 : .35) : 1;

      // 발밑 그림자 — 그림 종류·크기와 무관하게 항상 같은 높이
      ctx.save();
      ctx.globalAlpha *= .22;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(0, FOOT - 4, sw * .3, 7, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();

      // 발이 항상 FOOT 선에 닿도록 아래를 기준으로 그린다 (작아져도 뜨지 않는다)
      ctx.drawImage(spr.img, -sw * spr.cx, FOOT - sh, sw, sh);

      if (now < powerUntil) {
        ctx.beginPath();
        ctx.arc(0, player.hy, player.r * aug.hitboxMul + 14 + Math.sin(now / 90) * 3, 0, 6.283);
        ctx.strokeStyle = "rgba(255,255,255,.85)";
        ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
        ctx.lineDashOffset = -now / 20;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = .22 + feverT * .18;
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(0, player.hy, player.r * aug.hitboxMul + 14, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      drawShields(player.y + player.hy - player.r * aug.hitboxMul - 21);
      return;
    }

    /* ---- 이미지가 없을 때: 코드로 그린 기본 캐릭터 ---- */
    const R = DRAW_R;                      // 원본 도안 기준 반지름
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);
    ctx.scale(player.r * aug.hitboxMul / R, player.r * aug.hitboxMul / R); // 실제 크기로 축소
    ctx.globalAlpha = blink ? .35 : 1;

    ctx.save();
    ctx.globalAlpha *= .25;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, R + 26, R * .8, 9, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#f4f1ea";
    ctx.strokeStyle = "#d8d3c7";
    ctx.lineWidth = 2;
    const bw = R * 1.35, bh = 52;
    ctx.beginPath(); ctx.roundRect(-bw / 2, R * .55, bw, bh, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-bw / 2 - 13, R * .7, 14, 34, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(bw / 2 - 1, R * .7, 14, 34, 8); ctx.fill(); ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, 6.283);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = "#ffe0bd";
    ctx.fillRect(-R, -R, R * 2, R * 2);
    ctx.fillStyle = "#3b2a1d";
    ctx.beginPath(); ctx.arc(-13, -6, 4.5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -6, 4.5, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#3b2a1d"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0, 6, 12, .2, Math.PI - .2); ctx.stroke();
    ctx.fillStyle = "#6b4a2f";
    ctx.beginPath(); ctx.arc(0, -R * .55, R * .95, Math.PI, 0); ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(0, 0, R, 0, 6.283);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.stroke();

    if (now < powerUntil) {
      const t = feverT;
      ctx.beginPath();
      ctx.arc(0, 6, R + 16 + Math.sin(now / 90) * 3, 0, 6.283);
      ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -now / 20;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = .25 + t * .2;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, 6, R + 16, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    drawShields(player.y - player.r - 21);
  }

  // 머리 위에 남은 방패 수만큼 우산을 나란히 그린다
  function drawShields(y) {
    if (shields <= 0) return;
    const size = 30 * aug.hitboxMul;
    const gap = size * 0.78;
    ctx.save();
    ctx.translate(player.x, y);
    ctx.font = size + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const start = -(shields - 1) * gap / 2;
    for (let k = 0; k < shields; k++) ctx.fillText("☂️", start + k * gap, 0);
    ctx.restore();
  }

  // 원본 그림이 '오른쪽 → 왼쪽' 방향이라, 왼쪽 → 오른쪽으로 날 때만 좌우를 뒤집는다
  function drawHelperAt(x, y, vx, vy) {
    const hh = HELPER_H * helperScale(), hw = hh * HELPER_ASPECT;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(vx, -vy) * 0.8);   // 진행 방향으로 기울이기
    if (vx > 0) ctx.scale(-1, 1);            // 오른쪽으로 갈 때 반전
    ctx.drawImage(helperImg, -hw / 2, -hh / 2, hw, hh);
    ctx.restore();
  }

  function drawHelpers() {
    if (!helperImg) return;
    for (const hp of helpers) drawHelperAt(hp.x, hp.y, hp.vx, hp.vy);
    for (const f of fetchers) drawHelperAt(f.x, f.y, f.vx, f.vy);
  }

  /* 똥 위에 덧그리는 표정. 이모지 폰트가 기기마다 달라서 눈·입을 새로 그리는 대신
     어느 폰트에서나 자연스럽게 얹히는 장식(선글라스·눈썹·홍조 등)으로 표현한다. */
  function drawPoopFace(kind, S) {
    ctx.save();
    ctx.lineCap = "round";
    switch (kind) {
      case 2:   // 성난 눈썹
        ctx.strokeStyle = "#2b1a10";
        ctx.lineWidth = Math.max(2, S * 0.045);
        ctx.beginPath();
        ctx.moveTo(-S * 0.27, -S * 0.22); ctx.lineTo(-S * 0.09, -S * 0.13);
        ctx.moveTo( S * 0.27, -S * 0.22); ctx.lineTo( S * 0.09, -S * 0.13);
        ctx.stroke();
        break;
      case 3:   // 선글라스
        ctx.fillStyle = "#15161c";
        ctx.beginPath();
        ctx.roundRect(-S * 0.31, -S * 0.16, S * 0.62, S * 0.15, S * 0.06);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.5)";
        ctx.beginPath();
        ctx.roundRect(-S * 0.26, -S * 0.14, S * 0.10, S * 0.04, S * 0.02);
        ctx.fill();
        break;
      case 4:   // 뿅 간 눈 (X)
        ctx.strokeStyle = "#2b1a10";
        ctx.lineWidth = Math.max(2, S * 0.04);
        for (const sx of [-1, 1]) {
          const cx = sx * S * 0.17, cy = -S * 0.07, d = S * 0.06;
          ctx.beginPath();
          ctx.moveTo(cx - d, cy - d); ctx.lineTo(cx + d, cy + d);
          ctx.moveTo(cx + d, cy - d); ctx.lineTo(cx - d, cy + d);
          ctx.stroke();
        }
        break;
      case 5:   // 발그레한 볼
        ctx.fillStyle = "rgba(255,120,140,.55)";
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(sx * S * 0.27, S * 0.06, S * 0.09, S * 0.055, 0, 0, 6.283);
          ctx.fill();
        }
        break;
      case 6:   // 식은땀
        ctx.fillStyle = "#8fd4ff";
        ctx.beginPath();
        ctx.moveTo(S * 0.28, -S * 0.34);
        ctx.quadraticCurveTo(S * 0.36, -S * 0.20, S * 0.28, -S * 0.16);
        ctx.quadraticCurveTo(S * 0.20, -S * 0.20, S * 0.28, -S * 0.34);
        ctx.fill();
        break;
      case 7:   // 분노 표시
        ctx.strokeStyle = "#ff3b3b";
        ctx.lineWidth = Math.max(2, S * 0.035);
        for (const off of [[0, 0], [S * 0.09, S * 0.05]]) {
          ctx.beginPath();
          ctx.moveTo(S * 0.20 + off[0], -S * 0.32 + off[1]);
          ctx.lineTo(S * 0.27 + off[0], -S * 0.26 + off[1]);
          ctx.lineTo(S * 0.20 + off[0], -S * 0.20 + off[1]);
          ctx.stroke();
        }
        break;
    }
    ctx.restore();
  }

  function drawItems() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const it of items) {
      ctx.save();
      const bob = it.bob !== undefined ? Math.sin(it.bob) * 4 : 0;
      ctx.translate(it.x, it.y + bob);
      ctx.rotate(it.rot);
      if (it.special) {
        // 종류마다 다른 색 기운 — 미리 알아보고 피하라고
        ctx.fillStyle = it.special === "split" ? "rgba(200,107,255,.34)"
                      : it.special === "zigzag" ? "rgba(70,215,255,.32)"
                      : "rgba(255,196,60,.34)";
        ctx.beginPath();
        ctx.arc(0, 0, it.size * 0.60, 0, 6.283);
        ctx.fill();
      }
      if (it.skin === "fever" && feverPoop) {
        ctx.drawImage(feverPoop, -it.size / 2, -it.size / 2, it.size, it.size);
      } else {
        ctx.font = it.size + "px serif";
        ctx.fillText(it.emoji, 0, 0);
        if (it.type === "poop" && it.face > 1 && it.size >= 34) {
          drawPoopFace(it.face, it.size);
        }
      }
      ctx.restore();
    }
  }

  // 위쪽 두 봉우리가 둥글고 아래가 뾰족한 통통한 하트
  function heartPath(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + r * 1.00);
    ctx.bezierCurveTo(cx - r * 0.62, cy + r * 0.45, cx - r * 1.32, cy - r * 0.05, cx - r * 1.32, cy - r * 0.52);
    ctx.bezierCurveTo(cx - r * 1.32, cy - r * 1.06, cx - r * 0.72, cy - r * 1.28, cx - r * 0.34, cy - r * 0.92);
    ctx.bezierCurveTo(cx - r * 0.16, cy - r * 0.75, cx - r * 0.05, cy - r * 0.60, cx, cy - r * 0.50);
    ctx.bezierCurveTo(cx + r * 0.05, cy - r * 0.60, cx + r * 0.16, cy - r * 0.75, cx + r * 0.34, cy - r * 0.92);
    ctx.bezierCurveTo(cx + r * 0.72, cy - r * 1.28, cx + r * 1.32, cy - r * 1.06, cx + r * 1.32, cy - r * 0.52);
    ctx.bezierCurveTo(cx + r * 1.32, cy - r * 0.05, cx + r * 0.62, cy + r * 0.45, cx, cy + r * 1.00);
    ctx.closePath();
  }

  function drawHud() {
    ctx.save();
    const top = 14;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = "700 26px system-ui, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillText(Math.floor(score).toLocaleString(), 17, top + 1);
    ctx.fillStyle = "#fff";
    ctx.fillText(Math.floor(score).toLocaleString(), 16, top);

    ctx.font = "600 13px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText("LEVEL " + level, 17, top + 32);

    // 보유 증강 — 아이콘과 중첩 횟수 (우산은 캐릭터 머리 위에 이미 보이므로 제외)
    const owned = AUGMENTS.filter(a => augCount[a.id] && !a.noCount);
    if (owned.length) {
      ctx.font = "15px serif";
      let x = 17;
      for (const a of owned) {
        ctx.fillStyle = "#fff";
        ctx.fillText(a.ic, x, top + 52);
        const n = augCount[a.id];
        if (n > 1) {
          ctx.font = "700 10px system-ui, sans-serif";
          ctx.fillStyle = "#ffd23f";
          ctx.fillText("x" + n, x + 16, top + 56);
          ctx.font = "15px serif";
          x += 30;
        } else {
          x += 21;
        }
      }
    }

    // 목숨은 이모지 대신 직접 그린다.
    // iOS 이모지는 지정한 상단선보다 위로 튀어나와서 화면 밖으로 잘리는 문제가 있었다.
    const hr = 10.5, hgap = 30, hy = top + 16;
    for (let i = 0; i < lives; i++) {
      const cx = W - 18 - hr * 1.32 - i * hgap;
      ctx.fillStyle = "rgba(70,8,20,.32)";                // 그림자
      heartPath(cx, hy + 2.5, hr * 1.06);
      ctx.fill();
      ctx.fillStyle = "#ff3d6a";
      heartPath(cx, hy, hr);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.7)";             // 광택
      ctx.beginPath();
      ctx.ellipse(cx - hr * 0.55, hy - hr * 0.62, hr * 0.30, hr * 0.20, -0.56, 0, 6.283);
      ctx.fill();
    }

    // 🔥 뚜니핑 타임 게이지
    if (fever) {
      // 점수·레벨과 겹치지 않도록 화면 한가운데에 표시
      const bw = Math.min(260, W - 60), bx = (W - bw) / 2, by = H / 2 + 8;
      const ty = H / 2 - 24;
      ctx.textAlign = "center";
      ctx.font = "800 22px system-ui, sans-serif";
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(120,30,0,.55)";
      ctx.strokeText("🔥 뚜니핑 타임 🔥", W / 2, ty);
      ctx.fillStyle = "#fff";
      ctx.fillText("🔥 뚜니핑 타임 🔥", W / 2, ty);

      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, 10, 5); ctx.fill();
      ctx.fillStyle = "#fff36b";
      ctx.beginPath(); ctx.roundRect(bx, by, bw * feverT, 10, 5); ctx.fill();
    }
    ctx.restore();
  }

  function drawEffects() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
      ctx.font = "800 " + (f.size || 22) + "px system-ui, sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,60,60," + (flash * .35) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (feverFlash > 0) {
      ctx.fillStyle = "rgba(255,240,180," + (feverFlash * .6) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function frame(now) {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    update(dt, now);

    ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawBackground(now);
    drawItems();
    drawHelpers();
    if (state !== STATE.OVER) drawPlayer(now);
    drawEffects();
    ctx.restore();
    if (state === STATE.PLAY) drawHud();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
