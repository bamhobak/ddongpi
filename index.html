  /* 배경음용 뚜니핑 여부 — fever 는 증강 화면·일시정지에서 꺼지므로,
     그대로 쓰면 달을 먹을 때마다 곡이 갈아탔다가 돌아와 처음부터 다시 시작한다. */
  let feverBgm = false;
  let feverBanner = 0;               // 뚜니핑 타임 시작 알림 (1 → 0, 1.1초)
  /* 쉬었음 청년으로 시작할 때 뜨는 엄마의 한마디 — 남은 시간(초). 뚜니핑 알림과 달리
     글자가 길어 두 줄로 띄우고, 아케이드투가 아니라 따뜻한 색으로 쓴다. */
  const MOM_SEC = 5;
  const MOM_LINES = ["이재야.. 엄마는 우리 딸 믿어.", "파이팅"];
  let momMsg = 0;
  let last = 0;

  const keys = {};
  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    /* 방귀 대시 — 키보드로 할 때는 두 번 두드릴 데가 없으니 스페이스바로 낸다.
       나아가는 쪽은 지금 누르고 있는 방향키, 아무것도 안 누르고 있으면 보고 있는 쪽. */
    if (e.key === " " && state === STATE.PLAY && aug.dash && !e.repeat) {
      e.preventDefault();
      const kdir = (keys.ArrowLeft || keys.a || keys.A) ? -1
                 : (keys.ArrowRight || keys.d || keys.D) ? 1
                 : (facing === "left" ? -1 : 1);
      tryDash(performance.now(), player.x + kdir * 100);
    }
    if (e.key === " " || e.key === "Enter") {
      // 증강 선택 중에는 재시작되면 안 된다
      if (state === STATE.READY || state === STATE.OVER) {
        e.preventDefault();
        if (jobScreen.classList.contains("hidden")) openJobSelect();
      }
      if ((e.key === "Escape" || e.key === "p" || e.key === "P") && state === STATE.PLAY) {
        doPause();
      }
    }
  });
  window.addEventListener("keyup", e => { keys[e.key] = false; });

  /* 터치: 손가락을 화면 어디에 대도 좌우로 끌어서 조작 */
  function pointerX(e) {
    const r = cv.getBoundingClientRect();
    const cx = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - r.left;
    return cx / r.width * W;
  }
  function pointerY(e) {
    const r = cv.getBoundingClientRect();
    const cy = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY) - r.top;
    return cy / r.height * H;
  }
  /* 터치 조작 — 화면 어디를 누르든 그 자리가 기준점이 되고, 손가락을 끄는 만큼 캐릭터가 따라 움직인다
     (누른 자리로 순간이동하지 않는다). 좌우는 누구나, 위아래는 날 수 있을 때만.
     손가락을 떼면 기준점이 풀리고, 다시 누르면 그 자리가 새 기준점. PC 는 마우스를 누른 채 끈다.
     화면 끝에 닿으면 기준점을 끌어와서, 반대로 돌리는 순간 바로 따라온다. */
  const DRAG_GAIN = 1.5;             // 손가락이 움직인 거리 × 이만큼 (엄지를 조금만 움직여도 되게)
  let drag = null;                   // { fx, fy, px, py } 기준점의 손가락·캐릭터 자리
  function dragBlocked(e) {
    if (state !== STATE.PLAY || dying > 0) return true;
    /* 화면(증강·직업 선택)을 누른 손가락이 그대로 게임 조작으로 새는 걸 막는다.
       화면이 닫힌 뒤 브라우저가 같은 자리에 흉내내는 마우스 이벤트를 흘려보낸다. */
    if (performance.now() < inputHoldUntil) return true;
    if (ctrlMode === "pad") return true;
    return false;
  }
  function dragAnchor(e) {
    drag = { fx: pointerX(e), fy: pointerY(e), px: player.tx, py: flyOn ? player.ty : groundY };
  }
  function dragStart(e) {
    if (dragBlocked(e)) { drag = null; if (e.cancelable) e.preventDefault(); return; }
    dragAnchor(e);
    if (e.cancelable) e.preventDefault();
  }
  function dragMove(e) {
    if (dragBlocked(e)) { drag = null; if (e.cancelable) e.preventDefault(); return; }
    if (!drag) { dragAnchor(e); if (e.cancelable) e.preventDefault(); return; }   // 막혀 있던 손가락은 여기서 기준점을 잡는다
    const kd = prophIs("reverse") ? -1 : 1;           // 거꾸로 가는 날 — 끄는 방향과 반대로
    const wantX = drag.px + (pointerX(e) - drag.fx) * DRAG_GAIN * kd;
    const x = Math.max(player.r, Math.min(W - player.r, wantX));
    if (x !== wantX) drag.px += x - wantX;            // 끝에 닿으면 기준점을 끌어온다
    player.tx = x;
    if (flyOn) {
      const top = H * FLY_TOP;
      const wantY = drag.py + (pointerY(e) - drag.fy) * DRAG_GAIN;
      const y = Math.max(top, Math.min(groundY, wantY));
      if (y !== wantY) drag.py += y - wantY;
      player.ty = y;
    }
    if (e.cancelable) e.preventDefault();
  }
  function dragEnd(e) {
    // 여러 손가락 중 하나만 뗐으면 남은 손가락으로 기준점을 다시 잡는다
    if (e.touches && e.touches.length) { if (!dragBlocked(e)) dragAnchor(e); return; }
    drag = null;
  }
  cv.addEventListener("touchstart", dragStart, { passive: false });
  cv.addEventListener("touchmove", dragMove, { passive: false });
  cv.addEventListener("touchend", dragEnd);
  cv.addEventListener("touchcancel", dragEnd);
  cv.addEventListener("mousedown", e => { if (e.button === 0) dragStart(e); });
  cv.addEventListener("mousemove", e => { if (e.buttons & 1) dragMove(e); });
  window.addEventListener("mouseup", () => { drag = null; });

  /* ---------- 두 번 두드리기 → 방귀 대시 ----------
     끌기 조작과 섞이지 않는 게 제일 중요하다. '짧게 눌렀다 뗀' 것만 한 번의 두드림으로 치고
     (TAP_MS 안에 떼고, 그동안 TAP_MOVE 넘게 끌지 않았을 것), 그 뒤 DTAP_MS 안에 가까운 자리를
     다시 누르면 터진다. 끌고 있는 손가락은 TAP_MOVE 에서 걸러지므로 오작동하지 않는다.
     십자패드 모드에서도 놀이판을 두드리면 되게 끌기와 따로 듣는다. */
  const TAP_MS = 220, TAP_MOVE = 26, DTAP_MS = 300, DTAP_DIST = 130;
  let tapDownAt = 0, tapDownX = 0, tapDownY = 0, tapMoved = 0;
  let lastTapAt = -1e9, lastTapX = 0, lastTapY = 0;
  /* 폰은 터치가 끝난 뒤 브라우저가 같은 자리에 마우스 이벤트를 흉내 내서 보낸다.
     그걸 두 번째 두드림으로 세면 한 번만 눌러도 대시가 나간다 — 잠깐 마우스를 흘려보낸다. */
  let lastTouchAt = 0;
  function mouseEcho(e) {
    if (e.touches) { lastTouchAt = performance.now(); return false; }
    return performance.now() - lastTouchAt < 700;
  }
  function tapDown(e) {
    if (mouseEcho(e)) return;
    if (state !== STATE.PLAY || dying > 0) return;
    const now = performance.now();
    if (now < inputHoldUntil) return;
    const x = pointerX(e), y = pointerY(e);
    if (now - lastTapAt < DTAP_MS && Math.hypot(x - lastTapX, y - lastTapY) < DTAP_DIST) {
      lastTapAt = -1e9;                 // 세 번째 두드림이 이어서 또 터지지 않게
      tapDownAt = 0;
      tryDash(now, x);
      return;
    }
    tapDownAt = now; tapDownX = x; tapDownY = y; tapMoved = 0;
  }
  function tapMove(e) {
    if (mouseEcho(e) || !tapDownAt) return;
    tapMoved = Math.max(tapMoved, Math.hypot(pointerX(e) - tapDownX, pointerY(e) - tapDownY));
  }
  function tapUp(e) {
    if (e && mouseEcho(e)) return;
    const now = performance.now();
    if (tapDownAt && now - tapDownAt <= TAP_MS && tapMoved <= TAP_MOVE) {
      lastTapAt = now; lastTapX = tapDownX; lastTapY = tapDownY;
    } else lastTapAt = -1e9;            // 끌었던 손가락은 두드림으로 치지 않는다
    tapDownAt = 0;
  }
  cv.addEventListener("touchstart", tapDown, { passive: false });
  cv.addEventListener("touchmove", tapMove, { passive: false });
  cv.addEventListener("touchend", tapUp);
  cv.addEventListener("touchcancel", tapUp);
  cv.addEventListener("mousedown", e => { if (e.button === 0) tapDown(e); });
  cv.addEventListener("mousemove", e => { if (e.buttons & 1) tapMove(e); });
  window.addEventListener("mouseup", tapUp);

  /* ---------- 조작 방식: 터치 따라가기 / 십자패드 ----------
     십자패드는 누르고 있는 동안 키보드 방향키와 같은 신호를 낸다. */
  const LS_CTRL = "epjpddongpi_ctrl";
  let ctrlMode = "touch";
  try { ctrlMode = localStorage.getItem(LS_CTRL) === "pad" ? "pad" : "touch"; } catch (e) {}
  const dpad = document.getElementById("dpad");
  function syncPad() {   // 게임 중 + 십자패드 모드일 때만 보인다
    const on = ctrlMode === "pad" && btnPause.classList.contains("on");
    dpad.classList.toggle("on", on);
    dpad.classList.toggle("noVert", !flyOn);
    if (!on) padClear();
  }
  /* 소리 버튼도 생김새를 맞추려고 같은 클래스를 쓰므로, 조작 쪽은 제 상자 안만 본다.
     (예전에는 전체를 훑어서 서로를 꺼 버렸다) */
  function showCtrl() {
    for (const b of document.querySelectorAll("#ctrlBox .ctrlBtn"))
      b.classList.toggle("on", b.dataset.ctrl === ctrlMode);
  }
  for (const b of document.querySelectorAll("#ctrlBox .ctrlBtn")) {
    b.addEventListener("click", () => {
      ctrlMode = b.dataset.ctrl;
      try { localStorage.setItem(LS_CTRL, ctrlMode); } catch (e) {}
      showCtrl();
      beep(760, .06, "square", .03);
    });
  }
  showCtrl();
  /* 패드 안에서 누른 지점의 방향으로 움직인다. 손가락을 떼지 않고 밀기만 해도 방향이 바뀌고,
     가운데로 돌아오면 멈춘다. 대각선도 된다. */
  const padKnob = dpad.querySelector(".knob");
  /* 패드를 민 정도(0~1). 키보드로 조작할 때는 항상 1이라 예전과 똑같다. */
  let padAmpX = 1, padAmpY = 1;
  const PAD_MIN = 0.10;          // 살짝만 밀었을 때의 최소 속도 비율
  const PAD_STEPS = 16;          // 최소~최대 사이를 이만큼의 단계로 나눈다
  const PAD_RANGE = 105;         // 이 거리(px)까지 밀어야 최고 속도 — 패드 밖으로 나가도 이어진다
  /* 느린 구간을 넓게 잡아 섬세하게 다루고, 끝까지 밀었을 때만 최고 속도가 나온다.
     빠른 캐릭터(부양사)일수록 저속 구간이 더 넓어야 조준이 된다. */
  function padAmp(v, dead) {
    const t = Math.max(0, Math.min(1, (Math.abs(v) - dead) / (PAD_RANGE - dead)));
    const e = 1.6 + (spdMul() - 1) * 0.5;        // 빠른 직업은 더 완만하게
    const q = Math.round(Math.pow(t, e) * PAD_STEPS) / PAD_STEPS;
    return PAD_MIN + (1 - PAD_MIN) * q;
  }
  const padArrow = {
    ArrowUp: dpad.querySelector(".up"), ArrowDown: dpad.querySelector(".dn"),
    ArrowLeft: dpad.querySelector(".lf"), ArrowRight: dpad.querySelector(".rt")
  };
  function padSet(l, r, u, d) {
    keys.ArrowLeft = l; keys.ArrowRight = r; keys.ArrowUp = u; keys.ArrowDown = d;
    padArrow.ArrowLeft.classList.toggle("hit", l);
    padArrow.ArrowRight.classList.toggle("hit", r);
    padArrow.ArrowUp.classList.toggle("hit", u);
    padArrow.ArrowDown.classList.toggle("hit", d);
  }
  function padClear() {
    padAmpX = padAmpY = 1;
    padSet(false, false, false, false);
    dpad.classList.remove("press");
    padKnob.style.transform = "";
  }
  function padMove(e) {
    const r = dpad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const flat = dpad.classList.contains("noVert");   // 좌우 전용 알약 패드
    if (flat) {
      // 가로로만 움직인다. 가운데 12px 안쪽은 정지 구역.
      const max = r.width / 2 - 34;
      const kx = Math.max(-max, Math.min(max, dx));
      padKnob.style.transform = "translateX(" + kx.toFixed(1) + "px)";
      if (Math.abs(dx) < 5) { padSet(false, false, false, false); return; }
      padAmpX = padAmp(dx, 5);
      padSet(dx < 0, dx > 0, false, false);
      return;
    }
    const dist = Math.hypot(dx, dy);
    const max = r.width / 2 - 16;
    const k = dist > max ? max / dist : 1;         // 손잡이는 패드 안에서만 움직인다
    padKnob.style.transform = "translate(" + (dx * k).toFixed(1) + "px," + (dy * k).toFixed(1) + "px)";
    if (dist < 7) { padSet(false, false, false, false); return; }    // 가운데는 정지
    // 가로·세로 성분 중 확실히 큰 쪽만 켠다. 둘이 비슷하면(2배 이내) 대각선.
    const horiz = Math.abs(dx) >= Math.abs(dy) * 0.5;
    const vert  = flyOn && Math.abs(dy) >= Math.abs(dx) * 0.5;
    // 민 거리에 비례한 세기 — 축마다 따로 잰다 (대각선에서도 자연스럽게)
    padAmpX = padAmp(dx, 4);
    padAmpY = padAmp(dy, 4);
    padSet(horiz && dx < 0, horiz && dx > 0, vert && dy < 0, vert && dy > 0);
  }
  dpad.addEventListener("pointerdown", e => {
    dpad.classList.add("press");
    try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
    padMove(e);
    if (e.cancelable) e.preventDefault();
  });
  dpad.addEventListener("pointermove", e => {
    if (!dpad.classList.contains("press")) return;
    padMove(e);
    if (e.cancelable) e.preventDefault();
  });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) dpad.addEventListener(ev, padClear);
  dpad.addEventListener("contextmenu", e => e.preventDefault());

  /* ---------- 플레이어 이름 ----------
     시작 화면에서 미리 정해두고, 게임이 끝나면 조건을 만족할 때 자동으로 등록된다. */
  const nameBox   = document.getElementById("nameBox");
  const nameEdit  = document.getElementById("nameEdit");
  const myNameEl  = document.getElementById("myName");
  const startName = document.getElementById("startName");

  function savedName() {
    try { return (localStorage.getItem(LS_NAME) || "").trim(); } catch (e) { return ""; }
  }
  function showNameView() {
    const n = savedName();
    myNameEl.textContent = n || "-";
    if (n) { nameBox.classList.remove("off"); nameEdit.classList.remove("on"); }
    else   { nameBox.classList.add("off");    nameEdit.classList.add("on"); }
  }
  function startEditName() {
    startName.value = savedName();
    nameBox.classList.add("off");
    nameEdit.classList.add("on");
    startName.focus();
  }
  function saveName() {
    const n = startName.value.trim().slice(0, 5);
    if (!n) { startName.focus(); return; }
    try { localStorage.setItem(LS_NAME, n); } catch (e) {}
    showNameView();
  }
  document.getElementById("btnEditName").addEventListener("click", startEditName);
  document.getElementById("btnSaveName").addEventListener("click", saveName);
  startName.addEventListener("keydown", e => {
    e.stopPropagation();                       // 스페이스로 게임이 시작되지 않도록
    if (e.key === "Enter") { e.preventDefault(); saveName(); }
  });
  showNameView();

  /* ---------- 일시정지 ----------
     멈춘 동안의 시간은 뚜니핑·무적 마감에서 빼 주고,
     풀 때는 3초를 세고 나서 다시 움직인다. */
  const btnPause = document.getElementById("btnPause");
  const pauseScreen = document.getElementById("pauseScreen");
  let pauseAt = 0, resumeCountEnd = 0;

  function doPause() {
    if (state !== STATE.PLAY) return;
    state = STATE.PAUSE;
    pauseAt = performance.now();
    resumeCountEnd = 0;
    btnPause.classList.remove("on"); syncPad();
    pauseScreen.classList.remove("hidden");
    beep(500, .08, "sine", .04);
  }
  btnPause.addEventListener("click", doPause);
  if (SPLASH_USE) startScreen.style.visibility = "hidden";      // 스플래시가 끝나면 드러난다
  for (const ev of ["pointerdown", "keydown"])
    window.addEventListener(ev, () => endSplash(), { passive: true });
  for (const b of document.querySelectorAll(".sndBtn")) {
    b.addEventListener("click", () => setSnd(b.dataset.snd,
      b.dataset.snd === "bgm" ? !bgmOff : !sfxOff));
  }
  syncSoundUI();

  document.getElementById("btnResume").addEventListener("click", () => {
    readyBeat = false;
    pauseScreen.classList.add("hidden");
    resumeCountEnd = performance.now() + 3000;   // 3초 세고 나서 재개
    beep(700, .08, "sine", .04);
  });

  // 일시정지에서 다시하기 — 이번 판은 기록 없이 버리고 직업 선택부터 다시
  document.getElementById("btnPauseRetry").addEventListener("click", () => {
    pauseScreen.classList.add("hidden");
    resumeCountEnd = 0;
    state = STATE.OVER;
    beep(520, .08, "square", .04);
    openJobSelect();
  });

  /* 앱이 뒤로 가거나(홈·전화·알림·탭 전환) 화면이 꺼지면 — 판은 일시정지, 소리는 전부 멈춘다.
     돌아오면 일시정지 화면이 떠 있고, '계속'을 누르면 3-2-1 을 세고 다시 움직인다.
     3-2-1 을 세던 중에 가려지면 일시정지 화면으로 되돌린다. */
  let appHidden = false, bgmHeld = [];
  function onAppHide() {
    if (appHidden) return;                     // visibilitychange 와 pagehide 가 겹쳐 와도 한 번만
    appHidden = true;
    if (state === STATE.PLAY) doPause();
    else if (state === STATE.PAUSE && resumeCountEnd > 0) {
      resumeCountEnd = 0; readyBeat = false;
      pauseScreen.classList.remove("hidden");
    }
    bgmHeld = [];
    for (const k in bgmPair) for (const a of bgmPair[k]) if (!a.paused) { a.pause(); bgmHeld.push(a); }
    try { if (ac && ac.state === "running") ac.suspend(); } catch (e) {}
  }
  function onAppShow() {
    if (!appHidden) return;
    appHidden = false;
    try { if (ac && ac.state === "suspended" && !sfxOff) ac.resume(); } catch (e) {}
    if (!bgmOff) for (const a of bgmHeld) { const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); }
    bgmHeld = [];
    last = 0;                                  // 가려져 있던 시간을 한 프레임으로 치지 않게
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) onAppHide(); else onAppShow(); });
  window.addEventListener("pagehide", onAppHide);
  window.addEventListener("pageshow", () => { if (!document.hidden) onAppShow(); });

  function finishResume(now) {
    readyBeat = false;
    const paused = now - pauseAt;
    if (powerUntil > 0) powerUntil += paused;
    if (invUntil  > 0) invUntil  += paused;
    if (hurtUntil > 0) hurtUntil += paused;
    resumeCountEnd = 0;
    state = STATE.PLAY;
    btnPause.classList.add("on"); syncPad();
    beep(950, .1, "square", .05);
  }

  /* ---------- 직업 선택 화면 ----------
     시작하기·다시하기를 누르면 먼저 직업을 고른다. 카드를 누르면 바로 시작하지 않고
     그 직업을 크게 보여 주고, '이걸로 시작'을 눌러야 판이 시작된다. */
  const jobScreen = document.getElementById("jobScreen");
  const jobList   = document.getElementById("jobList");
  const jobDetail = document.getElementById("jobDetail");
  const btnJobBack = document.getElementById("btnJobBack");
  let jobTestMode = false;              // 테스트 모드로 들어왔는지 (상세를 거쳐도 유지)

  /* 긴 설명을 가운뎃점으로 끊어 줄 단위로 보여 준다 */
  function jobTraitLines(j) {
    return String(j.ds).split("·").map(t => t.trim()).filter(Boolean);
  }
  /* 직업 그림 — 강아지 모드면 강아지로 (방울이는 원래 강아지라 그대로) */
  function jobPic(id) {
    return dogMode && DOG_SPRS[id] ? "assets/dogs/" + id + "_right.png"
                                   : "assets/" + JOB_IMG[id] + "_right.png";
  }
  function showJobDetail(id) {
    job = id;
    // 맨몸대결·똥탑등반의 방울이는 '고른 직업'으로 저장하지 않는다 (똥대잔치로 돌아오면 원래 직업)
    if (!jobLocked()) try { localStorage.setItem(LS_JOB, job); } catch (e) {}
    const j = JOBS[id];
    document.getElementById("jobPetLine").textContent =
      "펫 · " + PETS[pet].ic + " " + PETS[pet].nm + (pet === "none" ? "" : " — " + PETS[pet].ds);
    document.getElementById("jobBig").src = jobPic(id);
    document.getElementById("jobBig").alt = j.nm;
    document.getElementById("jobName").textContent = j.nm;
    const tr = document.getElementById("jobTraits");
    tr.innerHTML = "";
    for (const line of jobTraitLines(j)) {
      const d = document.createElement("div");
      d.className = "tr";
      const dot = document.createElement("span");
      dot.className = "dot";
      d.appendChild(dot);
      d.appendChild(document.createTextNode(line));   // textContent → HTML 삽입 불가
      tr.appendChild(d);
    }
    if (jobLocked()) {                        // 맨몸대결·똥탑등반 — 비누방울 없이
      const d = document.createElement("div");
      d.className = "tr";
      const dot = document.createElement("span");
      dot.className = "dot";
      d.appendChild(dot);
      d.appendChild(document.createTextNode(MODES[gameMode].nm + "에서는 비누방울 없이 뛴다"));
      tr.appendChild(d);
    }
    if (j.f) {                                // 직업마다 붙는 한마디 — 모양은 위와 같게
      const d = document.createElement("div");
      d.className = "tr";
      const dot = document.createElement("span");
      dot.className = "dot";
      d.appendChild(dot);
      d.appendChild(document.createTextNode(j.f));
      tr.appendChild(d);
    }
    jobList.classList.add("hidden");
    pickTabs.classList.add("hidden"); pickFoot.classList.add("hidden");
    document.querySelector("#jobScreen h2").textContent = "이대로 시작?";
    jobDetail.classList.remove("hidden");
    btnJobBack.hidden = true;              // 상세에서는 '다른 직업 보기'로만 빠져나간다
  }
  /* 고르는 화면 — [직업] [펫] 탭. 카드를 누르면 '선택'만 되고, 아래 '결정'을 눌러야 다음으로 간다. */
  const pickTabs = document.getElementById("pickTabs");
  const pickFoot = document.getElementById("pickFoot");
  const tabJob = document.getElementById("tabJob"), tabPet = document.getElementById("tabPet");
  let pickTab = "job";
  function pickCard(sel, pic, name, title, onPick) {
    const card = document.createElement("button");
    card.className = "augCard";
    const tx = document.createElement("div"); tx.className = "tx";
    const nm = document.createElement("div"); nm.className = "nm2"; nm.textContent = name;
    if (title) card.title = title;
    if (sel) card.classList.add("sel");
    tx.append(nm);
    card.append(pic, tx);
    card.addEventListener("click", () => { beep(900, .08, "square", .05); onPick(); renderPick(); });
    return card;
  }
  function renderPick() {
    if (jobLocked()) job = "bangul";          // 맨몸대결·똥탑등반 — 탭 글자부터 방울이로
    if (petLocked()) { pet = "none"; petView = "none"; }
    tabJob.classList.toggle("on", pickTab === "job");
    tabPet.classList.toggle("on", pickTab === "pet");
    document.querySelector("#jobScreen h2").textContent = pickTab === "job" ? "직업 선택" : "펫 선택";
    // 탭에 지금 고른 것을 같이 적어 둔다 — 다른 탭에 있어도 무엇을 골랐는지 보이게
    tabJob.innerHTML = "직업<small></small>"; tabJob.lastChild.textContent = JOBS[job].nm;
    tabPet.innerHTML = "펫<small></small>";   tabPet.lastChild.textContent = PETS[pet].nm;
    jobList.innerHTML = "";
    if (pickTab === "job") {
      const lockJ = jobLocked();
      // 카드 앞에는 이모지 대신 그 직업의 이재(오른쪽 이동 모습)를 보여준다
      for (const id in JOBS) {
        const ic = document.createElement("img"); ic.className = "ic";
        ic.src = jobPic(id); ic.alt = JOBS[id].ic;
        const card = pickCard(id === job, ic, JOBS[id].nm, JOBS[id].ds, () => {
          if (lockJ) return;                  // 맨몸대결·똥탑등반은 방울이만
          job = id;
          try { localStorage.setItem(LS_JOB, job); } catch (e) {}
        });
        if (lockJ && id !== "bangul") {
          card.classList.add("locked");
          const lk = document.createElement("span"); lk.className = "lock"; lk.textContent = "🔒";
          card.appendChild(lk);
        }
        jobList.appendChild(card);
      }
      document.getElementById("pickDesc").textContent = lockJ
        ? MODES[gameMode].nm + "은 방울이만 뛸 수 있어요 (비누방울 없이)" : "";
    } else {
      if (!PETS[petView]) petView = pet;
      for (const id in PETS) {
        let ic;
        if (PETS[id].img) { ic = document.createElement("img"); ic.className = "ic"; ic.src = PETS[id].img; ic.alt = PETS[id].ic; }
        else { ic = document.createElement("div"); ic.className = "petNone"; ic.textContent = PETS[id].ic; }
        const card = pickCard(id === petView, ic, PETS[id].nm, PETS[id].ds, () => {
          if (petLocked()) return;          // 맨몸대결·똥탑등반은 펫 없이
          petView = id;                     // 잠긴 펫은 보기만 — 데리고 가는 펫은 그대로
          if (hasPet(id)) {
            pet = id;
            try { localStorage.setItem(LS_PET, pet); } catch (e) {}
          }
        });
        if (petLocked() && id !== "none") {
          card.classList.add("locked");
          const lk = document.createElement("span"); lk.className = "lock"; lk.textContent = "🔒";
          card.appendChild(lk);
        } else if (!hasPet(id)) {
          card.classList.add("locked");
          const lk = document.createElement("span"); lk.className = "lock";
          lk.textContent = "🔒 " + PET_PRICE;
          card.appendChild(lk);
        }
        jobList.appendChild(card);
      }
      const locked = !hasPet(petView);
      if (petLocked()) {
        document.getElementById("pickDesc").textContent = MODES[gameMode].nm + "은 펫 없이 뛰어요";
        buy.hidden = true;
        return;
      }
      document.getElementById("pickDesc").textContent =
        (locked ? "🔒 " : "") + PETS[petView].ds + "";
      buy.hidden = !locked;
      if (locked) {
        buy.disabled = coins < PET_PRICE;
        buy.textContent = coins < PET_PRICE
          ? "코인 부족 (" + coins.toLocaleString() + " / " + PET_PRICE + ")"
          : "🔓 " + PET_PRICE + "코인으로 해금 (보유 " + coins.toLocaleString() + ")";
      }
    }
    if (pickTab !== "pet") buy.hidden = true;
  }
  let petView = "none";                    // 펫 탭에서 지금 보고 있는 펫 (잠긴 것일 수도 있다)
  const buy = document.getElementById("btnPetBuy");
  buy.addEventListener("click", () => {
    const id = petView;
    if (hasPet(id) || coins < PET_PRICE) return;
    coins -= PET_PRICE;                    // 판에서 주운 코인(coinRun)과는 상관없다 — 모아 둔 전체에서 뺀다
    try { localStorage.setItem(LS_COINS, String(coins)); } catch (e) {}
    showCoins();

    try { localStorage.setItem(LS_PET_OWN, JSON.stringify([...petOwned])); } catch (e) {}

    try { localStorage.setItem(LS_PET, pet); } catch (e) {}
    if (!sfx("giant")) { beep(880, .1, "triangle", .06); beep(1320, .16, "triangle", .05); }
    renderPick();
  });
  tabJob.addEventListener("click", () => { beep(640, .05, "square", .04); pickTab = "job"; renderPick(); });
  tabPet.addEventListener("click", () => { beep(640, .05, "square", .04); pickTab = "pet"; petView = pet; renderPick(); });
  // 결정 — 고른 직업·펫을 확인하는 상세 화면으로
  document.getElementById("btnPickOk").addEventListener("click", () => {
    beep(900, .08, "square", .05);

  function showJobList() {
    jobDetail.classList.add("hidden");

  function openJobSelect(test) {           // test === true 면 고른 뒤 테스트 모드로 시작

  document.getElementById("btnJobGo").addEventListener("click", () => {
    jobScreen.classList.add("hidden");
    beep(900, .08, "square", .05);

  /* 시작화면으로 되돌아간다 — 직업 선택의 [뒤로], 게임오버의 [메인으로] 가 같은 길을 쓴다.
     배경음은 state 를 보고 저절로 메뉴 곡으로 돌아가고, 코인·순위표는 이미 갱신돼 있다. */
  function goHome() {
    beep(520, .06, "square", .04);
    jobScreen.classList.add("hidden");
    overScreen.classList.add("hidden");

    pauseScreen.classList.add("hidden");
    nameRow.classList.remove("on");       // 이름 등록 줄은 닫고 나간다
    btnPause.classList.remove("on"); syncPad();
    startScreen.classList.remove("hidden");
    state = STATE.READY;                 // 시작화면 데모가 다시 돌게
  }
  // 직업을 고르지 않고 시작화면으로 되돌아간다 (테스트 종료와 같은 길)
  btnJobBack.addEventListener("click", goHome);
  document.getElementById("btnHome").addEventListener("click", goHome);

  function syncMode() {
    for (const b of document.querySelectorAll("#modeSeg button")) {
      const on = b.dataset.mode === gameMode;
      b.classList.toggle("locked", b.dataset.mode === "noitem" && !towerOpen);

  }
  function syncBoardTabs() {
    const hide = gameMode !== "item";
    for (const b of document.querySelectorAll(".board.withTabs")) b.classList.toggle("noTabs", hide);
    if (hide && boardJob !== "all") {           // 직업 탭을 보던 중이면 전체로
      boardJob = "all";
      for (const t of document.querySelectorAll(".jobTab")) t.classList.toggle("on", t.dataset.job === "all");
    }

  function setMode(m) {
    gameMode = m;
    syncBoardTabs();
    if (m === "item") { try { const j = localStorage.getItem(LS_JOB); job = JOBS[j] ? j : "none";
                              const q = localStorage.getItem(LS_PET); pet = PETS[q] && hasPet(q) ? q : "none"; } catch (e) {} }
    try { localStorage.setItem(LS_MODE, gameMode); } catch (e) {}
    syncMode();
    syncBoardTitle();
    refreshBoards(boardStart);                // 순위표도 그 스테이지 것으로
    refreshLastWeek();
  }
  for (const b of document.querySelectorAll("#modeSeg button")) b.addEventListener("click", () => {
    if (gameMode === b.dataset.mode) return;
    beep(640, .05, "square", .04);
    if (b.dataset.mode === "noitem" && !towerOpen) { openPwScreen("tower"); return; }   // 잠금 — 비밀번호부터
    setMode(b.dataset.mode);
  });
  syncMode();
  document.getElementById("btnStart").addEventListener("click", () => {
    dogMode = false;                                 // 시작하기 — 원래 캐릭터
    if (!savedName()) { startEditName(); return; }   // 이름부터 정하고 시작
    openJobSelect();
  });
  const btnRetry = document.getElementById("btnRetry");
  const btnRetryJob = document.getElementById("btnRetryJob");
  btnRetry.addEventListener("click", () => {
    if (jobLocked()) { openJobSelect(); return; }   // 맨몸대결·똥탑등반은 원래 곧장 시작
    /* 똥대잔치 — 같은 직업·펫으로 곧장 한 판 더 (강아지로 뛰었으면 다시 해도 강아지) */
    overScreen.classList.add("hidden");
    beep(900, .08, "square", .05);
    reset(false);
  });
  btnRetryJob.addEventListener("click", () => openJobSelect());
  // 로고의 '재피' — 시작하기와 똑같이 들어가되 강아지로 뛴다
  document.getElementById("stageDot").addEventListener("click", () => {
    beep(1000, .08, "triangle", .05);
    dogMode = true;
    if (!savedName()) { startEditName(); return; }
    openJobSelect();
  });

  function reset(test) {
    testMode = (test === true);    // 정확히 true 일 때만 테스트 모드 (이벤트 객체가 새어들지 않게)
    if (jobLocked()) job = "bangul";         // 맨몸대결·똥탑등반은 방울이만
    if (petLocked()) pet = "none";           // 펫도 없이
    btnTestEnd.classList.toggle("on", testMode);
    testLv.classList.toggle("on", testMode);
    lvNow.textContent = "Lv 1";
    layout();
    items = []; particles = []; floats = []; warns = []; introPoops = []; introT = 0;
    // 테스트 모드는 어차피 목숨이 안 줄어드니, 목숨 조건 증강(당근거래·분신술)을
    // 바로 시험해볼 수 있게 1부터 시작한다.
    score = 0; lives = testMode ? 1 : 3; level = 1; elapsed = 0; levelTime = 0; starCount = 0;

    scoreSrc = {};
    bubbleOn = (job === "bangul" && !jobLocked()); bubbleT = 0;   // 방울이는 방울을 두르고 시작한다 (맨몸대결·똥탑등반은 방울 없이)
    zoneShown = -1;
    lvSeen = 0; lvGlow = 0; specSeen = {}; fairLog = []; dying = 0; hitStop = 0; readyBeat = false;
    augCount = {};

    angelUsed = false; angelAura = 0; angelFx = 0; petFon = false;
    fairies = []; giftT = GIFT_EVERY * 0.6;
    cats = []; catT = CAT_EVERY * 0.7; catN = 0;

    bullets = []; shipClock = 0; aug.galaga = 0;
    coinRun = 0; coinDebt = 0; coinSeen = 0; coinGot = 0; coinSeenV = 0; coinGotV = 0;
    monkStreak = 0; fullOwn = false; fullBanner = 0; fullFx = 0;
    shieldTimer = UMB_SEC;
    aug.itemRateMul = 1; aug.feverRateMul = 1; aug.giant = 0; aug.magnet = 0;

       타이머를 잡기 전에 켜 두어야 엄마의 밥상 시계가 제대로 돌아간다
       (꺼져 있으면 평균 간격이 무한이라 영영 안 떨어진다). */

    // ---- 펫 ---- 판 내내 한 마리. 기록에는 증강 목록에 'pet:<id>' 로 함께 남긴다

  /* 구름 하나하나의 생김새를 따로 만든다. 같은 덩이 세 개를 겹쳐 놓으면
     어느 구름이나 똑같아 보여서, 덩이 수와 크기·위치를 구름마다 뽑는다. */
  function reshapeCloud(c) {
    const n = 3 + Math.floor(Math.random() * 3);      // 덩이 3~5개
    c.lobes = [];
    let px = -c.s * (0.42 + Math.random() * 0.22);
    for (let i = 0; i < n; i++) {
      const mid = 1 - Math.abs(i - (n - 1) / 2) / (n / 1.6);   // 가운데가 더 봉긋하다
      c.lobes.push({
        dx: px,
        dy: (Math.random() - 0.65) * c.s * 0.16,
        r: c.s * (0.20 + 0.24 * Math.max(0.35, mid) + Math.random() * 0.10)
      });
