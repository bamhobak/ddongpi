    augList.innerHTML = "";
    for (const a of picks) {
      const card = document.createElement("button");
      card.className = "augCard";
      const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = a.ic;
      const tx = document.createElement("span"); tx.className = "tx";
      const nm = document.createElement("div");  nm.className = "nm2"; nm.textContent = nameOf(a);
      const ds = document.createElement("div");  ds.className = "ds";  ds.textContent = a.ds;
      tx.append(nm, ds);
      card.append(ic, tx);
      if (a.hidden) {
        card.classList.add("hid");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "히든";
        card.appendChild(badge);
      }
      if (augCount[a.id] && !a.noCount) {
        const cnt = document.createElement("span");
        cnt.className = "cnt";
        cnt.textContent = "보유 " + augCount[a.id];
        card.appendChild(cnt);
      }
      card.addEventListener("click", () => {
        const picked = nameOf(a);      // 보유 수가 오르기 전 = 카드에 적혀 있던 이름
        augTook[a.id] = augRound;      // 고른 것은 더 오래 쉬어 간다
        a.go();
        augCount[a.id] = (augCount[a.id] || 0) + 1;
        beep(900, .09, "square", .05);
        beep(1350, .13, "square", .05);
        augRemain--;
        if (augRemain > 0) {           // 보름달: 남은 횟수만큼 이어서 고른다
          showAugmentPick();
          return;
        }
        closeAugScreen();
        popText(player.x, player.y - 70, a.ic + " " + picked, "#ffd23f", 24);
      });
      augList.appendChild(card);
    }
    augScreen.classList.remove("hidden");
  }
  let state = STATE.READY;
  let testMode = false;            // 개발자 테스트 모드 — 목숨 무한, 기록 안 남김
  const btnTestEnd = document.getElementById("btnTestEnd");

  let score = 0, lives = 3, level = 1, elapsed = 0, starCount = 0;
  let levelTime = 0;               // 레벨이 오르는 시계 — 뚜니핑 타임에는 멈춰 있다
  let spawnTimer = 0;
  let invUntil = 0, powerUntil = 0;
  let shields = 0;                 // 남은 방패 수 — 우산 아이템은 최대 1, 증강으로만 여러 개
  const UMB_SEC = 5.5;             // 우산 로켓배송: 방패가 없을 때 몇 초마다 하나씩 오는지
  let shieldTimer = UMB_SEC;       // 다음 하나까지 남은 시간
  let spawnHold = 0;               // 성난 우산: 똥 생성이 멈춰 있는 남은 시간
  let bulletT = 0, interTimer = 8;// 인터스텔라: 불릿타임 남은 시간 / 다음 발동까지
  let refillLeft = 0;              // 뚜니핑 무한리필: 이번 뚜니핑에서 더 늘릴 수 있는 양(ms)
  let subsTimer = 0;               // 휴지 정기구독: 마지막 휴지 이후 지난 시간
  let noHitSec = 0;                // 마지막 피격 이후 버틴 시간 (무소유 배율용)
  let clones = [], cloneTimer = 0; // 벼랑 끝 분신술: 날아가는 작은 이재들
  let ghostTimer = 3;              // 유령화: 다음 무적까지 남은 시간
  let roidT = 0;                   // 스테로이드 과다 복용: 남은 약발 시간(초)
  let hurtUntil = 0;               // 똥에 맞은 직후 (아픈 그림 표시)
  let zoneShown = -1;              // 도착 안내를 이미 띄운 단계
  let shake = 0, flash = 0, feverFlash = 0;
  let fever = false, feverT = 0, feverDur = 10000;
  let last = 0;

  const keys = {};
  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === " " || e.key === "Enter") {
      // 증강 선택 중에는 재시작되면 안 된다
      if (state === STATE.READY || state === STATE.OVER) {
        e.preventDefault();
        if (jobScreen.classList.contains("hidden")) openJobSelect();
      }
      if ((e.key === "Escape" || e.key === "p" || e.key === "P") && state === STATE.PLAY) {
        doPause();
      }
    }
  });
  window.addEventListener("keyup", e => { keys[e.key] = false; });

  /* 터치: 손가락을 화면 어디에 대도 좌우로 끌어서 조작 */
  function pointerX(e) {
    const r = cv.getBoundingClientRect();
    const cx = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - r.left;
    return cx / r.width * W;
  }
  function pointerY(e) {
    const r = cv.getBoundingClientRect();
    const cy = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY) - r.top;
    return cy / r.height * H;
  }
  function movePointer(e) {
    if (state !== STATE.PLAY) return;
    if (ctrlMode === "pad") { if (e.cancelable) e.preventDefault(); return; }
    player.tx = Math.max(player.r, Math.min(W - player.r, pointerX(e)));
    if (flyOn) {
      /* 캐릭터가 손가락·커서보다 위에 떠 있도록 한다.
         손에 캐릭터가 가려지지 않아 조작감이 훨씬 낫다. */
      const want = pointerY(e) - 90;
      player.ty = Math.max(H * FLY_TOP, Math.min(groundY, want));
    }
    if (e.cancelable) e.preventDefault();
  }
  cv.addEventListener("mousemove", movePointer);
  cv.addEventListener("touchstart", movePointer, { passive: false });
  cv.addEventListener("touchmove", movePointer, { passive: false });

  /* ---------- 조작 방식: 터치 따라가기 / 십자패드 ----------
     십자패드는 누르고 있는 동안 키보드 방향키와 같은 신호를 낸다. */
  const LS_CTRL = "epjpddongpi_ctrl";
  let ctrlMode = "touch";
  try { ctrlMode = localStorage.getItem(LS_CTRL) === "pad" ? "pad" : "touch"; } catch (e) {}
  const dpad = document.getElementById("dpad");
  function syncPad() {   // 게임 중 + 십자패드 모드일 때만 보인다
    const on = ctrlMode === "pad" && btnPause.classList.contains("on");
    dpad.classList.toggle("on", on);
    dpad.classList.toggle("noVert", !flyOn);
    if (!on) padClear();
  }
  function showCtrl() {
    for (const b of document.querySelectorAll(".ctrlBtn")) b.classList.toggle("on", b.dataset.ctrl === ctrlMode);
  }
  for (const b of document.querySelectorAll(".ctrlBtn")) {
    b.addEventListener("click", () => {
      ctrlMode = b.dataset.ctrl;
      try { localStorage.setItem(LS_CTRL, ctrlMode); } catch (e) {}
      showCtrl();
      beep(760, .06, "square", .03);
    });
  }
  showCtrl();
  /* 패드 안에서 누른 지점의 방향으로 움직인다. 손가락을 떼지 않고 밀기만 해도 방향이 바뀌고,
     가운데로 돌아오면 멈춘다. 대각선도 된다. */
  const padKnob = dpad.querySelector(".knob");
  /* 패드를 민 정도(0~1). 키보드로 조작할 때는 항상 1이라 예전과 똑같다. */
  let padAmpX = 1, padAmpY = 1;
  const PAD_MIN = 0.10;          // 살짝만 밀었을 때의 최소 속도 비율
  const PAD_STEPS = 16;          // 최소~최대 사이를 이만큼의 단계로 나눈다
  const PAD_RANGE = 105;         // 이 거리(px)까지 밀어야 최고 속도 — 패드 밖으로 나가도 이어진다
  /* 느린 구간을 넓게 잡아 섬세하게 다루고, 끝까지 밀었을 때만 최고 속도가 나온다.
     빠른 캐릭터(부양사)일수록 저속 구간이 더 넓어야 조준이 된다. */
  function padAmp(v, dead) {
    const t = Math.max(0, Math.min(1, (Math.abs(v) - dead) / (PAD_RANGE - dead)));
    const e = 1.6 + (spdMul() - 1) * 0.5;        // 빠른 직업은 더 완만하게
    const q = Math.round(Math.pow(t, e) * PAD_STEPS) / PAD_STEPS;
    return PAD_MIN + (1 - PAD_MIN) * q;
  }
  const padArrow = {
    ArrowUp: dpad.querySelector(".up"), ArrowDown: dpad.querySelector(".dn"),
    ArrowLeft: dpad.querySelector(".lf"), ArrowRight: dpad.querySelector(".rt")
  };
  function padSet(l, r, u, d) {
    keys.ArrowLeft = l; keys.ArrowRight = r; keys.ArrowUp = u; keys.ArrowDown = d;
    padArrow.ArrowLeft.classList.toggle("hit", l);
    padArrow.ArrowRight.classList.toggle("hit", r);
    padArrow.ArrowUp.classList.toggle("hit", u);
    padArrow.ArrowDown.classList.toggle("hit", d);
  }
  function padClear() {
    padAmpX = padAmpY = 1;
    padSet(false, false, false, false);
    dpad.classList.remove("press");
    padKnob.style.transform = "";
  }
  function padMove(e) {
    const r = dpad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const flat = dpad.classList.contains("noVert");   // 좌우 전용 알약 패드
    if (flat) {
      // 가로로만 움직인다. 가운데 12px 안쪽은 정지 구역.
      const max = r.width / 2 - 34;
      const kx = Math.max(-max, Math.min(max, dx));
      padKnob.style.transform = "translateX(" + kx.toFixed(1) + "px)";
      if (Math.abs(dx) < 5) { padSet(false, false, false, false); return; }
      padAmpX = padAmp(dx, 5);
      padSet(dx < 0, dx > 0, false, false);
      return;
    }
    const dist = Math.hypot(dx, dy);
    const max = r.width / 2 - 16;
    const k = dist > max ? max / dist : 1;         // 손잡이는 패드 안에서만 움직인다
    padKnob.style.transform = "translate(" + (dx * k).toFixed(1) + "px," + (dy * k).toFixed(1) + "px)";
    if (dist < 7) { padSet(false, false, false, false); return; }    // 가운데는 정지
    // 가로·세로 성분 중 확실히 큰 쪽만 켠다. 둘이 비슷하면(2배 이내) 대각선.
    const horiz = Math.abs(dx) >= Math.abs(dy) * 0.5;
    const vert  = flyOn && Math.abs(dy) >= Math.abs(dx) * 0.5;
    // 민 거리에 비례한 세기 — 축마다 따로 잰다 (대각선에서도 자연스럽게)
    padAmpX = padAmp(dx, 4);
    padAmpY = padAmp(dy, 4);
    padSet(horiz && dx < 0, horiz && dx > 0, vert && dy < 0, vert && dy > 0);
  }
  dpad.addEventListener("pointerdown", e => {
    dpad.classList.add("press");
    try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
    padMove(e);
    if (e.cancelable) e.preventDefault();
  });
  dpad.addEventListener("pointermove", e => {
    if (!dpad.classList.contains("press")) return;
    padMove(e);
    if (e.cancelable) e.preventDefault();
  });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) dpad.addEventListener(ev, padClear);
  dpad.addEventListener("contextmenu", e => e.preventDefault());

  /* ---------- 플레이어 이름 ----------
     시작 화면에서 미리 정해두고, 게임이 끝나면 조건을 만족할 때 자동으로 등록된다. */
  const nameBox   = document.getElementById("nameBox");
  const nameEdit  = document.getElementById("nameEdit");
  const myNameEl  = document.getElementById("myName");
  const startName = document.getElementById("startName");

  function savedName() {
    try { return (localStorage.getItem(LS_NAME) || "").trim(); } catch (e) { return ""; }
  }
  function showNameView() {
    const n = savedName();
    myNameEl.textContent = n || "-";
    if (n) { nameBox.classList.remove("off"); nameEdit.classList.remove("on"); }
    else   { nameBox.classList.add("off");    nameEdit.classList.add("on"); }
  }
  function startEditName() {
    startName.value = savedName();
    nameBox.classList.add("off");
    nameEdit.classList.add("on");
    startName.focus();
  }
  function saveName() {
    const n = startName.value.trim().slice(0, 5);
    if (!n) { startName.focus(); return; }
    try { localStorage.setItem(LS_NAME, n); } catch (e) {}
    showNameView();
  }
  document.getElementById("btnEditName").addEventListener("click", startEditName);
  document.getElementById("btnSaveName").addEventListener("click", saveName);
  startName.addEventListener("keydown", e => {
    e.stopPropagation();                       // 스페이스로 게임이 시작되지 않도록
    if (e.key === "Enter") { e.preventDefault(); saveName(); }
  });
  showNameView();

  /* ---------- 일시정지 ----------
     멈춘 동안의 시간은 뚜니핑·무적 마감에서 빼 주고,
     풀 때는 3초를 세고 나서 다시 움직인다. */
  const btnPause = document.getElementById("btnPause");
  const pauseScreen = document.getElementById("pauseScreen");
  let pauseAt = 0, resumeCountEnd = 0;

  function doPause() {
    if (state !== STATE.PLAY) return;
    state = STATE.PAUSE;
    pauseAt = performance.now();
    resumeCountEnd = 0;
    btnPause.classList.remove("on"); syncPad();
    pauseScreen.classList.remove("hidden");
    beep(500, .08, "sine", .04);
  }
  btnPause.addEventListener("click", doPause);

  document.getElementById("btnResume").addEventListener("click", () => {
    pauseScreen.classList.add("hidden");
    resumeCountEnd = performance.now() + 3000;   // 3초 세고 나서 재개
    beep(700, .08, "sine", .04);
  });

  // 일시정지에서 다시하기 — 이번 판은 기록 없이 버리고 직업 선택부터 다시
  document.getElementById("btnPauseRetry").addEventListener("click", () => {
    pauseScreen.classList.add("hidden");
    resumeCountEnd = 0;
    state = STATE.OVER;
    beep(520, .08, "square", .04);
    openJobSelect();
  });

  function finishResume(now) {
    const paused = now - pauseAt;
    if (powerUntil > 0) powerUntil += paused;
    if (invUntil  > 0) invUntil  += paused;
    if (hurtUntil > 0) hurtUntil += paused;
    resumeCountEnd = 0;
    state = STATE.PLAY;
    btnPause.classList.add("on"); syncPad();
    beep(950, .1, "square", .05);
  }

  /* ---------- 직업 선택 화면 ----------
     시작하기·다시하기를 누르면 먼저 직업을 고르고, 고르는 순간 게임이 시작된다. */
  const jobScreen = document.getElementById("jobScreen");
  function openJobSelect(test) {           // test === true 면 고른 뒤 테스트 모드로 시작
    const list = document.getElementById("jobList");
    list.innerHTML = "";
    // 카드 앞에는 이모지 대신 그 직업의 이재(오른쪽 이동 모습)를 보여준다
    for (const id in JOBS) {
      const j = JOBS[id];
      const card = document.createElement("button");
      card.className = "augCard";
      const ic = document.createElement("img"); ic.className = "ic";
      ic.src = "assets/" + JOB_IMG[id] + "_right.png"; ic.alt = j.ic;
      const tx = document.createElement("div"); tx.className = "tx";
      const nm = document.createElement("div"); nm.className = "nm2"; nm.textContent = j.nm;
      const ds = document.createElement("div"); ds.className = "ds"; ds.textContent = j.ds;
      tx.append(nm, ds);
      card.append(ic, tx);
      card.addEventListener("click", () => {
        job = id;
        try { localStorage.setItem(LS_JOB, job); } catch (e) {}
        jobScreen.classList.add("hidden");
        beep(900, .08, "square", .05);
        reset(test === true);
      });
      list.appendChild(card);
    }
    startScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    jobScreen.classList.remove("hidden");
  }

  document.getElementById("btnStart").addEventListener("click", () => {
    if (!savedName()) { startEditName(); return; }   // 이름부터 정하고 시작
    openJobSelect();
  });
  document.getElementById("btnRetry").addEventListener("click", () => openJobSelect());

  function reset(test) {
    testMode = (test === true);    // 정확히 true 일 때만 테스트 모드 (이벤트 객체가 새어들지 않게)
    btnTestEnd.classList.toggle("on", testMode);
    layout();
    items = []; particles = []; floats = []; warns = []; introPoops = []; introT = 0;
    // 테스트 모드는 어차피 목숨이 안 줄어드니, 목숨 조건 증강(당근거래·분신술)을
    // 바로 시험해볼 수 있게 1부터 시작한다.
    score = 0; lives = testMode ? 1 : 3; level = 1; elapsed = 0; levelTime = 0; starCount = 0;
    spawnTimer = 0;
    resetBonusTimers();
    invUntil = 0; powerUntil = 0; hurtUntil = 0; shields = 0;
    shake = 0; flash = 0; feverFlash = 0; fever = false; feverT = 0;
    zoneShown = -1;
    augCount = {};
    aug.feverBonus = 0; aug.starMul = 1; aug.timeMul = 1;
    aug.feverScoreMul = 1; aug.fallMul = 1; aug.hitboxMul = 1; aug.poopMul = 1;
    aug.steelUmb = false; aug.starburst = false; aug.gamble = false; aug.scoreMul = 1;
    aug.ghost = false; aug.blackhole = false; aug.legion = false; ghostTimer = 3; roidT = 0;
    flyOn = false;
    aug.angryUmb = false; aug.goldChance = 0; aug.inter = false; aug.goldLord = false;
    augRound = 0;
    for (const k in augSeen) delete augSeen[k];
    for (const k in augTook) delete augTook[k];
    aug.refill = false; aug.subs = false; aug.clone = false;
    spawnHold = 0; bulletT = 0; interTimer = 8; refillLeft = 0; subsTimer = 0;
    noHitSec = 0;
    clones = []; cloneTimer = 0;
    shieldTimer = UMB_SEC;
    aug.itemRateMul = 1; aug.feverRateMul = 1; aug.giant = 0; aug.magnet = 0;
    aug.helper = 0; aug.helperRush = false; aug.hungry = false;
    helpers = []; fetchers = [];
    helperTimer = 0; helperQueue = 0; helperGap = 0; aug.maxLives = 5;
    // ---- 직업 효과 ----
    if (job === "gambler") {
      lives = 1;
      aug.maxLives = 1;               // 하트는 애초에 별로 대체되어 떨어진다
      shields = 1;                    // 대신 우산 1개를 쥐여 준다
      aug.scoreMul *= 3;              // 모든 점수 3배
    }
    if (job === "levitator") {
      flyOn = true;                   // 처음부터 하늘을 난다 (몸 크기는 그대로)
      player.ty = groundY;
    }
    if (job === "fit") {
      lives = 5;
      aug.maxLives = 30;              // 하트를 쌓아 올리는 직업
      aug.hitboxMul *= 1.25;          // 몸이 커서 잘 맞는다
    }
    augScreen.classList.add("hidden");
    facing = "right";
    player.x = player.tx = W / 2;
    player.y = player.ty = groundY;
    state = STATE.PLAY;
    startScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    nameRow.classList.remove("on");
    beep(660, .1, "square", .04);
    btnPause.classList.add("on"); syncPad();
    pauseScreen.classList.add("hidden");
    resumeCountEnd = 0;
    if (job === "none") openAugment(1);   // 백수의 소소한 복지 — 시작하자마자 증강 1개
  }

  /* 구름 하나하나의 생김새를 따로 만든다. 같은 덩이 세 개를 겹쳐 놓으면
     어느 구름이나 똑같아 보여서, 덩이 수와 크기·위치를 구름마다 뽑는다. */
  function reshapeCloud(c) {
    const n = 3 + Math.floor(Math.random() * 3);      // 덩이 3~5개
    c.lobes = [];
    let px = -c.s * (0.42 + Math.random() * 0.22);
    for (let i = 0; i < n; i++) {
      const mid = 1 - Math.abs(i - (n - 1) / 2) / (n / 1.6);   // 가운데가 더 봉긋하다
      c.lobes.push({
        dx: px,
        dy: (Math.random() - 0.65) * c.s * 0.16,
        r: c.s * (0.20 + 0.24 * Math.max(0.35, mid) + Math.random() * 0.10)
      });
      px += c.s * (0.24 + Math.random() * 0.20);
    }
    c.bw = c.s * (0.52 + Math.random() * 0.20);       // 바닥은 평평하게 깔린다
    c.bh = c.s * (0.14 + Math.random() * 0.09);
  }
  for (let i = 0; i < 7; i++) {
    const c = { x: Math.random() * W, y: Math.random() * H * .7,
                s: 26 + Math.random() * 64, v: 4 + Math.random() * 10 };
    reshapeCloud(c);
    clouds.push(c);
  }

  /* ---------- 스폰 ---------- */
  /* 뚜니핑 타임 낙하물 크기 등급 — 클수록 드물고 점수가 크다 */
  const FEVER_SIZES = [
    { min: 14, max: 18, score: 2,  w: 22 },
    { min: 18, max: 22, score: 3,  w: 22 },
    { min: 22, max: 26, score: 5,  w: 18 },
    { min: 26, max: 31, score: 8,  w: 14 },
    { min: 31, max: 37, score: 10, w: 11 },
    { min: 37, max: 44, score: 15, w: 8  },
    { min: 44, max: 52, score: 25, w: 5  },
    { min: 52, max: 62, score: 40, w: 3  }   // 초대형 — 가장 드물다
  ];
  // 대왕 뚜니핑 — 기존 최대(52~62)의 2배 크기, 점수는 최대 등급(75)의 3배
  const GIANT = { min: 104, max: 124, score: 138, w: 3, giant: true };
  function pickFeverSize() {
    const list = aug.giant > 0
      ? FEVER_SIZES.concat([{
          min: GIANT.min, max: GIANT.max,
          score: GIANT.score * (aug.legion ? 2 : 1),
          w: GIANT.w * aug.giant * (aug.legion ? 3 : 1),
          giant: true
        }])
      : FEVER_SIZES;
    const total = list.reduce((a, b) => a + b.w, 0);
    let n = Math.random() * total;
    for (const s of list) { if (n < s.w) return s; n -= s.w; }
    return list[0];
  }

  /* 후반 가속 — Lv10까지는 기존 그대로, Lv11부터 레벨당 +1.5%,
     블랙홀(Lv17) 이후에는 거기에 레벨당 +5%를 더 얹는다.
     낙하 속도에는 그대로, 생성 빈도에는 제곱근만큼 나눠 곱한다. */
  function lateMul() {
    let m = 1;
    if (level > 10) m *= Math.pow(1.015, level - 10);
    if (level > 17) m *= Math.pow(1.05, level - 17);
    return m;
  }

  /* 레벨이 오를수록 좁아지는 똥 사이 간격. 바닥(상한) 없이 계속 좁아지되,
     0.13초부터는 곱셈으로 줄여서 0 아래로 내려가지 않는다. */
  function spawnGap() {
    // 레벨당 좁아지는 폭을 완화했다 (레벨 1 간격은 그대로)
    const lin = 0.50707 - level * 0.029087;
    return (lin > 0.13 ? lin : 0.13 * Math.pow(0.9271, level - 12.37)) / Math.sqrt(lateMul());
  }

  /* 낙하 각도. 좌우 속도를 낙하 속도에 비례시켜서 레벨이 올라도 기울기 느낌이 일정하다.
     (Math.random() - Math.random()) 은 0 근처가 흔하고 양 끝이 드문 삼각분포 →
     대부분은 적당히 기울고 일부만 크게 비스듬히 떨어진다. */
  const SPREAD_POOP  = 0.16;   // 최대 약 9도 (예전 12도에서 완화)
  const SPREAD_BONUS = 0.28;   // 아이템은 조금 얌전하게 (약 16도)

  const FEVER_VY = 245;      // 뚜니핑 낙하물 기준 속도 — 레벨이 올라도 그대로 유지한다

  /* 레벨 7부터 섞여 나오는 까다로운 똥들
     split  = 내려오다 둘로 쪼개진다 (쪼개진 조각은 평범한 똥)
     zigzag = 좌우로 크게 흔들리며 내려온다
     laser  = 1초간 떨어질 자리를 깜빡여 알려준 뒤 번개처럼 내리꽂힌다
     huge   = 초대형 뚜니핑의 1.4배쯤 되는 거대한 똥, 느리게 굴러떨어진다 */
  const SPECIAL_KINDS = ["split", "zigzag", "laser", "huge"];
  const HUGE_R = 66;           // 반지름 — 초대형(52~62)의 약 1.26배
  /* 까다로운 똥이 나올 확률 — 레벨 7에서 SPEC_BASE 로 시작해 레벨마다 SPEC_STEP 씩 오른다.
     상한 SPEC_CAP — 절반까지만. 나머지 절반은 언제나 평범한 똥이다. */
  const SPEC_FROM = 7, SPEC_BASE = 0.023, SPEC_STEP = 0.04, SPEC_CAP = 0.5;
  const LASER_WARN = 1;        // 예고 시간(초)
  const LASER_VY = 4500;       // 낙하 속도 — 똥이 아니라 레이저처럼 내리꽂힌다
  let warns = [];              // 예고 중인 레이저 자리

  /* 꾸밈 고르기 — 0·1 은 민얼굴이라 셋 중 하나쯤은 장식이 없다. */
  function randFace() { return Math.floor(Math.random() * 14); }
  /* 눈·입은 따로 굴려서 장식과 조합된다 (0 = 그림 그대로) */
  function randEye() { const r = Math.random(); return r < 0.42 ? 0 : 1 + Math.floor(Math.random() * 9); }
  function randMouth() { const r = Math.random(); return r < 0.55 ? 0 : 1 + Math.floor(Math.random() * 3); }
  // 눈을 통째로 덮는 장식(선글라스·X눈·하트눈·별눈·안대)이면 눈 변형은 건너뛴다
  const EYE_COVER = { 3: 1, 4: 1, 8: 1, 9: 1, 12: 1 };

  function spawnPoop(mul, special, forceX, forceAng) {
    if (spawnHold > 0) return;              // 성난 우산 직후에는 똥이 나오지 않는다
    const m = (mul || 1) * (H / BASE_H);   // 화면이 길면 그만큼 빨리 떨어져야 체감이 같다
    // 뚜니핑 타임에 나온 것은 외형·점수를 스스로 기억한다 → 뚜니핑 타임이 끝나도 모습이 바뀌지 않는다
    const inFever = fever;
    const cls = inFever ? pickFeverSize() : null;
    // 무지개똥 연금술 — 맞아도 무해하고 먹으면 점수 (특수똥은 위협으로 남아야 해서 제외)
    let gold = false;
    if (!inFever && !special && aug.goldChance > 0 && Math.random() < aug.goldChance) {
      gold = true;
    }
    // 뚜니핑 낙하물은 크기가 곧 점수라서 '작아진 똥'의 영향을 받지 않는다
    let r = cls ? cls.min + Math.random() * (cls.max - cls.min)
                : (12.6 + Math.random() * 11.7) * aug.poopMul;   // 기본 크기 10% 축소
    if (special === "huge") r = (HUGE_R + Math.random() * 13) * aug.poopMul;   // 초거대 똥
    r = Math.min(r, (W - 24) / 2);        // 화면보다 커지지 않게
    // 일반 똥은 레벨이 오를수록 빨라지지만, 뚜니핑 낙하물은 처음이나 나중이나 같은 속도로 떨어진다
    const baseVy = inFever ? FEVER_VY + Math.random() * 110
                           : 230.0 + level * 14.97 + Math.random() * 110;   // 레벨당 상승폭 완화(레벨 1 속도는 동일)
    /* 뚜니핑 낙하물은 언제나 같은 속도로 떨어진다 — 레벨·지대·증강(느린 하늘·도파민)
       어느 것에도 영향받지 않는다. 화면 높이 보정(m)만 그대로 둔다. */
    let vy = inFever ? baseVy * m
                     : baseVy * m * DIFF_F * spaceF() * bhDiff() * aug.fallMul * lateMul();
    if (special === "huge") vy *= 0.55;   // 덩치값 — 느릿느릿 굴러떨어진다
    let px = r + Math.random() * (W - r * 2);
    let pvx = (Math.random() - Math.random()) * vy * SPREAD_POOP;
    if (special === "laser") {                // 예고한 선을 그대로 따라 내려온다
      px = forceX;
      const sp = LASER_VY * (H / BASE_H) * aug.fallMul;
      vy = sp * Math.cos(forceAng || 0);
      pvx = sp * Math.sin(forceAng || 0);
    }
    items.push({
      type: "poop", emoji: "💩",
      x: px, y: -r - 10,
      r: r * (special === "huge" ? 0.70 : 0.82),
      vx: pvx,
      vy: vy,
      /* 얼굴이 보이도록 회전 대신 살랑인다. 시작 각도는 ±30도 안에서 제각각이고,
         거기서 ±12도씩 천천히 오간다 (레이저는 예고선을 따라야 해서 고정). */
      rot: special === "laser" ? 0 : (Math.random() - Math.random()) * 0.52,
      vr: 0,
      swayA: special === "laser" ? 0 : 0.14 + Math.random() * 0.07,   // 흔들 폭 (약 8~12도)
      swayW: 1.1 + Math.random() * 1.1,                               // 흔드는 속도
      swayP: Math.random() * 6.28,
      size: r * 2, sz: r, fast: m > 1,
      skin: inFever ? "fever" : "poop",
      space: inSpace(),
      gold: gold,
      special: special || null,
      bumpCd: 0,                             // 정연핑과 부딪힌 직후의 무반응 시간
      phase: Math.random() * 6.28,
      splitAt: H * (0.14 + Math.random() * 0.20),   // 분열똥이 쪼개지는 높이 (화면 위쪽)
      sz0: 0,
      face: randFace(),                      // 표정 장식 (0~1은 기본 얼굴)
      eye: randEye(), mouth: randMouth(),    // 눈·입 변형
      gain: cls ? cls.score : 0,
      giant: !!(cls && cls.giant)
    });
  }
  const BONUS = [
    { type: "moon",     emoji: "🌙", w: 84 },   // 증강 선택 — 가장 자주 나온다
    { type: "fullmoon", emoji: "🌕", w: 6  },   // 보름달 — 증강 3연속. 초승달의 10%
    { type: "paper",    emoji: "🧻", w: 26 },
    { type: "umbrella", emoji: "☂️", w: 22 },
    { type: "star",     emoji: "⭐", w: 73 },   // 등장 빈도 10% 상향
    { type: "heart",    emoji: "❤️", w: 24 }   // 너무 안 나와서 상향
  ];
  /* 아이템은 종류마다 자기 타이머로 따로 굴러간다.
     각자의 평균 간격 = 기본 10초 ÷ 그 아이템의 비중 → 전체 등장 빈도는 예전과 같지만
     서로 독립이라 운이 맞으면 두세 개가 한꺼번에 쏟아진다. */
  /* 각 아이템의 평균 간격은 이 고정 기준값으로 계산한다.
     실제 가중치 합을 쓰면 별 하나를 올릴 때 다른 아이템까지 덩달아 드물어진다.
     기준을 고정해두면 별은 독립적으로 자주 나오고 나머지는 영향을 받지 않는다. */
  const BONUS_W_TOTAL = 204;
  const BONUS_BASE = 6.82;                // 아이템 전체의 평균 등장 간격(초)

  function bonusInterval(b) {
    const lvFactor = Math.max(0.5, 1 / (1 + (level - 1) * 0.06));   // 레벨이 오르면 더 자주
    // 블랙홀 안에서는 아이템도 두 배로 자주 나온다
    let mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul * lvFactor / bhMul();
    if (b.type === "paper" && aug.subs) mean /= 1.7;  // 정기구독 — 휴지만 1.7배 빈도
    if (b.type === "heart" && job === "fit") mean /= 5;  // 헬스걸 — 하트 5배
    if ((b.type === "moon" || b.type === "fullmoon") && job === "powerj") mean /= 1.75;  // 파워J — 달 +75%
    if (b.type === "star" && job === "powerp") mean /= 1.25;  // 무소유 — 별 1.25배
    // 후반 견제 — Lv15부터 달이 레벨마다 7%씩 뜸해진다 (뚜니핑 타임 가동률을 떨어뜨린다)
    if ((b.type === "moon" || b.type === "fullmoon") && level > 15)
      mean *= Math.pow(1.07, level - 15);
    /* 평균 간격을 중심으로 ±12% 안에서만 흔들린다 — 판마다 개수가 들쭉날쭉하지 않게.
       종류별로 타이머가 따로 도는 건 그대로라 여러 개가 한꺼번에 나오는 일은 여전히 생긴다.
       (0.4초 하한은 완전히 겹쳐 떨어지는 것만 막는 장치) */
    return Math.max(0.4 / bhMul(), mean * (0.88 + Math.random() * 0.24));
  }
  function resetBonusTimers() {
    /* 첫 등장까지의 시간. 예전에는 편차가 큰 지수분포라 어떤 판은 별이 한참 안 나왔다.
       평균의 25~85% 사이로만 잡아 매판 초반 흐름이 비슷하게 흘러가도록 했다. */
    const lvFactor = 1;
    for (const b of BONUS) {
      const mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul * lvFactor;
      b.t = Math.max(0.4, mean * (0.25 + Math.random() * 0.60));
    }
  }

  function spawnBonus(picked) {
    let pick = picked;
    if ((pick.type === "moon" || pick.type === "fullmoon") && job === "powerp") return;   // 파워P — 무계획 무증강
    if (pick.type === "umbrella" && job === "fit") {
      pick = BONUS.find(b => b.type === "heart");   // 헬스걸 — 우산 자리에 하트
    }
    if (pick.type === "heart" && job === "gambler") return;   // 도박사에겐 하트가 아예 안 나온다
    if (pick.type === "heart" && lives >= aug.maxLives) {
      pick = BONUS.find(b => b.type === "star");    // 목숨 꽉 차면 별로 대체
    }
    const r = 20;
    // 낙하 속도에 변화를 주되, 너무 빠르면 못 먹고 지나가버려서 위쪽을 눌러 잡았다
    const vy = (110 + level * 6) * (H / BASE_H) * (0.6 + Math.random() * 0.5);
    if (pick.type === "paper") subsTimer = 0;        // 정기구독 배송 시계 리셋
    items.push({
      type: pick.type, emoji: pick.emoji,
      x: r + Math.random() * (W - r * 2), y: -r - 10,
      r: r,
      vx: (Math.random() - Math.random()) * vy * SPREAD_BONUS,
      vy: vy,
      rot: 0, vr: 0, size: r * 2, bob: Math.random() * 6.28,
      born: elapsed          // 배고픈 정연핑이 몇 초 뒤에 출발할지 재는 기준
    });
  }

  // 점과 선분 사이의 최단 거리
  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay;
    const len2 = vx * vx + vy * vy;
    let t = len2 ? ((px - ax) * vx + (py - ay) * vy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, sp = 60 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                       life: .6 + Math.random() * .4, t: 0, c: color, r: 2 + Math.random() * 4 });
    }
  }
  function popText(x, y, text, color, size) {
    floats.push({ x, y, text, color, t: 0, life: 1, size: size || 22 });
  }

  /* ---------- 업데이트 ---------- */
  function update(dt, now) {
    // 인터스텔라 불릿타임 — 세상(똥·예고)만 이 배율로 느려진다. 점수 시계는 dt 그대로.
    const tsc = (bulletT > 0 && !fever) ? 0.55 : 1;
    for (const c of clouds) {
      c.x += c.v * dt;
      if (c.x - c.s > W) {
        c.x = -c.s * 1.6;
        c.y = Math.random() * H * .7;
        c.s = 26 + Math.random() * 64;
        c.v = 4 + Math.random() * 10;
        reshapeCloud(c);                              // 다시 나올 땐 다른 모양으로
      }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt; p.vy += 700 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.life) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt; f.y -= 40 * dt;
      if (f.t > f.life) floats.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    if (feverFlash > 0) feverFlash = Math.max(0, feverFlash - dt * 2.5);

    const wasFever = fever;
    fever = state === STATE.PLAY && now < powerUntil;
    // 겹쳐 먹어 남은 시간이 한 번 분량을 넘으면 게이지가 넘치므로 1로 묶는다
    feverT = fever ? Math.min(1, (powerUntil - now) / feverDur) : 0;
    // 뚜니핑 타임 끝나는 순간엔 화면이 똥으로 가득 차 있으니 1초 무적으로 숨 돌릴 틈을 준다
    if (wasFever && !fever && state === STATE.PLAY) {
      invUntil = Math.max(invUntil, now + 1500);
      for (let i = items.length - 1; i >= 0; i--) {
        if (items[i].giant) {                     // 대왕은 피할 수 없는 크기라 같이 사라진다
          burst(items[i].x, items[i].y, "#c86bff", 26);
          items.splice(i, 1);
        }
      }
      popText(player.x, player.y - 70, "휴… 세이프", "#fff");
      beep(520, .12, "triangle", .04);
    }

    if (state === STATE.READY) { introUpdate(dt, now); return; }
    if (state !== STATE.PLAY) return;

    elapsed += dt;
    noHitSec += dt;                          // 안 맞고 버틴 시간 (피격 시 0으로)
    /* 레벨 시계는 뚜니핑 타임 동안 멈춘다. 무적으로 낙하물을 줍는 시간까지
       레벨에 포함되면, 정작 실력으로 버틴 시간이 아닌데도 난이도가 올라간다. */
    if (!fever) levelTime += dt;
    level = 1 + Math.floor(levelTime / 12);   // 레벨 하나당 12초
    score += dt * Math.pow(1.8, level - 1) * aug.timeMul * scoreMul();  // 생존 점수: 레벨마다 1.8배

    // 한 단계 올라설 때마다 어디에 도착했는지 알려준다
    const zi = zoneIdx();
    if (zi !== zoneShown) {
      if (zoneShown >= 0) {
        popText(W / 2, H * 0.40, ZONES[zi].ic + " " + ZONES[zi].nm, "#cfe4ff", 30);
        beep(760, .1, "sine", .05);
        beep(1140, .14, "sine", .04);
        if (zi === SPACE_Z) {          // 공기가 없는 높이 — 우주복으로 갈아입는다
          popText(W / 2, H * 0.48, "🧑‍🚀 우주복 착용!", "#ffd23f", 26);
          beep(520, .16, "triangle", .05);
        }
        if (zi === BH_Z) {             // 빨려 들어갔다 — 모든 것이 두 배
          popText(W / 2, H * 0.48, "모든 것이 2배!", "#ff8a5c", 28);
          shake = Math.max(shake, 26);
          feverFlash = Math.max(feverFlash, 0.5);
          beep(90, .5, "sawtooth", .07);
          beep(140, .4, "square", .05);
        }
      }
      zoneShown = zi;
    }

    const kSpeed = 560 * spdMul() * dt;
    // 패드는 민 정도만큼 속도가 붙는다 (키보드는 늘 최고 속도)
    const kx = kSpeed * (ctrlMode === "pad" ? padAmpX : 1);
    const ky = kSpeed * (ctrlMode === "pad" ? padAmpY : 1);
    if (keys.ArrowLeft  || keys.a || keys.A) player.tx -= kx;
    if (keys.ArrowRight || keys.d || keys.D) player.tx += kx;
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
    if (flyOn) {
      if (keys.ArrowUp   || keys.w || keys.W) player.ty -= ky;
      if (keys.ArrowDown || keys.s || keys.S) player.ty += ky;
      player.ty = Math.max(H * FLY_TOP, Math.min(groundY, player.ty));
    }

    const prev = player.x;
    // 손가락을 반대편에 찍어도 순간이동하지 않도록 최고 속도를 제한한다
    const want = (player.tx - player.x) * Math.min(1, dt * 20);
    const maxStep = PLAYER_MAX_SPEED * spdMul() * dt;
    player.x += Math.max(-maxStep, Math.min(maxStep, want));
    if (player.x - prev < -0.25) facing = "left";
    else if (player.x - prev > 0.25) facing = "right";   // 멈춰 있으면 마지막 방향 유지
    player.tilt += (((player.x - prev) / Math.max(dt, .001) / 900) - player.tilt) * Math.min(1, dt * 10);
    player.tilt = Math.max(-.35, Math.min(.35, player.tilt));

    // 위아래 이동 — 가로보다 조금 느리게 따라간다 (붕 뜬 느낌)
    if (flyOn) {
      const wantY = (player.ty - player.y) * Math.min(1, dt * 14);
      const stepY = PLAYER_MAX_SPEED * 0.72 * spdMul() * dt;
      player.y += Math.max(-stepY, Math.min(stepY, wantY));
    } else if (player.y !== groundY) {
      player.y += (groundY - player.y) * Math.min(1, dt * 10);
      if (Math.abs(player.y - groundY) < 0.5) player.y = groundY;
    }

    player.hy = headOffset(currentSprite(now));

    // ---- 레이저똥 예고: 2초를 세고 그 자리에 내리꽂는다 ----
    for (let k = warns.length - 1; k >= 0; k--) {
      const wn = warns[k];
      wn.t -= dt * tsc;
      if (wn.t <= 0) {
        spawnPoop(1, "laser", wn.x, wn.ang);
        beep(180, .16, "sawtooth", .06);
        warns.splice(k, 1);
      }
    }

    // ---- 스테로이드 과다 복용: 약발이 도는 동안 몸이 2배, 똥이 튕겨 나간다 ----
    if (roidT > 0) {
      roidT -= dt;
      if (roidT <= 0) {
        roidT = 0;
        popText(player.x, player.y - 70, "💉 약발 끝", "#ff8f8f", 22);
        beep(300, .12, "sine", .04);
      }
    }

    // ---- 유령화: 3초마다 1초씩 몸이 사라진다 ----
    if (aug.ghost) {
      ghostTimer -= dt;
      if (ghostTimer <= 0) {
        ghostTimer = 3;
        invUntil = Math.max(invUntil, now + 1000);
        popText(player.x, player.y - 60, "👻 유령화", "#cfe4ff");
        beep(520, .1, "sine", .04);
        beep(700, .12, "sine", .03);
      }
    }

    if (spawnHold > 0) spawnHold -= dt;

    // ---- 인터스텔라: 10초마다 2초씩 세상만 느려진다 (점수 시계는 그대로) ----
    if (aug.inter) {
      if (bulletT > 0) bulletT -= dt;
      else if (!fever) {
        interTimer -= dt;
        if (interTimer <= 0) {
          interTimer = 8; bulletT = 2;
          popText(W / 2, H * 0.35, "🕰️ 인터스텔라", "#9fd4ff", 26);
          beep(320, .14, "sine", .05);
          beep(210, .2, "sine", .05);
        }
      }
    }

    // ---- 휴지 정기구독: 뚜니핑이 끝나고 한동안 휴지가 안 오면 강제 배송 ----
    if (aug.subs) {
      if (fever) subsTimer = 0;
      else {
        subsTimer += dt;
        if (subsTimer >= 33) {
          subsTimer = 0;
          spawnBonus(BONUS.find(b => b.type === "paper"));
          popText(W / 2, H * 0.3, "📦 구독 배송 도착!", "#ffd23f", 24);
          beep(880, .1, "triangle", .05);
        }
      }
    }

    // ---- 벼랑 끝 분신술: 작은 이재가 가장 가까운 똥에게 날아가 자폭한다 ----
    if (aug.clone) {
      cloneTimer -= dt;
      if (cloneTimer <= 0) {
        let best = null, bd = 1e9;
        const py = player.y + player.hy;
        for (const q of items) {
          if (q.type !== "poop") continue;            // 무지개똥·특수똥도 표적으로 삼는다
          if (q.y > player.y - 40) continue;          // 이미 지나친 똥은 무시
          /* 머리 위쪽 좁은 부채꼴 안에서만 고른다. 옆으로 멀리 날아가면
             분신이 가로로 새는 것처럼 보여서, 가로 거리에 벌점을 준다. */
          const dy = py - q.y, dx = Math.abs(q.x - player.x);
          if (dx > 70 + dy * 0.55) continue;          // 위로 갈수록 조금씩만 넓어진다 (약 29도)
          const d = Math.hypot(dx, dy) + dx * 1.4;
          if (d < bd) { bd = d; best = q; }
        }
        if (best) {
          clones.push({ x: player.x, y: player.y + player.hy, t: best, life: 3 });
          cloneTimer = 1;                             // 1초마다 한 명 출격
          beep(740, .08, "square", .04);
        } else cloneTimer = 0.5;
      }
    }
    for (let k = clones.length - 1; k >= 0; k--) {
      const c = clones[k];
      c.life -= dt;
      const alive = items.indexOf(c.t) >= 0;
      const tx2 = alive ? c.t.x : c.x, ty2 = alive ? c.t.y : c.y - 120;
      const dx2 = tx2 - c.x, dy2 = ty2 - c.y, d2 = Math.hypot(dx2, dy2) || 1;
      c.x += dx2 / d2 * 1200 * dt;
      c.y += dy2 / d2 * 1200 * dt;
      if ((alive && d2 < (c.t.r || 20) + 16) || c.life <= 0) {
        smashPoopsAround(c.x, c.y, 100, true);        // 폭발 반경 100px (특수똥까지 부순다)
        burst(c.x, c.y, "#ffd23f", 26);
        shake = Math.max(shake, 8);
        beep(240, .12, "square", .05);
        clones.splice(k, 1);
      }
    }

    // ---- 우산 로켓배송: 방패가 하나도 없을 때만 시간을 재서 하나 배송한다 ----
    if (aug.steelUmb) {
      const canTake = job === "fit" ? lives < aug.maxLives : shields <= 0;
      if (canTake) {
        shieldTimer -= dt;
        if (shieldTimer <= 0) {
          shieldTimer = UMB_SEC;
          if (job === "fit") {                       // 헬스걸 — 우산 대신 하트 배송
            lives = Math.min(aug.maxLives, lives + 1);
            popText(player.x, player.y - 60, "❤️ 하트 도착!", "#ff8fb0");
          } else {
            shields = 1;
            popText(player.x, player.y - 60, "☔ 우산 도착!", "#7ec8ff");
          }
          beep(880, .12, "triangle", .05);
        }
      } else {
        shieldTimer = UMB_SEC;
      }
    }

    // ---- 도와줘 정연핑 ----
    if (aug.helper > 0) {
      // 1명이면 4초, 2명이면 5.5초, 3명이면 7초… 인원이 늘수록 주기도 함께 길어진다
      const cycle = 2.5 + 1.5 * aug.helper;
      helperTimer -= dt;
      if (helperTimer <= 0 && helperQueue <= 0) {
        helperTimer = cycle;
        helperQueue = aug.helper;                 // 이번 차례 출격 인원
        helperGap = 0;                            // 첫 명은 바로
      }
      if (helperQueue > 0) {
        helperGap -= dt;
        if (helperGap <= 0) {
          // 한 차례 안에서 인원을 고르게 나눠 내보낸다 (2명 = 4초에 2명, 3명 = 5초에 3명)
          helperGap = cycle / aug.helper;
          helperQueue--;
          const fromLeft = Math.random() < 0.5;   // 아래 좌/우에서 비스듬히 솟아오른다
          // 수직에서 8~34도 사이. 너무 눕히면 옆으로 금방 빠져나가서 범위를 좁혔다
          const speed = 744 + Math.random() * 216;   // 기존 620~800 에서 20% 빠르게
          const ang = (8 + Math.random() * 26) * Math.PI / 180;
          helpers.push({
            x: fromLeft ? -30 + Math.random() * (W * 0.45)
                        : W + 30 - Math.random() * (W * 0.45),
            y: H + 60,
            vx: (fromLeft ? 1 : -1) * speed * Math.sin(ang),
            vy: -speed * Math.cos(ang)
          });
          beep(760, .12, "triangle", .05);
          beep(1140, .14, "triangle", .04);
        }
      }
    }
    for (let k = helpers.length - 1; k >= 0; k--) {
      const hp = helpers[k];
      hp.x += hp.vx * dt;
      hp.y += hp.vy * dt;
      smashPoopsAround(hp.x, hp.y, HELPER_R * helperScale());   // 지나가는 자리의 똥
      if (hp.y < -HELPER_H - 40 || hp.x < -160 || hp.x > W + 160) helpers.splice(k, 1);
    }

    // ---- 배고픈 정연핑: 아이템이 뜨고 3초 뒤에 화면 아래 중앙에서 출발 ----
    if (aug.hungry) {
      for (const it of items) {
        if (it.type === "poop" || it.claimed) continue;
        if (elapsed - it.born >= FETCH_DELAY) {
          it.claimed = true;
          fetchers.push({ x: W / 2, y: H + 50, vx: 0, vy: -FETCH_SPEED, t: it });
          beep(660, .1, "sine", .05);
          beep(990, .12, "sine", .04);
        }
      }
    }
    for (let k = fetchers.length - 1; k >= 0; k--) {
      const f = fetchers[k];
      const alive = items.indexOf(f.t) >= 0;
      let dx = 0, dy = -1;
      if (alive) { dx = f.t.x - f.x; dy = f.t.y - f.y; }   // 목표가 사라지면 그대로 위로 빠진다
      const d = Math.hypot(dx, dy) || 1;
      f.vx = dx / d * FETCH_SPEED;
      f.vy = dy / d * FETCH_SPEED;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      smashPoopsAround(f.x, f.y, HELPER_R * helperScale());   // 가는 길의 똥도 부순다
      if (alive && Math.hypot(f.t.x - f.x, f.t.y - f.y) < HELPER_R * 0.9) {
        const idx = items.indexOf(f.t);
        if (idx >= 0) items.splice(idx, 1);
        fetchers.splice(k, 1);
        burst(f.x, f.y, "#ffd23f", 24);
        if (collectItem(f.t, now)) return;    // 달이면 화면이 멈춘다
        continue;
      }
      if (f.y < -HELPER_H * 2 || f.x < -260 || f.x > W + 260) fetchers.splice(k, 1);
    }

    const powered = now < powerUntil;      // 🔥 뚜니핑 타임

    // 화면이 좁으면 그만큼 똥도 덜 떨어지게(체감 난이도 유지)
    const widthFactor = 480 / W;
    spawnTimer -= dt * tsc;
    if (spawnTimer <= 0) {
      if (powered) {
        // 뚜니핑 타임: 똥이 폭포처럼 쏟아지고 속도도 2배 이상
        const n = 3 + Math.floor(Math.random() * 4);   // 스폰당 3~6개 (평균 4.5개)
        // 증강으로 낙하량이 늘면 화면 상한도 같이 올려야 늘린 만큼이 깎이지 않는다
        const cap = Math.min(280, Math.round(165 / aug.feverRateMul));
        if (items.length < cap) {
          for (let k = 0; k < n; k++) spawnPoop(2.09 + Math.random() * 0.855);
        }
        spawnTimer = (0.14 / 1.43) * aug.feverRateMul * widthFactor;   // 간격 ÷1.43 → 낙하량 +43%
      } else {
        spawnPoop();
        if (level >= 3 && Math.random() < .35) spawnPoop();
        if (level >= 6 && Math.random() < .30) spawnPoop(1.6);   // 초고속 똥
        // 까다로운 똥 — 레벨 7에 아주 드물게 시작해서 레벨마다 조금씩 늘어난다
        if (level >= SPEC_FROM && Math.random() < Math.min(SPEC_CAP, SPEC_BASE + (level - SPEC_FROM) * SPEC_STEP)) {
          const kind = SPECIAL_KINDS[Math.floor(Math.random() * SPECIAL_KINDS.length)];
          if (kind === "huge" && items.some(q => q.special === "huge")) {
            spawnPoop();                  // 이미 하늘에 하나 있으면 평범한 똥으로
          } else if (kind === "laser") {
            // 바로 떨어뜨리지 않고 자리를 먼저 알려준다 (예고는 동시에 여러 개도 가능)
            if (warns.length < 3) {
              /* 떨어질 지점을 먼저 정하고, 기울기를 골라 위쪽 진입점을 역산한다.
                 진입점이 화면 밖으로 너무 나가면 기울기를 그만큼 줄인다. */
              const L = H - GROUND_H;
              const tx = 30 + Math.random() * Math.max(1, W - 60);
              const ang = (Math.random() - Math.random()) * 0.62;   // 최대 약 35도
              let ex = tx - Math.tan(ang) * L;
              ex = Math.max(-20, Math.min(W + 20, ex));
              warns.push({ x: ex, ang: Math.atan((tx - ex) / L), t: LASER_WARN });
              beep(1500, .06, "sine", .03);
            }
          } else {
            spawnPoop(1, kind);
          }
        }
        spawnTimer = spawnGap() / DIFF_F / spaceF() / bhDiff() * widthFactor * (0.7 + Math.random() * 0.6);
      }
    }
    if (!powered) {
      for (const b of BONUS) {           // 종류별로 따로 세다가 각자 때가 되면 떨어진다
        b.t -= dt;
        if (b.t <= 0) {
          spawnBonus(b);
          b.t = bonusInterval(b);
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      /* 별핑별·성난 우산처럼 순회 도중 목록을 무더기로 지우는 일이 있으면
         인덱스가 새 길이를 넘어설 수 있다 — 그 칸은 건너뛴다 (없으면 게임이 멈춘다) */
      if (!it) continue;
      if (it.bumpCd > 0) it.bumpCd -= dt;
      if (it.special === "split") {
        // 정해진 높이까지 내려오면 둘로 쪼개진다. 조각은 평범한 똥이라 정연핑이 부술 수 있다.
        if (it.y > it.splitAt) {
          const r2 = it.sz * 0.80;          // 조각을 더 크게 (잘 보이게)
          for (const dir of [-1, 1]) {
            /* 좌우로 벌어지는 각도와 속도를 조각마다 따로 뽑는다.
               늘 같은 폭으로 갈라지면 한 번 외우면 끝이라 재미가 없다. */
            const ang = dir * (0.22 + Math.random() * Math.random() * 0.65);   // 세로 기준 12~50도 (가로로 눕지 않게)
            const sp = it.vy * (0.50 + Math.random() * 0.28);   // 쪼개진 뒤엔 확 느려진다
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: Math.sin(ang) * sp, vy: Math.cos(ang) * sp,
              rot: (Math.random() - Math.random()) * 0.52, vr: 0,
              swayA: 0.14 + Math.random() * 0.07, swayW: 1.1 + Math.random() * 1.1,
              swayP: Math.random() * 6.28,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", space: it.space, special: null, bumpCd: 0, phase: 0, splitAt: 0,
              sz0: 0, face: randFace(), eye: randEye(), mouth: randMouth(), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#c86bff", 20);
          beep(300, .08, "square", .04);
          items.splice(i, 1);
          continue;
        }
      } else if (it.special === "zigzag") {
        // 흔들리는 속도·폭도 '느린 하늘'의 영향을 받는다 (세로만 느려지면 더 촘촘해져서 어색하다)
        it.phase += dt * tsc * 3.0 * aug.fallMul;
        it.vx = Math.sin(it.phase) * 230 * aug.fallMul;
      }
      const prevX = it.x, prevY = it.y;      // 한 프레임에 크게 움직이면 스쳐 지나갈 수 있다
      it.x += it.vx * dt * tsc;
      it.y += it.vy * dt * tsc;
      if (it.swayA) {                       // 살랑임 — 처음 각도를 중심으로 오간다
        it.swayP += dt * tsc * it.swayW;
        it.rot = (it.rot0 === undefined ? (it.rot0 = it.rot) : it.rot0) + Math.sin(it.swayP) * it.swayA;
      } else it.rot += it.vr * dt * tsc;
      if (it.special !== "laser") {          // 레이저는 예고한 선을 그대로 지나간다
        if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx); }
        if (it.x > W - it.r) { it.x = W - it.r; it.vx = -Math.abs(it.vx); }
      }
      if (it.bob !== undefined) it.bob += dt * 4;

      const cy = player.y + player.hy;
      const dx = it.x - player.x, dy = it.y - cy;
      if ((aug.blackhole || job === "levitator") && it.type === "poop" && it.skin === "fever") {
        // 뚜니핑 낙하물은 가까이 왔을 때만 끌어당긴다 (전부 빨아들이면 너무 세다)
        // 부양사 기본치는 블랙홀의 절반 반경·45% 힘
        const d = Math.hypot(dx, dy), R = aug.blackhole ? 195 : 98;
        if (d < R && d > 1) {
          const pull = (aug.blackhole ? 481 : 216) * dt * (1 - d / R);
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.5;
        }
      }
      /* 부양사는 자석이 없어도 기본 흡인(자석의 약 20%)을 갖고 시작한다.
         자석 증강을 먹으면 온전한 자석으로 덮어쓴다. */
      const magR = aug.magnet > 0 ? aug.magnet : (job === "levitator" ? 110 : 0);
      const magF = aug.magnet > 0 ? 1 : 0.45;
      if (magR > 0 && (it.type !== "poop" || it.gold)) {
        const d = Math.hypot(dx, dy);
        // 무지개똥은 아이템의 절반 반경·절반 힘 — 수집가라면 그 2배(아이템과 동일)
        const goldF = it.gold ? (aug.goldLord ? 1 : 0.5) : 1;
        const R = magR * goldF;
        if (d < R && d > 1) {
          const pull = (676 * (1 - d / R) + 78) * dt * magF * goldF;
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.55;
        }
      }
      /* 맞는 판정은 줍는 판정보다 좁다. 아이템은 잘 잡히면서 똥은 살짝 스쳐도 넘어가도록
         맞는 쪽만 줄여 뒀다 (.78 → .702 → .632). */
      const dmg = it.type === "poop" && !powered && it.skin !== "fever";
      // 끝점만 보면 빠른 똥이 캐릭터를 뛰어넘을 수 있어서, 이번 프레임에 지나온 선분과의 거리를 본다
      const hit = !it.bounced && segDist(player.x, cy, prevX, prevY, it.x, it.y)
                  < it.r + player.r * (dmg ? .632 : .78) * hitMul();

      if (hit) {
        if (it.type === "poop") {
          if (it.gold) {                    // 무지개똥 — 먹으면 점수 (레벨이 오를수록 값지다)
            const g = Math.round(120 * (aug.goldLord ? 3 : 1) * scoreMul() * Math.pow(1.3, level - 1));
            score += g;
            burst(it.x, it.y, "hsl(" + Math.round(goldFx(now, it.x).hue) + ",100%,62%)", 20);
            popText(it.x, it.y, "🌈 +" + g.toLocaleString(), "#ffe07a");
            beep(1250, .1, "square", .05);
            items.splice(i, 1);
            continue;
          }
          // 뚜니핑 타임 낙하물은 타임이 끝난 뒤에도 먹을 수 있다.
          // (끝나는 순간 화면에 떠 있던 것들이 그냥 스쳐 지나가면 아까우니까)
          if (powered || it.skin === "fever") {
            // 크기가 곧 점수. 뚜니핑 타임 중 생성된 건 자기 점수를 갖고 있고,
            // 뚜니핑 타임 전에 떨어지던 일반 똥은 크기로 환산한다.
            const gain = feverGain(it);
            let tone, burstN, note, textSize;
            if (gain >= 110)     { tone = "#c86bff"; burstN = 80; note = 2200; textSize = 48; }
            else if (gain >= 40) { tone = "#ff2170"; burstN = 54; note = 2000; textSize = 40; }
            else if (gain >= 25) { tone = "#ff3b3b"; burstN = 42; note = 1800; textSize = 34; }
            else if (gain >= 15) { tone = "#ff6a2a"; burstN = 34; note = 1650; textSize = 30; }
            else if (gain >= 10) { tone = "#ff8f3a"; burstN = 26; note = 1500; textSize = 27; }
            else if (gain >= 8)  { tone = "#ffcc33"; burstN = 18; note = 1350; textSize = 24; }
            else if (gain >= 5)  { tone = "#ffd23f"; burstN = 12; note = 1150; textSize = 22; }
            else                 { tone = "#ffe3a8"; burstN = 8;  note = 900;  textSize = 22; }
            score += gain;
            if (aug.refill && powered && refillLeft > 0) {   // 무한리필 — 먹은 만큼 길어진다
              const add = Math.min(150, refillLeft);
              powerUntil += add; refillLeft -= add;
            }
            burst(it.x, it.y, tone, burstN);
            // 큰 건 항상, 중간은 절반만 표시 — 작은 건 화면이 지저분해지니 생략
            if (gain >= 8 || (gain >= 5 && Math.random() < .5)) {
              popText(it.x, it.y, "+" + gain, tone, textSize);
            }
            if (gain >= 15) {
              shake = Math.max(shake, gain >= 110 ? 32 : (gain >= 40 ? 22 : (gain >= 25 ? 16 : 10)));
            }
            items.splice(i, 1);
            if (gain >= 25 || Math.random() < .5) beep(note + Math.random() * 200, .06, "square", .04);
            continue;
          }
          if (roidT > 0) {
            /* 스테로이드 — 몸에 닿은 똥이 위로 튕겨 나간다. 피한 것과 같은 점수를 받고,
               특수 성질(분열·지그재그·레이저)은 튕기는 순간 사라진다. */
            score += 3 * scoreMul();
            const away = it.x - player.x;
            it.vx = away * 5 + (Math.random() - .5) * 160;
            it.vy = -(Math.abs(it.vy) * 0.6 + 320);
            it.vr = (Math.random() - .5) * 12;
            it.special = null; it.bounced = true;
            burst(it.x, it.y, "#ff6a6a", 10);
            shake = Math.max(shake, 5);
            beep(560 + Math.random() * 200, .05, "square", .035);
            continue;
          }
          /* 무적 여부는 이 자리에서 그때그때 확인해야 한다.
             프레임 앞에서 한 번만 재어 두면, 같은 프레임에 똥 두 개가 겹쳐 닿았을 때
             첫 번째로 무적이 걸렸는데도 두 번째가 그대로 들어와 방패가 두 개 깨진다. */
          if (now >= invUntil) {
            if (shields > 0) {
              shields--;                     // 우산이 막아준 건 '맞은 것'으로 치지 않는다
              invUntil = now + 1000;        // 목숨을 잃었을 때와 같은 무적 시간
              shake = Math.max(shake, 14);
              burst(it.x, it.y, "#7ec8ff", 20);
              popText(player.x, player.y - 60, "☂️ 방어!", "#7ec8ff");
              beep(400, .12, "triangle", .06);
              if (navigator.vibrate) navigator.vibrate(60);
              if (aug.angryUmb) {
                /* 성난 우산 — 화면의 똥이 전부 사라지고 잠깐 새 똥도 안 나온다.
                   지금 부딪힌 똥(i)은 바로 아래 공용 splice 가 지우므로 건드리지 않는다. */
                for (let k = items.length - 1; k >= 0; k--) {
                  const q = items[k];
                  if (q.type !== "poop" || k === i) continue;
                  burst(q.x, q.y, "#9fd4ff", 7);
                  items.splice(k, 1);
                  if (k < i) i--;            // 앞쪽이 지워지면 내 자리도 한 칸 당겨진다
                }
                warns = [];
                shake = Math.max(shake, 22);
                feverFlash = Math.max(feverFlash, 0.4);
                popText(player.x, player.y - 95, "💢 성난 우산!", "#7ec8ff", 26);
                beep(190, .22, "square", .06);
              }
            } else {
              if (!testMode) lives--;      // 테스트 모드는 맞아도 목숨이 줄지 않는다
              noHitSec *= 0.5;             // 무소유 무피격 배율 — 맞으면 절반만 잃는다
              invUntil = now + 1000;
              hurtUntil = now + 1000;   // 무적 시간 동안 아픈 그림으로
              shake = 22; flash = 1;
              burst(it.x, it.y, "#8a5a2b", 22);
              popText(player.x, player.y - 60, "으악!", "#ff5d5d");
              beep(140, .25, "sawtooth", .07);
              if (lives <= 0) { items.splice(i, 1); return gameOver(); }
            }
            items.splice(i, 1);
            continue;
          }
        } else {
          items.splice(i, 1);
          if (collectItem(it, now)) return;   // 달이면 화면이 멈추므로 여기서 끝
          continue;
        }
      }

      if (it.bounced && it.y + it.r < -40) { items.splice(i, 1); continue; }   // 튕겨 나간 똥은 하늘로 퇴장
      if (it.y - it.r > H + 20) {
        // 뚜니핑 타임 낙하물은 워낙 많이 쏟아져서, 안 먹고 흘려보낸 것에 점수를 주면
        // 가만히 있어도 점수가 폭등한다. 뚜니핑 타임 것은 0점 — 직접 받아야만 점수가 오른다.
        if (it.type === "poop" && it.skin !== "fever") score += 3 * scoreMul();
        items.splice(i, 1);
      }
    }
  }

  /* 아이템 효과 적용. 플레이어가 직접 먹을 때와 '배고픈 정연핑'이 대신 먹을 때 모두 쓴다.
     달을 먹으면 게임이 멈추므로 true 를 돌려주고, 부른 쪽은 그 프레임 처리를 중단한다. */
  function collectItem(it, now) {
    if (it.type === "paper") {
      feverDur = 10000 + aug.feverBonus;
      // 이미 뚜니핑 중이면 남은 시간에 이어붙인다 (초기화하면 남은 시간이 버려진다)
      powerUntil = Math.max(powerUntil, now) + feverDur;
      refillLeft = 5000;               // 무한리필 — 이번 뚜니핑에서 늘릴 수 있는 한도
      feverFlash = 1;
      popText(player.x, player.y - 70, "🔥 뚜니핑 타임!", "#ffd23f", 26);
      beep(700, .1, "square", .05);
      beep(1100, .12, "square", .05);
      beep(1500, .18, "square", .05);
      if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
    }
    if (it.type === "umbrella") {
      shields = Math.max(shields, Math.min(shields + 1, 5));   // 아이템으로도 5개까지 누적
      popText(player.x, player.y - 60, "☂️ 방패!", "#7ec8ff");
      beep(900, .12, "triangle", .05);
    }
    if (it.type === "star") {
      const gain = eatStar(it.x, it.y);
      if (aug.starburst) {
        // 화면의 똥을 전부 없애고, 개당 방금 먹은 별 점수의 1%를 받는다 (까다로운 똥도 함께)
        let cnt = 0, bonus = 0;
        for (let k = items.length - 1; k >= 0; k--) {
          const q = items[k];
          if (q.type !== "poop") continue;
          bonus += gain * 0.01;
          burst(q.x, q.y, "#ffe9a8", 10);
          items.splice(k, 1);
          cnt++;
        }
        if (cnt) {
          bonus = Math.round(bonus);
          score += bonus;
          shake = Math.max(shake, 18);
          feverFlash = Math.max(feverFlash, 0.7);
          popText(player.x, player.y - 110,
                  "🌠 " + cnt + "개 쓸어버림 +" + Math.round(bonus).toLocaleString(), "#ffe9a8", 26);
          beep(2000, .18, "square", .05);
        }
      }
    }
    if (it.type === "moon" || it.type === "fullmoon") {
      const full = it.type === "fullmoon";
      burst(it.x, it.y, full ? "#ffe9a8" : "#cfe4ff", full ? 40 : 20);
      if (full) { flash = 0; feverFlash = 1; shake = Math.max(shake, 14); }
      openAugment(full ? 3 : 1);     // 보름달은 3연속 선택
      return true;
    }
    if (it.type === "heart") {
      lives = Math.min(aug.maxLives, lives + 1);
      popText(it.x, it.y, "❤️ +1", "#ff8fb0");
      beep(1000, .15, "sine", .06);
    }
    burst(it.x, it.y, "#ffd23f", 16);
    return false;
  }

  /* 뚜니핑 낙하물 점수. 크기 등급 점수에 레벨 보정을 곱한다.
     레벨이 하나 오를 때마다 10%씩 (레벨1 기준, 레벨10이면 약 2.4배). */
  function feverGain(it) {
    const base = it.gain || (it.sz < 16.2 ? 2 : (it.sz < 20.7 ? 5 : 10));
    /* 레벨이 오를수록 낙하물 값이 커진다. 1.1배로는 생존 점수(레벨당 1.7배)에
       한참 못 미쳐서 후반에 뚜니핑 타임이 있으나 마나였다 — 1.3배로 올렸다. */
    return Math.max(1, Math.round(base * aug.feverScoreMul * scoreMul() * Math.pow(1.3, level - 1)));
  }

  // 정연핑이 지나간 자리의 똥을 부순다 (뚜니핑 낙하물은 제 점수를 그대로 준다)
  function smashPoopsAround(x, y, radius, force) {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.type !== "poop") continue;
      if (Math.hypot(it.x - x, it.y - y) >= radius + it.r) continue;
      if (it.gold) {                         // 무지개똥 — 부수면 직접 먹은 것과 같은 점수
        const g = Math.round(120 * (aug.goldLord ? 3 : 1) * scoreMul() * Math.pow(1.3, level - 1));
        score += g;
        burst(it.x, it.y, "#ffd23f", 18);
        popText(it.x, it.y, "✨ +" + g.toLocaleString(), "#ffe07a");
        items.splice(i, 1);
        continue;
      }
      if (it.special && force) {              // 분신 폭발은 까다로운 똥도 부순다
        score += 3 * scoreMul();
        burst(it.x, it.y, "#ffd23f", 16);
        items.splice(i, 1);
        continue;
      }
      if (it.special) {
        /* 까다로운 똥은 부수지 못한다. 대신 종류마다 다르게 반응하고,
           정연핑은 부딪힌 자리를 그대로 지나간다. */
        if (it.bumpCd > 0) continue;
        it.bumpCd = 0.4;
        if (it.special === "split") {
          it.splitAt = -1;                   // 그 자리에서 곧바로 쪼개진다
        } else if (it.special === "zigzag") {
          it.phase += Math.PI;               // 흔들리던 방향이 뒤집힌다
          it.vx = -it.vx;
          burst(it.x, it.y, "#46d7ff", 14);
          beep(520, .07, "square", .04);
        } else if (it.special === "huge") {
          const r2 = it.sz * 0.42;           // 셋으로 쪼개진다 (조각은 평범한 똥)
          for (const dir of [-1, 0, 1]) {
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: dir * (170 + Math.random() * 90) * aug.fallMul, vy: it.vy * 1.4,
              rot: (Math.random() - Math.random()) * 0.52, vr: 0,
              swayA: 0.14 + Math.random() * 0.07, swayW: 1.1 + Math.random() * 1.1,
              swayP: Math.random() * 6.28,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", space: it.space, special: null, bumpCd: 0, phase: 0, splitAt: 0,
              sz0: 0, face: randFace(), eye: randEye(), mouth: randMouth(), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#ff963c", 28);
          beep(240, .12, "square", .05);
          shake = Math.max(shake, 10);
          items.splice(i, 1);
        }
        continue;                            // 레이저는 아무 반응 없이 지나간다
      }
      if (it.skin === "fever") {
        const g = feverGain(it);
        score += g;
        burst(it.x, it.y, g >= 25 ? "#ff3b3b" : "#ffd23f", g >= 25 ? 30 : 16);
        if (g >= 15) popText(it.x, it.y, "+" + g, "#ffd23f", g >= 40 ? 30 : 24);
      } else {
        score += 3 * scoreMul();
        burst(it.x, it.y, "#ffd23f", 14);
      }
      items.splice(i, 1);
    }
  }

  function gameOver() {
    state = STATE.OVER;
    btnPause.classList.remove("on"); syncPad();
    augScreen.classList.add("hidden");
    const s = Math.floor(score);
    burst(player.x, player.y, "#8a5a2b", 40);
    shake = 30;
    elFinal.textContent = s.toLocaleString();
    elTitle.textContent = "게임 오버!";
    overScreen.classList.remove("hidden");
    beep(220, .4, "sawtooth", .06);
    if (navigator.vibrate) navigator.vibrate(120);

    logRun(s);                 // 증강 통계 수집 (화면에는 아무것도 보이지 않는다)

    // 전체 랭킹: 최신 TOP 10을 다시 받아보고 진입했으면 이름 입력을 띄운다
    pendingScore = s; pendingLevel = level;
    myRowKey = null;
    nameRow.classList.remove("on");
    btnSave.disabled = false;
    btnSave.textContent = "등록";
    nameTag.textContent = "🎉 TOP 10 진입! 이름을 남기세요";
    // 게임오버 순위표는 이번 판 직업 탭으로 연다 (전체 TOP 10에 들면 아래에서 전체 탭으로 바꾼다)
    boardJob = job;
    for (const t of document.querySelectorAll(".jobTab")) t.classList.toggle("on", t.dataset.job === job);
    refreshBoards(boardOver).then(async () => {
      if (state !== STATE.OVER) return;
      const nm = savedName();
      /* 이름이 있으면 전체 TOP 10에 못 들어도 등록한다 — 직업별 순위표는 전체와 별개라서
         전체 기준으로만 걸러 버리면 직업별 판이 비게 된다. 이름이 없으면 예전처럼 진입했을 때만 묻는다. */
      if (!(nm ? canSubmit(s) : qualifies(s))) return;
      const r = topList.findIndex(v => s > v.score);
      const rank = (r < 0 ? topList.length + 1 : r + 1);
      if (nm) {
        // 이름을 미리 정해뒀으면 곧바로 등록한다
        nameRow.classList.add("on");
        nameForm.style.display = "none";
        nameTag.textContent = qualifies(s) ? "🎉 이번 주 " + rank + "위 등록 중…" : "기록 등록 중…";
        try {
          await submitScore(nm, pendingScore, pendingLevel);
          myRowKey = nm + "|" + pendingScore;
          await refreshBoards(boardOver);
          refreshBoards(boardStart);
          /* 한 기기당 한 줄만 남기 때문에, 예전 기록이 더 높으면 이번 판은 순위표에
             올라가지 않는다. 실제로 올라갔을 때만 달성 문구를 띄운다. */
          const at = topList.findIndex(v => v.name + "|" + Number(v.score) === myRowKey);
          if (at >= 0) {
            nameTag.textContent = "🎉 이번 주 " + (at + 1) + "위 달성! (" + nm + ")";
            setBoardJob("all");                 // 전체 순위에 들었으니 전체 탭으로
          } else {
            // 전체엔 못 들어도 직업별 TOP 10엔 들어갔을 수 있다
            let jat = -1;
            try {
              const jl = await fetchRange(weekStartMs(0), null, TOP_N, job);
              jobLists[job] = jl;
              jat = jl.findIndex(v => v.name + "|" + Number(v.score) === myRowKey);
            } catch (e) {}
            if (jat >= 0) nameTag.textContent = "🎉 이번 주 " + JOBS[job].nm + " " + (jat + 1) + "위 달성! (" + nm + ")";
            else nameRow.classList.remove("on");
          }
        } catch (e) {
          nameTag.textContent = "등록 실패 — 아래에서 다시 시도해주세요";
          nameForm.style.display = "";
          nameInput.value = nm;
        }
      } else {
        // 이름이 없으면 예전처럼 여기서 입력받는다
        nameRow.classList.add("on");
        nameForm.style.display = "";
        nameInput.value = "";
        nameTag.textContent = "🎉 " + rank + "위 진입! 이름을 남기세요";
      }
    });
  }
  /* 기기마다 한 번 만들어 저장해두는 식별자.
     같은 기기에서 여러 번 잘해도 순위표에는 가장 높은 기록 하나만 오른다. */
  const deviceId = (function () {
    try {
      let d = localStorage.getItem(LS_DEV);
      if (!d) {
        d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(LS_DEV, d);
      }
      return d;
    } catch (e) {
      return "d" + Math.random().toString(36).slice(2, 12);
    }
  })();

  /* ---------- 전체 랭킹 (Supabase) ---------- */
  // 이 게임 전용 Supabase 프로젝트 정보 (Settings → API 에서 복사)
  // 비워두면 랭킹 기능만 꺼지고 게임은 그대로 돌아간다.
  const SB_URL   = "https://osfbhhdpqdydbkgbgmat.supabase.co";
  const SB_KEY   = "sb_publishable_IOCUMux3jedTRKdTSGvDdg_1YCPmMw0";
  const SB_TABLE = "ddongpi_scores";
  const SB_RUNS  = "ddongpi_runs";     // 플레이 기록(증강 통계). 익명 키로는 쓰기만 되고 조회 불가
  const TOP_N    = 10;
  const SB_ON    = !!(SB_URL && SB_KEY);   // 설정 전에는 랭킹만 꺼지고 게임은 정상 동작

  const boardStart = document.getElementById("boardStart");
  const boardOver  = document.getElementById("boardOver");
  const nameRow    = document.getElementById("nameRow");
  const nameTag    = document.getElementById("nameTag");
  const nameInput  = document.getElementById("nameInput");
  const nameForm   = document.getElementById("nameForm");
  const btnSave    = document.getElementById("btnSave");

  let topList = [];
  let myRowKey = null;   // 방금 등록한 내 기록 강조용

  function sbHeaders(extra) {
    return Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }, extra || {});
  }

  /* 랭킹은 매주 월요일 0시(한국시간)에 새로 시작한다.
     기록을 지우는 게 아니라 '이번 주 것만' 보여주는 방식이라 초기화가 실패할 일이 없다.
     보는 사람 폰의 시간대와 무관하게 항상 한국시간 기준으로 계산한다. */
  const KST = 9 * 60 * 60 * 1000;
  function weekStartMs(weeksAgo) {                        // 0 = 이번 주, 1 = 지난주
    const k = new Date(Date.now() + KST);                 // UTC 값으로 읽으면 한국 벽시계
    const mondayIndex = (k.getUTCDay() + 6) % 7;          // 월=0 … 일=6
    const kstMidnight = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(),
                                 k.getUTCDate() - mondayIndex - (weeksAgo || 0) * 7);
    return kstMidnight - KST;                             // 실제 UTC 시각
  }
  function kstDateLabel(ms) {                             // "8.10" 형태
    const k = new Date(ms + KST);
    return (k.getUTCMonth() + 1) + "." + k.getUTCDate();
  }
  function resetNote() {
    const left = weekStartMs(0) + 7 * 24 * 3600 * 1000 - Date.now();
    const d = Math.floor(left / 86400000);
    const h = Math.floor(left / 3600000) % 24;
    const m = Math.floor(left / 60000) % 60;
    const remain = d > 0 ? d + "d" : (h > 0 ? h + "h" : m + "m");   // 짧게: 5d / 12h / 40m
    return "초기화까지 " + remain;
  }

  async function fetchRange(fromMs, toMs, limit, jb) {
    // 기기별 최고 기록만 남기는 건 SQL 함수 쪽에서 처리한다 (한 사람이 순위를 도배하지 않도록)
    // jb 가 있으면 그 직업으로 낸 기록 중 기기별 최고 (ddongpi_top_job)
    try {
      const body = {
        since: new Date(fromMs).toISOString(),
        until: toMs ? new Date(toMs).toISOString() : null,
        lim: limit
      };
      if (jb) body.jb = jb;
      const res = await fetch(SB_URL + "/rest/v1/rpc/" + (jb ? "ddongpi_top_job" : "ddongpi_top"), {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return await res.json();
      if (jb) throw new Error("HTTP " + res.status);   // 직업별은 함수가 없으면 대체 경로가 없다
    } catch (e) { if (jb) throw e; /* 아래 방식으로 넘어간다 */ }
    // 함수가 아직 없으면 예전처럼 표에서 바로 읽는다 (기기 중복 제거는 안 됨)
    let url = SB_URL + "/rest/v1/" + SB_TABLE +
      "?select=name,score,level,created_at" +
      "&created_at=gte." + encodeURIComponent(new Date(fromMs).toISOString());
    if (toMs) url += "&created_at=lt." + encodeURIComponent(new Date(toMs).toISOString());
    url += "&order=score.desc,created_at.asc&limit=" + limit;
    const r2 = await fetch(url, { headers: sbHeaders() });
    if (!r2.ok) throw new Error("HTTP " + r2.status);
    return r2.json();
  }

  function fetchTop() {
    return fetchRange(weekStartMs(0), null, TOP_N);
  }

  // 지난주 1~3위 — 기록이 있을 때만 시작 화면에 띄운다
  async function refreshLastWeek() {
    const lastBoard = document.getElementById("lastBoard");
    if (!SB_ON) return;
    const from = weekStartMs(1), to = weekStartMs(0);
    try {
      const list = await fetchRange(from, to, 3);
      if (!list.length) { lastBoard.hidden = true; return; }
      // 억/만 단위로 줄여 한 줄 칩으로 담는다
      const short = n => n >= 1e8 ? (n / 1e8).toFixed(n >= 1e9 ? 0 : 1) + "억"
                       : n >= 1e4 ? Math.round(n / 1e4).toLocaleString() + "만"
                       : n.toLocaleString();
      const medal = ["🥇", "🥈", "🥉"];
      const row = document.getElementById("boardLast");
      row.innerHTML = "";
      list.forEach((r, i) => {
        const chip = document.createElement("span");
        chip.className = "lp";
        const nm = document.createElement("span");
        nm.textContent = medal[i] + " " + r.name;
        const sc = document.createElement("b");
        sc.textContent = short(Number(r.score) || 0);
        chip.append(nm, sc);
        row.appendChild(chip);
      });
      lastBoard.hidden = false;
    } catch (e) {
      lastBoard.hidden = true;
    }
  }

  async function submitScore(name, sc, lv) {
    // DB 제약(최대 1억점)에 걸려 등록이 실패하지 않도록 방어
    const base = {
      name: name,
      score: Math.min(1000000000000, Math.max(0, sc)),   // 상한 1조
      level: lv
    };
    /* 아래 두 값은 나중에 추가한 컬럼이라 DB에 아직 없을 수 있다.
       컬럼이 없으면 요청 전체가 거부되므로, 실패하면 기본 항목만으로 다시 보낸다. */
    const tries = [
      Object.assign({}, base, { device: deviceId, augs: augCount, job: job }),
      Object.assign({}, base, { device: deviceId, augs: augCount }),
      Object.assign({}, base, { device: deviceId }),
      base
    ];
    let lastErr = "";
    for (const body of tries) {
      const res = await fetch(SB_URL + "/rest/v1/" + SB_TABLE, {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return;
      lastErr = "HTTP " + res.status + " " + (await res.text()).slice(0, 120);
      if (res.status !== 400) break;      // 컬럼 문제(400)일 때만 다시 시도한다
    }
    throw new Error(lastErr);
  }

  function renderBoard(el, list, msg) {
    el.innerHTML = "";
    if (msg) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = msg;
      el.appendChild(li);
      return;
    }
    if (!list.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "이번 주 기록이 아직 없습니다. 첫 주인공이 되어보세요!";
      el.appendChild(li);
      return;
    }
    const medal = ["🥇", "🥈", "🥉"];
    const shortScore = n => n >= 1e8 ? (n / 1e8).toFixed(n >= 1e9 ? 0 : 1) + "억"
                          : n >= 1e4 ? Math.round(n / 1e4).toLocaleString() + "만"
                          : n.toLocaleString();
    const isMe = row => myRowKey && row.name + "|" + row.score === myRowKey;
    // 1~3위 — 금·은·동 큰 줄
    list.slice(0, 3).forEach((row, i) => {
      const li = document.createElement("li");
      li.className = "p" + (i + 1) + (isMe(row) ? " me" : "");
      const rk = document.createElement("span");
      rk.className = "rk";
      rk.textContent = medal[i];
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = row.name;               // textContent → HTML 삽입 불가
      const sc = document.createElement("span");
      const digits = String(Math.round(Number(row.score) || 0)).length;
      sc.className = "sc" + (digits >= 13 ? " xlong" : digits >= 10 ? " long" : "");
      if (row.job && JOBS[row.job]) {
        const im = document.createElement("img");
        im.className = "jic";
        im.src = "assets/" + JOB_IMG[row.job] + "_right.png";
        im.alt = JOBS[row.job].ic;
        sc.appendChild(im);
      }
      sc.appendChild(document.createTextNode(Number(row.score).toLocaleString()));
      li.append(rk, nm, sc);
      el.appendChild(li);
    });
    // 4~6위는 한 줄에 셋, 7~10위는 한 줄에 넷 — 세로 미니 카드
    const mkMini = (row, rank) => {
      const chip = document.createElement("span");
      chip.className = "mini" + (isMe(row) ? " me" : "");
      const im = document.createElement("img");
      im.className = "jic2";
      const jb = row.job && JOBS[row.job] ? row.job : "none";
      im.src = "assets/" + JOB_IMG[jb] + "_right.png";
      im.alt = JOBS[jb].ic;
      const mn = document.createElement("span");
      mn.className = "mn";
      const b = document.createElement("b"); b.textContent = rank;
      mn.appendChild(b);
      mn.appendChild(document.createTextNode(row.name));
      const ms = document.createElement("span");
      ms.className = "ms";
      ms.textContent = shortScore(Number(row.score) || 0);
      chip.append(im, mn, ms);
      return chip;
    };
    for (const [from, to, cls] of [[3, 6, "duo"], [6, 10, "five"]]) {
      const rows = list.slice(from, to);
      if (!rows.length) continue;
      const li = document.createElement("li");
      li.className = cls;
      rows.forEach((row, k) => li.appendChild(mkMini(row, from + k + 1)));
      el.appendChild(li);
    }
  }

  const noteStart = document.getElementById("noteStart");
  const noteOver  = document.getElementById("noteOver");

  /* ---------- 직업별 TOP 10 탭 ----------
     전체 목록(topList)은 순위 계산에도 쓰이므로 그대로 두고,
     직업별 목록은 탭을 누를 때 따로 받아서 캐시해 둔다. */
  let boardJob = "all";
  let jobLists = {};
  function buildJobTabs() {
    for (const id of ["jobTabsStart", "jobTabsOver"]) {
      const box = document.getElementById(id);
      box.innerHTML = "";
      const mk = (key, label, img, title) => {
        const b = document.createElement("button");
        b.className = "jobTab" + (key === boardJob ? " on" : "");
        b.dataset.job = key;
        b.title = title || label;
        if (img) {
          const im = document.createElement("img");
          im.src = "assets/" + img + "_right.png"; im.alt = title || "";
          b.appendChild(im);
        }
        if (label) b.appendChild(document.createTextNode(label));
        b.addEventListener("click", () => {
          if (boardJob === key) return;
          beep(760, .06, "square", .03);
          setBoardJob(key);
        });
        box.appendChild(b);
      };
      mk("all", "전체", null);
      for (const jid in JOBS) mk(jid, "", JOB_IMG[jid], JOBS[jid].nm);   // 아이콘만 — 한 줄에
    }
  }
  buildJobTabs();
  // 탭을 바꾸고(두 화면 모두) 목록을 다시 그린다
  function setBoardJob(key, els) {
    boardJob = key;
    for (const t of document.querySelectorAll(".jobTab"))
      t.classList.toggle("on", t.dataset.job === key);
    return showBoards(els);
  }

  // 현재 탭에 맞는 목록을 두 순위표에 그린다
  async function showBoards(els) {
    els = els || [boardStart, boardOver];
    if (boardJob === "all") { els.forEach(el => renderBoard(el, topList)); return; }
    if (!jobLists[boardJob]) {
      els.forEach(el => renderBoard(el, null, "불러오는 중…"));
      try {
        jobLists[boardJob] = await fetchRange(weekStartMs(0), null, TOP_N, boardJob);
      } catch (e) {
        els.forEach(el => renderBoard(el, null, "직업별 랭킹을 불러오지 못했습니다"));
        return;
      }
    }
    if (boardJob !== "all") els.forEach(el => renderBoard(el, jobLists[boardJob]));
  }

  async function refreshBoards(target) {
    const els = target ? [target] : [boardStart, boardOver];
    const note = resetNote();
    noteStart.textContent = note;
    noteOver.textContent = note;
    if (!SB_ON) {
      els.forEach(el => renderBoard(el, null, "전체 랭킹 준비 중입니다"));
      return;
    }
    try {
      topList = await fetchTop();
      jobLists = {};                       // 새 기록이 있을 수 있으니 직업별 캐시도 비운다
      await showBoards(els);
    } catch (e) {
      els.forEach(el => renderBoard(el, null, "랭킹을 불러오지 못했습니다 (오프라인?)"));
    }
  }

  /* 판이 끝날 때 어떤 증강을 골랐는지 익명으로 남긴다.
     이름·기기 정보는 보내지 않고, 실패해도 게임에는 아무 영향이 없다. */
  function logRun(sc) {
    if (!SB_ON || testMode) return;    // 테스트 기록은 통계에 섞지 않는다
    const base = {
      score: Math.min(1000000000000, Math.max(0, sc)),   // 상한 1조
      level: level,
      secs: Math.round(elapsed),
      stars: starCount,
      augs: augCount,
      ver: GAME_VERSION        // 어느 버전에서 나온 기록인지
    };
    const nm = savedName();
    /* 직업·이름 칸이 아직 없는 서버에서도 기록은 남아야 하므로,
       400 이 오면 칸을 하나씩 빼며 다시 보낸다. */
    const withName = o => (nm ? Object.assign({ name: nm }, o) : o);
    const tries = [
      withName(Object.assign({ job: job }, base)),   // 직업 + 이름
      withName(base)                                  // 직업 칸이 없는 서버
    ];
    if (nm) tries.push(base);                         // 이름 칸도 없는 서버
    const send = body => fetch(SB_URL + "/rest/v1/" + SB_RUNS, {
      method: "POST",
      headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify(body),
      keepalive: true          // 창을 바로 닫아도 전송되도록
    });
    const go = i => {
      if (i >= tries.length) return;
      send(tries[i]).then(r => { if (r.status === 400) go(i + 1); }).catch(function () {});
    };
    try { go(0); } catch (e) {}
  }

  /* ---------- 개발자 통계 패널 ----------
     제목 오른쪽 💩 을 누르고 비밀번호를 넣으면 집계를 보여준다.
     원본 기록은 익명 키로 못 읽고, 비밀번호가 맞을 때만 서버 함수가 집계를 돌려준다. */
  const AUG_NAMES = {};
  const AUG_HIDDEN = {};
  for (const a of AUGMENTS) { AUG_NAMES[a.id] = a.nm; AUG_HIDDEN[a.id] = !!a.hidden; }
  AUG_NAMES.gamble = "도박꾼(삭제됨)";   // 옛 기록 표시용
  AUG_NAMES.fly = "초전도 이재(삭제됨)";
  AUG_NAMES.refill = "뚜니핑 무한리필(삭제됨)";
  const JOB_NAMES = { none: "백수", gambler: "도박사", levitator: "부양사", fit: "헬스걸", powerj: "파워J", powerp: "무소유", "(none)": "(기록 없음)" };
  const devScreen = document.getElementById("devScreen");
  const devPw     = document.getElementById("devPw");
  const devBody   = document.getElementById("devBody");
  const devMsg    = document.getElementById("devMsg");

  function devRow(cells, tag) {
    const tr = document.createElement("tr");
    for (const c of cells) {
      const td = document.createElement(tag || "td");
      if (typeof c === "object") { td.textContent = c.t; td.className = c.c || ""; }
      else td.textContent = c;
      tr.appendChild(td);
    }
    return tr;
  }
  function devSection(title, head, rows) {
    const box = document.createElement("div");
    box.className = "sec";
    const h = document.createElement("h4");
    h.textContent = title;
    box.appendChild(h);
    const tb = document.createElement("table");
    if (head) tb.appendChild(devRow(head, "th"));
    for (const r of rows) tb.appendChild(devRow(r));
    box.appendChild(tb);
    return box;
  }

  // {star50:2, lucky:1} → "별빛 증폭 x2, 행운"
  function augLabel(augs) {
    const keys = Object.keys(augs || {});
    if (!keys.length) return "-";
    return keys.map(k => (AUG_NAMES[k] || k) + (augs[k] > 1 ? " x" + augs[k] : "")).join(", ");
  }

  function renderDevStats(data) {
    const P = devPanes;
    const su = data.summary || {};
    P.sum.appendChild(devSection("전체 요약", null, [
      ["총 플레이", { t: (su.runs || 0) + "판", c: "num" }],
      ["평균 점수", { t: Number(su.avg_score || 0).toLocaleString(), c: "num" }],
      ["최고 점수", { t: Number(su.max_score || 0).toLocaleString(), c: "num" }],
      ["평균 생존", { t: (su.avg_secs || 0) + "초", c: "num" }],
      ["평균 별 개수", { t: su.avg_stars || 0, c: "num" }]
    ]));

    const augs = data.augs || [];
    P.aug.appendChild(devSection("증강별 채택 (판수 순)",
      ["증강", "판수", "중첩", "평균점수"],
      augs.length ? augs.map(a => [
        { t: AUG_NAMES[a.id] || a.id, c: AUG_HIDDEN[a.id] ? "hid" : "" },
        { t: a.picks, c: "num" },
        { t: a.stack, c: "num" },
        { t: Number(a.score || 0).toLocaleString(), c: "num" }
      ]) : [["기록 없음", "", "", ""]]));

    const vers = data.vers || [];
    if (vers.length) {
      P.sum.appendChild(devSection("버전별",
        ["버전", "판수", "평균생존"],
        vers.map(v => [
          v.ver,
          { t: v.runs, c: "num" },
          { t: (v.secs || 0) + "초", c: "num" }
        ])));
    }

    const jb = data.jobs || [];
    if (jb.length) {
      P.sum.appendChild(devSection("직업별",
        ["직업", "판수", "평균점수", "최고점수", "평균생존"],
        jb.map(q => [
          JOB_NAMES[q.job] || q.job,
          { t: q.runs, c: "num" },
          { t: Number(q.avg || 0).toLocaleString(), c: "num" },
          { t: Number(q.best || 0).toLocaleString(), c: "num" },
          { t: (q.secs == null ? "-" : q.secs + "초"), c: "num" }
        ])));
    }

    const rec = data.recent || [];
    const recSec = devSection("최근 20판",
      ["이름", "직업", "점수", "생존", "증강"],
      rec.length ? rec.map(r => [
        r.name || "-",
        r.job ? (JOB_NAMES[r.job] || r.job) : "-",
        { t: Number(r.score || 0).toLocaleString(), c: "num" },
        { t: (r.secs || 0) + "초", c: "num" },
        { t: augLabel(r.augs), c: "lft" }
      ]) : [["기록 없음", "", "", "", ""]]);
    recSec.querySelector("table").classList.add("tbRecent");
    P.rec.appendChild(recSec);

  }

  function kstStamp(iso) {                      // "8.19 14:03" 형태 (한국시간)
    const k = new Date(new Date(iso).getTime() + KST);
    const p2 = n => (n < 10 ? "0" + n : "" + n);
    return (k.getUTCMonth() + 1) + "." + k.getUTCDate() + " " +
           p2(k.getUTCHours()) + ":" + p2(k.getUTCMinutes());
  }

  let devPwOK = "";          // 인증에 성공한 비밀번호 (삭제할 때 다시 쓴다)

  // 이번 주 기록을 원본 그대로(중복 포함) 불러온다 — 지울 대상을 고르기 위해
  async function devFetchRaw() {
    const url = SB_URL + "/rest/v1/" + SB_TABLE +
      "?select=id,name,score,level,created_at" +
      "&created_at=gte." + encodeURIComponent(new Date(weekStartMs(0)).toISOString()) +
      "&order=score.desc&limit=200";
    const res = await fetch(url, { headers: sbHeaders() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function devDeleteIds(ids, btn, label) {
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const res = await fetch(SB_URL + "/rest/v1/rpc/ddongpi_delete", {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ pw: devPwOK, ids: ids })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);

  /* ---------- 그리기 ---------- */
  /* 한 단계 오를 때마다 지면에서 우주로 한 층씩 올라간다.
     sky = [하늘 위, 중간, 아래] 색, gr = 발밑 지형,

  const ZONES = [
    { nm: "잔디밭",     ic: "🌱", gr: "grass", cl: 1.00, st: 0,
      sky: [[137, 198, 255], [191, 224, 255], [233, 244, 255]] },
