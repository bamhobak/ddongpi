      sky: [[  8,  18,  58], [ 16,  42,  94], [ 30,  72, 122]] },
    { nm: "중간권",     ic: "❄️", gr: "metal", cl: 0, st: 0.92, au: 0.35, mt: 1,
      sky: [[  6,  12,  40], [ 10,  24,  64], [ 18,  38,  86]] },
    { nm: "카르만 선",  ic: "🛰️", gr: "metal", cl: 0, st: 1, mt: 0.5, ea: 0.6,
      sky: [[  3,   6,  22], [  6,  12,  38], [ 12,  24,  58]] },
    { nm: "저궤도",     ic: "🌍", gr: "metal", cl: 0, st: 1, ea: 1,
      sky: [[  2,   4,  14], [  4,   8,  24], [  8,  16,  40]] },
    { nm: "달 궤도",    ic: "🌕", gr: "moon",  cl: 0, st: 1, mo: 1, ea: 0.25,
      sky: [[  1,   2,   8], [  2,   5,  15], [  5,   9,  24]] },
    { nm: "소행성대",   ic: "☄️", gr: "dark",  cl: 0, st: 1, rk: 1, mt: 0.6,
      sky: [[  2,   2,  10], [  5,   4,  17], [  9,   8,  26]] },
    { nm: "은하수",     ic: "🌌", gr: "dark",  cl: 0, st: 1, nb: 1, rk: 0.3,
      sky: [[ 10,   4,  30], [ 26,   9,  54], [ 44,  15,  74]] },
    { nm: "심우주",       ic: "🌑", gr: "void", cl: 0, st: 1, nb: 0.6, mt: 0.8, bh: 0.10,
      sky: [[  0,   0,   0], [  2,   2,   9], [  5,   4,  16]] },
    { nm: "어둠의 문턱",   ic: "🌒", gr: "void", cl: 0, st: 1, nb: 0.35, mt: 0.5, bh: 0.30,
      sky: [[  2,   0,   6], [  6,   2,  14], [ 12,   4,  20]] },
    { nm: "강착원반",     ic: "🌀", gr: "void", cl: 0, st: 0.8, nb: 0.15, mt: 0.3, bh: 0.55,
      sky: [[  6,   0,   6], [ 14,   3,  14], [ 26,   6,  18]] },
    { nm: "사건의 지평선", ic: "⚫", gr: "void", cl: 0, st: 0.5, mt: 0.15, bh: 0.80,
      sky: [[ 10,   0,   4], [ 22,   4,  10], [ 40,   8,  14]] },
    { nm: "블랙홀 안",    ic: "🕳️", gr: "void", cl: 0, st: 0, bh: 1.5, sw: 1,
      sky: [[  0,   0,   0], [  0,   0,   0], [  0,   0,   0]] }
  ];
  const LAST_Z = ZONES.length - 1;
  const BH_Z = LAST_Z;                 // 블랙홀 안 — 여기부터 모든 조건이 두 배
  function inBlackhole() { return zoneIdx() >= BH_Z; }
  function bhMul() { return inBlackhole() ? 2 : 1; }
  // 블랙홀 안의 '난이도' 배율 — 점수·아이템 배율(2배)과 달리 낙하 속도·똥 수량에만 쓴다
  function bhDiff() { return inBlackhole() ? 1.5 : 1; }
  /* 부양사 — 높이 날수록 모든 점수가 커진다. 바닥 +0%, 중간 +50%, 꼭대기 +100%. */
  function levMul() {
    if (job !== "levitator" || !flyOn) return 1;
    const air = Math.max(0, Math.min(1, (groundY - player.y) / Math.max(1, groundY - H * FLY_TOP)));
    return 1 + 1.0 * air;
  }
  /* 무소유 — 증강이 없는 대신 레벨마다 배율이 커지고 (Lv1 ×4, 레벨마다 +1),
     여기에 안 맞고 버틴 시간만큼 초당 +10% 가 더 곱해진다.
     목숨을 잃으면 무피격 시간이 절반으로 줄어든다 (우산 방어는 무피격 유지). */
  function monkMul() {
    if (job !== "powerp") return 1;
    return (level + 3) * (1 + 0.10 * noHitSec);
  }
  function scoreMul() { return aug.scoreMul * bhMul() * levMul() * monkMul(); }

  function zoneIdx() { return Math.min(LAST_Z, level - 1); }
  // 지금 단계와 다음 단계 사이의 진행도 — 색이 뚝 끊기지 않고 이어지도록
  function zoneFrac() {
    const i = level - 1;
    if (i >= LAST_Z) return 0;
    return Math.max(0, Math.min(1, levelTime / 12 - i));
  }
  // 두 단계 사이를 이어 구한 값 (색이면 rgb 문자열, 숫자면 숫자)
  function zv(key, i) {
    const a = ZONES[zoneIdx()], b = ZONES[Math.min(LAST_Z, zoneIdx() + 1)], f = zoneFrac();
    if (i === undefined) return (a[key] || 0) + ((b[key] || 0) - (a[key] || 0)) * f;
    const ca = a.sky[i], cb = b.sky[i];
    return "rgb(" + Math.round(ca[0] + (cb[0] - ca[0]) * f) + ","
                  + Math.round(ca[1] + (cb[1] - ca[1]) * f) + ","
                  + Math.round(ca[2] + (cb[2] - ca[2]) * f) + ")";
  }
  function skyColor(i) { return zv(null, i); }

  /* 올라갈수록 드러나는 별. 위치는 매판 고정이고 반짝임만 움직인다.
     크기·밝기·색·반짝이는 속도를 제각각으로 흩어 놓아야 하늘처럼 보인다. */
  const STARS = [];
  for (let i = 0; i < 120; i++) {
    const t = (i % 9) / 8;
    STARS.push({
      fx: (i * 0.6180339887) % 1,
      fy: ((i * 0.7548776662) % 1) * 0.94,
      r: 0.45 + t * t * 2.1,                       // 대부분 작고 가끔 크다
      ph: i * 1.7,
      sp: 620 + (i % 7) * 320,                     // 반짝이는 주기도 제각각
      dim: 0.35 + ((i * 37) % 100) / 155,          // 별마다 기본 밝기가 다르다
      col: (i % 19 === 0) ? "255,226,180"          // 드물게 노란 별
         : (i % 11 === 0) ? "200,220,255"          // 드물게 푸른 별
         : "255,255,255",
      // 대부분은 점, 가끔 네 갈래 반짝이, 아주 드물게 빛살이 뻗는 큰 별
      kind: (i % 24 === 0) ? 2 : (i % 5 === 0) ? 1 : 0
    });
  }
  function drawBackground(now) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const spaceFever = fever && inSpace();
    if (spaceFever) {                      // 우주에서는 불꽃 대신 워프하는 하늘
      const p = 0.5 + Math.sin(now / 70) * 0.5;
      g.addColorStop(0, "#12002e");
      g.addColorStop(.5, p > .5 ? "#5a1490" : "#7a1aa8");
      g.addColorStop(1, "#d22bb0");
    } else if (fever) {
      const p = 0.5 + Math.sin(now / 70) * 0.5;
      g.addColorStop(0, "#ff5a2e");
      g.addColorStop(.5, p > .5 ? "#ff9d2e" : "#ffb92e");
      g.addColorStop(1, "#ffe08a");
    } else {
      g.addColorStop(0, skyColor(0));
      g.addColorStop(.55, skyColor(1));
      g.addColorStop(1, skyColor(2));
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 뚜니핑 타임 속도선 — 우주에서는 길게 늘어진 별빛으로
    if (fever) {
      const n = spaceFever ? 26 : 14, len = spaceFever ? 170 : 70;
      ctx.lineWidth = spaceFever ? 2 : 3;
      for (let i = 0; i < n; i++) {
        const x = ((i * 137 + now * 0.05) % (W + 40)) - 20;
        const y = ((i * 311 + now * (spaceFever ? 2.6 : 1.6)) % (H + 260)) - 130;
        ctx.strokeStyle = spaceFever
          ? (i % 5 === 0 ? "rgba(255,190,255,.55)" : "rgba(255,255,255,.55)")
          : "rgba(255,255,255,.35)";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
      }
    }

    if (!fever) {
      const nb = zv("nb"), st = zv("st"), mo = zv("mo"), au = zv("au"),
            ea = zv("ea"), rk = zv("rk"), mt = zv("mt");
      if (nb > 0.01) drawNebula(nb, now);
      if (st > 0.01) drawStars(st, now);
      const bh = zv("bh"), sw = zv("sw");
      if (sw > 0.01) drawSwirl(sw, now);
      if (bh > 0.01) drawBlackhole(bh, now);
      if (mo > 0.01) drawMoon(mo);
      if (au > 0.01) drawAurora(au, now);
      if (rk > 0.01) drawRocks(rk, now);
      if (mt > 0.01) drawMeteors(mt, now);
      if (ea > 0.01) drawEarth(ea);
    }

    // 구름 — 올라갈수록 옅어지다 사라진다
    const cl = fever ? (spaceFever ? 0 : 0.75) : Math.min(0.80, zv("cl") * 0.62);
    if (cl > 0.02) {
      ctx.fillStyle = "rgba(255,255,255," + cl.toFixed(2) + ")";
      for (const c of clouds) {
        /* 덩이를 한 덩어리로 묶어 한 번에 칠한다.
           따로따로 칠하면 겹친 자리가 진해져서 동그라미 여러 개로 보인다. */
        ctx.beginPath();
        for (const L of c.lobes) {
          ctx.moveTo(c.x + L.dx + L.r, c.y + L.dy);
          ctx.arc(c.x + L.dx, c.y + L.dy, L.r, 0, 6.283);
        }
        ctx.moveTo(c.x + c.bw, c.y + c.bh * 0.4);
        ctx.ellipse(c.x, c.y + c.bh * 0.4, c.bw, c.bh, 0, 0, 6.283);
        ctx.fill();
      }
    }

    // 발밑 — 단계가 바뀌는 동안 다음 지형이 겹쳐 올라온다
    if (state !== STATE.READY) {          // 인트로에서는 발판 없이 날아간다
      const za = ZONES[zoneIdx()], zb = ZONES[Math.min(LAST_Z, zoneIdx() + 1)], zf = zoneFrac();
      drawGround(za.gr, 1);
      if (zb.gr !== za.gr && zf > 0.45) drawGround(zb.gr, Math.min(1, (zf - 0.45) / 0.35));
    }
  }

  /* ---- 배경 조각들 ---- */
  function drawStars(a, now) {
    for (const st of STARS) {
      const tw = st.dim + (1 - st.dim) * Math.abs(Math.sin(now / st.sp + st.ph));
      const al = a * tw;
      if (al < 0.02) continue;
      const x = st.fx * W, y = st.fy * H;
      ctx.fillStyle = "rgba(" + st.col + "," + al.toFixed(3) + ")";
      if (st.kind === 0) {                         // 평범한 점
        ctx.beginPath();
        ctx.arc(x, y, st.r, 0, 6.283);
        ctx.fill();
      } else {                                     // 네 갈래로 뾰족한 반짝이
        const R = st.r * (st.kind === 2 ? 3.4 : 2.3), k = R * 0.16;
        ctx.beginPath();
        ctx.moveTo(x, y - R);
        ctx.quadraticCurveTo(x + k, y - k, x + R, y);
        ctx.quadraticCurveTo(x + k, y + k, x, y + R);
        ctx.quadraticCurveTo(x - k, y + k, x - R, y);
        ctx.quadraticCurveTo(x - k, y - k, x, y - R);
        ctx.fill();
        if (st.kind === 2) {                       // 큰 것은 빛무리까지
          const gg = ctx.createRadialGradient(x, y, 0, x, y, R * 1.5);
          gg.addColorStop(0, "rgba(" + st.col + "," + (al * 0.30).toFixed(3) + ")");
          gg.addColorStop(1, "rgba(" + st.col + ",0)");
          ctx.fillStyle = gg;
          ctx.beginPath(); ctx.arc(x, y, R * 1.5, 0, 6.283); ctx.fill();
        }
      }
    }
  }

  function drawNebula(a, now) {           // 은하수 — 커다란 색 얼룩 몇 개
    const blobs = [[0.28, 0.24, "255,120,220"], [0.74, 0.40, "120,150,255"], [0.48, 0.66, "180,110,255"]];
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i];
      const cx = b[0] * W + Math.sin(now / 9000 + i) * 18;
      const cy = b[1] * H + Math.cos(now / 11000 + i) * 14;
      const r = W * (0.42 + i * 0.06);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, "rgba(" + b[2] + "," + (a * 0.14).toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + b[2] + ",0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawBlackhole(a, now) {        // 다가갈수록 커지는 블랙홀
    const cx = W * 0.5, cy = H * 0.30;
    let R = Math.min(W, H) * (0.05 + a * a * 0.52);
    /* 마지막 단계에서는 지평선이 화면을 통째로 삼켜서 완전한 암흑이 된다.
       화면 구석까지 닿는 반지름을 구해 그보다 크게 잡는다. */
    if (a >= 1.3) {
      const need = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 10;
      R = Math.max(R, need);
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.26);
    for (let i = 0; i < 3; i++) {         // 강착원반 — 납작하게 누운 불의 고리
      const rr = R * (1.30 + i * 0.34);
      const g = ctx.createRadialGradient(0, 0, R * 0.98, 0, 0, rr);
      g.addColorStop(0, "rgba(255,186,90," + (0.42 * a).toFixed(3) + ")");
      g.addColorStop(0.5, "rgba(255,96,40," + (0.20 * a).toFixed(3) + ")");
      g.addColorStop(1, "rgba(120,16,60,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, 0, rr, rr * (0.30 + i * 0.05), 0, 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(255,222,158," + (0.8 * a).toFixed(3) + ")";   // 빛이 휘는 고리
    ctx.lineWidth = Math.max(1.5, R * 0.05);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.07, 0, 6.283); ctx.stroke();
    ctx.fillStyle = "#000";                                              // 사건의 지평선
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();
  }

  function drawSwirl(a, now) {            // 블랙홀 안 — 빨려 들어가는 빛줄기
    const cx = W * 0.5, cy = H * 0.30, far = Math.max(W, H);
    ctx.save();
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (let i = 0; i < 30; i++) {
      const r0 = 60 + ((i * 137 + now * 0.16) % (far * 1.05));
      const r1 = r0 * 0.74;
      const ang = i * 0.71 + now / 1400 + r0 * 0.004;
      const fade = a * Math.max(0, 1 - r0 / far) * 0.65;
      if (fade < 0.02) continue;
      ctx.strokeStyle = "rgba(255," + (130 + (i % 5) * 24) + ",90," + fade.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0 * 0.72);
      ctx.lineTo(cx + Math.cos(ang + 0.40) * r1, cy + Math.sin(ang + 0.40) * r1 * 0.72);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
    ctx.restore();
  }

  function drawMoon(a) {                  // 달 궤도 — 크게 떠 있는 달
    ctx.globalAlpha = a;
    const cx = W * 0.74, cy = H * 0.20, r = Math.min(W, H) * 0.15;
    ctx.fillStyle = "rgba(255,245,220,.10)";
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#ded8c8";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(160,152,136,.55)";
    const cr = [[-.34, -.22, .20], [.26, -.06, .15], [-.10, .34, .17], [.34, .38, .11]];
    for (const c of cr) {
      ctx.beginPath();
      ctx.arc(cx + c[0] * r, cy + c[1] * r, c[2] * r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawAurora(a, now) {           // 흐르는 오로라 커튼
    for (let b = 0; b < 3; b++) {
      const base = H * 0.13 + b * 30;
      const g = ctx.createLinearGradient(0, base, 0, base + 96);
      const col = b === 1 ? "120,255,190" : "160,130,255";
      g.addColorStop(0, "rgba(" + col + "," + (a * 0.24).toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + col + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-20, base);
      for (let x = -20; x <= W + 20; x += 20) ctx.lineTo(x, base + Math.sin(x / 90 + now / 1500 + b * 2) * 24);
      for (let x = W + 20; x >= -20; x -= 20) ctx.lineTo(x, base + 96 + Math.sin(x / 90 + now / 1500 + b * 2) * 24);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawMeteors(a, now) {          // 스쳐 가는 별똥별 — 밝은 머리에 꼬리가 옅어진다
    ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const T = ((now / 1000) + i * 0.83) % 3.4;
      if (T > 1.15) continue;
      const q = T / 1.15;
      const fade = Math.sin(Math.PI * q);          // 스르르 나타났다 스르르 사라진다
      if (fade < 0.03) continue;
      const vx = W * (0.34 + (i % 3) * 0.16), vy = H * (0.62 + (i % 2) * 0.22);
      const d = Math.hypot(vx, vy);
      const hx = ((i * 151) % Math.max(1, W)) + q * vx;   // 머리 위치
      const hy = -60 + q * vy;
      const len = 86 + (i % 3) * 52;                      // 꼬리는 날아온 쪽으로 눕는다
      const tx = hx - vx / d * len, ty = hy - vy / d * len;
      const g = ctx.createLinearGradient(hx, hy, tx, ty);
      g.addColorStop(0, "rgba(255,255,255," + (a * fade * 0.92).toFixed(3) + ")");
      g.addColorStop(0.30, "rgba(206,228,255," + (a * fade * 0.34).toFixed(3) + ")");
      g.addColorStop(1, "rgba(170,200,255,0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(hx, hy); ctx.lineTo(tx, ty);
      ctx.stroke();
      const gh = ctx.createRadialGradient(hx, hy, 0, hx, hy, 8);
      gh.addColorStop(0, "rgba(255,255,255," + (a * fade).toFixed(3) + ")");
      gh.addColorStop(0.4, "rgba(220,235,255," + (a * fade * 0.35).toFixed(3) + ")");
      gh.addColorStop(1, "rgba(200,225,255,0)");
      ctx.fillStyle = gh;
      ctx.beginPath(); ctx.arc(hx, hy, 8, 0, 6.283); ctx.fill();
    }
    ctx.lineCap = "butt";
  }

  function drawRocks(a, now) {            // 소행성대 — 천천히 흘러가는 바위
    for (let i = 0; i < 7; i++) {
      const y = (((now * 0.014 * (1 + (i % 3))) + i * 137) % (H + 140)) - 70;
      const x = (i * 97 + 40) % Math.max(1, W);
      const r = 7 + (i % 4) * 5;
      ctx.fillStyle = "rgba(120,124,142," + (a * 0.75).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(80,84,100," + (a * 0.7).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(x + r * .3, y + r * .25, r * .4, 0, 6.283); ctx.fill();
    }
  }

  function drawEarth(a) {                 // 저궤도 — 발밑에 걸린 지구의 곡선
    ctx.globalAlpha = a;
    const R = W * 1.55, cy = H - GROUND_H + R - 30;
    ctx.fillStyle = "rgba(150,210,255,.28)";
    ctx.beginPath(); ctx.arc(W / 2, cy, R + 12, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#2f6bb5";
    ctx.beginPath(); ctx.arc(W / 2, cy, R, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.30)";
    const cl = [[-.30, .06], [.12, .02], [.40, .10]];
    for (const c of cl) {
      ctx.beginPath();
      ctx.ellipse(W / 2 + c[0] * W, cy - R + 14 + c[1] * 40, W * .18, 9, 0, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- 발밑 지형 ---- */
  function drawGround(kind, a) {
    const y = H - GROUND_H;
    ctx.save();
    ctx.globalAlpha = a;
    if (kind === "grass") {
      ctx.fillStyle = "#7bbf6a"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#6aad5b"; ctx.fillRect(0, y, W, 6);
    } else if (kind === "rock") {
      ctx.fillStyle = "#8b6b4c"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#a9855f"; ctx.fillRect(0, y, W, 7);
      ctx.fillStyle = "rgba(0,0,0,.13)";
      for (let i = 0; i < 7; i++) ctx.fillRect((i * 89) % Math.max(1, W), y + 20 + ((i * 37) % 44), 28, 7);
    } else if (kind === "cloud") {
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillRect(0, y + 14, W, GROUND_H - 14);
      for (let x = -10; x < W + 50; x += 44) {
        ctx.beginPath(); ctx.arc(x, y + 16, 24, 0, 6.283); ctx.fill();
      }
      ctx.fillStyle = "rgba(190,210,235,.55)";
      ctx.fillRect(0, y + 40, W, GROUND_H - 40);
    } else if (kind === "metal") {
      // 위가 밝고 아래로 어두워지는 금속판. 촘촘한 세로줄은 실로폰처럼 보여서 뺐다.
      const mg = ctx.createLinearGradient(0, y, 0, H);
      mg.addColorStop(0, "#525d7d");
      mg.addColorStop(0.35, "#3a4260");
      mg.addColorStop(1, "#232838");
      ctx.fillStyle = mg; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#9fb4e0"; ctx.fillRect(0, y, W, 4);            // 밝은 난간
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, y + 4, W, 2);
      ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fillRect(0, y + 30, W, 1);
      ctx.fillStyle = "rgba(140,190,255,.55)";                        // 활주로 유도등
      for (let x = 34; x < W; x += 132) {
        ctx.beginPath(); ctx.arc(x, y + 17, 2.6, 0, 6.283); ctx.fill();
      }
    } else if (kind === "moon") {
      ctx.fillStyle = "#b3ada0"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#cdc7b8"; ctx.fillRect(0, y, W, 7);
      ctx.fillStyle = "rgba(120,114,102,.55)";
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc((i * 103 + 30) % Math.max(1, W), y + 26 + ((i * 29) % 34), 9 + (i % 3) * 5, 0, 6.283);
        ctx.fill();
      }
    } else if (kind === "dark") {
      ctx.fillStyle = "#2b2f40"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#434964"; ctx.fillRect(0, y, W, 6);
      ctx.fillStyle = "rgba(0,0,0,.28)";
      for (let i = 0; i < 6; i++) ctx.fillRect((i * 79) % Math.max(1, W), y + 24 + ((i * 41) % 40), 34, 6);
    } else {                                  // void — 빛나는 발판만 남는다
      ctx.fillStyle = "rgba(16,18,30,.92)"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "rgba(150,190,255,.85)"; ctx.fillRect(0, y, W, 3);
      ctx.fillStyle = "rgba(120,170,255,.16)"; ctx.fillRect(0, y + 3, W, 16);
    }
    ctx.restore();
  }

  function drawPlayer(now) {
    const hurting = now < hurtUntil && sprSet().hurt.img;
    const blink = now < invUntil && Math.floor(now / 90) % 2 === 0;
    const spr = currentSprite(now);

    if (spr) {
      // 머리 지름을 판정원 지름과 일치시킨다 — 그림마다 머리 비율이 달라 각자의 값을 쓴다
      const sh = spriteHeight(spr);   // 판정이 작아지면 그림도 같이 작아진다
      const sw = sh * spr.aspect;
      ctx.save();
      ctx.translate(player.x, player.y);
      // 맞은 직후엔 제자리에서 아파하는 그림이라 기울이지 않는다
      ctx.rotate(hurting ? 0 : player.tilt * 0.35);
      // 아픈 그림은 잘 보이도록 깜빡임을 약하게
      ctx.globalAlpha = blink ? (hurting ? .62 : .35) : 1;

      /* 발밑 그림자 — 그림이 떠올라도 그림자는 땅에 남는다.
         높이 뜰수록 작고 옅어져서 얼마나 떠 있는지 눈으로 읽힌다. */
      const air = Math.max(0, Math.min(1, (groundY - player.y) / Math.max(1, groundY - H * FLY_TOP)));
      ctx.save();
      ctx.globalAlpha *= .22 * (1 - air * .62);
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(0, FOOT - 4 + (groundY - player.y), sw * .3 * (1 - air * .34), 7 * (1 - air * .34), 0, 0, 6.283);
      ctx.fill();
      ctx.restore();

      // 발이 항상 FOOT 선에 닿도록 아래를 기준으로 그린다 (작아져도 뜨지 않는다)
      ctx.drawImage(spr.img, -sw * spr.cx, FOOT - sh, sw, sh);

      if (roidT > 0) {                      // 스테로이드 — 붉게 달아오른 근육 오라
        ctx.globalAlpha = .18 + Math.sin(now / 70) * .08;
        ctx.fillStyle = "#ff4b4b";
        ctx.beginPath(); ctx.arc(0, player.hy, player.r * hitMul() + 18, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "rgba(255,90,90,.9)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, player.hy, player.r * hitMul() + 18, 0, 6.283); ctx.stroke();
      }
      if (now < powerUntil) {
        ctx.beginPath();
        ctx.arc(0, player.hy, player.r * hitMul() + 14 + Math.sin(now / 90) * 3, 0, 6.283);
        ctx.strokeStyle = "rgba(255,255,255,.85)";
        ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
        ctx.lineDashOffset = -now / 20;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = .22 + feverT * .18;
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(0, player.hy, player.r * hitMul() + 14, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      drawShields(player.y + player.hy - player.r * hitMul() - 21);
      return;
    }

    /* ---- 이미지가 없을 때: 코드로 그린 기본 캐릭터 ---- */
    const R = DRAW_R;                      // 원본 도안 기준 반지름
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);
    ctx.scale(player.r * hitMul() / R, player.r * hitMul() / R); // 실제 크기로 축소
    ctx.globalAlpha = blink ? .35 : 1;

    ctx.save();
    ctx.globalAlpha *= .25;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, R + 26, R * .8, 9, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#f4f1ea";
    ctx.strokeStyle = "#d8d3c7";
    ctx.lineWidth = 2;
    const bw = R * 1.35, bh = 52;
    ctx.beginPath(); ctx.roundRect(-bw / 2, R * .55, bw, bh, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-bw / 2 - 13, R * .7, 14, 34, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(bw / 2 - 1, R * .7, 14, 34, 8); ctx.fill(); ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, 6.283);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = "#ffe0bd";
    ctx.fillRect(-R, -R, R * 2, R * 2);
    ctx.fillStyle = "#3b2a1d";
    ctx.beginPath(); ctx.arc(-13, -6, 4.5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -6, 4.5, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#3b2a1d"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0, 6, 12, .2, Math.PI - .2); ctx.stroke();
    ctx.fillStyle = "#6b4a2f";
    ctx.beginPath(); ctx.arc(0, -R * .55, R * .95, Math.PI, 0); ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(0, 0, R, 0, 6.283);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.stroke();

    if (now < powerUntil) {
      const t = feverT;
      ctx.beginPath();
      ctx.arc(0, 6, R + 16 + Math.sin(now / 90) * 3, 0, 6.283);
      ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -now / 20;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = .25 + t * .2;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, 6, R + 16, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    drawShields(player.y - player.r - 21);
  }

  // 머리 위에 남은 방패 수만큼 우산을 나란히 그린다
  function drawShields(y) {
    if (shields <= 0) return;
    const size = 30 * hitMul();
    const gap = size * 0.78;
    ctx.save();
    ctx.translate(player.x, y);
    ctx.font = size + "px serif";
    ctx.fillStyle = "#fff";                    // 이모지가 앞의 투명도를 물려받지 않게
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    /* 5개까지는 한 줄, 그보다 많으면 두 줄로 나눠 머리 위에 얹는다.
       (아랫줄이 원래 자리, 윗줄이 그 위) */
    const rows = shields > 5 ? 2 : 1;
    const perRow = Math.ceil(shields / rows);
    const d = size * ITEM_IMG_SCALE;
    let k = 0;
    for (let r = 0; r < rows; r++) {
      const n = Math.min(perRow, shields - k);       // 윗줄이 모자라면 그만큼만
      const start = -(n - 1) * gap / 2;
      const ry = (rows - 1 - r) * -gap * 0.82;       // 위로 한 줄씩 쌓는다
      for (let i = 0; i < n; i++, k++) {
        if (ITEM_IMG.umbrella) ctx.drawImage(ITEM_IMG.umbrella, start + i * gap - d / 2, ry - d / 2, d, d);
        else ctx.fillText("☂️", start + i * gap, ry);
      }
    }
    ctx.restore();
  }

  // 원본 그림이 '오른쪽 → 왼쪽' 방향이라, 왼쪽 → 오른쪽으로 날 때만 좌우를 뒤집는다
  function drawHelperAt(x, y, vx, vy) {
    const hh = HELPER_H * helperScale(), hw = hh * helperAspect();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(vx, -vy) * 0.8);   // 진행 방향으로 기울이기
    if (vx > 0) ctx.scale(-1, 1);            // 오른쪽으로 갈 때 반전
    ctx.drawImage(helperPic(), -hw / 2, -hh / 2, hw, hh);
    ctx.restore();
  }

  function drawHelpers() {
    if (!helperPic()) return;
    for (const hp of helpers) drawHelperAt(hp.x, hp.y, hp.vx, hp.vy);
    for (const f of fetchers) drawHelperAt(f.x, f.y, f.vx, f.vy);
  }

  /* 똥 위에 덧그리는 표정. 이모지 폰트가 기기마다 달라서 눈·입을 새로 그리는 대신
     어느 폰트에서나 자연스럽게 얹히는 장식(선글라스·눈썹·홍조 등)으로 표현한다. */
  /* 눈·입 변형 — 그림의 흰자가 순백이라 눈동자를 흰색으로 덮고 다시 그리면 이음매가 없다.
     입은 자홍색 영역 안에 이빨·혀를 얹기만 하므로 지울 필요가 없다. (모두 실측 좌표) */
  const SCL_R = 0.163;                  // 흰자 반지름 / 그림 크기
  const PUP_R = 0.085;                  // 원래 눈동자 반지름
  const PUP_C = "#3f2930";              // 원래 눈동자 색
  const MOU_TOP = 0.327, MOU_BOT = 0.475, MOU_HW = 0.145;   // 입 범위

  function eyeBase(S) {                 // 흰자만 남기고 눈동자를 지운다
    ctx.fillStyle = "#fff";
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(sx * EYE_X * S, EYE_Y * S, SCL_R * S * 0.99, 0, 6.283);
      ctx.fill();
    }
  }
  function pupil(S, sx, dx, dy, r) {    // 흰자 안에서만 움직이도록 가둔다
    const cx = sx * EYE_X * S, cy = EYE_Y * S;
    const lim = (SCL_R - r) * S;
    const ox = Math.max(-lim, Math.min(lim, dx * S));
    const oy = Math.max(-lim, Math.min(lim, dy * S));
    ctx.fillStyle = PUP_C;
    ctx.beginPath(); ctx.arc(cx + ox, cy + oy, r * S, 0, 6.283); ctx.fill();
  }
  /* 0 = 그림 그대로. 1~9 는 눈동자를 다시 그린다. */
  function drawPoopEyes(kind, S) {
    if (!kind) return;
    ctx.save();
    if (kind === 7 || kind === 8) {                 // 감은 눈 / 윙크
      eyeBase(S);
      ctx.strokeStyle = PUP_C;
      ctx.lineWidth = Math.max(2, S * 0.035);
      ctx.lineCap = "round";
      for (const sx of [-1, 1]) {
        if (kind === 8 && sx > 0) { pupil(S, sx, 0, 0, PUP_R); continue; }   // 윙크는 한쪽만 감는다
        const cx = sx * EYE_X * S, cy = EYE_Y * S, r = SCL_R * S * 0.72;
        ctx.beginPath();
        ctx.arc(cx, cy + r * 0.55, r, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
    eyeBase(S);
    switch (kind) {
      case 1: for (const sx of [-1, 1]) pupil(S, sx, -0.09, 0, PUP_R); break;        // 왼쪽 곁눈질
      case 2: for (const sx of [-1, 1]) pupil(S, sx,  0.09, 0, PUP_R); break;        // 오른쪽 곁눈질
      case 3: for (const sx of [-1, 1]) pupil(S, sx, 0, -0.08, PUP_R); break;        // 위 보기
      case 4: pupil(S, -1, 0.10, 0, PUP_R); pupil(S, 1, -0.10, 0, PUP_R); break;     // 사팔뜨기
      case 5: for (const sx of [-1, 1]) pupil(S, sx, 0, 0.02, PUP_R * 0.5); break;   // 콩눈
      case 6: for (const sx of [-1, 1]) pupil(S, sx, 0, 0, PUP_R * 1.45); break;     // 부릅뜬 눈
      case 9: pupil(S, -1, 0, 0, PUP_R * 1.4); pupil(S, 1, 0.03, 0.02, PUP_R * 0.55); break;   // 짝눈
    }
    ctx.restore();
  }

  /* 입 — 원래 입 안에 덧그리기만 한다. 0 = 그림 그대로. */
  function drawPoopMouth(kind, S) {
    if (!kind) return;
    ctx.save();
    const top = MOU_TOP * S, bot = MOU_BOT * S, hw = MOU_HW * S;
    if (kind === 1) {                       // 윗니
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.roundRect(-hw * 0.72, top + S * 0.004, hw * 1.44, (bot - top) * 0.34, S * 0.012);
      ctx.fill();
    } else if (kind === 2) {                // 혀
      ctx.fillStyle = "#ff7ab0";
      ctx.beginPath();
      ctx.ellipse(0, bot - (bot - top) * 0.22, hw * 0.52, (bot - top) * 0.34, 0, 0, 6.283);
      ctx.fill();
    } else if (kind === 3) {                // 송곳니
      ctx.fillStyle = "#fff";
      for (const sx of [-1, 1]) {
        const x = sx * hw * 0.52;
        ctx.beginPath();
        ctx.moveTo(x - hw * 0.13, top + S * 0.004);
        ctx.lineTo(x + hw * 0.13, top + S * 0.004);
        ctx.lineTo(x, top + (bot - top) * 0.52);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  /* 똥 꾸밈. 3D 그림의 눈은 가운데보다 조금 아래(y +0.124S), 좌우 ±0.221S 에 있고
     눈 반지름은 0.16S 쯤 된다 — 아래 좌표는 전부 그 실측값에 맞춰 두었다. */
  const EYE_X = 0.221, EYE_Y = 0.124, EYE_R = 0.155;
  function drawPoopFace(kind, S) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const ex = EYE_X * S, ey = EYE_Y * S, er = EYE_R * S;
    switch (kind) {
      case 2: {  // 성난 눈썹
        ctx.strokeStyle = "#2b1a10";
        ctx.lineWidth = Math.max(2, S * 0.05);
        ctx.beginPath();
        ctx.moveTo(-ex - er * 0.9, ey - er * 1.5); ctx.lineTo(-ex + er * 0.5, ey - er * 0.75);
        ctx.moveTo( ex + er * 0.9, ey - er * 1.5); ctx.lineTo( ex - er * 0.5, ey - er * 0.75);
        ctx.stroke();
        break;
      }
      case 3: {  // 선글라스
        const w = ex + er * 1.35, h = er * 1.5;
        ctx.fillStyle = "#15161c";
        ctx.beginPath();
        ctx.roundRect(-w, ey - h * 0.62, w * 2, h * 1.24, h * 0.4);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.45)";           // 렌즈 반사
        ctx.beginPath();
        ctx.roundRect(-ex - er * 0.7, ey - h * 0.42, er * 0.75, h * 0.32, h * 0.16);
        ctx.fill();
        break;
      }
      case 4: {  // 뿅 간 눈 (X)
        ctx.strokeStyle = "#2b1a10";
        ctx.lineWidth = Math.max(2, S * 0.045);
        for (const sx of [-1, 1]) {
          const cx = sx * ex, d = er * 0.85;
          ctx.beginPath();
          ctx.moveTo(cx - d, ey - d); ctx.lineTo(cx + d, ey + d);
          ctx.moveTo(cx + d, ey - d); ctx.lineTo(cx - d, ey + d);
          ctx.stroke();
        }
        break;
      }
      case 5: {  // 발그레한 볼
        ctx.fillStyle = "rgba(255,120,140,.6)";
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(sx * (ex + er * 1.35), ey + er * 1.15, er * 0.6, er * 0.4, 0, 0, 6.283);
          ctx.fill();
        }
        break;
      }
      case 6: {  // 식은땀
        ctx.fillStyle = "#8fd4ff";
        const x = ex + er * 1.5, y = ey - er * 2.1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + er * 0.55, y + er * 0.95, x, y + er * 1.2);
        ctx.quadraticCurveTo(x - er * 0.55, y + er * 0.95, x, y);
        ctx.fill();
        break;
      }
      case 7: {  // 분노 표시
        ctx.strokeStyle = "#ff3b3b";
        ctx.lineWidth = Math.max(2, S * 0.04);
        for (const off of [[0, 0], [er * 0.55, er * 0.4]]) {
          const x = ex + er * 0.9 + off[0], y = ey - er * 2.3 + off[1];
          ctx.beginPath();
          ctx.moveTo(x, y); ctx.lineTo(x + er * 0.5, y + er * 0.45); ctx.lineTo(x, y + er * 0.9);
          ctx.stroke();
        }
        break;
      }
      case 8: {  // 하트 눈
        ctx.fillStyle = "#ff3d68";
        for (const sx of [-1, 1]) {
          const cx = sx * ex, cy = ey, r = er * 1.05;
          ctx.beginPath();
          ctx.moveTo(cx, cy + r * 0.75);
          ctx.bezierCurveTo(cx - r * 1.3, cy - r * 0.25, cx - r * 0.5, cy - r * 1.2, cx, cy - r * 0.35);
          ctx.bezierCurveTo(cx + r * 0.5, cy - r * 1.2, cx + r * 1.3, cy - r * 0.25, cx, cy + r * 0.75);
          ctx.fill();
        }
        break;
      }
      case 9: {  // 별 눈
        ctx.fillStyle = "#ffd23f";
        for (const sx of [-1, 1]) {
          const cx = sx * ex, cy = ey, r = er * 1.15;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const rr = i % 2 ? r * 0.45 : r;
            const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.closePath(); ctx.fill();
        }
        break;
      }
      case 10: {  // 왕관
        const y = ey - er * 3.0, w = ex * 1.15, h = er * 1.5;
        ctx.fillStyle = "#ffd23f";
        ctx.beginPath();
        ctx.moveTo(-w, y + h);
        ctx.lineTo(-w, y); ctx.lineTo(-w * 0.45, y + h * 0.5); ctx.lineTo(0, y - h * 0.28);
        ctx.lineTo(w * 0.45, y + h * 0.5); ctx.lineTo(w, y); ctx.lineTo(w, y + h);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ff5d8f";
        ctx.beginPath(); ctx.arc(0, y + h * 0.55, h * 0.2, 0, 6.283); ctx.fill();
        break;
      }
      case 11: {  // 리본
        const x = -ex - er * 0.55, y = ey - er * 2.15, r = er * 0.8;
        ctx.fillStyle = "#ff5d8f";
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0 + x, y);
          ctx.quadraticCurveTo(x + sx * r * 1.7, y - r, x + sx * r * 1.5, y + r * 0.35);
          ctx.quadraticCurveTo(x + sx * r * 0.9, y + r * 0.7, x, y);
          ctx.fill();
        }
        ctx.fillStyle = "#ffd23f";
        ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, 6.283); ctx.fill();
        break;
      }
      case 12: {  // 안대
        ctx.strokeStyle = "#1b1c22";
        ctx.lineWidth = Math.max(1.5, S * 0.028);
        ctx.beginPath();
        ctx.moveTo(-ex - er * 1.15, ey - er * 1.35); ctx.lineTo(ex + er * 0.85, ey - er * 0.3);
        ctx.stroke();
        ctx.fillStyle = "#1b1c22";
        ctx.beginPath();
        ctx.ellipse(-ex, ey, er * 1.25, er * 1.1, -0.15, 0, 6.283);
        ctx.fill();
        break;
      }
      case 13: {  // 콧수염
        ctx.fillStyle = "#3a2415";
        const y = ey + er * 1.5, w = er * 1.5;
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.quadraticCurveTo(sx * w * 0.6, y - er * 0.55, sx * w * 1.35, y - er * 0.15);
          ctx.quadraticCurveTo(sx * w * 0.7, y + er * 0.5, 0, y + er * 0.3);
          ctx.fill();
        }
        break;
      }
    }
    ctx.restore();
  }

  // 레이저가 떨어질 자리를 미리 깜빡여 알려준다 (막판일수록 빠르게)
  function drawWarnings(now) {
    const L = H - GROUND_H;
    for (const wn of warns) {
      const left = wn.t / LASER_WARN;                 // 1 → 0
      const speed = 90 + (1 - left) * 240;            // 남을수록 느리게, 임박하면 빠르게
      const on = Math.floor(now / speed) % 2 === 0;
      ctx.save();
      ctx.translate(wn.x, 0);
      ctx.rotate(-(wn.ang || 0));                     // 실제 낙하 궤적과 같은 기울기
      /* 넓은 띠는 항상 같은 밝기로 깔아둔다. 띠까지 깜빡이면 그 뒤를 지나는
         다른 똥들이 함께 깜빡이는 것처럼 보인다. 깜빡이는 건 가운데 선과 ⚠ 뿐. */
      const g = ctx.createLinearGradient(0, 0, 0, L);
      g.addColorStop(0, "rgba(255,60,60,.20)");
      g.addColorStop(1, "rgba(255,60,60,.05)");
      ctx.fillStyle = g;
      ctx.fillRect(-17, 0, 34, L / Math.cos(wn.ang || 0));
      ctx.strokeStyle = "rgba(255,80,80," + (on ? 0.9 : 0.3) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, L / Math.cos(wn.ang || 0));
      ctx.stroke();
      /* 경고 표시는 화면 맨 위가 아니라 예고선 중간쯤에 크게 띄운다.
         선을 따라 기울어진 자리로 옮긴 뒤, 글자만 다시 세운다. */
      const mid = (L / Math.cos(wn.ang || 0)) * 0.45;
      ctx.translate(0, mid);
      ctx.rotate(wn.ang || 0);
      ctx.globalAlpha = on ? 1 : 0.35;
      ctx.fillStyle = "#ff5d5d";
      ctx.font = "700 46px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.beginPath();                       // 어두운 배경에서도 눈에 띄게 뒤에 원을 깐다
      ctx.arc(0, 2, 32, 0, 6.283);
      ctx.fillStyle = "rgba(60,0,0,.45)";
      ctx.fill();
      ctx.fillStyle = "#ff5d5d";
      ctx.fillText("⚠", 0, 0);
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawItems(now) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const it of items) {
      ctx.save();
      /* 떨어지는 것들은 어떤 경우에도 비쳐 보이지 않게 한다.
         앞서 그린 배경이 남긴 흐림·투명도가 여기까지 따라오지 않도록 매번 초기화한다. */
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      ctx.shadowColor = "rgba(0,0,0,0)";
      if (ctx.filter !== undefined) ctx.filter = "none";
      const bob = it.bob !== undefined ? Math.sin(it.bob) * 4 : 0;
      ctx.translate(it.x, it.y + bob);
      if (it.special === "laser") {
        ctx.rotate(Math.atan2(it.vx, it.vy));   // 굴러떨어지지 않고 진행 방향으로 눕는다
      } else {
        ctx.rotate(it.rot);
      }
      if (it.special && it.special !== "huge") {
        // 종류마다 다른 색 기운 — 미리 알아보고 피하라고 (초거대는 덩치로 이미 눈에 띈다)
        ctx.fillStyle = it.special === "split" ? "rgba(200,107,255,.34)"
                      : it.special === "zigzag" ? "rgba(70,215,255,.32)"
                      : "rgba(255,60,60,.40)";
        ctx.beginPath();
        ctx.arc(0, 0, it.size * 0.60, 0, 6.283);
        ctx.fill();
      }
      const fp = (it.space && feverPoopSpace) ? feverPoopSpace : feverPoop;
      if (it.skin === "fever" && fp) {
        ctx.drawImage(fp, -it.size / 2, -it.size / 2, it.size, it.size);
      } else {
        /* 색 이모지도 fillStyle 의 투명도를 그대로 따라간다.
           바로 앞에 그린 구름의 반투명 흰색이 남아 있으면 똥까지 비쳐 보인다. */
        if (it.gold) {                       // 무지개똥 — 무지갯빛으로 돌며 번쩍인다
          const fx = goldFx(now, it.x);
          const R = it.size * (0.95 + fx.puls * 0.18);
          const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
          gg.addColorStop(0, "hsla(" + fx.hue + ",100%,72%," + (0.75 + fx.puls * 0.25).toFixed(2) + ")");
          gg.addColorStop(0.42, "hsla(" + ((fx.hue + 60) % 360) + ",100%,60%," + (0.34 + fx.puls * 0.2).toFixed(2) + ")");
          gg.addColorStop(1, "hsla(" + ((fx.hue + 120) % 360) + ",100%,55%,0)");
          ctx.fillStyle = gg;
          ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();
          if (ctx.filter !== undefined) ctx.filter = fx.css;
        }
        const ii = ITEM_IMG[it.type];      // 똥도 같은 3D 그림 (무지개똥 필터는 그림에도 먹는다)
        if (ii) {
          const d = it.size * ITEM_IMG_SCALE;
          ctx.drawImage(ii, -d / 2, -d / 2, d, d);
        } else {
          ctx.fillStyle = "#fff";
          ctx.font = it.size + "px serif";
          ctx.fillText(it.emoji, 0, 0);
        }
        if (ctx.filter !== undefined) ctx.filter = "none";
        if (it.type === "poop" && it.size >= 28 && !it.gold) {
          if (!EYE_COVER[it.face]) drawPoopEyes(it.eye || 0, it.size);
          drawPoopMouth(it.mouth || 0, it.size);
          if (it.face > 1) drawPoopFace(it.face, it.size);
        }
      }
      ctx.restore();
    }
  }

  // 위쪽 두 봉우리가 둥글고 아래가 뾰족한 통통한 하트
  function heartPath(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + r * 1.00);
    ctx.bezierCurveTo(cx - r * 0.62, cy + r * 0.45, cx - r * 1.32, cy - r * 0.05, cx - r * 1.32, cy - r * 0.52);
    ctx.bezierCurveTo(cx - r * 1.32, cy - r * 1.06, cx - r * 0.72, cy - r * 1.28, cx - r * 0.34, cy - r * 0.92);
    ctx.bezierCurveTo(cx - r * 0.16, cy - r * 0.75, cx - r * 0.05, cy - r * 0.60, cx, cy - r * 0.50);
    ctx.bezierCurveTo(cx + r * 0.05, cy - r * 0.60, cx + r * 0.16, cy - r * 0.75, cx + r * 0.34, cy - r * 0.92);
    ctx.bezierCurveTo(cx + r * 0.72, cy - r * 1.28, cx + r * 1.32, cy - r * 1.06, cx + r * 1.32, cy - r * 0.52);
    ctx.bezierCurveTo(cx + r * 1.32, cy - r * 0.05, cx + r * 0.62, cy + r * 0.45, cx, cy + r * 1.00);
    ctx.closePath();
  }

  function drawHud() {
    ctx.save();
    const top = 14;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = "700 26px system-ui, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillText(Math.floor(score).toLocaleString(), 17, top + 1);
    ctx.fillStyle = "#fff";
    ctx.fillText(Math.floor(score).toLocaleString(), 16, top);

    ctx.font = "600 13px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(ZONES[zoneIdx()].ic + " " + ZONES[zoneIdx()].nm, 17, top + 32);


    // 목숨은 이모지 대신 직접 그린다.
    // iOS 이모지는 지정한 상단선보다 위로 튀어나와서 화면 밖으로 잘리는 문제가 있었다.
    if (testMode) {
      ctx.font = "700 12px system-ui, sans-serif";
      ctx.fillStyle = "#ff7b7b";
      ctx.fillText("TEST  목숨 ∞", 17, top + 54);
    }
    // 보유 증강 — 오른쪽 위 하트 아래에 붙인다 (우산은 머리 위에 이미 보이므로 제외)
    const owned = AUGMENTS.filter(a => augCount[a.id] && !a.noCount);
    if (owned.length) {
      let x = W - 16, ay = top + (lives > 20 ? 82 : lives > 10 ? 62 : 44);   // 하트 줄 수만큼 아래로
      for (let i = owned.length - 1; i >= 0; i--) {
        const a = owned[i], n = augCount[a.id];
        const wItem = n > 1 ? 30 : 21;
        if (x - wItem < 52) { x = W - 16; ay += 21; }   // 한 줄에 안 들어가면 아랫줄로
        x -= wItem;
        ctx.font = "15px serif";
        ctx.fillStyle = "#fff";
        ctx.fillText(a.ic, x, ay);
        if (n > 1) {
          ctx.font = "700 10px system-ui, sans-serif";
          ctx.fillStyle = "#ffd23f";
          ctx.fillText("x" + n, x + 16, ay + 4);
        }
      }
    }

    // 하트가 많으면 작게 그리고 10개 단위로 줄을 바꾼다 (헬스걸은 최대 20개)
    if (job === "powerp") {                 // 무소유 — 무피격으로 버틴 시간
      ctx.textAlign = "right";
      ctx.font = "700 13px system-ui, sans-serif";
      ctx.fillStyle = "#ffe08a";
      ctx.fillText("🧘 " + Math.floor(noHitSec) + "초", W - 16, top + 44);
      ctx.textAlign = "left";
    }
    const hr = lives > 5 ? 7.5 : 10.5, hgap = lives > 5 ? 18 : 30;
    for (let i = 0; i < lives; i++) {
      const cx = W - 18 - hr * 1.32 - (i % 10) * hgap;
      const hy = top + 16 + Math.floor(i / 10) * 19;
      ctx.fillStyle = "rgba(70,8,20,.32)";                // 그림자
      heartPath(cx, hy + 2.5, hr * 1.06);
      ctx.fill();
      ctx.fillStyle = "#ff3d6a";
      heartPath(cx, hy, hr);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.7)";             // 광택
      ctx.beginPath();
      ctx.ellipse(cx - hr * 0.55, hy - hr * 0.62, hr * 0.30, hr * 0.20, -0.56, 0, 6.283);
      ctx.fill();
    }

    // 🔥 뚜니핑 타임 게이지
    if (fever) {
      // 점수·레벨과 겹치지 않도록 화면 한가운데에 표시
      const bw = Math.min(260, W - 60), bx = (W - bw) / 2, by = H / 2 + 8;
      const ty = H / 2 - 24;
      ctx.textAlign = "center";
      ctx.font = "800 22px system-ui, sans-serif";
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(120,30,0,.55)";
      ctx.strokeText("🔥 뚜니핑 타임 🔥", W / 2, ty);
      ctx.fillStyle = "#fff";
      ctx.fillText("🔥 뚜니핑 타임 🔥", W / 2, ty);

      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, 10, 5); ctx.fill();
      ctx.fillStyle = "#fff36b";
      ctx.beginPath(); ctx.roundRect(bx, by, bw * feverT, 10, 5); ctx.fill();
    }
    ctx.restore();
  }

  function drawEffects() {
    // 벼랑 끝 분신술 — 작은 이재가 날아간다
    if (clones.length) {
      const S = sprSet();
      const ci = (S.right && S.right.img) ? S.right : (SPR.right.img ? SPR.right : null);
      for (const c of clones) {
        if (ci) {
          const h = 69, w = h * ci.aspect;      // 1.5배 키움
          ctx.drawImage(ci.img, c.x - w / 2, c.y - h / 2, w, h);
        } else {
          ctx.font = "39px serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillStyle = "#fff";
          ctx.fillText("🏃", c.x, c.y);
        }
      }
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
      ctx.font = "800 " + (f.size || 22) + "px system-ui, sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    if (bulletT > 0) {                    // 인터스텔라 — 세상이 파랗게 잠긴다
      ctx.fillStyle = "rgba(110,170,255,.08)";
      ctx.fillRect(0, 0, W, H);
    }
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,60,60," + (flash * .35) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (feverFlash > 0) {
      ctx.fillStyle = "rgba(255,240,180," + (feverFlash * .6) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* 화면이 멈춰 있거나 메뉴일 때는 초당 그리는 장수를 줄여 발열·배터리를 아낀다.
     게임 중(PLAY)은 예전 그대로 60fps. */
  let lastPaint = 0;
  function frameCap() {
    if (state === STATE.PLAY) return 0;                       // 제한 없음
    if (state === STATE.PAUSE) return resumeCountEnd ? 0 : 10; // 카운트다운 중에는 부드럽게
    if (state === STATE.AUG) return 10;                        // 증강 고르는 중
    return 30;                                                 // 인트로·게임오버 화면
  }

  function frame(now) {
    const cap = frameCap();
    if (cap && now - lastPaint < 1000 / cap - 1) { requestAnimationFrame(frame); return; }
    lastPaint = now;
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    update(dt, now);

    ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawBackground(now);
    if (state === STATE.READY) {
      drawIntro(now);
    } else {
      drawWarnings(now);
      drawItems(now);
      drawHelpers();
      if (state !== STATE.OVER) drawPlayer(now);
    }
    drawEffects();
    ctx.restore();
    if (state === STATE.PLAY || state === STATE.PAUSE) drawHud();
    if (dpad.classList.contains("on")) dpad.classList.toggle("noVert", !flyOn);

    // 일시정지 해제 카운트다운 — 3, 2, 1 을 크게 세고 나서 움직인다
    if (state === STATE.PAUSE && resumeCountEnd > 0) {
      const leftMs = resumeCountEnd - now;
      if (leftMs <= 0) {
        finishResume(now);
      } else {
        const n = Math.ceil(leftMs / 1000);
        const frac = 1 - ((leftMs % 1000) / 1000);        // 숫자마다 커졌다 사라진다
        ctx.save();
        ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
        ctx.fillStyle = "rgba(0,0,0,.35)";
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1 - frac * 0.6;
        ctx.fillStyle = "#ffd23f";
        ctx.font = "800 " + Math.round(90 + frac * 40) + "px system-ui, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(n, W / 2, H * 0.45);
        ctx.restore();
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
