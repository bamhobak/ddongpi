  /* 판이 끝날 때 어떤 증강을 골랐는지 익명으로 남긴다.
     이름·기기 정보는 보내지 않고, 실패해도 게임에는 아무 영향이 없다. */
  function logRun(sc) {
    if (!SB_ON || testMode) return;    // 테스트 기록은 통계에 섞지 않는다
    const base = {
      score: Math.min(1000000000000, Math.max(0, sc)),   // 상한 1조
      level: level,
      secs: Math.round(elapsed),
      stars: starCount,
      augs: augCount,
      ver: GAME_VERSION        // 어느 버전에서 나온 기록인지
    };
    /* 오브젝트별 점수 비중(%) — 액수가 아니라 비중이라 판 길이와 무관하게 견줄 수 있다.
       칸이 없는 서버에서도 기록은 남아야 하므로 아래에서 이 칸부터 떼어 낸다. */
    const srcTot = SRC_KEYS.reduce((t, k) => t + (scoreSrc[k] || 0), 0);
    const srcPct = {};
    if (srcTot > 0) {
      for (const k of SRC_KEYS) {
        if (scoreSrc[k] > 0) srcPct[SRC_CODE[k]] = Math.round(scoreSrc[k] / srcTot * 1000) / 10;
      }
    }
    const nm = savedName();
    /* 직업·이름 칸이 아직 없는 서버에서도 기록은 남아야 하므로,
       400 이 오면 칸을 하나씩 빼며 다시 보낸다. */
    const withName = o => (nm ? Object.assign({ name: nm }, o) : o);
    const tries = [
      // 주운 코인 개수 + 풀소유까지 갔는지
      withName(Object.assign({ job: job, src: srcPct, coins: coinGot, fullown: fullOwn }, base)),
      withName(Object.assign({ job: job, src: srcPct }, base)),   // 코인 칸이 없는 서버
      withName(Object.assign({ job: job }, base)),   // src 칸이 없는 서버
      withName(base)                                  // 직업 칸도 없는 서버
    ];
    if (nm) tries.push(base);                         // 이름 칸도 없는 서버
    const send = body => fetch(SB_URL + "/rest/v1/" + SB_RUNS, {
      method: "POST",
      headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify(body),
      keepalive: true          // 창을 바로 닫아도 전송되도록
    });
    const go = i => {
      if (i >= tries.length) return;
      send(tries[i]).then(r => { if (r.status === 400) go(i + 1); }).catch(function () {});
    };
    try { go(0); } catch (e) {}
  }

  /* ---------- 개발자 통계 패널 ----------
     제목 오른쪽 💩 을 누르고 비밀번호를 넣으면 집계를 보여준다.
     원본 기록은 익명 키로 못 읽고, 비밀번호가 맞을 때만 서버 함수가 집계를 돌려준다. */
  const AUG_NAMES = {};
  const AUG_HIDDEN = {};
  for (const a of AUGMENTS) { AUG_NAMES[a.id] = a.nm; AUG_HIDDEN[a.id] = !!a.hidden; }
  for (const id in PETS) if (id !== "none") AUG_NAMES["pet:" + id] = PETS[id].ic + " 펫 " + PETS[id].nm;
  AUG_NAMES["mode:noitem"] = "🗼 똥탑등반";
  AUG_NAMES["mode:pure"] = "🥊 맨몸대결";
  AUG_NAMES.gamble = "도박꾼(삭제됨)";   // 옛 기록 표시용
  AUG_NAMES.fly = "초전도 이재(삭제됨)";
  AUG_NAMES.refill = "뚜니핑 무한리필(삭제됨)";
  AUG_NAMES.ghost = "유령화(삭제됨)";
  AUG_NAMES.subs = "뚜니핑 정기구독(삭제됨)";
  const JOB_NAMES = { none: "쉬었음 청년", fortune: "점술가", gambler: "도박사", levitator: "부양사", fit: "헬스걸", powerj: "파워J", powerp: "무소유", powerp2: "파워P", bangul: "방울이", "(none)": "(기록 없음)" };
  const devScreen = document.getElementById("devScreen");
  const devPw     = document.getElementById("devPw");
  const devBody   = document.getElementById("devBody");
  const devMsg    = document.getElementById("devMsg");

  function devRow(cells, tag) {
    const tr = document.createElement("tr");
    for (const c of cells) {
      const td = document.createElement(tag || "td");
      if (typeof c === "object") { td.textContent = c.t; td.className = c.c || ""; }
      else td.textContent = c;
      tr.appendChild(td);
    }
    return tr;
  }
  function devSection(title, head, rows) {
    const box = document.createElement("div");
    box.className = "sec";
    const h = document.createElement("h4");
    h.textContent = title;
    box.appendChild(h);
    const tb = document.createElement("table");
    if (head) tb.appendChild(devRow(head, "th"));
    for (const r of rows) tb.appendChild(devRow(r));
    box.appendChild(tb);
    return box;
  }

  // {star50:2, lucky:1} → "별빛 증폭 x2, 행운"
  function augLabel(augs) {
    const keys = Object.keys(augs || {});
    if (!keys.length) return "-";
    return keys.map(k => (AUG_NAMES[k] || k) + (augs[k] > 1 ? " x" + augs[k] : "")).join(", ");
  }

  /* 평균 코인 한 칸 — 몇 판에서 잰 값인지 같이 보여준다.
     기록이 아직 없으면(예전 판에는 코인 칸이 없다) 줄만 남기고 비운다. */
  function coinCell(avg, runs) {
    if (!runs) return "-";
    return Number(avg || 0).toFixed(2) + "개 (" + runs + "판)";
  }

  function renderDevStats(data) {
    const P = devPanes;
    const su = data.summary || {};
    P.sum.appendChild(devSection("전체 요약", null, [
      ["총 플레이", { t: (su.runs || 0) + "판", c: "num" }],
      ["평균 점수", { t: Number(su.avg_score || 0).toLocaleString(), c: "num" }],
      ["최고 점수", { t: Number(su.max_score || 0).toLocaleString(), c: "num" }],
      ["평균 생존", { t: (su.avg_secs || 0) + "초", c: "num" }],
      ["평균 별 개수", { t: su.avg_stars || 0, c: "num" }],
      /* 코인은 풀소유 판을 따로 뺀다 — 풀소유는 코인이 열다섯 배로 쏟아져
         같이 묶으면 평범한 판의 감각이 묻힌다. */
      ["평균 코인 (풀소유 빼고)", { t: coinCell(su.avg_coins, su.coin_runs), c: "num" }],
      ["평균 코인 (풀소유)", { t: coinCell(su.avg_coins_full, su.coin_runs_full), c: "num" }]
    ]));

    /* 오브젝트별 점수 비중 — 판마다의 비중을 평균 낸 값이라
       점수가 큰 한두 판에 끌려가지 않는다. */
    const srcRows = data.src || [];
    if (srcRows.length) {
      const SRC_LABEL = { star: "별", burst: "별핑별", fever: "뚜니핑",
                          gold: "무지개똥", poop: "똥", time: "생존", spot: "명당" };
      P.sum.appendChild(devSection("오브젝트별 점수 비중 (판마다의 평균)",
        ["오브젝트", "평균 비중", "판수"],
        srcRows.map(r => [
          SRC_LABEL[r.k] || r.k,
          { t: (r.pct || 0) + "%", c: "num" },
          { t: r.runs, c: "num" }
        ])));
    }

    const augs = data.augs || [];
    P.aug.appendChild(devSection("증강별 채택 (판수 순)",
      ["증강", "판수", "중첩", "평균점수"],
      augs.length ? augs.map(a => [
        { t: AUG_NAMES[a.id] || a.id, c: AUG_HIDDEN[a.id] ? "hid" : "" },
        { t: a.picks, c: "num" },
        { t: a.stack, c: "num" },
        { t: Number(a.score || 0).toLocaleString(), c: "num" }
      ]) : [["기록 없음", "", "", ""]]));

  // 버전별 표를 '지금 쓰는 마이너 버전만 자세히, 이전 마이너는 하나로' 묶는다.
  //  예) 현재가 v1.4.xx 면  v1.4.47 · v1.4.46 … 은 그대로 두고,
  //      v1.3.01~99 는 'v1.3' 한 줄로, v1.2.01~99 는 'v1.2' 한 줄로 합친다.
  //  v1.5 가 나오면 v1.4 가 자동으로 묶인다(따로 고칠 필요 없음).
  //  평균생존은 판수로 가중평균해서 합친다(단순 평균은 판수 1판짜리가 과대반영됨).
  //  2026-09 에 번호를 v1.5.97 → v0.6 으로 새로 매겼다. 그래서 v1.x 는 '옛 번호'(더 오래된 판)이고,
  //  숫자 크기가 아니라 시대로 줄을 세운다 — 새 번호(v0.x)가 위, 옛 번호(v1.x)는 맨 아래.
  function groupVers(list) {
    const parse = (t) => {
      const m = /^v?(\d+)\.(\d+)(?:\.(\d+))?/.exec(String(t || ""));
      return m ? { maj: +m[1], min: +m[2], pat: m[3] === undefined ? 999 : +m[3] } : null;
    };
    const oldEra = p => p.maj >= 1;       // 번호를 새로 매기기 전
    const top = parse(GAME_VERSION);      // 지금 쓰는 마이너 버전대 (예: v0.7)
    if (!top) return list;
    const keep = [], bucket = new Map();
    for (const v of list) {
      const p = parse(v.ver);
      if (!p) { keep.push(v); continue; }               // '(없음)' 같은 건 그대로
      if (p.maj === top.maj && p.min === top.min && p.pat !== 999) { keep.push(v); continue; }
      const key = "v" + p.maj + "." + p.min + (oldEra(p) ? " (옛 번호)" : "");
      const b = bucket.get(key) || { ver: key, runs: 0, secs: 0, score: 0, _w: 0 };
      const runs = Number(v.runs) || 0;
      b.runs += runs;
      b._w += runs;
      b.secs += (Number(v.secs) || 0) * runs;           // 가중합
      b.score += (Number(v.score) || 0) * runs;
      bucket.set(key, b);
    }
    for (const b of bucket.values()) {
      b.secs = b._w ? Math.round(b.secs / b._w) : 0;
      b.score = b._w ? Math.round(b.score / b._w) : 0;
      delete b._w;
      keep.push(b);
    }
    const rank = (v) => {
      const p = parse(v.ver);
      if (!p) return -1;
      return (oldEra(p) ? 0 : 1e9) + p.maj * 1e6 + p.min * 1e3 + p.pat;   // 새 번호가 늘 위, 묶음은 그 마이너의 맨 위
    };
    return keep.sort((a, b) => rank(b) - rank(a));
  }

    const vers = groupVers(data.vers || []);
    if (vers.length) {
      P.sum.appendChild(devSection("버전별",
        ["버전", "판수", "평균생존"],
        vers.map(v => [
          v.ver,
          { t: v.runs, c: "num" },
          { t: (v.secs || 0) + "초", c: "num" }
        ])));
    }

    const jb = data.jobs || [];
    if (jb.length) {
      P.sum.appendChild(devSection("직업별",
        ["직업", "판수", "평균점수", "최고점수", "평균생존"],
        jb.map(q => [
          JOB_NAMES[q.job] || q.job,
          { t: q.runs, c: "num" },
          { t: Number(q.avg || 0).toLocaleString(), c: "num" },
          { t: Number(q.best || 0).toLocaleString(), c: "num" },
          { t: (q.secs == null ? "-" : q.secs + "초"), c: "num" }
        ])));
    }

    /* 펫별 — 따로 만든 DB 함수(ddongpi_pet_stats)에서 받는다. 함수가 아직 없으면
       증강 통계에 섞여 있는 'pet:<id>' 줄로 판수·평균점수만이라도 보여 준다. */
    const petBox = document.createElement("div");
    P.sum.appendChild(petBox);
    const petName = id => id === "none" ? "펫 없음" : (PETS[id] ? PETS[id].ic + " " + PETS[id].nm : id);
    const petTable = (rows, note) => {
      petBox.innerHTML = "";
      petBox.appendChild(devSection("펫별" + (note || ""),
        ["펫", "판수", "평균점수", "최고점수", "평균생존"],
        rows.length ? rows.map(q => [
          petName(q.pet),
          { t: q.runs, c: "num" },
          { t: Number(q.avg || 0).toLocaleString(), c: "num" },
          { t: q.best == null ? "-" : Number(q.best).toLocaleString(), c: "num" },
          { t: (q.secs == null ? "-" : q.secs + "초"), c: "num" }
        ]) : [["기록 없음", "", "", "", ""]]));
    };
    const fromAugs = (data.augs || []).filter(a => String(a.id).slice(0, 4) === "pet:")
      .map(a => ({ pet: String(a.id).slice(4), runs: a.picks, avg: a.score, best: null, secs: null }));
    petTable(fromAugs, " (불러오는 중…)");
    (async () => {
      try {
        const res = await fetch(SB_URL + "/rest/v1/rpc/ddongpi_pet_stats", {
          method: "POST",
          headers: sbHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ pw: devPwOK })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        petTable(await res.json());
      } catch (e) {
        petTable(fromAugs, " (최고점수·생존은 DB 함수 실행 후)");
      }
    })();

    /* 최근 판 — 아이템전·노템전을 따로. 모드별 최근 20판은 따로 만든 DB 함수(ddongpi_recent_mode)에서 받고,
       함수가 아직 없으면 요약에 딸려 온 최근 20판을 모드로 갈라 보여 준다. */
    const isNo = r => !!(r.augs && r.augs["mode:noitem"]);
    const isPure = r => !!(r.augs && r.augs["mode:pure"]);
    const recTable = (rows, md, note) => {
      if (md === "item") rows = rows.filter(r => !isPure(r) && !isNo(r));   // 똥대잔치 목록에는 다른 맵 판을 섞지 않는다
      if (md === "pure") rows = rows.filter(isPure);
      const pane = md === "noitem" ? P.nrec : md === "pure" ? P.prec : P.rec;
      pane.innerHTML = "";
      const no = md === "noitem";
      const sec = devSection((md !== "item" ? MODES[md].nm + " " : "") + "최근 " + rows.length + "판" + (note || ""),
        no ? ["이름", "직업", "거리", "생존", "펫·증강"] : ["이름", "직업", "점수", "생존", "증강"],
        rows.length ? rows.map(r => [
          r.name || "-",
          r.job ? (JOB_NAMES[r.job] || r.job) : "-",
          no ? { t: Math.floor((r.secs || 0) / LEVEL_SEC_NOITEM * 100).toLocaleString() + "m", c: "num" }   // 레벨 하나(8초) = 100m
             : { t: Number(r.score || 0).toLocaleString(), c: "num" },
          { t: (r.secs || 0) + "초", c: "num" },
          { t: augLabel(Object.fromEntries(Object.entries(r.augs || {}).filter(([k]) => k.slice(0, 5) !== "mode:"))), c: "lft" }
        ]) : [["기록 없음", "", "", "", ""]]);
      sec.querySelector("table").classList.add("tbRecent");
      pane.appendChild(sec);
    };
    const rec = data.recent || [];
    recTable(rec.filter(r => !isNo(r)), "item", " (불러오는 중…)");
    recTable(rec.filter(isNo), "noitem", " (불러오는 중…)");
    recTable(rec, "pure", " (불러오는 중…)");
    for (const md of ["item", "noitem", "pure"]) (async () => {
      try {
        const res = await fetch(SB_URL + "/rest/v1/rpc/ddongpi_recent_mode", {
          method: "POST",
          headers: sbHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ pw: devPwOK, md: md })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        recTable(await res.json() || [], md);
      } catch (e) {
        recTable(md === "noitem" ? rec.filter(isNo) : rec, md, " (최근 20판 중에서 — DB 함수 실행 전)");
      }
    })();

  }

  let devPwOK = "";          // 인증에 성공한 비밀번호 (삭제할 때 다시 쓴다)

  // 이번 주 기록을 원본 그대로(중복 포함) 불러온다 — 지울 대상을 고르기 위해
  async function devFetchRaw(md) {
    const url = SB_URL + "/rest/v1/" + SB_TABLE +
      "?select=id,name,score,level,created_at" +
      "&created_at=gte." + encodeURIComponent(new Date(weekStartMs(0)).toISOString()) +
      (md && md !== "item" ? "&mode=eq." + md : "&or=(mode.is.null,mode.eq.item)") +
      "&order=score.desc&limit=200";
    const res = await fetch(url, { headers: sbHeaders() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function devDeleteIds(ids, btn, label) {
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const res = await fetch(SB_URL + "/rest/v1/rpc/ddongpi_delete", {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ pw: devPwOK, ids: ids })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await devRenderRaw();        // 목록 새로고침
      refreshBoards();             // 시작·게임오버 화면 순위표도 갱신
    } catch (e) {
      btn.disabled = false;
      btn.textContent = label;
      devMsg.textContent = "삭제하지 못했습니다 (함수 설치 필요)";
    }
  }

  function devDelete(id, btn) {
    if (!confirm("이 기록을 지울까요?")) return;
    devDeleteIds([id], btn, "삭제");
  }

  async function devRenderRaw(md) {
    if (!md) { await devRenderRaw("item"); await devRenderRaw("noitem"); await devRenderRaw("pure"); return; }   // 셋 다 새로
    const no = md === "noitem";
    const secId = md === "noitem" ? "devRawSecN" : md === "pure" ? "devRawSecP" : "devRawSec";
    const old = document.getElementById(secId);
    if (old) old.remove();
    let rows = [];
    try { rows = await devFetchRaw(md); } catch (e) { /* 아래에서 안내 */ }
    const box = devSection((md !== "item" ? MODES[md].nm + " " : "") + "이번 주 기록 (지우기)",
      ["이름", no ? "거리" : "점수", "Lv", ""],
      rows.length ? rows.map(r => [
        r.name,
        { t: Number(r.score || 0).toLocaleString() + (no ? "m" : ""), c: "num" },
        { t: r.level == null ? "-" : r.level, c: "num" },
        { t: "", c: "" }
      ]) : [["기록 없음", "", "", ""]]);
    box.id = secId;
    // 랭킹 탭에 붙인다 (삭제 후 다시 그릴 때도 같은 자리)
    if (rows.length) {                      // 제목 옆에 일괄 삭제 버튼
      const all = document.createElement("button");
      all.className = "del";
      all.style.marginLeft = "8px";
      all.textContent = "전체 " + rows.length + "건 삭제";
      all.addEventListener("click", () => {
        if (!confirm((md !== "item" ? MODES[md].nm + " " : "") + "이번 주 기록 " + rows.length + "건을 모두 지울까요? 되돌릴 수 없습니다.")) return;
        devDeleteIds(rows.map(r => r.id), all, "전체 삭제");
      });
      box.querySelector("h4").appendChild(all);
    }
    // 마지막 칸에 삭제 버튼을 심는다
    const trs = box.querySelectorAll("tr");
    rows.forEach((r, i) => {
      const tr = trs[i + 1];               // 0번은 머리글
      if (!tr) return;
      const btn = document.createElement("button");
      btn.className = "del";
      btn.textContent = "삭제";
      btn.addEventListener("click", () => devDelete(r.id, btn));
      tr.lastChild.appendChild(btn);
    });
    ((no ? devPanes.nrank : md === "pure" ? devPanes.prank : devPanes.rank) || devBody).appendChild(box);
  }

  /* ---------- 개발자 화면 탭 ----------
     섹션이 많아져서 성격별로 묶는다. 탭 버튼을 누르면 해당 판만 보인다. */
  const DEV_TABS = [["요약", "sum"], ["증강", "aug"], ["최근 판", "rec"], ["랭킹", "rank"],
                    ["똥탑 최근 판", "nrec"], ["똥탑 랭킹", "nrank"],
                    ["맨몸 최근 판", "prec"], ["맨몸 랭킹", "prank"]];
  let devPanes = {};
  function devInitTabs() {
    const bar = document.getElementById("devTabs");
    bar.innerHTML = "";
    devBody.innerHTML = "";
    devPanes = {};
    for (const [label, key] of DEV_TABS) {

  const LAST_Z = ZONES.length - 1;
  const BH_Z = LAST_Z;                 // 블랙홀 안 — 마지막 지대
  function inBlackhole() { return zoneIdx() >= BH_Z; }
  /* 다크똥 — 블랙홀에 들어선 뒤로 섞여 떨어진다. 처음 8%, 레벨마다 +6%p, 85%에서 멈춘다.
     폭발·밀림 어느 것도 통하지 않아, 후반에 화력으로 버티는 길을 막는다. */
  // 기존 대비 5% 상향 — 0.08 / 0.06 / 0.85 에 각각 1.05 를 곱했다
  const DARK_BASE = 0.084, DARK_STEP = 0.063, DARK_CAP = 0.8925;
  function darkChance() {
    if (prophIs("dark")) return Math.max(0.3, inBlackhole() ? Math.min(DARK_CAP, DARK_BASE + DARK_STEP * (level - 1 - BH_Z)) : 0);   // 먹구름
    if (!inBlackhole()) return 0;
    return Math.min(DARK_CAP, DARK_BASE + DARK_STEP * (level - 1 - BH_Z));
  }
  function bhMul() { return inBlackhole() ? 2 : 1; }   // 블랙홀 안 점수 배율
  /* 블랙홀 안의 '난이도' 배율 — 점수 배율(2배)과 달리 낙하 속도·똥 수량에만 쓴다.
     속도와 빈도 양쪽에 걸리므로, 우주(SPACE_DIFF)와 같이 제곱근을 나눠 걸어
     둘을 합친 체감이 정확히 BH_DIFF 가 되게 한다 (예전에는 1.5 를 양쪽에 그대로
     걸어 체감이 2.25배였다). */
  const BH_DIFF = 1.5;
  const BH_DIFF_F = Math.sqrt(BH_DIFF);
  function bhDiff() { return inBlackhole() ? BH_DIFF_F : 1; }
  /* 부양사 — 높이 날수록 모든 점수가 커진다. 바닥 +0%, 중간 +50%, 꼭대기 +100%. */
  function levMul() {
    if (job !== "levitator" || !flyOn) return 1;
    const air = Math.max(0, Math.min(1, (groundY - player.y) / Math.max(1, groundY - H * FLY_TOP)));
    return 1 + 1.0 * air;
  }
  /* 무소유 — 증강이 없는 대신, 안 맞고 버틴 시간만큼 배율이 오른다 (초당 +10%, 상한 없음).
     레벨 배수는 곱하지 않는다 — 점수 자체가 이미 레벨에 비례하므로 두 번 세는 셈이 된다.
     목숨을 잃으면 무피격 시간의 1/4 만 깎인다 (우산·방울·회피로 막은 것은 그대로 유지). */
  function monkMul() {
    if (job !== "powerp") return 1;
    return 1 + 0.10 * noHitSec;
  }
  /* 점수 눈금 — 모든 점수가 여기를 지나므로, 이 값만 바꾸면
     항목 사이의 균형은 그대로 두고 자릿수만 키우거나 줄일 수 있다. */
  const SCORE_SCALE = 3;
  /* 똥묻히기 — 지금 오염도에 비례해 점수가 오른다. 0%면 1배, 100%면 2배.
     한 번만 먹는 증강이고, 빗방울로 씻으면 배율도 같이 내려간다.
     (100% 는 곧 끝이라, 실제로 누리는 최대는 75% = 1.75배다) */
  function dungyMul() { return aug.dungy ? 1 + (dirt / DIRT_MAX) : 1; }
  function scoreMul() { return SCORE_SCALE * aug.scoreMul * bhMul() * levMul() * monkMul() * dungyMul() * (prophIs("double") ? 2 : prophIs("dice") ? 3 : 1); }

  function zoneIdx() { return Math.min(LAST_Z, level - 1); }
  // 지금 단계와 다음 단계 사이의 진행도 — 색이 뚝 끊기지 않고 이어지도록
  function zoneFrac() {
    const i = level - 1;
    if (i >= LAST_Z) return 0;
    return Math.max(0, Math.min(1, levelTime / lvSec() - i));
  }
  // 두 단계 사이를 이어 구한 값 (색이면 rgb 문자열, 숫자면 숫자)
  function zv(key, i) {
    const a = ZONES[zoneIdx()], b = ZONES[Math.min(LAST_Z, zoneIdx() + 1)], f = zoneFrac();
    if (i === undefined) return (a[key] || 0) + ((b[key] || 0) - (a[key] || 0)) * f;
    const ca = a.sky[i], cb = b.sky[i];
    return "rgb(" + Math.round(ca[0] + (cb[0] - ca[0]) * f) + ","
                  + Math.round(ca[1] + (cb[1] - ca[1]) * f) + ","
                  + Math.round(ca[2] + (cb[2] - ca[2]) * f) + ")";
  }
  function skyColor(i) { return zv(null, i); }

  /* 올라갈수록 드러나는 별. 위치는 매판 고정이고 반짝임만 움직인다.
     크기·밝기·색·반짝이는 속도를 제각각으로 흩어 놓아야 하늘처럼 보인다. */
  const STARS = [];
  for (let i = 0; i < 120; i++) {
    const t = (i % 9) / 8;
    STARS.push({
      fx: (i * 0.6180339887) % 1,
      fy: ((i * 0.7548776662) % 1) * 0.94,
      r: 0.45 + t * t * 2.1,                       // 대부분 작고 가끔 크다
      ph: i * 1.7,
      sp: 620 + (i % 7) * 320,                     // 반짝이는 주기도 제각각
      dim: 0.35 + ((i * 37) % 100) / 155,          // 별마다 기본 밝기가 다르다
      col: (i % 19 === 0) ? "255,226,180"          // 드물게 노란 별
         : (i % 11 === 0) ? "200,220,255"          // 드물게 푸른 별
         : "255,255,255",
      // 대부분은 점, 가끔 네 갈래 반짝이, 아주 드물게 빛살이 뻗는 큰 별
      kind: (i % 24 === 0) ? 2 : (i % 5 === 0) ? 1 : 0
    });
  }
  /* 배경 그림 한 장 — 비율을 지킨 채 화면을 덮도록 키워서 가운데 맞춘다.
     기기마다 세로 비율이 달라서, 남는 쪽은 잘려 나간다. */
  /* 배경은 위에서 아래로만 흐른다 — 그래야 주인공이 계속 올라가는 것처럼 보인다.
     그림은 화면보다 세로로 길어 위아래가 잘려 있고, prog 0 일 때 그 여유분의
     맨 위(그림의 아래쪽이 보이는 자리)에서 시작해 1 일 때 맨 아래까지 내려온다.
     되돌아가는 지점은 지대가 바뀌며 두 그림이 겹쳐 녹는 순간이라 보이지 않는다. */
  const ZONE_FADE = 0.5;   // 다음 지대 그림이 겹쳐 오르는 구간 — 레벨의 뒤 절반
  function drawZoneImg(im, a, prog) {
    if (!im || a <= 0.004) return;
    const sc = Math.max(W / im.width, H / im.height);
    const dw = im.width * sc, dh = im.height * sc;
    const amp = Math.min(Math.max(0, dh - H) / 2, 130);
    const pg = Math.max(0, Math.min(1, prog || 0));
    const dy = (H - dh) / 2 - amp + 2 * amp * pg;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(im, (W - dw) / 2, dy, dw, dh);
    ctx.restore();
  }

  /* ---------- 제작사 스플래시 ----------
     대기화면 앞에 2.8초. 루도로 만든 로고가 통 튀어 오른다.
     화면을 누르면 바로 건너뛴다. 이 동안에는 게임도 배경음악도 시작하지 않는다. */
  const SPLASH_SEC = 2.8;
  let splashT = 0, splashOn = SPLASH_USE, studioImg = null, splashRang = false;
  /* 인트로 소리 — 효과음 꾸러미와 따로 두는 이유는 스플래시가 뜨는 순간
     아직 그 꾸러미를 다 받지 못했기 때문이다. 오디오 요소는 바로 틀 수 있다.
     브라우저는 화면을 한 번 만지기 전에는 소리를 막으므로, 막히면 조용히 넘어간다. */
  const introSnd = new Audio("assets/sfx/intro.mp3");
  introSnd.preload = SPLASH_USE ? "auto" : "none";
  introSnd.volume = 0.5;
  if (SPLASH_USE) {
    const t = new Image();
    t.onload = () => { studioImg = t; };
    t.onerror = () => { splashOn = false; };   // 못 받으면 그냥 건너뛴다
    t.src = "assets/studio.webp";
  }
  function endSplash() {
    if (!splashOn) return;
    splashOn = false;
    try { introSnd.pause(); } catch (e) {}   // 건너뛰면 소리도 함께 멈춘다
    startScreen.style.visibility = "";
  }
  const SPLASH_FALL = 0.40;                 // 떨어지는 데 걸리는 시간
  const SPLASH_SHINE = SPLASH_FALL + 0.34;  // 빛줄기가 지나가기 시작하는 때
  const SPLASH_SHINE_DUR = 0.52;
  let splashBits = [], splashLanded = false, shineCv = null, shineCx = null;

  /* 글자 안에서만 빛나는 빛줄기 — 로고를 딴 판에 그린 뒤 그 위에 흰 띠를
     source-atop 으로 얹으면 글자 바깥으로 새어 나가지 않는다. */
  function shineImage(k) {
    if (!shineCv) {
      shineCv = document.createElement("canvas");
      shineCv.width = studioImg.width; shineCv.height = studioImg.height;
      shineCx = shineCv.getContext("2d");
    }
    const w = shineCv.width, h = shineCv.height;
    shineCx.setTransform(1, 0, 0, 1, 0, 0);
    shineCx.clearRect(0, 0, w, h);
    shineCx.globalCompositeOperation = "source-over";
    shineCx.drawImage(studioImg, 0, 0);
    shineCx.globalCompositeOperation = "source-atop";
    const bw = w * 0.30;                     // 띠 너비
    const x = -bw + k * (w + bw * 2);
    shineCx.save();
    shineCx.translate(x, h / 2);
    shineCx.rotate(-0.32);                   // 비스듬히 지나간다
    const g = shineCx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.5, "rgba(255,255,255,.78)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    shineCx.fillStyle = g;
    shineCx.fillRect(-bw / 2, -h * 1.4, bw, h * 2.8);
    shineCx.restore();
    shineCx.globalCompositeOperation = "source-over";
    return shineCv;
  }

  function drawSplash(dt) {
    if (!splashRang) {
      splashRang = true;
      if (!sfxOff) { const pr = introSnd.play(); if (pr && pr.catch) pr.catch(() => {}); }
    }
    splashT += dt;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b0f1c");
    g.addColorStop(1, "#141a2e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const cy = H * 0.44;
    const after = splashT - SPLASH_FALL;      // 착지하고 나서 흐른 시간
    const fade = Math.min(1, splashT / 0.18) * Math.min(1, (SPLASH_SEC - splashT) / 0.45);

    /* 착지하는 순간 딱 한 번 — 별가루를 흩뿌린다 */
    if (!splashLanded && after >= 0) {
      splashLanded = true;
      const TONE = ["#ffd23f", "#35f0ff", "#ff6ab0", "#ffffff", "#9fd8ff"];
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * 6.283 + Math.random() * 0.35;
        const sp = 170 + Math.random() * 330;
        splashBits.push({ x: W / 2, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.62 - 90,
                          r: 2.4 + Math.random() * 4.2, rot: Math.random() * 6.283,
                          vr: (Math.random() - .5) * 14, life: 0.75 + Math.random() * 0.5, t: 0,
                          c: TONE[Math.floor(Math.random() * TONE.length)] });
      }
    }

    /* 떨어지는 동안엔 크고 기울어 있다가, 착지하면 가로로 눌렸다가 튕겨 오른다.
       (감쇠 진동이라 두어 번 출렁이고 저절로 멎는다) */
    let sx = 1, sy = 1, rot = 0, dy = 0, alpha = 1;
    if (after < 0) {
      const k = Math.max(0, splashT / SPLASH_FALL), e = k * k;   // 점점 빨라지며 내리꽂힌다
      sx = sy = 1.95 - 0.95 * e;
      rot = -0.26 * (1 - e);
      dy = -H * 0.40 * (1 - e);
      alpha = Math.min(1, k * 2.4);
    } else {
      const d = Math.exp(-after * 8.5);
      const w = Math.cos(after * 21);
      sx = 1 + 0.30 * d * w;
      sy = 1 - 0.30 * d * w;
      rot = 0.055 * Math.exp(-after * 6.5) * Math.sin(after * 17);
      dy = -6 * d * w;
      const br = 1 + 0.014 * Math.sin(splashT * 3.4);   // 자리 잡은 뒤의 숨결
      sx *= br; sy *= br;
      rot += 0.014 * Math.sin(splashT * 1.6);
    }
    /* 마지막에는 앞으로 튀어나오면서 사라진다 */
    const out = Math.max(0, (splashT - (SPLASH_SEC - 0.45)) / 0.45);
    if (out > 0) { sx *= 1 + 0.13 * out; sy *= 1 + 0.13 * out; dy -= 20 * out * out; }

    /* 착지 충격 — 화면이 짧게 흔들리고 흰 고리가 퍼진다 */
    let shx = 0, shy = 0;
    if (after >= 0 && after < 0.3) {
      const amp = 11 * Math.exp(-after * 13);
      shx = (Math.random() - .5) * amp; shy = (Math.random() - .5) * amp;
    }
    if (after >= 0 && after < 0.5) {
      const rk = after / 0.5;
      ctx.save();
      ctx.globalAlpha = (1 - rk) * 0.5 * fade;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5 * (1 - rk) + 1;
      ctx.beginPath();
      ctx.ellipse(W / 2, cy, 30 + rk * 250, (30 + rk * 250) * 0.34, 0, 0, 6.283);
      ctx.stroke();
      ctx.restore();
    }
    if (after >= 0 && after < 0.16) {         // 착지 섬광
      ctx.save();
      ctx.globalAlpha = (1 - after / 0.16) * 0.16;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (studioImg) {
      const bw = Math.min(W * 0.86, 360);
      const bh = studioImg.height / studioImg.width * bw;
      const sk = (splashT - SPLASH_SHINE) / SPLASH_SHINE_DUR;
      const img = (sk >= 0 && sk <= 1) ? shineImage(sk) : studioImg;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade) * alpha;
      ctx.translate(W / 2 + shx, cy + dy + shy);
      ctx.rotate(rot);
      ctx.scale(sx, sy);
      ctx.drawImage(img, -bw / 2, -bh / 2, bw, bh);
      ctx.restore();
    }

    /* 튀어 나간 별가루 — 중력을 받아 떨어지며 사라진다 */
    for (let i = splashBits.length - 1; i >= 0; i--) {
      const b = splashBits[i];
      b.t += dt;
      if (b.t >= b.life) { splashBits.splice(i, 1); continue; }
      b.vy += 900 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      const k = 1 - b.t / b.life;
      ctx.save();
      ctx.globalAlpha = k * fade;
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.beginPath();                         // 네 갈래 반짝이
      for (let j = 0; j < 4; j++) {
        const a0 = j * Math.PI / 2;
        ctx.lineTo(Math.cos(a0) * b.r * 2.3, Math.sin(a0) * b.r * 2.3);
        ctx.lineTo(Math.cos(a0 + Math.PI / 4) * b.r * 0.66, Math.sin(a0 + Math.PI / 4) * b.r * 0.66);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (splashT >= SPLASH_SEC) endSplash();
  }

  /* 대기화면 전용 그림 — 이핑이와 방울이가 함께 있는 한 장.
     이 그림은 무지개가 위, 두 캐릭터가 3분의 2 지점, 꽃밭이 아래를 채운다.
     두 캐릭터가 조금 오른쪽에 있어 9px 왼쪽으로 옮긴다.
     1.07배는 그만큼 옮기고도 좌우로 흔들릴(±4px) 자리를 남기는 데 필요한 값이고,
     위를 1.2%만 덜어 무지개를 살리면서 방울이가 시작 버튼 위에 오게 했다.

     그림 한 장이지만 가만히 있지는 않는다. 26초에 걸쳐 아주 천천히 다가갔다 물러나고,
     그 위로 색종이와 반짝임이 흐른다. 확대 폭을 1.5%로 묶은 것은, 위를 맞춰 두었기 때문에
     커진 만큼이 전부 아래로 밀려 발이 잘릴 수 있어서다.
     모두 그때그때 계산해 그리므로 받아 둘 파일은 없다. */
  const TITLE_CONF = ["#ff6b8a", "#ffd23f", "#6ee7ff", "#9be36b", "#c88bff", "#fff1a8"];
  function drawTitleArt(now) {
    const t = now / 1000;
    // 0 에서 1 사이를 왕복하는 아주 느린 물결 — 26초에 한 바퀴
    const breathe = 0.5 - 0.5 * Math.cos(t * (6.2832 / 26));
    const sc = Math.max(W / titleArt.width, H / titleArt.height) * 1.07 * (1 + 0.015 * breathe);
    const dw = titleArt.width * sc, dh = titleArt.height * sc;
    ctx.drawImage(titleArt, (W - dw) / 2 - 9 + Math.sin(t * 0.11) * 4, -dh * 0.012, dw, dh);

    /* 벚꽃잎 — 뱅글 돌며 좌우로 크게 흔들려 떨어진다.
       가로로 눌린 타원을 기울여 그리면 뒤집힐 때마다 도톰해 보인다. */
    for (let i = 0; i < 20; i++) {
      const sp = 22 + (i % 6) * 6;
      const y = ((i * 167 + t * sp) % (H + 90)) - 45;
      const x = ((i * 211 + 43) % W) + Math.sin(t * 0.55 + i * 0.9) * 34;
      const r = 4.6 + (i % 4) * 1.3;
      const spin = t * (0.9 + (i % 5) * 0.3) + i;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(spin);
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = i % 3 === 0 ? "#fff0f5" : (i % 3 === 1 ? "#ffd0e0" : "#ffb7d2");
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * Math.abs(Math.cos(spin * 0.7)) * 0.62 + r * 0.18, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }

    // 색종이 — 좌우로 살랑이며 천천히 내려온다
    for (let i = 0; i < 28; i++) {
      const sp = 17 + (i % 5) * 7;
      const y = ((i * 149 + t * sp) % (H + 80)) - 40;
      const x = ((i * 173) % W) + Math.sin(t * 0.7 + i * 1.3) * 16;
      const w = 5 + (i % 3) * 2;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * (0.5 + (i % 4) * 0.22) + i);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = TITLE_CONF[i % TITLE_CONF.length];
      ctx.fillRect(-w / 2, -w * 0.35, w, w * 0.7);
      ctx.restore();
    }

    // 반짝임 — 제자리에서 커졌다 작아지는 네 갈래 별
    for (let i = 0; i < 20; i++) {
      const ph = (t * 0.55 + i * 0.41) % 1;
      const k = Math.sin(ph * Math.PI);            // 0 에서 1 로 떴다가 다시 0
      if (k <= 0.02) continue;
      const x = (i * 97 + 37) % W;
      const y = (i * 211 + 61) % Math.round(H * 0.72);
      const r = (3.5 + (i % 3) * 2.2) * k;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = 0.85 * k;
      ctx.fillStyle = i % 4 === 0 ? "#fff1a8" : "#ffffff";
      ctx.beginPath();
      ctx.moveTo(0, -r * 2.4); ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.quadraticCurveTo(0, 0, 0, r * 2.4);
      ctx.quadraticCurveTo(0, 0, -r, 0);
      ctx.quadraticCurveTo(0, 0, 0, -r * 2.4);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  /* 타이틀 그림이 오기 전 잠깐 깔아 두는 하늘 — 그림의 색에서 뽑았다.
     이게 없으면 그 사이에 지대 배경과 달리는 인트로가 스쳐 지나간다. */
  function drawTitleWait() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#4aa8e8");
    g.addColorStop(0.62, "#bfe4f7");
    g.addColorStop(1, "#a9d67e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  function drawBackground(now) {
    if (state === STATE.READY) {
      if (titleArt) {
        /* 도착한 직후에는 기다림 하늘 위로 0.3초에 걸쳐 떠오른다 —
           두 하늘의 파랑이 조금 달라 그냥 바꾸면 툭 튄다. */
        const k = Math.min(1, (performance.now() - titleAt) / 300);
        if (k < 1) drawTitleWait();
        ctx.globalAlpha = k;
        drawTitleArt(now);
        ctx.globalAlpha = 1;
        return;
      }
      if (!titleGaveUp) { drawTitleWait(); return; }
    }
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const spaceFever = fever && inSpace();
    if (spaceFever) {                      // 우주에서는 불꽃 대신 워프하는 하늘
      const p = 0.5 + Math.sin(now / 70) * 0.5;
      g.addColorStop(0, "#12002e");
      g.addColorStop(.5, p > .5 ? "#5a1490" : "#7a1aa8");
      g.addColorStop(1, "#d22bb0");
    } else if (fever) {
      const p = 0.5 + Math.sin(now / 70) * 0.5;
      g.addColorStop(0, "#ff5a2e");
      g.addColorStop(.5, p > .5 ? "#ff9d2e" : "#ffb92e");
      g.addColorStop(1, "#ffe08a");
    } else {
      g.addColorStop(0, skyColor(0));
      g.addColorStop(.55, skyColor(1));
      g.addColorStop(1, skyColor(2));
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 지대 배경 그림. 다음 지대로 넘어가는 동안 두 장을 겹쳐 녹여서
       색만 이어지던 때처럼 끊김 없이 바뀐다.
       (뚜니핑 타임에는 불꽃 하늘이 주인공이라 그림을 걷는다) */
    let bgShown = false;
    if (fever) {
      /* 뚜니핑 하늘은 흐르지 않고 가만히 있는다.
         겹쳐 먹으면 시간이 늘어나 남은 시간을 진행도로 쓸 수 없어 시계로 흘렸는데,
         그러면 한 바퀴 돌 때마다 그림이 260px 씩 되감겨 튀면서 경계처럼 보였다. */
      const fsky = spaceFever ? feverSkySpace : feverSky;
      drawZoneImg(fsky, 1, 0.5);
      bgShown = !!fsky;
    } else {
      const i0 = zoneIdx(), i1 = Math.min(LAST_Z, i0 + 1);
      /* 그 지대 안에서의 진행도가 곧 배경이 내려온 정도다.
         마지막 지대는 진행도가 늘 0 이라 다 내려온 자리에서 멈춘다 —
         되감으면 뚜니핑 하늘과 같은 이유로 튄다.
         시작화면에서는 아예 흐르지 않는다. 아무것도 안 하고 보고 있는데
         배경만 계속 내려오면 어지럽다. 지대가 겹쳐 녹는 것은 그대로 둔다. */
      const idle = state === STATE.READY;
      /* 레벨이 바뀔 때 멈칫하지 않게 — 예전엔 다음 지대 그림이 레벨 내내 겹쳐 오르는 동안
         멈춰 있다가(진행도 0) 레벨이 바뀌어서야 흐르기 시작했다. 레벨 끝 무렵엔 거의 그 멈춘
         그림만 보여서 배경이 잠깐 서는 것처럼 보였다.
         이제 다음 그림은 레벨의 뒤 절반(ZONE_FADE)에만 겹쳐 오르고, 한 그림은 처음 보이기
         시작할 때부터 다음 그림에 다 덮일 때까지(1.5 레벨) 한 번도 서지 않고 이어서 흐른다. */
      const t = levelTime / lvSec();
      const pgOf = k => Math.max(0, Math.min(1, (t - (k - ZONE_FADE)) / (1 + ZONE_FADE)));
      drawZoneImg(ZONE_IMG[i0], 1, idle ? 0.5 : pgOf(i0));
      if (i1 !== i0) {
        const a1 = idle ? zoneFrac() : Math.max(0, Math.min(1, (t - (i1 - ZONE_FADE)) / ZONE_FADE));
        drawZoneImg(ZONE_IMG[i1], a1, idle ? 0.5 : pgOf(i1));
      }
      bgShown = !!ZONE_IMG[i0];
    }

    // 뚜니핑 타임 속도선 — 우주에서는 길게 늘어진 별빛으로
    if (fever) {
      const n = spaceFever ? 26 : 14, len = spaceFever ? 170 : 70;
      ctx.lineWidth = spaceFever ? 2 : 3;
      for (let i = 0; i < n; i++) {
        const x = ((i * 137 + now * 0.05) % (W + 40)) - 20;
        const y = ((i * 311 + now * (spaceFever ? 2.6 : 1.6)) % (H + 260)) - 130;
        ctx.strokeStyle = spaceFever
          ? (i % 5 === 0 ? "rgba(255,190,255,.55)" : "rgba(255,255,255,.55)")
          : "rgba(255,255,255,.35)";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
      }
    }

    if (!fever) {
      const nb = zv("nb"), st = zv("st"), mo = zv("mo"), au = zv("au"),
            ea = zv("ea"), rk = zv("rk"), mt = zv("mt");
      /* 별·성운·달·지구·오로라·소행성·블랙홀은 배경 그림 안에 이미 있다.
         그림이 올라와 있으면 겹쳐 그리지 않는다.
         운석만 남긴다 — 그림은 멈춰 있어서 움직이는 것이 하나는 있어야 한다. */
      if (!bgShown) {
        if (nb > 0.01) drawNebula(nb, now);
        if (st > 0.01) drawStars(st, now);
        const bh = zv("bh"), sw = zv("sw");
        if (sw > 0.01) drawSwirl(sw, now);
        if (bh > 0.01) drawBlackhole(bh, now);
        if (mo > 0.01) drawMoon(mo);
        if (au > 0.01) drawAurora(au, now);
        if (rk > 0.01) drawRocks(rk, now);
        if (ea > 0.01) drawEarth(ea);

    // 구름 — 올라갈수록 옅어지다 사라진다

                     : Math.min(0.80, zv("cl") * 0.62);
    if (cl > 0.02) {
      ctx.fillStyle = "rgba(255,255,255," + cl.toFixed(2) + ")";

        /* 덩이를 한 덩어리로 묶어 한 번에 칠한다.
           따로따로 칠하면 겹친 자리가 진해져서 동그라미 여러 개로 보인다. */
        ctx.beginPath();
        for (const L of c.lobes) {
          ctx.moveTo(c.x + L.dx + L.r, c.y + L.dy);
          ctx.arc(c.x + L.dx, c.y + L.dy, L.r, 0, 6.283);

       배경이 하늘 그림뿐이라 지금 무엇 위에 서 있는지 읽히지 않는다.
       바닥 바로 위에 그 지대의 바닥색을 얇게 깔아 두면 공기가 이어져 보인다. */
    if (bgShown && state !== STATE.READY && !groundless()) {
      const gt2 = GROUND_TINT[ZONES[zoneIdx()].gr];
      if (gt2) {

        gg.addColorStop(0, "rgba(" + gt2 + ",0)");
        gg.addColorStop(1, "rgba(" + gt2 + ",.26)");
        ctx.fillStyle = gg;
        ctx.fillRect(0, gy, W, gh);

    // 발밑 — 단계가 바뀌는 동안 다음 지형이 겹쳐 올라온다
    if (state !== STATE.READY && !groundless()) {   // 인트로·방울이 판에서는 발판 없이 날아간다
      const za = ZONES[zoneIdx()], zb = ZONES[Math.min(LAST_Z, zoneIdx() + 1)], zf = zoneFrac();
      drawGround(za.gr, 1);

  /* ---- 배경 조각들 ---- */
  function drawStars(a, now) {
    for (const st of STARS) {
      const tw = st.dim + (1 - st.dim) * Math.abs(Math.sin(now / st.sp + st.ph));
      const al = a * tw;
      if (al < 0.02) continue;
      const x = st.fx * W, y = st.fy * H;
      ctx.fillStyle = "rgba(" + st.col + "," + al.toFixed(3) + ")";
      if (st.kind === 0) {                         // 평범한 점
        ctx.beginPath();
        ctx.arc(x, y, st.r, 0, 6.283);
        ctx.fill();
      } else {                                     // 네 갈래로 뾰족한 반짝이
        const R = st.r * (st.kind === 2 ? 3.4 : 2.3), k = R * 0.16;
        ctx.beginPath();
        ctx.moveTo(x, y - R);
        ctx.quadraticCurveTo(x + k, y - k, x + R, y);
        ctx.quadraticCurveTo(x + k, y + k, x, y + R);
        ctx.quadraticCurveTo(x - k, y + k, x - R, y);
        ctx.quadraticCurveTo(x - k, y - k, x, y - R);
        ctx.fill();
        if (st.kind === 2) {                       // 큰 것은 빛무리까지
          const gg = ctx.createRadialGradient(x, y, 0, x, y, R * 1.5);
          gg.addColorStop(0, "rgba(" + st.col + "," + (al * 0.30).toFixed(3) + ")");
          gg.addColorStop(1, "rgba(" + st.col + ",0)");
          ctx.fillStyle = gg;
          ctx.beginPath(); ctx.arc(x, y, R * 1.5, 0, 6.283); ctx.fill();
        }
      }
    }
  }

  function drawNebula(a, now) {           // 은하수 — 커다란 색 얼룩 몇 개
    const blobs = [[0.28, 0.24, "255,120,220"], [0.74, 0.40, "120,150,255"], [0.48, 0.66, "180,110,255"]];
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i];
      const cx = b[0] * W + Math.sin(now / 9000 + i) * 18;
      const cy = b[1] * H + Math.cos(now / 11000 + i) * 14;
      const r = W * (0.42 + i * 0.06);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, "rgba(" + b[2] + "," + (a * 0.14).toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + b[2] + ",0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawBlackhole(a, now) {        // 다가갈수록 커지는 블랙홀
    const cx = W * 0.5, cy = H * 0.30;
    let R = Math.min(W, H) * (0.05 + a * a * 0.52);
    /* 마지막 단계에서는 지평선이 화면을 통째로 삼켜서 완전한 암흑이 된다.
       화면 구석까지 닿는 반지름을 구해 그보다 크게 잡는다. */
    if (a >= 1.3) {
      const need = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 10;
      R = Math.max(R, need);
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.26);
    for (let i = 0; i < 3; i++) {         // 강착원반 — 납작하게 누운 불의 고리
      const rr = R * (1.30 + i * 0.34);
      const g = ctx.createRadialGradient(0, 0, R * 0.98, 0, 0, rr);
      g.addColorStop(0, "rgba(255,186,90," + (0.42 * a).toFixed(3) + ")");
      g.addColorStop(0.5, "rgba(255,96,40," + (0.20 * a).toFixed(3) + ")");
      g.addColorStop(1, "rgba(120,16,60,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, 0, rr, rr * (0.30 + i * 0.05), 0, 0, 6.283);
      ctx.fill();

    ctx.restore();
    ctx.strokeStyle = "rgba(255,222,158," + (0.8 * a).toFixed(3) + ")";   // 빛이 휘는 고리
    ctx.lineWidth = Math.max(1.5, R * 0.05);

    ctx.fillStyle = "#000";                                              // 사건의 지평선

  function drawSwirl(a, now) {            // 블랙홀 안 — 빨려 들어가는 빛줄기
    const cx = W * 0.5, cy = H * 0.30, far = Math.max(W, H);
    ctx.save();
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (let i = 0; i < 30; i++) {
      const r0 = 60 + ((i * 137 + now * 0.16) % (far * 1.05));
      const r1 = r0 * 0.74;
      const ang = i * 0.71 + now / 1400 + r0 * 0.004;
      const fade = a * Math.max(0, 1 - r0 / far) * 0.65;
      if (fade < 0.02) continue;
      ctx.strokeStyle = "rgba(255," + (130 + (i % 5) * 24) + ",90," + fade.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0 * 0.72);
      ctx.lineTo(cx + Math.cos(ang + 0.40) * r1, cy + Math.sin(ang + 0.40) * r1 * 0.72);
      ctx.stroke();

  function drawMoon(a) {                  // 달 궤도 — 크게 떠 있는 달
    ctx.globalAlpha = a;
    const cx = W * 0.74, cy = H * 0.20, r = Math.min(W, H) * 0.15;
    ctx.fillStyle = "rgba(255,245,220,.10)";
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#ded8c8";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(160,152,136,.55)";

    for (const c of cr) {
      ctx.beginPath();
      ctx.arc(cx + c[0] * r, cy + c[1] * r, c[2] * r, 0, 6.283);
      ctx.fill();
    }

  }

  function drawAurora(a, now) {           // 흐르는 오로라 커튼
    for (let b = 0; b < 3; b++) {
      const base = H * 0.13 + b * 30;
      const g = ctx.createLinearGradient(0, base, 0, base + 96);
      const col = b === 1 ? "120,255,190" : "160,130,255";
      g.addColorStop(0, "rgba(" + col + "," + (a * 0.24).toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + col + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-20, base);
      for (let x = -20; x <= W + 20; x += 20) ctx.lineTo(x, base + Math.sin(x / 90 + now / 1500 + b * 2) * 24);
      for (let x = W + 20; x >= -20; x -= 20) ctx.lineTo(x, base + 96 + Math.sin(x / 90 + now / 1500 + b * 2) * 24);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawMeteors(a, now) {          // 스쳐 가는 별똥별 — 밝은 머리에 꼬리가 옅어진다
    ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const T = ((now / 1000) + i * 0.83) % 3.4;
      if (T > 1.15) continue;
      const q = T / 1.15;
      const fade = Math.sin(Math.PI * q);          // 스르르 나타났다 스르르 사라진다
      if (fade < 0.03) continue;
      const vx = W * (0.34 + (i % 3) * 0.16), vy = H * (0.62 + (i % 2) * 0.22);
      const d = Math.hypot(vx, vy);
      const hx = ((i * 151) % Math.max(1, W)) + q * vx;   // 머리 위치
      const hy = -60 + q * vy;
      const len = 86 + (i % 3) * 52;                      // 꼬리는 날아온 쪽으로 눕는다
      const tx = hx - vx / d * len, ty = hy - vy / d * len;
      const g = ctx.createLinearGradient(hx, hy, tx, ty);
      g.addColorStop(0, "rgba(255,255,255," + (a * fade * 0.92).toFixed(3) + ")");
      g.addColorStop(0.30, "rgba(206,228,255," + (a * fade * 0.34).toFixed(3) + ")");
      g.addColorStop(1, "rgba(170,200,255,0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(hx, hy); ctx.lineTo(tx, ty);
      ctx.stroke();
      const gh = ctx.createRadialGradient(hx, hy, 0, hx, hy, 8);
      gh.addColorStop(0, "rgba(255,255,255," + (a * fade).toFixed(3) + ")");
      gh.addColorStop(0.4, "rgba(220,235,255," + (a * fade * 0.35).toFixed(3) + ")");
      gh.addColorStop(1, "rgba(200,225,255,0)");
      ctx.fillStyle = gh;
      ctx.beginPath(); ctx.arc(hx, hy, 8, 0, 6.283); ctx.fill();
    }

  }

  function drawRocks(a, now) {            // 소행성대 — 천천히 흘러가는 바위
    for (let i = 0; i < 7; i++) {
      const y = (((now * 0.014 * (1 + (i % 3))) + i * 137) % (H + 140)) - 70;
      const x = (i * 97 + 40) % Math.max(1, W);
      const r = 7 + (i % 4) * 5;
      ctx.fillStyle = "rgba(120,124,142," + (a * 0.75).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(80,84,100," + (a * 0.7).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(x + r * .3, y + r * .25, r * .4, 0, 6.283); ctx.fill();
    }
  }

  function drawEarth(a) {                 // 저궤도 — 발밑에 걸린 지구의 곡선
    ctx.globalAlpha = a;
    const R = W * 1.55, cy = H - GROUND_H + R - 30;
    ctx.fillStyle = "rgba(150,210,255,.28)";
    ctx.beginPath(); ctx.arc(W / 2, cy, R + 12, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#2f6bb5";
    ctx.beginPath(); ctx.arc(W / 2, cy, R, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.30)";
    const cl = [[-.30, .06], [.12, .02], [.40, .10]];
    for (const c of cl) {
      ctx.beginPath();
      ctx.ellipse(W / 2 + c[0] * W, cy - R + 14 + c[1] * 40, W * .18, 9, 0, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
