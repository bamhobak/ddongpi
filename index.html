      vy = sp * Math.cos(forceAng || 0);
      pvx = sp * Math.sin(forceAng || 0);
    }
    items.push({
      type: "poop", emoji: "💩",
      x: px, y: -r - 10,
      r: r * (special === "huge" ? 0.70 : 0.82),
      vx: pvx,
      vy: vy,
      /* 회전 대신 살랑인다. 시작 각도는 ±90도 안에서 제각각이고,
         거기서 ±12도씩 천천히 오간다 (레이저는 예고선을 따라야 해서 고정). */
      rot: special === "laser" ? 0 : (Math.random() - Math.random()) * 1.571,
      vr: 0,
      swayA: special === "laser" ? 0 : 0.14 + Math.random() * 0.07,   // 흔들 폭 (약 8~12도)
      swayW: 1.1 + Math.random() * 1.1,                               // 흔드는 속도
      swayP: Math.random() * 6.28,
      size: r * 2, sz: r, fast: m > 1,
      skin: inFever ? "fever" : "poop",
      space: inSpace(),
      gold: gold,
      dark: dark,                            // 폭발·밀림이 통하지 않는다
      special: special || null,
      bumpCd: 0,                             // 정연핑과 부딪힌 직후의 무반응 시간
      phase: Math.random() * 6.28,
      splitAt: H * (lerp(0.10, 0.14, sk) + Math.random() * lerp(0.12, 0.20, sk)),   // 분열똥이 쪼개지는 높이 — 처음엔 더 위에서(피할 틈이 넉넉)
      sk: sk,                                // 특수똥의 독한 정도 (태어날 때 레벨로)
      sz0: 0,
      face: randFace(),                      // 표정 장식 (0~1은 기본 얼굴)
      eye: randEye(), mouth: randMouth(),    // 눈·입 변형
      gain: cls ? cls.score : 0,
      giant: !!(cls && cls.giant)
    });
    // 코인은 평범한 똥에만 덤으로 붙는다 — 뚜니핑 낙하물에는 안 붙는다
    if (!inFever) coinDebt += coinRatio();
    /* 리듬 실험 — 뚜니핑 타임은 초당 수십 개가 쏟아져 박자에 몰아넣으면
       한 자리에 뭉쳐 버리므로 건드리지 않는다. */
    if (!inFever) snapArrival(items[items.length - 1]);
  }
  /* 방금 나온 똥의 낙하 속도를 살짝 비틀어, 캐릭터 머리 높이에 닿는 순간이
     가장 가까운 박(또는 반 박)에 얹히게 한다.

     게임은 하나도 안 바꾼다 — 개수도 크기도 특수똥도 그대로고, 속도만 조금
     달라진다. 속도를 15% 넘게 바꿔야 맞출 수 있는 경우에는 아예 손대지 않는다
     (난이도를 흔드느니 그 한 개는 박자에서 빠지는 편이 낫다).
     레이저똥은 예고선을 따라야 하므로 vx 도 같은 배율로 곱한다. */
  const SNAP_LIMIT = 0.15;
  function snapArrival(it) {
    if (!rhythmActive() || !bgmCur || !bgmName) return;
    const bpm = BGM_BPM[bgmName];
    if (!bpm || it.vy <= 0) return;
    const off = BGM_OFF[bgmName] || 0, beat = 60 / bpm;
    const dist = (player.y + player.hy) - it.y;
    if (dist <= 0) return;
    const travel = dist / it.vy;
    const songT = bgmCur.currentTime;
    for (const grid of [beat, beat / 2, beat / 4]) {
      const k = Math.round((songT + travel - off) / grid);
      const want = off + k * grid - songT;
      const f = travel / want;
      if (want > 0.05 && f > 1 - SNAP_LIMIT && f < 1 + SNAP_LIMIT) {
        it.vy *= f; it.vx *= f;
        it.snapped = true;
        return;
      }
    }
  }


  /* 박자마다 화면이 한 번 뛴다 (소리를 껐을 때도 박자가 보이도록) */
  function rhythmTick() {
    if (!rhythmActive() || !bgmCur || !bgmName) return;
    const bpm = BGM_BPM[bgmName];
    if (!bpm) return;
    const period = 60 / bpm, off = BGM_OFF[bgmName] || 0;
    const ph = ((bgmCur.currentTime - off) / period) % 1;
    if (ph < 0.5) beatPulse = Math.max(beatPulse, 1 - ph / 0.5);
  }

  /* w 는 등장 빈도에 그대로 비례한다 (간격 = 기준값 ÷ (w / 204)).
     아래는 전체를 10% 올리고, 하트·우산만 20% 올린 값이다. */
  const BONUS = [
    { type: "moon",     emoji: "🌙", w: 92.4 },  // 84 x1.1 — 증강 선택, 가장 자주 나온다
    { type: "fullmoon", emoji: "🌕", w: 6.6 },   // 6 x1.1 — 증강 3연속. 초승달의 10%
    { type: "paper",    emoji: "🧻", w: 27.17 }, // 26 x1.1 후 5% 하향
    { type: "umbrella", emoji: "☂️", w: 26.4 },  // 22 x1.2
    { type: "star",     emoji: "⭐", w: 72.52 }, // 69.4 x1.1 후 5% 하향
    { type: "heart",    emoji: "❤️", w: 28.8 },  // 24 x1.2 (방울이는 빗방울로 바뀐다)
    /* 엄마의 밥상 — 별과 똑같은 비중. 증강을 먹기 전에는 아예 나오지 않으므로
       다른 아이템의 등장 빈도에는 영향을 주지 않는다 (기준값이 고정이라 더욱 그렇다). */
    { type: "meal",     emoji: "🍚", w: 72.52 }
  ];
  /* 아이템은 종류마다 자기 타이머로 따로 굴러간다.
     각자의 평균 간격 = 기본 10초 ÷ 그 아이템의 비중 → 전체 등장 빈도는 예전과 같지만
     서로 독립이라 운이 맞으면 두세 개가 한꺼번에 쏟아진다. */
  /* 각 아이템의 평균 간격은 이 고정 기준값으로 계산한다.
     실제 가중치 합을 쓰면 별 하나를 올릴 때 다른 아이템까지 덩달아 드물어진다.
     기준을 고정해두면 별은 독립적으로 자주 나오고 나머지는 영향을 받지 않는다. */
  const BONUS_W_TOTAL = 204;
  const BONUS_BASE = 6.82;                // 아이템 전체의 평균 등장 간격(초)

  // 이 아이템이 지금 평균 몇 초마다 나오는지 (흔들림을 뺀 값)
  function bonusMean(b) {
    // 엄마의 밥상은 '엄마는 우리 딸 믿어'를 먹기 전에는 영영 오지 않는다
    if (b.type === "meal" && !aug.momMeal) return Infinity;
    /* 레벨은 아이템 등장에 전혀 관여하지 않는다 — 처음부터 끝까지 같은 확률.
       예전에는 레벨이 오를수록 잦아지고(최대 2배), 대신 Lv15부터 달만 뜸해졌다. */
    let mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul;
    if (b.type === "heart" && job === "fit") mean /= 5;  // 헬스걸 — 하트 5배
    if ((b.type === "moon" || b.type === "fullmoon") && job === "powerj") mean /= 1.8;  // 파워J — 달 1.8배
    if (b.type === "star" && job === "powerp") mean /= 1.5;  // 무소유 — 별 1.5배
    return mean;
  }
  /* 다음 하나까지의 시간 — 레벨 1에서 평균의 80~120%, 레벨마다 2%p 씩 벌어진다.
     뒤로 갈수록 언제 올지 읽기 어려워진다. 평균 간격은 그대로라 개수는 변하지 않는다.
     50%에서 멈춘다 (레벨 16). 그 뒤로는 더 벌어지지 않는다.
     (0.4초 하한은 완전히 겹쳐 떨어지는 것만 막는 장치) */
  function bonusSpread() { return Math.min(0.50, 0.20 + 0.02 * (level - 1)); }
  function bonusInterval(b) {
    const w = bonusSpread();
    return Math.max(0.4, bonusMean(b) * (1 - w + Math.random() * 2 * w));
  }
  /* 무엇이 떨어질지 새로 뽑는다. 지금 이 순간의 등장 빈도(= 1 / 평균간격)에 비례하므로
     직업·증강이 걸어 둔 배율이 그대로 살아 있고, 긴 눈으로 본 종류별 비율도 변하지 않는다.
     달라지는 건 '다음에 뭐가 올지 읽히지 않는다'는 것뿐이다. */
  function pickBonus() {
    let tot = 0;
    for (const b of BONUS) tot += 1 / bonusMean(b);
    let n = Math.random() * tot;
    for (const b of BONUS) {
      n -= 1 / bonusMean(b);
      if (n <= 0) return b;
    }
    return BONUS[BONUS.length - 1];
  }
  /* 타이머가 가리킨 것 대신 새로 뽑을 확률 — 레벨 1에서 10%, 레벨마다 1.5%p 씩.
     드물게 나오는 종류는 한 번 건너뛰면 간격이 두 배가 되어, 이 값이 곧 들쭉날쭉함이다.
     비율대로 다시 뽑는 것이라 종류별 등장 비율은 그대로다. 50%에서 멈춘다 (레벨 28). */
  function bonusSwap() { return Math.min(0.50, 0.10 + 0.015 * (level - 1)); }
  function resetBonusTimers() {
    /* 첫 등장까지의 시간. 예전에는 편차가 큰 지수분포라 어떤 판은 별이 한참 안 나왔다.
       평균의 25~85% 사이로만 잡아 매판 초반 흐름이 비슷하게 흘러가도록 했다. */
    for (const b of BONUS) b.t = Math.max(0.4, bonusMean(b) * (0.25 + Math.random() * 0.60));
  }

  function spawnBonus(picked) {
    let pick = picked;
    if ((pick.type === "moon" || pick.type === "fullmoon") && job === "powerp") return;   // 무소유 — 무계획 무증강
    if (pick.type === "umbrella" && job === "fit") {
      pick = BONUS.find(b => b.type === "heart");   // 헬스걸 — 우산 자리에 하트
    }
    /* 방울이 — 하트 자리에 빗방울이 온다. 오염도가 0 이어도 그냥 떨어진다
       (먹어도 아무 일이 없을 뿐, 하트처럼 별로 바뀌지는 않는다). */
    let asDrop = false;
    if (pick.type === "heart" && dirtJob()) asDrop = true;
    if (pick.type === "heart" && !asDrop && lives >= aug.maxLives) {
      pick = BONUS.find(b => b.type === "star");    // 목숨 꽉 차면 별로 대체
    }
    // 0.945 배 — 10% 줄였다가 다시 5% 키운 값 (빗방울은 원래 조금 크다)
    const r = (asDrop ? 24 : 20) * 0.945;
    // 낙하 속도에 변화를 주되, 너무 빠르면 못 먹고 지나가버려서 위쪽을 눌러 잡았다
    const vy = (110 + level * 6) * (H / BASE_H) * (0.6 + Math.random() * 0.5);
    items.push({
      type: asDrop ? "droplet" : pick.type, emoji: asDrop ? "💧" : pick.emoji,
      x: r + Math.random() * (W - r * 2), y: -r - 10,
      r: r,
      vx: (Math.random() - Math.random()) * vy * SPREAD_BONUS,
      vy: vy,
      rot: 0, vr: 0, size: r * 2, bob: Math.random() * 6.28,
      born: elapsed          // 배고픈 정연핑이 몇 초 뒤에 출발할지 재는 기준
    });
  }

  // 점과 선분 사이의 최단 거리
  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay;
    const len2 = vx * vx + vy * vy;
    let t = len2 ? ((px - ax) * vx + (py - ay) * vy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }

  /* 입자 상한 — 증강이 쌓인 후반·대왕 군단처럼 한꺼번에 터질 때 저가 폰이 버벅이지 않게.
     게임 중 프레임 간격을 지켜보다가 45fps 아래로 떨어지면 상한을 스스로 낮추고, 55fps 위로 회복되면 되올린다 */
  const FX_MAX = 420, FX_MIN = 120, FLOAT_MAX = 60;
  let fxCap = FX_MAX, fxDt = 1 / 60;
  function fxTune(dt) {
    if (dt <= 0 || dt > 0.1) return;           // 가려졌다 돌아온 첫 프레임 같은 튀는 값은 뺀다
    fxDt += (dt - fxDt) * 0.05;
    if (fxDt > 1 / 45) fxCap = Math.max(FX_MIN, fxCap - 4);
    else if (fxDt < 1 / 55) fxCap = Math.min(FX_MAX, fxCap + 2);
  }
  function burst(x, y, color, n) {
    n = Math.min(n, fxCap - particles.length);   // 꽉 찼으면 덜 터뜨린다
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, sp = 60 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                       life: .6 + Math.random() * .4, t: 0, c: color, r: 2 + Math.random() * 4 });
    }
  }
  function popText(x, y, text, color, size) {
    if (floats.length >= FLOAT_MAX) floats.shift();   // 글씨도 너무 쌓이면 오래된 것부터
    floats.push({ x, y, text, color, t: 0, life: 1, size: size || 22 });
  }
  /* 점수를 딴 순간은 액수만큼 크게 말한다.
     푼돈은 조용히 떠오르고, 큰돈은 고리가 퍼지면서 화면이 흔들린다. */
  /* gain 은 이제 화면에 적지 않는다 — 글씨 크기·고리·화면 흔들림으로만 크기를 전한다.
     문턱은 똥 한 개 값을 기준으로 잡아 레벨이 올라도 등급이 밀리지 않는다. */
  function popGain(x, y, gain, text, color) {
    const w = gain / Math.max(1, poopGain());
    const tier = w >= 60 ? 2 : w >= 8 ? 1 : 0;
    floats.push({
      x, y, text, color: color || "#ffd23f", t: 0,
      life: [1, 1.15, 1.35][tier], size: [22, 28, 36][tier], tier, pop: 1,
      vx: (Math.random() - Math.random()) * 14
    });
    if (tier >= 1) {
      rings.push({ x, y, t: 0, life: 0.46 + tier * 0.14,
                   r1: 74 + tier * 62, color: color || "#ffd23f" });
      shake = Math.max(shake, 6 + tier * 6);
    }
  }

  /* ---------- 업데이트 ---------- */
  function update(dt, now) {
    /* 인터스텔라 불릿타임 — 캐릭터를 뺀 세상 전부가 이 배율로 느려진다.
       똥·아이템·정연핑·비둘기·분신·미사일·구름과 그것들이 나오는 시계까지 모두 포함.
       점수·레벨 시계와 캐릭터 조작은 dt 그대로라 나만 제 속도로 움직인다. */
    if (grazeFxCd > 0) grazeFxCd -= dt;
    const tsc = (bulletT > 0 && !fever) ? 0.4 : 1;   // 불릿타임 — 세상이 60% 느려진다
    for (const c of clouds) {
      c.x += c.v * dt * tsc;
      if (c.x - c.s > W) {
        c.x = -c.s * 1.6;
        c.y = Math.random() * H * .7;
        c.s = 26 + Math.random() * 64;
        c.v = 4 + Math.random() * 10;
        reshapeCloud(c);                              // 다시 나올 땐 다른 모양으로
      }
    }
    let pw = 0;                                  // 다 탄 입자는 한 번에 걷어 낸다 (splice 를 여러 번 부르지 않게)
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.t += dt; p.vy += 700 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t <= p.life) particles[pw++] = p;
    }
    particles.length = pw;
    if (pw > fxCap) particles.splice(0, pw - fxCap);   // 상한을 넘으면 오래된 것부터
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt; f.y -= 40 * dt; f.x += (f.vx || 0) * dt;
      if (f.t > f.life) floats.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.t += dt;
      if (rg.t > rg.life) rings.splice(i, 1);
    }
    for (let i = bubPops.length - 1; i >= 0; i--) {
      const bp = bubPops[i];
      bp.t += dt;
      if (bp.t > bp.life) bubPops.splice(i, 1);
    }

    /* 점수판 — 한 번에 '똥 몇 개어치'를 벌었는지로 잰다.
       레벨·직업·증강 배율이 똥 한 개 값에도 똑같이 들어가 있으므로,
       판 초반이든 후반이든 같은 크기의 사건에 같은 세기로 튄다.
         똥 하나 = 1 · 무지개똥 ≈ 10 · 별 ≈ 136 · 별핑별 = 부순 개수 x4
       생존 점수는 한 프레임에 0.07 개어치라 문턱을 넘지 못한다. */
    const dScore = score - prevScore;
    const worth = dScore / Math.max(1, poopGain());
    if (worth >= 4) {
      scorePunch = Math.min(1, scorePunch + 0.30 + Math.min(0.70, Math.log10(worth / 4) * 0.62));
    }
    prevScore = score;
    if (scorePunch > 0) scorePunch = Math.max(0, scorePunch - dt * 2.6);
    scoreShown += (score - scoreShown) * Math.min(1, dt * 6);
    if (score - scoreShown < 1) scoreShown = score;      // 마지막 한 자리는 붙여 놓는다
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    if (feverFlash > 0) feverFlash = Math.max(0, feverFlash - dt * 2.5);
    if (lvGlow > 0) lvGlow = Math.max(0, lvGlow - dt * 1.3);
    if (feverBanner > 0) feverBanner = Math.max(0, feverBanner - dt / 1.1);
    if (momMsg > 0 && state === STATE.PLAY) momMsg = Math.max(0, momMsg - dt);
    if (fullBanner > 0 && state === STATE.PLAY) fullBanner = Math.max(0, fullBanner - dt);
    if (fullFx > 0 && state === STATE.PLAY) fullFx = Math.max(0, fullFx - dt);
    // 방울이 — 터진 방울이 다시 맺힌다
    if (job === "bangul" && state === STATE.PLAY && !bubbleOn && !itemsOff()) {   // 맨몸대결·똥탑등반은 방울이 다시 맺히지 않는다
      bubbleT += dt;
      if (bubbleT >= BUBBLE_SEC) {
        bubbleT = 0; bubbleOn = true;
        burst(player.x, player.y + player.hy, "#bfe9ff", 10);
        beep(1180, .09, "sine", .04);
      }
    }

    const wasFever = fever;
    fever = state === STATE.PLAY && now < powerUntil;
    if (state === STATE.PLAY) feverBgm = fever;   // 놀고 있을 때만 새로 쓴다
    if (!wasFever && fever) feverBanner = 1;      // 막 시작했다
    /* 뚜니핑 타임에는 똥이 아예 안 보인다 — 뚜니핑만 쏟아진다.
       켜지는 순간 하늘에 있던 똥을 펑 하고 거두고, 켜져 있는 동안 어디서 생긴 똥이든
       (쪼개진 조각, 예고 중이던 레이저 등) 곧바로 거둔다. 무지개똥은 주우라고 남긴다. */
    if (fever) {
      const pop = !wasFever;
      for (let k = items.length - 1; k >= 0; k--) {
        const q = items[k];
        if (q.type !== "poop" || q.skin === "fever" || q.gold) continue;
        if (pop) burst(q.x, q.y, "#ffe9a8", 6);
        items.splice(k, 1);
      }
      warns.length = 0;
    }
    // 겹쳐 먹어 남은 시간이 한 번 분량을 넘으면 게이지가 넘치므로 1로 묶는다
    feverT = fever ? Math.min(1, (powerUntil - now) / feverDur) : 0;
    // 뚜니핑 타임 끝나는 순간엔 화면이 똥으로 가득 차 있으니 1초 무적으로 숨 돌릴 틈을 준다
    if (wasFever && !fever && state === STATE.PLAY) {
      invUntil = Math.max(invUntil, now + 1500);
      /* 대왕 뚜니핑도 다른 낙하물처럼 그대로 남겨 둔다. 뚜니핑 낙하물은
         타임이 끝나도 피해를 주지 않으니(dmg 판정에서 fever 껍질은 빠진다)
         떠 있는 동안 마저 먹을 수 있다. */
      beep(520, .12, "triangle", .04);          // 무적 — 소리와 함께 캐릭터 둘레에 옅은 빛(drawInvGlow)
    }

    if (state === STATE.READY) {
      /* 타이틀 그림을 쓰는 동안에는 인트로를 돌리지 않는다.
         인트로가 우주복으로 갈아입는 순간 feverFlash 를 켜서 화면이 하얗게 번쩍였다. */
      if (titleArt) { flash = 0; feverFlash = 0; }
      else introUpdate(dt, now);
      return;
    }
    if (dirtShown !== dirt) {              // 막대가 진짜 값을 뒤따라간다
      const gap = dirt - dirtShown;
      const move = Math.max(DIRT_SLIDE, Math.abs(gap) * 5) * dt;
      dirtShown = Math.abs(gap) <= move ? dirt : dirtShown + Math.sign(gap) * move;
    }
    if (state !== STATE.PLAY) return;

    elapsed += dt;
    noHitSec += dt;                          // 안 맞고 버틴 시간 (피격 시 1/4 감소)
    /* 레벨 시계는 뚜니핑 타임 동안 멈춘다. 무적으로 낙하물을 줍는 시간까지
       레벨에 포함되면, 정작 실력으로 버틴 시간이 아닌데도 난이도가 올라간다. */
    if (!fever) levelTime += dt;
    /* 스테이지는 자리가 고정이다 — 한 판 내내 같은 하늘에서 이어진다.
       판마다 다른 자리라 스테이지가 올라갈수록 풍경도 올라간다. */
    level = 1 + Math.floor(levelTime / lvSec());
    if (noItem()) patLevel(level);          // 노템전 — 패턴 이름 · 보스 등장/격파
    if (testMode && lvNow.textContent !== "Lv " + level) lvNow.textContent = "Lv " + level;
    score += sc("생존", dt * 50 * level * aug.timeMul * scoreMul());   // 생존 점수: 초당 50 × 레벨

    // 한 단계 올라설 때마다 어디에 도착했는지 알려준다
    const zi = zoneIdx();
    const lvUp = lvSeen > 0 && level > lvSeen;
    if (level !== lvSeen) lvSeen = level;
    if (lvUp) lvGlow = 1;                    // 레벨이 오를 때마다 테두리가 한 번 반짝인다
    if (lvUp && zi === zoneShown) {          // 지대 글자가 안 뜨는 레벨(마지막 지대 뒤)에는 작은 소리로
      beep(880, .07, "triangle", .035); beep(1320, .09, "triangle", .03);
    }
    if (zi !== zoneShown) {
      if (zoneShown >= 0) {
        popText(W / 2, H * 0.40, ZONES[zi].ic + " " + ZONES[zi].nm, "#cfe4ff", 30);
        beep(760, .1, "sine", .05);
        beep(1140, .14, "sine", .04);
        if (zi === SPACE_Z) {          // 공기가 없는 높이 — 우주복으로 갈아입는다
          popText(W / 2, H * 0.48, "🧑‍🚀 우주복 착용!", "#ffd23f", 26);
          beep(520, .16, "triangle", .05);
        }
        if (zi === BH_Z) {             // 빨려 들어갔다 — 모든 것이 두 배
          popText(W / 2, H * 0.48, "모든 것이 2배!", "#ff8a5c", 28);
          shake = Math.max(shake, 26);
          feverFlash = Math.max(feverFlash, 0.5);
          beep(90, .5, "sawtooth", .07);
          beep(140, .4, "square", .05);
        }
      }
      zoneShown = zi;
    }

    const kSpeed = 560 * spdMul() * dt;
    // 패드는 민 정도만큼 속도가 붙는다 (키보드는 늘 최고 속도)
    const kx = kSpeed * (ctrlMode === "pad" ? padAmpX : 1);
    const ky = kSpeed * (ctrlMode === "pad" ? padAmpY : 1);
    const kd = prophIs("reverse") ? -1 : 1;           // 거꾸로 가는 날 — 좌우가 바뀐다
    if (keys.ArrowLeft  || keys.a || keys.A) player.tx -= kx * kd;
    if (keys.ArrowRight || keys.d || keys.D) player.tx += kx * kd;
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
    if (flyOn) {
      if (keys.ArrowUp   || keys.w || keys.W) player.ty -= ky;
      if (keys.ArrowDown || keys.s || keys.S) player.ty += ky;
      player.ty = Math.max(H * FLY_TOP, Math.min(groundY, player.ty));
    }

    const prev = player.x;
    // 손가락을 반대편에 찍어도 순간이동하지 않도록 최고 속도를 제한한다
    const want = (player.tx - player.x) * Math.min(1, dt * 20);
    const maxStep = PLAYER_MAX_SPEED * spdMul() * dt;
    player.x += Math.max(-maxStep, Math.min(maxStep, want));
    /* ── 방귀 대시 — 돌진하는 동안은 끌기보다 앞선다 ──
       끌기 기준점(drag.px)과 목표(player.tx)를 함께 끌고 가야, 대시가 끝나는 순간
       손가락이 잡고 있던 원래 자리로 확 빨려 돌아가지 않는다. */
    if (dashCd > 0) dashCd -= dt;
    if (dashT > 0) {
      dashT = Math.max(0, dashT - dt);
      const nx = Math.max(player.r, Math.min(W - player.r, player.x + dashDir * (DASH_DIST / DASH_SEC) * dt));
      player.x = nx;
      player.tx = nx;
      if (drag) drag.px = nx;
      burst(player.x - dashDir * 26, player.y + player.hy + 14, "#c7e39a", 3);   // 뒤로 뿜는 방귀 자국
    }
    if (pet === "dove" && state === STATE.PLAY) {
      moveDist += Math.abs(player.x - prev);
      const need = doveEvery();
      if (moveDist >= need) {
        moveDist -= need;
        // 머리 위쪽에서 가장 가까운 똥을 노린다 (없으면 그냥 위로 날아간다)
        const py = player.y + player.hy;
        /* 비둘기 떼 — 한 번에 여러 마리. 같은 똥에 몰리지 않게 이미 노린 똥은 빼고 고른다 */
        const n = 1 + aug.doveFlock, taken = new Set(doves.map(c => c.t));
        for (let m = 0; m < n; m++) {
          const ox = n > 1 ? (m - (n - 1) / 2) * 26 : 0;   // 나란히 퍼져서 날아오른다
          let best = null, bd = -1e9;
          for (const q of items) {
            if (q.type !== "poop" || q.blast || q.dark || taken.has(q)) continue;
            if (q.y > player.y - 40) continue;          // 이미 지나친 똥은 무시
            /* 머리 위 부채꼴 안에서 '가장 멀리 있는' 똥을 노린다.
               바로 앞 똥만 잡으면 금방 터져 버려서 날아가는 맛이 없다. */
            const dy = py - q.y, dx = Math.abs(q.x - player.x - ox);
            if (dx > 90 + dy * 0.75 + (n - 1) * 30) continue;   // 떼가 클수록 부채꼴도 넓게
            const d = dy - dx * 0.35;                   // 높이 있을수록, 옆으로 덜 치우칠수록
            if (d > bd) { bd = d; best = q; }
          }
          if (best) taken.add(best);
          // 몸이 아니라 머리 위쪽에서 날아오른다
          doves.push({ x: player.x + ox, y: py - player.r * hitMul() - 26 - Math.abs(ox) * 0.4,
                       t: best, ph: Math.random() * 6.28 });
        }
        if (!sfx("dove")) { beep(1500, .06, "sine", .035); beep(1900, .07, "sine", .03); }
      }
    }
    if (player.x - prev < -0.25) facing = "left";
    else if (player.x - prev > 0.25) facing = "right";   // 멈춰 있으면 마지막 방향 유지
    player.tilt += (((player.x - prev) / Math.max(dt, .001) / 900) - player.tilt) * Math.min(1, dt * 10);
    player.tilt = Math.max(-.35, Math.min(.35, player.tilt));

    // 위아래 이동 — 가로보다 조금 느리게 따라간다 (붕 뜬 느낌)
    if (flyOn) {
      const wantY = (player.ty - player.y) * Math.min(1, dt * 14);
      const stepY = PLAYER_MAX_SPEED * 0.72 * spdMul() * dt;
      player.y += Math.max(-stepY, Math.min(stepY, wantY));
    } else if (player.y !== groundY) {
      player.y += (groundY - player.y) * Math.min(1, dt * 10);
      if (Math.abs(player.y - groundY) < 0.5) player.y = groundY;
    }

    player.hy = headOffset(currentSprite(now));

    // ---- 레이저똥 예고: 2초를 세고 그 자리에 내리꽂는다 ----
    for (let k = warns.length - 1; k >= 0; k--) {
      const wn = warns[k];
      wn.t -= dt * tsc;
      if (wn.t <= 0) {
        spawnPoop(1, "laser", wn.x, wn.ang, wn.dark);
        beep(180, .16, "sawtooth", .06);
        warns.splice(k, 1);
      }
    }

    // ---- 스테로이드 과다 복용: 약발이 도는 동안 몸이 2배, 똥이 튕겨 나간다 ----
    if (roidT > 0) {
      roidT -= dt;
      if (roidT <= 0) {
        roidT = 0;
        popText(player.x, player.y - 70, "💉 약발 끝", "#ff8f8f", 22);
        beep(300, .12, "sine", .04);
      }
    }

    if (spawnHold > 0) spawnHold -= dt * tsc;
    if (umbBlast) { umbBlast.t -= dt * tsc; if (umbBlast.t <= 0) umbBlast = null; }
    for (let k = sweats.length - 1; k >= 0; k--) {
      const w = sweats[k];
      w.t += dt; w.vy += 900 * dt;
      w.x += w.vx * dt; w.y += w.vy * dt;
      if (w.t >= w.life) sweats.splice(k, 1);
    }
    for (let k = ghosts.length - 1; k >= 0; k--) {
      ghosts[k].t += dt;
      if (ghosts[k].t >= ghosts[k].life) ghosts.splice(k, 1);
    }
    for (let k = wakBooms.length - 1; k >= 0; k--) {
      wakBooms[k].t += dt * tsc;
      if (wakBooms[k].t >= 0.35) wakBooms.splice(k, 1);
    }

    // ---- 인터스텔라: 10초마다 2초씩 세상만 느려진다 (점수 시계는 그대로) ----
    if (aug.inter) {
      if (bulletT > 0) bulletT -= dt;
      else if (!fever) {
        interTimer -= dt;
        if (interTimer <= 0) {
          interTimer = 8; bulletT = 2;
          popText(W / 2, H * 0.35, "🕰️ 인터스텔라", "#9fd4ff", 26);
          beep(320, .14, "sine", .05);
          beep(210, .2, "sine", .05);
        }
      }
    }

    // ---- 벼랑 끝 분신술: 작은 이재가 가장 가까운 똥에게 날아가 자폭한다 ----
    if (aug.clone) {
      cloneTimer -= dt * tsc;
      if (cloneTimer <= 0) {
        let best = null, bd = 1e9;
        const py = player.y + player.hy;
        for (const q of items) {
          if (q.type !== "poop" || q.dark) continue;   // 무지개똥·특수똥도 표적 (다크똥만 제외)
          if (q.y > player.y - 40) continue;          // 이미 지나친 똥은 무시
          /* 머리 위쪽 좁은 부채꼴 안에서만 고른다. 옆으로 멀리 날아가면
             분신이 가로로 새는 것처럼 보여서, 가로 거리에 벌점을 준다. */
          const dy = py - q.y, dx = Math.abs(q.x - player.x);
          if (dx > 70 + dy * 0.55) continue;          // 위로 갈수록 조금씩만 넓어진다 (약 29도)
          const d = Math.hypot(dx, dy) + dx * 1.4;
          if (d < bd) { bd = d; best = q; }
        }
        if (best) {
          clones.push({ x: player.x, y: player.y + player.hy, t: best, life: 3 });
          cloneTimer = 1.5;                           // 1.5초마다 한 명 출격
          beep(740, .08, "square", .04);
        } else cloneTimer = 0.5;
      }
    }
    for (let k = clones.length - 1; k >= 0; k--) {
      const c = clones[k];
      c.life -= dt * tsc;
      const alive = items.indexOf(c.t) >= 0;
      const tx2 = alive ? c.t.x : c.x, ty2 = alive ? c.t.y : c.y - 120;
      const dx2 = tx2 - c.x, dy2 = ty2 - c.y, d2 = Math.hypot(dx2, dy2) || 1;
      c.x += dx2 / d2 * 1200 * dt * tsc;
      c.y += dy2 / d2 * 1200 * dt * tsc;
      if ((alive && d2 < (c.t.r || 20) + 16) || c.life <= 0) {
        smashPoopsAround(c.x, c.y, 110, true);        // 폭발 반경 110px (특수똥까지 부순다)
        burst(c.x, c.y, "#ffd23f", 26);
        shake = Math.max(shake, 8);
        if (!sfx("clone")) beep(240, .12, "square", .05);
        clones.splice(k, 1);
      }
    }

      // ---- 갤러그 — 땅에 늘어선 우주선이 저마다 제 주기로 총알을 쏘아 올린다 ----
    if (aug.galaga > 0) {
      /* 우주선마다 제 박자가 있다 — 다 같이 쏘면 여러 대라도 한 발처럼 보인다.
         한 대는 shipGap(n) 마다 쏘되, k 번째는 그 주기를 n 등분한 만큼 늦게 쏜다.
         시계 하나로 재기 때문에 대수가 바뀌어도 박자가 저절로 다시 갈린다. */
      const n = aug.galaga, was = shipClock, gap = shipGap(n);
      shipClock += dt * tsc;
      for (let k = 0; k < n; k++) {
        const ph = gap * k / n;
        if (Math.floor((shipClock - ph) / gap) === Math.floor((was - ph) / gap)) continue;
        bullets.push({ x: shipX(k, n), y: H - GROUND_H * 0.55 - 14, vy: -760 });
        // 소리는 한 바퀴에 한 번만 — 대수만큼 울리면 귀가 아프다
        if (k === 0 && !sfx("galaga")) beep(1250, .05, "square", .03);
      }
    }
    for (let k = bullets.length - 1; k >= 0; k--) {
      const bu = bullets[k];
      bu.y += bu.vy * dt * tsc;
      let hit = false;
      for (let j = items.length - 1; j >= 0; j--) {
        const q = items[j];
        if (q.type !== "poop" || q.blast || q.bounced || q.dark) continue;
        /* 레이저똥은 무엇으로도 건드릴 수 없다 — 총알이 여기서 없어지면 헛방이 되므로
           정연핑이 지나가듯 그냥 스쳐 지나가게 둔다. */
        if (q.special === "laser" && !aug.wak) continue;
        if (Math.hypot(q.x - bu.x, q.y - bu.y) > q.r + 6) continue;
        if (aug.wak && !q.gold && q.skin !== "fever") {
          /* 고무고무노 피스톨 — 부수지 않고 위로 튕겨 올린다. 날아가는 똥은 사람을 해치지 않고,
             처음 부딪히는 똥과 함께 반경 50px 로 터진다 (아래 wak 처리).
             무지개똥·뚜니핑은 튕기면 먹을 기회가 날아가니 예전처럼 그 자리에서 부순다. */
          q.vx = (q.x - bu.x) * 5 + (Math.random() - .5) * 140;
          q.vy = -(520 + Math.random() * 140);      // 0.7~0.9초 뒤 꼭대기, 200px 남짓 오른다
          q.vr = (Math.random() - .5) * 12;
          q.swayA = 0; q.special = null;
          q.bounced = true; q.wak = true;
          burst(bu.x, bu.y, "#ff8a6a", 8);
          if (!sfx("boing")) beep(520, .06, "square", .04);
        } else {
          /* 맞은 똥 하나만. force 를 주지 않아야 정연핑과 똑같이 다룬다 —
             대왕똥은 셋으로 쪼개지고, 분열똥은 그 자리에서 쪼개지고,
             지그재그똥은 방향이 뒤집힌다 (예전에는 전부 통째로 사라졌다). */
          smashPoopsAround(bu.x, bu.y, 8);
          burst(bu.x, bu.y, "#9fe8ff", 10);
          if (aug.chainZap) zapChain(bu.x, bu.y, 2, 120, null, 120);   // 히든 '연쇄 전류' — 가까운(120px 안) 똥 두 개까지만 번진다
        }
        hit = true;
        break;
      }
      if (hit || bu.y < -20) bullets.splice(k, 1);
    }

    // ---- 비둘기 펫 — 목표에 부딪히면 반경 50px 로 터진다 ----
    for (let k = doves.length - 1; k >= 0; k--) {
      const c = doves[k];
      c.ph += dt * tsc * 14;                            // 날갯짓
      /* 표적이 사라지면 위쪽에서 새 표적을 찾는다. 없으면 계속 위로 난다 —
         부딪힐 때까지는 스스로 터지지 않는다. */
      if (items.indexOf(c.t) < 0) {
        let best = null, bd = -1e9;
        for (const q of items) {
          if (q.type !== "poop" || q.blast || q.dark) continue;
          const dy = c.y - q.y, dx = Math.abs(q.x - c.x);
          if (dy < 0) continue;                         // 이미 지나친 똥은 무시
          if (dx > 90 + dy * 0.75) continue;
          const d = dy - dx * 0.35;                     // 멀리(위쪽) 있는 똥을 우선
          if (d > bd) { bd = d; best = q; }
        }
        c.t = best;
      }
      const alive = !!c.t;
      const tx2 = alive ? c.t.x : c.x, ty2 = alive ? c.t.y : c.y - 160;
      const dx2 = tx2 - c.x, dy2 = ty2 - c.y, d2 = Math.hypot(dx2, dy2) || 1;
      const dm = doveMul();
      c.x += dx2 / d2 * 300 * dm * dt * tsc;
      c.y += dy2 / d2 * 300 * dm * dt * tsc;
      /* 표적이 아니어도 가는 길에 닿은 똥이 있으면 그 자리에서 터진다 */
      let bump = false;
      for (const q of items) {
        if (q.type !== "poop" || q.blast || q.dark || q === c.t) continue;
        if (Math.hypot(q.x - c.x, q.y - c.y) < q.r + 14 * dm) { bump = true; break; }
      }
      if (bump || (alive && d2 < (c.t.r || 20) + 14 * dm) || c.y < -40) {
        // 비둘기가 부순 똥은 똥점수 5배
        smashPoopsAround(c.x, c.y, 50 * dm, true, 5);   // 폭발 반경 50px
        burst(c.x, c.y, "#eaf6ff", 18);
        shake = Math.max(shake, 6);
        beep(300, .1, "square", .045);
        doves.splice(k, 1);
      }
    }

    petFollow(dt);
    // ---- 수호천사 — 되살아난 뒤 둘레의 똥을 밖으로 밀어낸다 ----
    if (angelFx > 0) angelFx = Math.max(0, angelFx - dt);
    if (angelAura > 0) {
      angelAura = Math.max(0, angelAura - dt);
      const ax = player.x, ay = player.y + player.hy;
      for (const q of items) {
        if (q.type !== "poop" || q.bounced || q.skin === "fever" || q.gold) continue;
        const dx = q.x - ax, dy = q.y - ay, d = Math.hypot(dx, dy);
        if (d > ANGEL_R + q.r) continue;
        /* 성난 우산처럼 바깥으로 날려 보낸다 — 날아가는 똥은 사람을 해치지 않고,
           내려오던 다른 똥과 부딪히면 둘 다 터진다. 다크똥도 밀려난다(부서지지는 않는다). */
        const ux = d > 1 ? dx / d : (Math.random() - .5), uy = d > 1 ? dy / d : -1;
        const sp = 640;
        q.vx = ux * sp; q.vy = Math.min(uy, -0.35) * sp - 120;
        q.vr = (Math.random() - .5) * 10; q.swayA = 0; q.special = null;
        q.bounced = true; q.blast = true;
        burst(q.x, q.y, "#fff3c4", 6);
        if (Math.random() < .5) beep(980 + Math.random() * 300, .04, "sine", .03);
      }
    }
    // ---- 선물 요정 — 떨어지는 똥에 날아가 펑! 아이템으로 바꾼다 ----
    if (pet === "gift" && state === STATE.PLAY) {
      giftT -= dt * tsc;
      if (giftT <= 0) {
        const busy = new Set(fairies.map(f => f.t));
        let best = null, bd = 1e9;
        for (const q of items) {
          if (q.type !== "poop" || q.dark || q.gold || q.bounced || q.blast || q.skin === "fever" || busy.has(q)) continue;
          if (q.special === "laser" || q.y < H * 0.12 || q.y > H * 0.58) continue;
          const d = Math.abs(q.x - player.x) + Math.abs(q.y - H * 0.35) * 0.4;   // 내 머리 위 쪽 똥부터
          if (d < bd) { bd = d; best = q; }
        }
        if (best) {
          fairies.push({ x: player.x, y: player.y - 70, t: best, st: 0, k: 0, ph: 0 });
          giftT = GIFT_EVERY;
          if (!sfx("helper", 0.6)) beep(1320, .08, "sine", .04);
        } else giftT = 0.5;                  // 마땅한 똥이 없으면 잠깐 뒤 다시 본다
      }
    }
    for (let k = fairies.length - 1; k >= 0; k--) {
      const f = fairies[k];
      f.ph += dt * 18;
      if (f.st === 0) {                      // 날아가는 중
        if (items.indexOf(f.t) < 0 || f.t.bounced) { f.st = 2; continue; }   // 표적이 사라졌다
        const dx = f.t.x - f.x, dy = f.t.y - f.y, d = Math.hypot(dx, dy) || 1;
        const v = 620 * dt;
        if (d <= v + 30) { f.st = 3; f.k = 0; }   // 똥 옆에 붙어 요술봉을 휘두른다
        else { f.x += dx / d * v; f.y += dy / d * v; f.fl = dx > 0; }
      } else if (f.st === 3) {               // 요술 부리는 중 — 똥 옆을 따라다니며 반짝이를 뿌린다
        if (items.indexOf(f.t) < 0 || f.t.bounced) { f.st = 2; f.k = 0; continue; }
        f.k += dt / 0.35;
        f.x = f.t.x - 30; f.y = f.t.y - 22; f.fl = true;
        for (let m = 0; m < 2; m++) {
          const a = Math.random() * 6.283, rr = f.t.r + 6;
          particles.push({ x: f.t.x + Math.cos(a) * rr, y: f.t.y + Math.sin(a) * rr, vx: -Math.cos(a) * 40, vy: -Math.sin(a) * 40,
                           life: .35, t: 0, c: Math.random() < .5 ? "#ffd6f5" : "#fff3a8", r: 1.5 + Math.random() * 2.5 });
        }
        if (f.k >= 1) {
          // 펑! — 똥이 터지고 그 자리에 아이템이 생긴다
          const q = f.t, ix = items.indexOf(q);
          if (ix >= 0) items.splice(ix, 1);
          giftItemAt(q.x, q.y);
          burst(q.x, q.y, "#ffd6f5", 16); burst(q.x, q.y, "#fff3a8", 12); burst(q.x, q.y, "#9fe8ff", 10);
          rings.push({ x: q.x, y: q.y, t: 0, life: 0.45, r1: 70, color: "#ffc2ec" });
          popText(q.x, q.y - 34, "펑!", "#ffc2ec", 20);
          shake = Math.max(shake, 5);
          if (!sfx("burst", 0.8)) { beep(760, .06, "square", .04); beep(1180, .1, "triangle", .04); }
          f.st = 1; f.k = 0;
        }
      } else {                               // 일을 마치고 반짝이며 사라진다
        f.k += dt / (f.st === 1 ? 0.55 : 0.3);
        f.y -= 120 * dt;
        if (f.k >= 1) fairies.splice(k, 1);
      }
    }
    // ---- 코인 고양이 — 위에서 고개를 내밀어 코인을 떨어뜨린다 ----
    if (pet === "coincat" && state === STATE.PLAY) {
      catT -= dt * tsc;
      if (catT <= 0) {
        catT = CAT_EVERY;
        catN++;
        const x = 40 + Math.random() * (W - 80);
        cats.push({ x, t: 0, v: catN % 3 === 0 ? 5 : 1, dropped: false });
      }
    }
    for (let k = cats.length - 1; k >= 0; k--) {
      const c = cats[k];
      c.t += dt;
      if (!c.dropped && c.t >= 0.45) {
        c.dropped = true;
        makeCoinAt(c.x, 70, c.v);
        if (!sfx("coin", 0.7)) beep(1500, .06, "triangle", .04);
      }
      if (c.t >= 1.4) cats.splice(k, 1);
    }
    // ---- 백만볼트 뱀장어 — 가까운 똥에 번개, 옆 똥으로 옮겨붙는다 ----
    if (pet === "eel" && state === STATE.PLAY) {
      eelT -= dt * tsc;
      if (eelT <= 0) {
        const ex = petFx, ey = petFy + petArc() + 4;     // 번개는 뱀장어가 있는 자리에서
        const n = zapChain(ex, ey, EEL_CHAIN, 9999, true);
        eelT = n ? EEL_EVERY : 0.5;          // 똥이 없으면 잠깐 뒤 다시
      }
    }
    for (let k = bolts.length - 1; k >= 0; k--) {
      bolts[k].t += dt;
      if (bolts[k].t >= bolts[k].life) bolts.splice(k, 1);
    }
    // ---- 점술가 — 아이템 없이 10초마다 예언이 저절로 바뀐다 (하나가 끝나면 곧바로 다음 예언) ----
    if (job === "fortune" && state === STATE.PLAY) {
      if (fortuneT > 0) {                    // 판 시작 직후 잠깐 쉬었다가 첫 예언
        fortuneT -= dt;
        if (fortuneT <= 0) startProphecy(now);
      } else {
        prophT = Math.max(0, prophT - dt);
        if (prophIs("coin")) {
          prophRain -= dt;
          if (prophRain <= 0) { spawnCoin(); prophRain = 0.5; }
        }
        if (prophIs("spot")) {
          if (!spotMoved && prophT < PROPH_SEC / 2) { spotX = spotPick(); spotMoved = true; }   // 절반쯤에 한 번 옮겨 간다
          const on = Math.abs(player.x - spotX) < SPOT_HALF;
          spotOn += ((on ? 1 : 0) - spotOn) * Math.min(1, dt * 8);
          if (on) {
            score += sc("명당", dt * 50 * level * aug.timeMul * scoreMul() * SPOT_MUL);
            if (Math.random() < dt * 14) particles.push({ x: player.x + (Math.random() - .5) * 40, y: player.y + player.hy + 20,
              vx: (Math.random() - .5) * 30, vy: -80 - Math.random() * 60, life: .7, t: 0, c: Math.random() < .5 ? "#ffe066" : "#fff6c4", r: 2 + Math.random() * 2 });
          }
        }
        if (prophT <= 0) startProphecy(now);
      }
    }

    // ---- 우산 로켓배송: 방패가 하나도 없을 때만 시간을 재서 하나 배송한다 ----
    if (aug.steelUmb) {
      if (shields <= 0) {
        shieldTimer -= dt * tsc;
        if (shieldTimer <= 0) {
          shieldTimer = UMB_SEC;
          shields = 1;
          popText(player.x, player.y - 60, "☔ 우산 도착!", "#7ec8ff");
          beep(880, .12, "triangle", .05);
        }
      } else {
        shieldTimer = UMB_SEC;
      }
    }

    // ---- 도와줘 정연핑 ----
    if (aug.helper > 0) {
      // 1명이면 4.5초, 2명이면 5.5초, 3명이면 6.5초… 인원이 늘수록 주기가 1초씩 길어진다
      const cycle = 4.0 + 1.0 * aug.helper;   // 3.5 → 4.0, 출격이 조금 뜸해진다
      helperTimer -= dt * tsc;
      if (helperTimer <= 0 && helperQueue <= 0) {
        helperTimer = cycle;
        helperQueue = aug.helper;                 // 이번 차례 출격 인원
        helperGap = 0;                            // 첫 명은 바로
      }
      if (helperQueue > 0) {
        helperGap -= dt * tsc;
        if (helperGap <= 0) {
          // 한 차례 안에서 인원을 고르게 나눠 내보낸다 (2명 = 4초에 2명, 3명 = 5초에 3명)
          helperGap = cycle / aug.helper;
          helperQueue--;
          const fromLeft = Math.random() < 0.5;   // 아래 좌/우에서 비스듬히 솟아오른다
          // 수직에서 8~34도 사이. 너무 눕히면 옆으로 금방 빠져나가서 범위를 좁혔다
          const speed = 744 + Math.random() * 216;   // 기존 620~800 에서 20% 빠르게
          const ang = (8 + Math.random() * 26) * Math.PI / 180;
          helpers.push({
            x: fromLeft ? -30 + Math.random() * (W * 0.45)
                        : W + 30 - Math.random() * (W * 0.45),
            y: H + 60,
            vx: (fromLeft ? 1 : -1) * speed * Math.sin(ang),
            vy: -speed * Math.cos(ang)
          });
          if (!sfx("helper")) {
            beep(760, .12, "triangle", .05);
            beep(1140, .14, "triangle", .04);
          }
        }
      }
    }
    for (let k = helpers.length - 1; k >= 0; k--) {
      const hp = helpers[k];
      hp.x += hp.vx * dt * tsc;
      hp.y += hp.vy * dt * tsc;
      smashPoopsAround(hp.x, hp.y, HELPER_R * helperScale());   // 지나가는 자리의 똥
      if (hp.y < -HELPER_H - 40 || hp.x < -160 || hp.x > W + 160) helpers.splice(k, 1);
    }

    // ---- 배고픈 정연핑: 아이템이 뜨고 3초 뒤에 화면 아래 중앙에서 출발 ----
    /* 배고픈 정연핑 — 한 번에 한 명만 나간다. 아이템이 여럿이라고 우르르 몰려가면
       아이템을 통째로 쓸어가 버려서, 다녀온 뒤 FETCH_REST 만큼 쉬었다 다시 나간다. */
    if (fetchRest > 0) fetchRest -= dt * tsc;
    if (aug.hungry && !fetchers.length && fetchRest <= 0) {
      let pick = null;
      for (const it of items) {                 // 가장 오래 떠 있던 것 하나만
        if (it.type === "poop" || it.claimed) continue;
        if (elapsed - it.born < FETCH_DELAY) continue;
        if (!pick || it.born < pick.born) pick = it;
      }
      if (pick) {
        pick.claimed = true;
        fetchers.push({ x: W / 2, y: H + 50, vx: 0, vy: -FETCH_SPEED, t: pick });
        if (!sfx("fetch")) {
          beep(660, .1, "sine", .05);
          beep(990, .12, "sine", .04);
        }
      }
    }
    for (let k = fetchers.length - 1; k >= 0; k--) {
      const f = fetchers[k];
      const alive = items.indexOf(f.t) >= 0;
      let dx = 0, dy = -1;
      if (alive) { dx = f.t.x - f.x; dy = f.t.y - f.y; }   // 목표가 사라지면 그대로 위로 빠진다
      const d = Math.hypot(dx, dy) || 1;
      f.vx = dx / d * FETCH_SPEED;
      f.vy = dy / d * FETCH_SPEED;
      f.x += f.vx * dt * tsc;
      f.y += f.vy * dt * tsc;
      smashPoopsAround(f.x, f.y, HELPER_R * helperScale());   // 가는 길의 똥도 부순다
      if (alive && Math.hypot(f.t.x - f.x, f.t.y - f.y) < HELPER_R * 0.9) {
        const idx = items.indexOf(f.t);
        if (idx >= 0) items.splice(idx, 1);
        fetchers.splice(k, 1);
        fetchRest = FETCH_REST;
        burst(f.x, f.y, "#ffd23f", 24);
        if (collectItem(f.t, now)) return;    // 달이면 화면이 멈춘다
        continue;
      }
      if (f.y < -HELPER_H * 2 || f.x < -260 || f.x > W + 260) { fetchers.splice(k, 1); fetchRest = FETCH_REST; }
    }

    magNear = 0;                          // 이번 프레임에 가장 세게 끌린 정도
    const powered = now < powerUntil;      // 🔥 뚜니핑 타임

    // 화면이 좁으면 그만큼 똥도 덜 떨어지게(체감 난이도 유지)
    const widthFactor = 480 / W;
    if (rhythmActive()) rhythmTick();
    if (beatPulse > 0) beatPulse = Math.max(0, beatPulse - dt * 4);
    if (noItem()) { patTick(); bossTick(dt); }   // 노템전 — 똥은 공통 패턴대로, 8레벨마다 보스
    else spawnTimer -= dt * tsc;
    if (!noItem() && spawnTimer <= 0) {
      if (powered) {
        // 뚜니핑 타임: 똥이 폭포처럼 쏟아지고 속도도 2배 이상
        const n = 3 + Math.floor(Math.random() * 4);   // 스폰당 3~6개 (평균 4.5개)
        // 증강으로 낙하량이 늘면 화면 상한도 같이 올려야 늘린 만큼이 깎이지 않는다
        const cap = Math.min(280, Math.round(165 / aug.feverRateMul));
        if (items.length < cap) {
          for (let k = 0; k < n; k++) spawnPoop(2.09 + Math.random() * 0.855);
        }
        /* 한 번에 평균 4.5개 → 초당 55개.
           59 로 나누는 것은 아래 widthFactor(480/W) 때문이다 — 실제 캔버스가 446 언저리라
           480 기준으로 계산하면 초당 51개까지 내려간다. 실측으로 맞춘 값.
           '=' 가 아니라 '+=' 인 이유: 넘긴 만큼을 다음 차례로 넘겨야 한 프레임(1/60초)
           단위로 올림되며 새지 않는다. 예전에는 이 손실로 초당 45개까지 내려갔다. */
        spawnTimer += (4.5 / 59) * aug.feverRateMul * widthFactor;
      } else {
        spawnPoop();
        if (level >= 3 && Math.random() < .35) spawnPoop();
        if (level >= 6 && Math.random() < .30) spawnPoop(1.6);   // 초고속 똥
        // 까다로운 똥 — 레벨 7에 아주 드물게 시작해서 레벨마다 조금씩 늘어난다
        if (level >= SPEC_FROM && Math.random() < Math.min(SPEC_CAP, SPEC_BASE + (level - SPEC_FROM) * SPEC_STEP)) {
          const kind = SPECIAL_KINDS[Math.floor(Math.random() * SPECIAL_KINDS.length)];
          if (kind === "huge" && items.some(q => q.special === "huge")) {
            spawnPoop();                  // 이미 하늘에 하나 있으면 평범한 똥으로
          } else if (kind === "laser") {
            // 바로 떨어뜨리지 않고 자리를 먼저 알려준다 (예고는 동시에 여러 개도 가능)
            if (warns.length < Math.round(lerp(1, 3, specK()))) {   // 동시 예고 1개 → 3개
              /* 떨어질 지점을 먼저 정하고, 기울기를 골라 위쪽 진입점을 역산한다.
                 진입점이 화면 밖으로 너무 나가면 기울기를 그만큼 줄인다. */
              const L = H - GROUND_H;
              const tx = 30 + Math.random() * Math.max(1, W - 60);
              const ang = (Math.random() - Math.random()) * 0.62;   // 최대 약 35도
              let ex = tx - Math.tan(ang) * L;
              ex = Math.max(-20, Math.min(W + 20, ex));
              /* 예고 모양을 다크로 바꾸려면 떨어질 똥이 다크인지 지금 정해야 한다 */
              const wt = lerp(1.6, 0.9, specK());     // 예고 1.6초 → 0.9초
              warns.push({ x: ex, ang: Math.atan((tx - ex) / L), t: wt, t0: wt,
                           dark: Math.random() < darkChance() });
              fairNote(elapsed + wt, tx, 20);    // 레이저가 꽂힐 자리도 벽의 일부로 친다
              specIntro("laser");
              if (!sfx("laser")) beep(1500, .06, "sine", .03);
            }
          } else {
            spawnPoop(1, kind);
          }
        }
        spawnTimer = spawnGap() / DIFF_F / spaceF() / bhDiff() * widthFactor * (0.7 + Math.random() * 0.6)
                   / (prophIs("dice") ? 1.5 : 1);        // 운명의 주사위 — 똥 1.5배
      }
    }
    /* 쌓인 몫만큼 코인을 떨어뜨린다. 몫은 똥 하나가 나올 때마다 spawnPoop 에서
       붙는다 (뚜니핑 낙하물은 빼고). 1 이 못 되는 나머지는 다음으로 넘긴다. */
    while (coinDebt >= 1) { spawnCoin(); coinDebt -= 1; }
    if (!powered) {
      for (const b of BONUS) {           // 종류별로 따로 세다가 각자 때가 되면 떨어진다
        b.t -= dt * tsc;
        if (b.t <= 0) {
          if (!itemsOff()) spawnBonus(Math.random() < bonusSwap() ? pickBonus() : b);
          else if (b.type === "meal") spawnBonus(b);     // 노템전 — 쉬었음 청년의 밥상은 직업 능력이라 남긴다
          b.t = bonusInterval(b);
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      /* 별핑별·성난 우산처럼 순회 도중 목록을 무더기로 지우는 일이 있으면
         인덱스가 새 길이를 넘어설 수 있다 — 그 칸은 건너뛴다 (없으면 게임이 멈춘다) */
      if (!it) continue;
      if (it.bumpCd > 0) it.bumpCd -= dt * tsc;
      if (it.special === "split") {
        // 정해진 높이까지 내려오면 둘로 쪼개진다. 조각은 평범한 똥이라 정연핑이 부술 수 있다.
        if (it.y > it.splitAt) {
          const r2 = it.sz * 0.80;          // 조각을 더 크게 (잘 보이게)
          for (const dir of [-1, 1]) {
            /* 좌우로 벌어지는 각도와 속도를 조각마다 따로 뽑는다.
               늘 같은 폭으로 갈라지면 한 번 외우면 끝이라 재미가 없다. */
            const k2 = it.sk === undefined ? 1 : it.sk;
            const ang = dir * (lerp(0.12, 0.22, k2) + Math.random() * Math.random() * lerp(0.3, 0.65, k2));   // 세로 기준 7~24도 → 12~50도
            const sp = it.vy * (0.50 + Math.random() * 0.28);   // 쪼개진 뒤엔 확 느려진다
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: Math.sin(ang) * sp, vy: Math.cos(ang) * sp,
              rot: (Math.random() - Math.random()) * 1.571, vr: 0,
              swayA: 0.14 + Math.random() * 0.07, swayW: 1.1 + Math.random() * 1.1,
              swayP: Math.random() * 6.28,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", space: it.space, special: null, bumpCd: 0, phase: 0, splitAt: 0,
              sz0: 0, face: randFace(), eye: randEye(), mouth: randMouth(), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#c86bff", 20);
          beep(300, .08, "square", .04);
          items.splice(i, 1);
          continue;
        }
      } else if (it.special === "zigzag") {
        // 흔들리는 속도·폭도 '느린 하늘'의 영향을 받는다 (세로만 느려지면 더 촘촘해져서 어색하다)
        const k3 = it.sk === undefined ? 1 : it.sk;
        it.phase += dt * tsc * lerp(2.1, 3.0, k3) * aug.fallMul;          // 처음엔 느긋하게 흔든다
        // 195.5 = 230 의 85% — 처음엔 그 60% 폭으로 시작한다
        it.vx = Math.sin(it.phase) * lerp(117, 195.5, k3) * aug.fallMul;
      }
      const prevX = it.x, prevY = it.y;      // 한 프레임에 크게 움직이면 스쳐 지나갈 수 있다
      /* 주먹에 맞은 똥은 포물선을 그린다 — 올라갔다가 똥밭을 되짚어 내려오며
         부딪힐 기회를 두 번 갖는다. 곧장 위로 날려 보내면 대부분 아무것도 못 만나고 사라졌다. */
      if (it.wak) it.vy += 760 * dt * tsc;
      it.x += it.vx * dt * tsc;
      it.y += it.vy * dt * tsc;
      if (prophIs("wind") && it.type === "poop" && !it.bounced && !it.chart && !it.ring) it.x += prophWind * dt * tsc;   // 옆바람
      if (it.ring && !it.bounced) {         // 고리 — 한가운데로 조여든다
        it.rad -= it.rv * dt * tsc;
        it.x = it.rcx + Math.cos(it.ang) * it.rad;
        it.y = it.rcy + Math.sin(it.ang) * it.rad;
      }
      if (it.chart && !it.bounced) {
        /* 채보 똥 — 위쪽에서 좌우로 휘다가 절반쯤 내려오면 제 칸에 선다 (끝까지 흔들면 읽을 수가 없다) */
        const pr = Math.max(0, Math.min(1, (it.y - it.y0) / (it.yT - it.y0)));
        if (it.diag) {                       // 사선 — 끝까지 같은 비탈로. 머리 높이에서 제 칸을 지나 바닥까지 그대로 흘러간다
          const prU = (it.y - it.y0) / (it.yT - it.y0);
          it.x = it.homeX + it.tilt0 * (1 - prU);
        }
        else {
        const u = Math.max(0, Math.min(1, (0.50 - pr) / 0.35));
        const env = u * u * (3 - 2 * u);
        it.x = it.homeX + env * (it.tilt0 + (it.wvA ? it.wvA * Math.sin(6.2832 * it.wvK * pr) : 0));
        }
      }
      if (it.swayA) {                       // 살랑임 — 처음 각도를 중심으로 오간다
        it.swayP += dt * tsc * it.swayW;
        it.rot = (it.rot0 === undefined ? (it.rot0 = it.rot) : it.rot0) + Math.sin(it.swayP) * it.swayA;
      } else it.rot += it.vr * dt * tsc;
      if (!(it.ring && !it.bounced) && !it.thrown && it.special !== "laser" && (!it.bounced || it.wak)) {   // 레이저·튕긴 똥·고리는 벽에 막히지 않는다 (주먹에 맞은 똥은 벽에 튕긴다)
        if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx); }
        if (it.x > W - it.r) { it.x = W - it.r; it.vx = -Math.abs(it.vx); }
      }
      if (it.bob !== undefined) it.bob += dt * tsc * 4;

      const cy = player.y + player.hy;
      const dx = it.x - player.x, dy = it.y - cy;
      if ((aug.blackhole || job === "levitator") && it.type === "poop" && it.skin === "fever") {
        // 뚜니핑 낙하물은 가까이 왔을 때만 끌어당긴다 (전부 빨아들이면 너무 세다)
        // 부양사 기본치는 블랙홀의 절반 반경·45% 힘
        const d = Math.hypot(dx, dy), R = aug.blackhole ? 195 : 98;
        if (d < R && d > 1) {
          const pull = (aug.blackhole ? 481 : 216) * dt * (1 - d / R);
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.5;
        }
      }
      /* 부양사는 자석이 없어도 기본 흡인(자석의 약 20%)을 갖고 시작한다.
         자석 증강을 먹으면 온전한 자석으로 덮어쓴다. 반경 110 → 121 (10% 확장). */
      const magR = prophIs("magnet") ? 2400 : aug.magnet > 0 ? aug.magnet : (job === "levitator" ? 121 : 0);
      const magF = prophIs("magnet") ? 1.8 : aug.magnet > 0 ? 1 : 0.45;   // 복이 굴러온다 — 화면 어디서든 끌려온다
      /* 코인은 자석이 없어도 늘 끌려온다 — 자석 증강의 절반(반경 110 · 힘 0.5).
         자석·복이 굴러온다가 있으면 둘 중 센 쪽을 쓴다. */
      const COIN_R0 = 110, COIN_F0 = 0.5;
      if ((magR > 0 && (it.type !== "poop" || it.gold)) || it.type === "coin") {
        const d = Math.hypot(dx, dy);
        /* 무지개똥과 코인은 아이템의 절반 반경·절반 힘.
           (무지개똥은 수집가를 먹으면 그 2배가 되어 아이템과 같아진다) */
        const goldF = it.gold ? (aug.goldLord ? 1 : 0.5)
                    : (it.type === "coin" ? 0.5 : 1);
        const R = it.type === "coin" ? Math.max(magR * goldF, COIN_R0) : magR * goldF;
        const F = it.type === "coin" ? Math.max(magF * goldF, COIN_F0) : magF * goldF;
        if (d < R && d > 1) {
          const near = 1 - d / R;              // 가장자리 0, 코앞 1
          const pull = (676 * near + 78) * dt * F;
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.55;
          // 가장 가까이 끌려오는 것 하나가 소리 크기를 정한다
          if (near > magNear) magNear = near;
        }
      }
      /* 맞는 판정은 줍는 판정보다 좁다. 아이템은 잘 잡히면서 똥은 살짝 스쳐도 넘어가도록
         맞는 쪽만 줄여 뒀다 (.78 → .702 → .632). */
      if (dying > 0) continue;               // 쓰러지는 중 — 느린 화면으로 보여 주기만 한다
      const dmg = it.type === "poop" && !powered && it.skin !== "fever";
      // 끝점만 보면 빠른 똥이 캐릭터를 뛰어넘을 수 있어서, 이번 프레임에 지나온 선분과의 거리를 본다
      const hitR = it.r + player.r * (dmg ? .632 : .78) * hitMul();
      const segD = (!it.bounced && !it.ghost) ? segDist(player.x, cy, prevX, prevY, it.x, it.y) : 1e9;
      const hit = segD < hitR;
      /* 아슬! — 떨어지는 내내 히트박스에 가장 가까웠던 틈을 적어 둔다 (바닥에 닿을 때 점수가 갈린다).
         무적인 동안은 재지 않는다 — 맞고 난 뒤 1초를 공짜 스침으로 쓰지 못하게.
         대시 중에는 예외라, 뚫고 지나간 똥이 그대로 스침으로 잡힌다. */
      if (dmg && !it.bounced && !it.ghost && (dashT > 0 || now >= invUntil)) {
        const gap = segD - hitR;
        if (it.gap === undefined || gap < it.gap) it.gap = gap;
        if (gap <= GRAZE_GAP && !it.grazed) { it.grazed = true; onGraze(it); }
      }

      if (hit) {
        if (it.type === "poop") {
          if (it.gold) {                    // 무지개똥 — 먹으면 점수 (레벨이 오를수록 값지다)
            const g = Math.round(120 * (aug.goldLord ? 2 : 1) * scoreMul() * level);
            score += sc("무지개똥", g);
            burst(it.x, it.y, "hsl(" + Math.round(goldFx(now, it.x).hue) + ",100%,62%)", 20);
            popGain(it.x, it.y, g, "🌈", "#ffe07a");
            if (!sfx("gold")) beep(1250, .1, "square", .05);
            items.splice(i, 1);
            continue;
          }
          // 뚜니핑 타임 낙하물은 타임이 끝난 뒤에도 먹을 수 있다.
          // (끝나는 순간 화면에 떠 있던 것들이 그냥 스쳐 지나가면 아까우니까)
          if (powered || it.skin === "fever") {
            // 크기가 곧 점수. 뚜니핑 타임 중 생성된 건 자기 점수를 갖고 있고,
            // 뚜니핑 타임 전에 떨어지던 일반 똥은 크기로 환산한다.
            const gain = feverGain(it);
            /* 터지는 색은 점수와 무관하게 매번 무작위 — 무지갯빛 폭죽처럼 보이게 한다.
               입자 수·소리는 크기를 따른다. 점수로 나누면 레벨당 1.3배씩 부풀어
               후반엔 작은 것 하나에도 80개씩 터졌다 (화면이 덮이고 발열도 심했다). */
            const tone = FEVER_TONES[Math.floor(Math.random() * FEVER_TONES.length)];
            const sz = it.sz;
            let burstN, note;
            if (it.giant)     { burstN = 80; note = 2200; }
            else if (sz >= 52) { burstN = 66; note = 2100; }
            else if (sz >= 44) { burstN = 54; note = 2000; }
            else if (sz >= 37) { burstN = 42; note = 1800; }
            else if (sz >= 31) { burstN = 34; note = 1650; }
            else if (sz >= 26) { burstN = 26; note = 1500; }
            else if (sz >= 22) { burstN = 18; note = 1350; }
            else if (sz >= 18) { burstN = 12; note = 1150; }
            else               { burstN = 8;  note = 900;  }
            score += sc("뚜니핑", gain);
            burst(it.x, it.y, tone, burstN);
            // 낙하물은 개당 점수를 띄우지 않는다 (한꺼번에 쏟아져서 화면이 지저분해진다)
            /* 흔들림은 점수가 아니라 크기로 정한다.
               점수는 레벨당 1.3배씩 부풀어서, 후반엔 제일 작은 뚜니핑 하나에도
               화면이 최대로 흔들렸다. 대왕 뚜니핑(반지름 104~124)이 기준이고,
               작은 것들은 거의 흔들리지 않는다 — 터지는 입자와 소리로 충분하다. */
            const sh = it.giant
              ? 26 + Math.min(1, (it.sz - GIANT.min) / (GIANT.max - GIANT.min)) * 6
              : Math.max(0, (it.sz - 26) / 36) * 14;
            if (sh >= 1) shake = Math.max(shake, sh);
            items.splice(i, 1);
            /* 초당 수십 개가 쏟아지므로 소리를 아껴 쓴다.
               큰 것(44 이상)만 진짜 소리를 내고, 작은 것은 절반만 짧은 삐 소리로 둔다.
               작은 것까지 음원을 겹치면 뭉개져서 잡음처럼 들린다. */
            /* 삐 소리는 사각파 대신 삼각파로 — 사각파는 배음이 거칠어서 초당 여러 번
               울리면 쨍하게 들린다. 대신 배음이 적은 만큼 크기를 1.4 배로 올려 맞췄다. */
            if (it.giant) { if (!sfx("giant")) beep(note, .14, "triangle", .07); }
            else if (sz >= 44) { if (!sfx("fpick")) beep(note + Math.random() * 200, .06, "triangle", .056); }
            else if (Math.random() < .5) beep(note + Math.random() * 200, .06, "triangle", .056);
            continue;
          }
          if (roidT > 0 && !it.dark) {          // 다크똥은 튕겨 나가지 않는다
            /* 스테로이드 — 몸에 닿은 똥이 위로 튕겨 나간다. 피한 것과 같은 점수를 받고,
               특수 성질(분열·지그재그·레이저)은 튕기는 순간 사라진다. */
            score += sc("똥", poopGain());
            const away = it.x - player.x;
            it.vx = away * 5 + (Math.random() - .5) * 160;
            it.vy = -(Math.abs(it.vy) * 0.6 + 320);
            it.vr = (Math.random() - .5) * 12;
            it.special = null; it.bounced = true;
            burst(it.x, it.y, "#ff6a6a", 10);
            shake = Math.max(shake, 5);
            beep(560 + Math.random() * 200, .05, "square", .035);
            continue;
          }
          /* 무적 여부는 이 자리에서 그때그때 확인해야 한다.
             프레임 앞에서 한 번만 재어 두면, 같은 프레임에 똥 두 개가 겹쳐 닿았을 때
             첫 번째로 무적이 걸렸는데도 두 번째가 그대로 들어와 방패가 두 개 깨진다. */
          if (now >= invUntil) {
            /* 방울이 우산보다 먼저 터진다 — 방울은 저절로 다시 차지만
               우산은 주워야 생기니, 공짜인 쪽을 먼저 쓰는 게 이롭다. */
            if (bubbleOn) {
              bubbleOn = false; bubbleT = 0;
              invUntil = now + 900;          // 터진 직후 잠깐은 안 맞는다
              shake = Math.max(shake, 10);
              /* 방울이 터지는 자리에서 테두리가 확 퍼지고 물방울이 사방으로 튄다.
                 (똥이 닿은 자리가 아니라 방울 자리에서 터져야 방울이 터진 것처럼 보인다) */
              const bg2 = bubbleGeom(now);
              const dots = [];
              for (let k = 0; k < 14; k++) {
                dots.push({
                  a: (k / 14) * 6.283 + Math.random() * 0.4,
                  sp: 90 + Math.random() * 190,
                  rr: 1.6 + Math.random() * 3.2,
                  c: BUB_TONES[Math.floor(Math.random() * BUB_TONES.length)]
                });
              }
              bubPops.push({ x: bg2.x, y: bg2.y, r: bg2.r, t: 0, life: 0.5, dots: dots });
              popText(player.x, player.y - 60, "🫧 방울 팡!", "#bfe9ff");
              if (!sfx("bubble")) beep(760, .12, "sine", .05);
              if (navigator.vibrate) navigator.vibrate(40);
              items.splice(i, 1);
              continue;
            }
            /* 그건 제 잔상입니다만? — 똥은 잔상을 뚫고 그냥 지나간다.
               우산보다 먼저 굴리므로, 피하면 우산이 그대로 남는다. 방울(방울이 전용)은
               저절로 다시 차니 위에서 먼저 터뜨리고, 주워야 생기는 우산부터 아낀다.
               이 똥은 다시 판정하지 않는다 (다음 프레임에 또 걸리지 않게). */
            if (aug.dodge > 0 && Math.random() < aug.dodge) {
              it.ghost = true;
              const spr = currentSprite(now), fl = sprFlipped(now), dir = fl ? 1 : -1;
              for (let k = 0; k < 3; k++)
                ghosts.push({ x: player.x + dir * k * 16, y: player.y, tilt: player.tilt,
                              flip: fl, spr: spr, t: -k * 0.04, life: 0.5 });
              burst(player.x, cy, "#cbb8ff", 10);
              popText(player.x, player.y - 60, "그건 제 잔상입니다만?", "#cbb8ff", 18);
              if (!sfx("dodge")) beep(880, .06, "sine", .04);
              continue;
            }
            if (shields > 0) {
              shields--;                     // 우산이 막아준 건 '맞은 것'으로 치지 않는다
              invUntil = now + 1000;        // 목숨을 잃었을 때와 같은 무적 시간
              hitStop = Math.max(hitStop, HITSTOP_SEC * 0.6);
              shake = Math.max(shake, 14);
              burst(it.x, it.y, "#7ec8ff", 20);
              popText(player.x, player.y - 60, "☂️ 방어!", "#7ec8ff");
              if (!sfx("break")) beep(400, .12, "triangle", .06);
              if (navigator.vibrate) navigator.vibrate(60);
              if (aug.angryUmb) {
                /* 성난 우산 — 우산이 터지면서 넓게 퍼지는 폭발이 똥을 쓸어낸다.
                   반경은 화면의 2/3 넘게 덮도록 잡는다 (까다로운 똥도 함께 부순다).
                   지금 부딪힌 똥(i)은 바로 아래 공용 splice 가 지우므로 건드리지 않는다. */
                const bx = player.x, by = player.y + player.hy;
                const bR = Math.sqrt(4 * W * H / (3 * Math.PI)) * 1.0;   // 1.15 → 1.0 (반경 13% 축소)
                for (let k = items.length - 1; k >= 0; k--) {
                  const q = items[k];
                  if (q.type !== "poop" || k === i || q.blast || q.dark) continue;
                  const dx = q.x - bx, dy = q.y - by, d = Math.hypot(dx, dy);
                  if (d > bR + q.r) continue;                 // 폭발 밖은 그대로 떨어진다
                  /* 부수지 않고 바깥으로 날려 보낸다. 날아가는 똥은 사람을 해치지 않고,
                     내려오던 다른 똥과 부딪히면 둘 다 터진다. */
                  const sp = 620 + (1 - Math.min(1, d / bR)) * 520;
                  const ux = d > 1 ? dx / d : (Math.random() - .5), uy = d > 1 ? dy / d : -1;
                  q.vx = ux * sp;
                  q.vy = uy * sp - 260;                       // 조금 위로 뜨면서 퍼진다
                  q.vr = (Math.random() - .5) * 10;
                  q.swayA = 0;                                // 살랑임 대신 실제로 회전
                  q.special = null;
                  q.bounced = true; q.blast = true;
                  burst(q.x, q.y, "#9fd4ff", 5);
                }
                warns = [];
                umbBlast = { x: bx, y: by, r: bR, t: 0.42 };
                shake = Math.max(shake, 26);
                feverFlash = Math.max(feverFlash, 0.4);
                popText(player.x, player.y - 95, "💢 성난 우산!", "#7ec8ff", 26);
                if (!sfx("angry")) beep(190, .22, "square", .06);
              }
            } else {
              if (!testMode) {             // 테스트 모드는 맞아도 줄지 않는다
                if (dirtJob()) dirt = Math.min(DIRT_MAX, dirt + DIRT_HIT);
                else lives--;
              }
              noHitSec *= 3 / 4;           // 무소유 무피격 배율 — 맞으면 1/4 만 잃는다
              invUntil = now + 1000;
              hurtUntil = now + 1000;   // 무적 시간 동안 아픈 그림으로
              shake = 22; flash = 1;
              hitStop = Math.max(hitStop, HITSTOP_SEC);   // 아주 잠깐 멈췄다가 흔들린다 (타격감)
              burst(it.x, it.y, "#8a5a2b", 22);
              popText(player.x, player.y - 60, "으악!", "#ff5d5d");
              if (!sfx("hurt")) beep(140, .25, "sawtooth", .07);
              if (navigator.vibrate) navigator.vibrate(70);
              if (dirtJob() ? dirt >= DIRT_MAX : lives <= 0) {
                if (angelSave(now)) { items.splice(i, 1); continue; }   // 수호천사 — 한 번 되살린다
                return startDeath();               // 마지막 똥은 남겨 둔 채 느린 화면으로
              }
            }
            items.splice(i, 1);
            continue;
          }
        } else {
          items.splice(i, 1);
          if (collectItem(it, now)) return;   // 달이면 화면이 멈추므로 여기서 끝
          continue;
        }
      }

      /* 튕겨 나간 똥은 화면 밖으로 나가면 사라진다 (위·좌우 어디로든).
         주먹에 맞은 똥만은 예외 — 주먹은 대개 똥이 막 태어나는 맨 위에서 맞히므로, 위로 나가는
         걸 지우면 거의 다 사라져 버린다. 화면 위로 올라갔다가 중력에 되돌아오게 둔다. */
      if (it.bounced && ((it.y + it.r < -40 && !it.wak) || it.y < -900 || it.x < -70 || it.x > W + 70)) { items.splice(i, 1); continue; }
      if (it.ring && !it.bounced) {         // 고리는 화면 밖에서 생겨나 조여들다 사그라진다 — 반지름으로만 거둔다
        if (it.rad <= RING_MIN) { score += sc("똥", poopGain() * 0.3); items.splice(i, 1); }
        continue;
      }
      if (it.y - it.r > H + 20) {
        // 뚜니핑 타임 낙하물은 워낙 많이 쏟아져서, 안 먹고 흘려보낸 것에 점수를 주면
        // 가만히 있어도 점수가 폭등한다. 뚜니핑 타임 것은 0점 — 직접 받아야만 점수가 오른다.
        /* 흘려보낸 똥은 얼마나 가까이 지나갔느냐로 값이 갈린다 — 먼 것 0.5배, 가까운 것 1.5배,
           스친 것 3배. 가만히 구석에 서 있으면 점수가 절반으로 줄어든다. */
        /* it.gap 이 없는 똥 = 떨어지는 내내 무적이었던 똥(뚜니핑 타임 등). 잰 적이 없으니
           멀다고 깎지 않고 그냥 한 배로 둔다 — 못 잰 것과 멀리 보낸 것은 다르다. */
        if (it.type === "poop" && it.skin !== "fever")
          score += sc("똥", poopGain() * (it.gap === undefined ? 1 : nearMul(it.gap)));
        if (it.type === "coin") monkStreak = 0;   // 흘려보내면 연속이 끊긴다
        items.splice(i, 1);
      }
    }

    /* 성난 우산에 날아간 똥은 부딪히는 똥을 관통하며 계속 부순다 (연쇄 청소).
       주먹에 맞은 똥은 처음 부딪히는 똥과 함께 반경 50px 로 터진다. */
    let boom = false;
    const waks = [];
    for (const a of items) {
      if (!(a.blast || a.wak) || a.dead) continue;
      for (const q of items) {
        if (q === a || q.dead || q.blast || q.dark || q.type !== "poop") continue;
        if (Math.hypot(a.x - q.x, a.y - q.y) > a.r + q.r) continue;
        if (a.wak) {                              // 둘이 같이 터진다 — 폭발은 아래에서
          a.dead = true;
          score += sc("똥", poopGain());          // 날아간 똥 제 몫
          waks.push({ x: (a.x + q.x) / 2, y: (a.y + q.y) / 2 });
          break;
        }
        q.dead = true; boom = true;               // 날아가는 똥은 살아서 계속 나아간다
        score += sc("똥", poopGain());
        burst(q.x, q.y, "#9fd4ff", 16);
      }
    }
    if (boom || waks.length) items = items.filter(q => !q.dead);
    if (boom) {
      shake = Math.max(shake, 8);
      beep(300, .07, "square", .04);
    }
    for (const w of waks) {
      smashPoopsAround(w.x, w.y, 50, true);       // 부딪힌 똥과 반경 안의 똥이 함께 터진다
      burst(w.x, w.y, "#ff8a6a", 30);
      wakBooms.push({ x: w.x, y: w.y, t: 0 });
      shake = Math.max(shake, 10);
      if (!sfx("wakboom")) beep(220, .1, "square", .05);
    }
  }

  /* 아이템 효과 적용. 플레이어가 직접 먹을 때와 '배고픈 정연핑'이 대신 먹을 때 모두 쓴다.
     달을 먹으면 게임이 멈추므로 true 를 돌려주고, 부른 쪽은 그 프레임 처리를 중단한다. */
  function collectItem(it, now) {
    if (it.type === "paper") {
      feverDur = 7000 + aug.feverBonus;
      // 이미 뚜니핑 중이면 남은 시간에 이어붙인다 (초기화하면 남은 시간이 버려진다)
      powerUntil = Math.max(powerUntil, now) + feverDur;
      feverFlash = 1;
      popText(player.x, player.y - 70, "🔥 뚜니핑 타임!", "#ffd23f", 26);
      if (!sfx("fever")) {
        beep(700, .1, "square", .05);
        beep(1100, .12, "square", .05);
        beep(1500, .18, "square", .05);
      }
      if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
    }
    if (it.type === "umbrella") {
      shields = Math.max(shields, Math.min(shields + 1, 5));   // 아이템으로도 5개까지 누적
      popText(player.x, player.y - 60, "☂️ 방패!", "#7ec8ff");
      if (!sfx("shield")) beep(900, .12, "triangle", .05);
    }
    if (it.type === "star") {
      const gain = eatStar(it.x, it.y);
      if (aug.starburst) {
        /* 화면의 똥을 전부 없애고 개당 똥 점수의 6배를 받는다 (까다로운 똥도 함께).
           뚜니핑 낙하물은 주우라고 떨어지는 것이라 건드리지 않는다. */
        let cnt = 0, bonus = 0;
        for (let k = items.length - 1; k >= 0; k--) {
          const q = items[k];
          // 무지개똥은 주우면 훨씬 값지므로 쓸어버리지 않고 남긴다
          if (q.type !== "poop" || q.skin === "fever" || q.gold || q.dark) continue;
          bonus += poopGain() * 6;
          burst(q.x, q.y, "#ffe9a8", 10);
          items.splice(k, 1);
          cnt++;
        }
        if (cnt) {
          bonus = Math.round(bonus);
          score += sc("별핑별", bonus);
          spawnHold = Math.max(spawnHold, 1);   // 쓸어낸 뒤 1초는 새 똥이 없다
          shake = Math.max(shake, 18);
          feverFlash = Math.max(feverFlash, 0.7);
          popGain(player.x, player.y - 110, bonus,
                  "🌠 " + cnt + "개 쓸어버림", "#ffe9a8");
          if (!sfx("burst")) beep(2000, .18, "square", .05);
        }
      }
    }
    if (it.type === "moon" || it.type === "fullmoon") {
      const full = it.type === "fullmoon";
      burst(it.x, it.y, full ? "#ffe9a8" : "#cfe4ff", full ? 40 : 20);
      if (full) { flash = 0; feverFlash = 1; shake = Math.max(shake, 14); }
      openAugment(full ? 3 : 1);     // 보름달은 3연속 선택
      return true;
    }
    if (it.type === "coin") {
      /* 이번 판 점수와는 아무 상관이 없다 — 판을 넘어 쌓이기만 한다. */
      const v = it.coin || 1;
      addCoins(v);
      coinGot++; coinGotV += v;
      if (job === "powerp" && !fullOwn) {
        /* 무소유 — 쥐는 순간 코인 값만큼 점수가 깎인다 (1코인 1%, 3코인 3%, 5코인 5%).
           끝에 안 쥔 것만큼 그대로 돌려받으므로, 주울지 흘려보낼지가 셈이 된다.
           값이 클수록 손해도 커서, 반짝이는 것일수록 참기 어렵다. */
        score *= 1 - 0.01 * v;
        /* 연달아 다섯 개를 쥐면 마음이 꺾인다 — 풀소유로 바뀐다.
           먼저 세어 두어야, 진화하는 그 한 개에서는 읊조리지 않고 넘어갈 수 있다. */
        const grow = (++monkStreak >= FULL_NEED);
        if (grow) {
          fullOwn = true; fullBanner = 2.6; fullFx = FULL_FX;
          hurtUntil = 0;                     // 바뀐 모습을 바로 보여 준다
          burst(player.x, player.y, "#ffd23f", 46);
          burst(player.x, player.y, "#ffffff", 30);
          feverFlash = Math.max(feverFlash, 1);
          shake = Math.max(shake, 22);
          // 문구는 가운데 큰 배너 하나로만 — 머리 위에도 띄우면 두 번 읽힌다
          if (!sfx("giant")) beep(1200, .18, "triangle", .06);
          if (navigator.vibrate) navigator.vibrate([40, 60, 90]);
        } else {
          popText(it.x, it.y, "공수래공수거 ㅠㅠ", "#d8cdbb", 13);
          /* 쥔 것이 곧 짐이라는 뜻으로 잠깐 아픈 모습이 된다.
             hurtUntil 은 그림만 바꾼다 — 무적(invUntil)은 건드리지 않는다. */
          hurtUntil = now + 1000;
          // 소리도 맞았을 때와 같게 — 쥐는 것이 곧 얻어맞는 일이라는 뜻
          if (!sfx("hurt")) beep(140, .25, "sawtooth", .07);
        }
      } else {
        /* 코인 이모지(🪙)는 아이폰 캔버스에서 까만 지구본으로 깨진다 — 코인 그림을 직접 그린다 */
        const ci = ITEM_IMG[it.img] || ITEM_IMG.coin;
        popText(it.x, it.y, ci ? "+" + v : it.emoji + " +" + v,
                v >= 5 ? "#ff9ede" : (v >= 3 ? "#8fd8ff" : "#ffd23f"), 18 + v * 2);
        if (ci) floats[floats.length - 1].img = ci;
        if (!sfx("coin")) { beep(1100 + v * 60, .06, "triangle", .056);
                            beep(1480 + v * 80, .09, "triangle", .05); }
      }
    }
    if (it.type === "fortune") startProphecy(now);
    if (it.type === "meal") {
      /* 엄마의 밥상 — 그 순간 점수의 10%. 판이 무르익을수록 한 상이 커진다.
         모든 점수에 곱하는 배율(scoreMul)은 얹지 않는다. 이미 배율이 반영된
         점수에서 떼어 오는 것이라, 또 곱하면 두 번 먹는 셈이 된다. */
      const gain = Math.round(score * 0.10);
      score += sc("밥상", gain);
      popGain(it.x, it.y, gain, "🍚 엄마의 밥상", "#ffd7a8");
      if (!sfx("star")) { beep(680, .12, "triangle", .05); beep(900, .16, "triangle", .045); }
      if (navigator.vibrate) navigator.vibrate(40);
    }
    if (it.type === "heart") {
      lives = Math.min(aug.maxLives, lives + 1);
      popText(it.x, it.y, "❤️ +1", "#ff8fb0");
      if (!sfx("heart")) beep(1000, .15, "sine", .06);
    }
    if (it.type === "droplet") {                    // 방울이 — 오염도를 씻어낸다
      if (dirt > 0) {
        dirt = Math.max(0, dirt - DIRT_WASH);
        popText(it.x, it.y, "💧", "#8fe3ff");     // 얼마나 씻겼는지는 막대가 보여 준다
        if (!sfx("heart")) beep(1000, .15, "sine", .06);
      } else {
        popText(it.x, it.y, "💧", "#bfe9ff");        // 깨끗하면 아무 일도 없다
        if (!sfx("bubble")) beep(760, .09, "sine", .04);
      }
    }
    burst(it.x, it.y, "#ffd23f", 16);
    return false;
  }

  /* 뚜니핑 낙하물 점수 — 크기 등급 점수 × 0.7 × 레벨.
     초당 수십 개가 쏟아지므로 한 개의 몫은 다른 것보다 작게 잡았다. */
  function feverGain(it) {
    const base = it.gain || (it.sz < 20.7 ? 3 : (it.sz < 26 ? 5 : 10));
    return Math.max(1, Math.round(base * aug.feverScoreMul * scoreMul() * level));
  }

  /* 점수를 항목별로도 모은다. 테스트 모드에서는 화면에 띄우고,
     실제 플레이에서는 판이 끝날 때 비중만 익명으로 남겨 통계에 쓴다. */
  const SRC_KEYS = ["별", "별핑별", "뚜니핑", "무지개똥", "똥", "생존", "명당"];
  // 서버에는 한글 대신 짧은 영문 키로 보낸다 (칸 이름이 지저분해지지 않게)
  const SRC_CODE = { "별": "star", "별핑별": "burst", "뚜니핑": "fever",
                     "무지개똥": "gold", "똥": "poop", "생존": "time", "명당": "spot" };
  let scoreSrc = {};
  function sc(key, v) {
    scoreSrc[key] = (scoreSrc[key] || 0) + v;
    return v;
  }

  /* 똥 한 개의 점수 — 10 × 레벨.
     흘려보낸 것, 스테로이드로 튕겨낸 것, 부순 것이 모두 같은 값을 받는다.
     (흘려보낸 똥만은 얼마나 가까이 지나갔느냐로 값이 갈린다 — nearMul) */
  function poopGain() { return 10 * scoreMul() * level; }

  /* ---------- 아슬! — 가까이 스쳐 보낸 똥일수록 비싸다 ----------
     똥이 떨어지는 내내 히트박스와 가장 가까웠던 틈을 적어 두었다가(it.gap),
     바닥으로 사라질 때 그 틈으로 배율을 정한다.
       스친 것(GRAZE_GAP 안)  3배 + 작은 반짝임 (글자·느린 화면 없음 — 화면이 시끄러워서 뺐다)
       가까운 것(NEAR_GAP 안) 1.5배
       먼 것(FAR_GAP 밖)      0.5배  ← 구석에 숨어 있으면 저절로 손해가 된다
     스침 판정은 진짜 아슬아슬할 때만 붙도록 박하게 잡는다. */
  const GRAZE_GAP = 20;            // 히트박스 바깥으로 이만큼까지는 '스쳤다' (40 → 20 으로 박하게)
  const NEAR_GAP  = 150;           // 여기까지는 가까운 똥
  const FAR_GAP   = 380;           // 여기부터는 먼 똥
  const GRAZE_MUL = 3, NEAR_MUL = 1.5, FAR_MUL = 0.5;
  /* 초반에는 배율 차이를 좁혀 둔다 — 1레벨은 차이의 35%만, 6레벨에서 온전해진다.
     처음부터 3배를 걸어 두면 초보가 욕심을 내다 죽는다. */
  function grazeRamp() { return 0.35 + 0.65 * Math.min(1, (level - 1) / 5); }
  function nearMul(gap) {
    const raw = gap <= GRAZE_GAP ? GRAZE_MUL
              : gap <= NEAR_GAP  ? NEAR_MUL
              : gap >= FAR_GAP   ? FAR_MUL
              : NEAR_MUL + (FAR_MUL - NEAR_MUL) * ((gap - NEAR_GAP) / (FAR_GAP - NEAR_GAP));
    return 1 + (raw - 1) * grazeRamp();
  }
  /* 스친 순간 바로 알려 준다 — 점수는 그 똥이 바닥에 닿을 때 들어오지만,
     짜릿한 건 스치는 그 순간이라 신호를 여기서 낸다.
     글자('아슬!')와 짧은 느린 화면은 한 판에 수십 번 나와 시끄러워서 뺐다.
     남은 건 캐릭터 머리에서 튀는 땀방울과 소리뿐이고, 소리만 겹쳐 울리지 않게 쉬는 시간을 둔다. */
  const GRAZE_FX_CD = 0.25;
  function onGraze(it) {
    grazeCount++;
    /* 똥이 지나간 반대쪽으로 땀이 튄다 — 스친 쪽으로 몸이 움찔한 것처럼 보인다 */
    const side = it.x > player.x ? -1 : 1;
    popSweat(side);
    if (Math.random() < 0.55) popSweat(side);           // 가끔 두 방울
    if (grazeFxCd <= 0) {
      grazeFxCd = GRAZE_FX_CD;
      if (!sfx("graze")) beep(2000, .04, "triangle", .025);
    }
  }
  /* 땀방울 하나 — 머리 옆에서 비스듬히 위로 튀어 올랐다가 중력에 떨어진다 */
  function popSweat(side) {
    if (sweats.length >= SWEAT_MAX) sweats.shift();
    sweats.push({
      x: player.x + side * player.r * (0.55 + Math.random() * 0.3),
      y: player.y + player.hy - player.r * (0.35 + Math.random() * 0.45),
      vx: side * (68 + Math.random() * 58),        // 너무 멀리 날아가면 몸에서 난 것으로 안 읽힌다
      vy: -(160 + Math.random() * 110),
      r: 3.8 + Math.random() * 2.4,
      t: 0, life: 0.5 + Math.random() * 0.22
    });
  }

  /* ---------- 방귀 대시 ----------
     증강으로만 얻는다. 빠르게 두 번 두드리면 옆으로 짧게 돌진하고,
     돌진하는 동안(+여운) 무적이다. 뚫고 지나간 똥은 위의 스침으로 잡혀
     '아슬!' 3배가 된다. 부양사는 이미 두 배 반으로 빠르니 후보에 안 나온다. */
  const DASH_CD = 5, DASH_SEC = 0.2, DASH_DIST = 180, DASH_INV = 300;
  function tryDash(now, sx) {
    if (!aug.dash || state !== STATE.PLAY || dying > 0) return;
    if (dashCd > 0 || dashT > 0) return;
    /* 두 번째로 두드린 쪽으로 나간다. 캐릭터 바로 위를 두드렸을 때는 지금 보고 있는 쪽으로

  /* 랭킹은 매주 월요일 0시(한국시간)에 새로 시작한다.
     기록을 지우는 게 아니라 '이번 주 것만' 보여주는 방식이라 초기화가 실패할 일이 없다.
     보는 사람 폰의 시간대와 무관하게 항상 한국시간 기준으로 계산한다. */
  const KST = 9 * 60 * 60 * 1000;
  function weekStartMs(weeksAgo) {                        // 0 = 이번 주, 1 = 지난주
    const k = new Date(Date.now() + KST);                 // UTC 값으로 읽으면 한국 벽시계
    const mondayIndex = (k.getUTCDay() + 6) % 7;          // 월=0 … 일=6
    const kstMidnight = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(),
                                 k.getUTCDate() - mondayIndex - (weeksAgo || 0) * 7);
    return kstMidnight - KST;                             // 실제 UTC 시각
  }
  function resetNote() {
    const left = weekStartMs(0) + 7 * 24 * 3600 * 1000 - Date.now();
    const d = Math.floor(left / 86400000);
    const h = Math.floor(left / 3600000) % 24;
    const m = Math.floor(left / 60000) % 60;
    const remain = d > 0 ? d + "d" : (h > 0 ? h + "h" : m + "m");   // 짧게: 5d / 12h / 40m
    return "초기화까지 " + remain;
  }

  async function fetchRange(fromMs, toMs, limit, jb, mdWant) {
    // 기기별 최고 기록만 남기는 건 SQL 함수 쪽에서 처리한다 (한 사람이 순위를 도배하지 않도록)
    // jb 가 있으면 그 직업으로 낸 기록 중 기기별 최고 (ddongpi_top_job)
    try {
      const body = {
        since: new Date(fromMs).toISOString(),
        until: toMs ? new Date(toMs).toISOString() : null,
        lim: limit
      };
      if (jb) body.jb = jb;
      const mdv = mdWant || gameMode;
      const md = mdv !== "item" ? mdv : null;   // 똥대잔치는 인자 없이 (옛 함수와도 맞는다)
      if (md) body.md = md;
      const res = await fetch(SB_URL + "/rest/v1/rpc/" + (jb ? "ddongpi_top_job" : "ddongpi_top"), {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return await res.json();
      if (jb || md) throw new Error("HTTP " + res.status);   // 직업별·노템전은 함수가 없으면 대체 경로가 없다
    } catch (e) { if (jb || (mdWant || gameMode) !== "item") throw e; /* 아래 방식으로 넘어간다 */ }
    // 함수가 아직 없으면 예전처럼 표에서 바로 읽는다 (기기 중복 제거는 안 됨)
    let url = SB_URL + "/rest/v1/" + SB_TABLE +
      "?select=name,score,level,created_at" +
      "&created_at=gte." + encodeURIComponent(new Date(fromMs).toISOString());
    if (toMs) url += "&created_at=lt." + encodeURIComponent(new Date(toMs).toISOString());
    url += "&order=score.desc,created_at.asc&limit=" + limit;
    const r2 = await fetch(url, { headers: sbHeaders() });
    if (!r2.ok) throw new Error("HTTP " + r2.status);
    return r2.json();
  }

  async function submitScore(name, sc, lv) {
    // DB 제약(최대 1억점)에 걸려 등록이 실패하지 않도록 방어
    const base = {
      name: name,
      score: Math.min(1000000000000, Math.max(0, sc)),   // 상한 1조
      level: lv
    };
    /* 아래 두 값은 나중에 추가한 컬럼이라 DB에 아직 없을 수 있다.
       컬럼이 없으면 요청 전체가 거부되므로, 실패하면 기본 항목만으로 다시 보낸다. */
    /* 노템전 기록은 mode 칸이 있어야만 올린다 — 칸이 없는 서버에 그냥 올리면 아이템전 순위에 섞인다 */
    if (pendingMode !== "item") {
      const res = await fetch(SB_URL + "/rest/v1/" + SB_TABLE, {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify(Object.assign({}, base, { device: deviceId, augs: augCount, job: job,
                                                        fullown: pendingFull, dog: pendingDog, mode: pendingMode }))
      });
      if (res.ok) return;
      throw new Error(MODES[pendingMode].nm + " 순위판 준비 중 (HTTP " + res.status + ")");
    }
    const tries = [
      Object.assign({}, base, { device: deviceId, augs: augCount, job: job, fullown: pendingFull, dog: pendingDog }),
      Object.assign({}, base, { device: deviceId, augs: augCount, job: job, fullown: pendingFull }),
      Object.assign({}, base, { device: deviceId, augs: augCount, job: job }),
      Object.assign({}, base, { device: deviceId, augs: augCount }),
      Object.assign({}, base, { device: deviceId }),
      base
    ];
    let lastErr = "";
    for (const body of tries) {
      const res = await fetch(SB_URL + "/rest/v1/" + SB_TABLE, {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return;
      lastErr = "HTTP " + res.status + " " + (await res.text()).slice(0, 120);
      if (res.status !== 400) break;      // 컬럼 문제(400)일 때만 다시 시도한다
    }
    throw new Error(lastErr);
  }

  /* 순위판은 늘 10칸을 그린다. 기록이 적으면 빈 칸을 옅게 남겨서,

  function boardImg(row) {

  function boardPet(row) {

  function petIcon(id) {

    const mkMini = (row, rank) => {

  const noteStart = document.getElementById("noteStart");

  /* ---------- 직업별 TOP 10 탭 ----------
     전체 목록(topList)은 순위 계산에도 쓰이므로 그대로 두고,

  let boardJob = "all";
  let jobLists = {};
  function buildJobTabs() {

    }

  buildJobTabs();
  syncBoardTabs();                       // 맨몸대결로 저장돼 있으면 직업 탭부터 접는다

  // 탭을 바꾸고(두 화면 모두) 목록을 다시 그린다
  /* 제목에 지금 보고 있는 직업을 넣는다 — 전체일 때는 넣지 않는다 */
  function syncBoardTitle() {

    const md = gameMode !== "item" ? MODES[gameMode].nm + " " : "";

  async function showBoards(els) {

    if (!jobLists[boardJob]) {
      els.forEach(el => renderBoard(el, null, "불러오는 중…"));

          ? MODES[gameMode].nm + " 순위판 준비 중입니다" : "직업별 랭킹을 불러오지 못했습니다"));

    const els = target ? [target] : [boardStart, boardOver];

    try {
      topList = await fetchTop();

      await showBoards(els);

      els.forEach(el => renderBoard(el, null, gameMode !== "item"
        ? MODES[gameMode].nm + " 순위판 준비 중입니다" : "랭킹을 불러오지 못했습니다 (오프라인?)"));
