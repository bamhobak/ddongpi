  function sbHeaders(extra) {
    return Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }, extra || {});
  }

  /* 랭킹은 매주 월요일 0시(한국시간)에 새로 시작한다.
     기록을 지우는 게 아니라 '이번 주 것만' 보여주는 방식이라 초기화가 실패할 일이 없다.
     보는 사람 폰의 시간대와 무관하게 항상 한국시간 기준으로 계산한다. */
  const KST = 9 * 60 * 60 * 1000;
  function weekStartMs(weeksAgo) {                        // 0 = 이번 주, 1 = 지난주
    const k = new Date(Date.now() + KST);                 // UTC 값으로 읽으면 한국 벽시계
    const mondayIndex = (k.getUTCDay() + 6) % 7;          // 월=0 … 일=6
    const kstMidnight = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(),
                                 k.getUTCDate() - mondayIndex - (weeksAgo || 0) * 7);
    return kstMidnight - KST;                             // 실제 UTC 시각
  }
  function resetNote() {
    const left = weekStartMs(0) + 7 * 24 * 3600 * 1000 - Date.now();
    const d = Math.floor(left / 86400000);
    const h = Math.floor(left / 3600000) % 24;
    const m = Math.floor(left / 60000) % 60;
    const remain = d > 0 ? d + "d" : (h > 0 ? h + "h" : m + "m");   // 짧게: 5d / 12h / 40m
    return "초기화까지 " + remain;
  }

  async function fetchRange(fromMs, toMs, limit, jb) {
    // 기기별 최고 기록만 남기는 건 SQL 함수 쪽에서 처리한다 (한 사람이 순위를 도배하지 않도록)
    // jb 가 있으면 그 직업으로 낸 기록 중 기기별 최고 (ddongpi_top_job)
    try {
      const body = {
        since: new Date(fromMs).toISOString(),
        until: toMs ? new Date(toMs).toISOString() : null,
        lim: limit
      };
      if (jb) body.jb = jb;
      const res = await fetch(SB_URL + "/rest/v1/rpc/" + (jb ? "ddongpi_top_job" : "ddongpi_top"), {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return await res.json();
      if (jb) throw new Error("HTTP " + res.status);   // 직업별은 함수가 없으면 대체 경로가 없다
    } catch (e) { if (jb) throw e; /* 아래 방식으로 넘어간다 */ }
    // 함수가 아직 없으면 예전처럼 표에서 바로 읽는다 (기기 중복 제거는 안 됨)
    let url = SB_URL + "/rest/v1/" + SB_TABLE +
      "?select=name,score,level,created_at" +
      "&created_at=gte." + encodeURIComponent(new Date(fromMs).toISOString());
    if (toMs) url += "&created_at=lt." + encodeURIComponent(new Date(toMs).toISOString());
    url += "&order=score.desc,created_at.asc&limit=" + limit;
    const r2 = await fetch(url, { headers: sbHeaders() });
    if (!r2.ok) throw new Error("HTTP " + r2.status);
    return r2.json();
  }

  function fetchTop() {
    return fetchRange(weekStartMs(0), null, TOP_N);
  }

  // 지난주 1~3위 — 기록이 있을 때만 시작 화면에 띄운다
  async function refreshLastWeek() {
    const lastBoard = document.getElementById("lastBoard");
    if (!SB_ON) return;
    const from = weekStartMs(1), to = weekStartMs(0);
    try {
      const list = await fetchRange(from, to, 3);
      if (!list.length) { lastBoard.hidden = true; return; }
      // 억/만 단위로 줄여 한 줄 칩으로 담는다
      const short = n => n >= 1e8 ? (n / 1e8).toFixed(n >= 1e9 ? 0 : 1) + "억"
                       : n >= 1e4 ? Math.round(n / 1e4).toLocaleString() + "만"
                       : n.toLocaleString();
      const medal = ["🥇", "🥈", "🥉"];
      const row = document.getElementById("boardLast");
      row.innerHTML = "";
      list.forEach((r, i) => {
        const chip = document.createElement("span");
        chip.className = "lp";
        const nm = document.createElement("span");
        nm.textContent = medal[i] + " " + r.name;
        const sc = document.createElement("b");
        sc.textContent = short(Number(r.score) || 0);
        chip.append(nm, sc);
        row.appendChild(chip);
      });
      lastBoard.hidden = false;
    } catch (e) {
      lastBoard.hidden = true;
    }
  }

  async function submitScore(name, sc, lv) {
    // DB 제약(최대 1억점)에 걸려 등록이 실패하지 않도록 방어
    const base = {
      name: name,
      score: Math.min(1000000000000, Math.max(0, sc)),   // 상한 1조
      level: lv
    };
    /* 아래 두 값은 나중에 추가한 컬럼이라 DB에 아직 없을 수 있다.
       컬럼이 없으면 요청 전체가 거부되므로, 실패하면 기본 항목만으로 다시 보낸다. */
    const tries = [
      Object.assign({}, base, { device: deviceId, augs: augCount, job: job }),
      Object.assign({}, base, { device: deviceId, augs: augCount }),
      Object.assign({}, base, { device: deviceId }),
      base
    ];
    let lastErr = "";
    for (const body of tries) {
      const res = await fetch(SB_URL + "/rest/v1/" + SB_TABLE, {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return;
      lastErr = "HTTP " + res.status + " " + (await res.text()).slice(0, 120);
      if (res.status !== 400) break;      // 컬럼 문제(400)일 때만 다시 시도한다
    }
    throw new Error(lastErr);
  }

  /* 순위판은 늘 10칸을 그린다. 기록이 적으면 빈 칸을 옅게 남겨서,
     직업 탭을 옮겨 다녀도 판 크기가 그대로다 (예전에는 판이 줄었다 늘었다 했다). */
  function renderBoard(el, list, msg) {
    el.innerHTML = "";
    const rows = (list || []).slice(0, 10);
    while (rows.length < 10) rows.push(null);
    const medal = ["🥇", "🥈", "🥉"];
    const shortScore = n => n >= 1e8 ? (n / 1e8).toFixed(n >= 1e9 ? 0 : 1) + "억"
                          : n >= 1e4 ? Math.round(n / 1e4).toLocaleString() + "만"
                          : n.toLocaleString();
    const isMe = row => row && myRowKey && row.name + "|" + row.score === myRowKey;
    // 1~3위 — 금·은·동 큰 줄
    rows.slice(0, 3).forEach((row, i) => {
      const li = document.createElement("li");
      li.className = "p" + (i + 1) + (row ? (isMe(row) ? " me" : "") : " ghost");
      const rk = document.createElement("span");
      rk.className = "rk";
      rk.textContent = medal[i];
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = row ? row.name : "-";     // textContent → HTML 삽입 불가
      const sc = document.createElement("span");
      const digits = row ? String(Math.round(Number(row.score) || 0)).length : 0;
      sc.className = "sc" + (digits >= 11 ? " xlong" : digits >= 9 ? " long" : "");
      /* 캐릭터 그림이 줄 높이를 정한다 — 빈 자리나 직업 기록이 없는 줄도
         그림 자리는 똑같이 잡아 둬야 판 높이가 흔들리지 않는다. */
      const jb3 = row && row.job && JOBS[row.job] ? row.job : null;
      const im = document.createElement("img");
      im.className = "jic";
      im.src = "assets/" + JOB_IMG[jb3 || "none"] + "_right.png";
      im.alt = jb3 ? JOBS[jb3].ic : "";
      if (!jb3) im.style.visibility = "hidden";
      sc.appendChild(im);
      sc.appendChild(document.createTextNode(row ? Number(row.score).toLocaleString() : "-"));
      li.append(rk, nm, sc);
      el.appendChild(li);
    });
    // 4~6위는 한 줄에 셋, 7~10위는 한 줄에 넷 — 세로 미니 카드
    const mkMini = (row, rank) => {
      const chip = document.createElement("span");
      chip.className = "mini" + (row ? (isMe(row) ? " me" : "") : " ghost");
      const im = document.createElement("img");
      im.className = "jic2";
      const jb = row && row.job && JOBS[row.job] ? row.job : "none";
      im.src = "assets/" + JOB_IMG[jb] + "_right.png";
      im.alt = JOBS[jb].ic;
      if (!row) im.style.visibility = "hidden";  // 자리는 잡되 캐릭터는 비운다
      const mn = document.createElement("span");
      mn.className = "mn";
      const b = document.createElement("b"); b.textContent = rank;
      mn.appendChild(b);
      mn.appendChild(document.createTextNode(row ? row.name : ""));
      const ms = document.createElement("span");
      ms.className = "ms";
      ms.textContent = row ? shortScore(Number(row.score) || 0) : "-";
      chip.append(im, mn, ms);
      return chip;
    };
    for (const [from, to, cls] of [[3, 6, "duo"], [6, 10, "five"]]) {
      const li = document.createElement("li");
      li.className = cls;
      rows.slice(from, to).forEach((row, k) => li.appendChild(mkMini(row, from + k + 1)));
      el.appendChild(li);
    }
    // 불러오는 중·오류·기록 없음은 칸 위에 겹쳐 띄운다
    const note = msg || (list && list.length ? "" : "이번 주 기록이 아직 없습니다. 첫 주인공이 되어보세요!");
    if (note) {
      const ov = document.createElement("li");
      ov.className = "boardMsg";
      ov.textContent = note;
      el.appendChild(ov);
    }
  }

  const noteStart = document.getElementById("noteStart");
  const noteOver  = document.getElementById("noteOver");

  /* ---------- 직업별 TOP 10 탭 ----------
     전체 목록(topList)은 순위 계산에도 쓰이므로 그대로 두고,
     직업별 목록은 탭을 누를 때 따로 받아서 캐시해 둔다. */
  let boardJob = "all";
  let jobLists = {};
  function buildJobTabs() {
    for (const id of ["jobTabsStart", "jobTabsOver"]) {
      const box = document.getElementById(id);
      box.innerHTML = "";
      const mk = (key, label, img, title) => {
        const b = document.createElement("button");
        b.className = "jobTab" + (key === boardJob ? " on" : "");
        b.dataset.job = key;
        b.title = title || label;
        if (img) {
          const im = document.createElement("img");
          im.src = "assets/" + img + "_right.png"; im.alt = title || "";
          b.appendChild(im);
        }
        if (label) b.appendChild(document.createTextNode(label));
        b.addEventListener("click", () => {
          if (boardJob === key) return;
          beep(760, .06, "square", .03);
          setBoardJob(key);
        });
        box.appendChild(b);
      };
      mk("all", "전체", null);
      for (const jid in JOBS) mk(jid, "", JOB_IMG[jid], JOBS[jid].nm);   // 아이콘만 — 한 줄에
    }
  }
  buildJobTabs();
  // 탭을 바꾸고(두 화면 모두) 목록을 다시 그린다
  /* 제목에 지금 보고 있는 직업을 넣는다 — 전체일 때는 넣지 않는다 */
  function syncBoardTitle() {
    const nm = boardJob !== "all" && JOBS[boardJob] ? JOBS[boardJob].nm + " " : "";
    for (const h of document.querySelectorAll(".boardTitle"))
      h.textContent = "🏆 이번 주 " + nm + "TOP 10";
  }
  function setBoardJob(key, els) {
    boardJob = key;
    for (const t of document.querySelectorAll(".jobTab"))
      t.classList.toggle("on", t.dataset.job === key);
    syncBoardTitle();
    return showBoards(els);
  }

  // 현재 탭에 맞는 목록을 두 순위표에 그린다
  async function showBoards(els) {
    els = els || [boardStart, boardOver];
    if (boardJob === "all") { els.forEach(el => renderBoard(el, topList)); return; }
    if (!jobLists[boardJob]) {
      els.forEach(el => renderBoard(el, null, "불러오는 중…"));
      try {
        jobLists[boardJob] = await fetchRange(weekStartMs(0), null, TOP_N, boardJob);
      } catch (e) {
        els.forEach(el => renderBoard(el, null, "직업별 랭킹을 불러오지 못했습니다"));
        return;
      }
    }
    if (boardJob !== "all") els.forEach(el => renderBoard(el, jobLists[boardJob]));
  }

  async function refreshBoards(target) {
    const els = target ? [target] : [boardStart, boardOver];
    const note = resetNote();
    noteStart.textContent = note;
    noteOver.textContent = note;
    if (!SB_ON) {
      els.forEach(el => renderBoard(el, null, "전체 랭킹 준비 중입니다"));
      return;
    }
    try {
      topList = await fetchTop();
      jobLists = {};                       // 새 기록이 있을 수 있으니 직업별 캐시도 비운다
      await showBoards(els);
    } catch (e) {
      els.forEach(el => renderBoard(el, null, "랭킹을 불러오지 못했습니다 (오프라인?)"));
    }
  }

  /* 판이 끝날 때 어떤 증강을 골랐는지 익명으로 남긴다.
     이름·기기 정보는 보내지 않고, 실패해도 게임에는 아무 영향이 없다. */
  function logRun(sc) {
    if (!SB_ON || testMode) return;    // 테스트 기록은 통계에 섞지 않는다
    const base = {
      score: Math.min(1000000000000, Math.max(0, sc)),   // 상한 1조
      level: level,
      secs: Math.round(elapsed),
      stars: starCount,
      augs: augCount,
      ver: GAME_VERSION        // 어느 버전에서 나온 기록인지
    };
    /* 오브젝트별 점수 비중(%) — 액수가 아니라 비중이라 판 길이와 무관하게 견줄 수 있다.
       칸이 없는 서버에서도 기록은 남아야 하므로 아래에서 이 칸부터 떼어 낸다. */
    const srcTot = SRC_KEYS.reduce((t, k) => t + (scoreSrc[k] || 0), 0);
    const srcPct = {};
    if (srcTot > 0) {
      for (const k of SRC_KEYS) {
        if (scoreSrc[k] > 0) srcPct[SRC_CODE[k]] = Math.round(scoreSrc[k] / srcTot * 1000) / 10;
      }
    }
    const nm = savedName();
    /* 직업·이름 칸이 아직 없는 서버에서도 기록은 남아야 하므로,
       400 이 오면 칸을 하나씩 빼며 다시 보낸다. */
    const withName = o => (nm ? Object.assign({ name: nm }, o) : o);
    const tries = [
      withName(Object.assign({ job: job, src: srcPct }, base)),   // 직업 + 이름 + 점수 비중
      withName(Object.assign({ job: job }, base)),   // src 칸이 없는 서버
      withName(base)                                  // 직업 칸도 없는 서버
    ];
    if (nm) tries.push(base);                         // 이름 칸도 없는 서버
    const send = body => fetch(SB_URL + "/rest/v1/" + SB_RUNS, {
      method: "POST",
      headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify(body),
      keepalive: true          // 창을 바로 닫아도 전송되도록
    });
    const go = i => {
      if (i >= tries.length) return;
      send(tries[i]).then(r => { if (r.status === 400) go(i + 1); }).catch(function () {});
    };
    try { go(0); } catch (e) {}
  }

  /* ---------- 개발자 통계 패널 ----------

  const AUG_NAMES = {};
  const AUG_HIDDEN = {};
  for (const a of AUGMENTS) { AUG_NAMES[a.id] = a.nm; AUG_HIDDEN[a.id] = !!a.hidden; }
  AUG_NAMES.gamble = "도박꾼(삭제됨)";   // 옛 기록 표시용

    /* 오브젝트별 점수 비중 — 판마다의 비중을 평균 낸 값이라
       점수가 큰 한두 판에 끌려가지 않는다. */

  // 버전별 표를 '지금 쓰는 마이너 버전만 자세히, 이전 마이너는 하나로' 묶는다.
  //  예) 현재가 v1.4.xx 면  v1.4.47 · v1.4.46 … 은 그대로 두고,
  //      v1.3.01~99 는 'v1.3' 한 줄로, v1.2.01~99 는 'v1.2' 한 줄로 합친다.
  //  v1.5 가 나오면 v1.4 가 자동으로 묶인다(따로 고칠 필요 없음).
  //  평균생존은 판수로 가중평균해서 합친다(단순 평균은 판수 1판짜리가 과대반영됨).
  function groupVers(list) {
    const parse = (t) => {
      const m = /^v?(\d+)\.(\d+)\.(\d+)/.exec(String(t || ""));
      return m ? { maj: +m[1], min: +m[2], pat: +m[3] } : null;
    };
    let top = null;                       // 가장 높은 마이너 버전(= 현재 버전대)
    for (const v of list) {
      const p = parse(v.ver);
      if (!p) continue;
      if (!top || p.maj > top.maj || (p.maj === top.maj && p.min > top.min)) top = p;
    }
    if (!top) return list;
    const keep = [], bucket = new Map();
    for (const v of list) {
      const p = parse(v.ver);
      if (!p) { keep.push(v); continue; }               // '(없음)' 같은 건 그대로
      if (p.maj === top.maj && p.min === top.min) { keep.push(v); continue; }
      const key = "v" + p.maj + "." + p.min;
      const b = bucket.get(key) || { ver: key, runs: 0, secs: 0, score: 0, _w: 0 };
      const runs = Number(v.runs) || 0;
      b.runs += runs;
      b._w += runs;
      b.secs += (Number(v.secs) || 0) * runs;           // 가중합
      b.score += (Number(v.score) || 0) * runs;
      bucket.set(key, b);
    }
    for (const b of bucket.values()) {
      b.secs = b._w ? Math.round(b.secs / b._w) : 0;
      b.score = b._w ? Math.round(b.score / b._w) : 0;
      delete b._w;
      keep.push(b);
    }
    const rank = (v) => {
      const p = parse(v.ver);
      if (p) return p.maj * 1e6 + p.min * 1e3 + p.pat;
      const m2 = /^v?(\d+)\.(\d+)$/.exec(String(v.ver || ""));
      return m2 ? +m2[1] * 1e6 + +m2[2] * 1e3 + 999 : -1;   // 묶음은 그 마이너의 맨 위
    };
    return keep.sort((a, b) => rank(b) - rank(a));
  }

    const vers = groupVers(data.vers || []);
    if (vers.length) {
      P.sum.appendChild(devSection("버전별",
        ["버전", "판수", "평균생존"],
        vers.map(v => [
          v.ver,
          { t: v.runs, c: "num" },
          { t: (v.secs || 0) + "초", c: "num" }
        ])));
    }

    const jb = data.jobs || [];
    if (jb.length) {
      P.sum.appendChild(devSection("직업별",
        ["직업", "판수", "평균점수", "최고점수", "평균생존"],
        jb.map(q => [
          JOB_NAMES[q.job] || q.job,
          { t: q.runs, c: "num" },

    }

    const rec = data.recent || [];
    const recSec = devSection("최근 20판",

        { t: (r.secs || 0) + "초", c: "num" },
        { t: augLabel(r.augs), c: "lft" }
      ]) : [["기록 없음", "", "", "", ""]]);
    recSec.querySelector("table").classList.add("tbRecent");
    P.rec.appendChild(recSec);

  }

  function canSubmit(sc) { return SB_ON && !testMode && sc > 0; }   // 테스트 점수는 랭킹에 올리지 않는다

  /* ---------- 그리기 ---------- */
  /* 한 단계 오를 때마다 지면에서 우주로 한 층씩 올라간다.

  const ZONES = [
    { nm: "잔디밭",     ic: "🌱", gr: "grass", cl: 1.00, st: 0,
      sky: [[137, 198, 255], [191, 224, 255], [233, 244, 255]] },

    { nm: "오로라 지대", ic: "🌈", gr: "metal", cl: 0.03, st: 0.78, au: 1,

    { nm: "중간권",     ic: "❄️", gr: "metal", cl: 0, st: 0.92, au: 0.35, mt: 1,

    { nm: "저궤도",     ic: "🌍", gr: "metal", cl: 0, st: 1, ea: 1,

    { nm: "달 궤도",    ic: "🌕", gr: "moon",  cl: 0, st: 1, mo: 1, ea: 0.25,

    { nm: "소행성대",   ic: "☄️", gr: "dark",  cl: 0, st: 1, rk: 1, mt: 0.6,
