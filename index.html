<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12131a">
<title>이피재피똥피</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='52' font-size='84' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%92%A9%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #12131a;
    color: #fff;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  body { position: fixed; inset: 0; }
  #app {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    /* 노치·둥근 모서리·홈바에 화면이 잘리지 않도록 */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 520px;
    max-height: 780px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  @media (min-width: 560px) and (min-height: 700px) { #stage { border-radius: 16px; } }
  canvas { display: block; width: 100%; height: 100%; }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(10px, 2.2vh, 16px);
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    text-align: center;
    background: rgba(10,11,16,.84);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .screen.hidden { display: none; }
  .screen { overflow-y: auto; }

  /* ---- 랭킹판 ---- */
  .board {
    width: 100%; max-width: 320px;
    background: rgba(255,255,255,.06);
    border-radius: 14px; padding: 12px 14px;
  }
  .board h3 {
    font-size: 13px; font-weight: 700; color: #ffd23f;
    letter-spacing: .5px; margin-bottom: 8px;
  }
  .board ol { list-style: none; }
  .board li {
    display: flex; align-items: center; gap: 8px;
    font-size: clamp(12px, 3.4vw, 14px);
    padding: 4px 0; color: #d5d8e2;
  }
  .board li + li { border-top: 1px solid rgba(255,255,255,.06); }
  .board .rk { width: 22px; text-align: center; flex: none; color: #8b90a0; font-weight: 700; }
  .board .nm {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left; color: #fff;
  }
  /* 4위 이하는 굵게 하지 않는다 — 굵기는 1~3위 전용 */
  .board .sc { flex: none; font-weight: 400; color: #ffd23f; font-variant-numeric: tabular-nums; }

  /* 1~3위는 금·은·동으로 따로 */
  .board li.p1, .board li.p2, .board li.p3 {
    margin: 3px 0; padding: 6px 8px; border-radius: 9px;
    border-left: 3px solid;
  }
  .board li.p1 + li, .board li.p2 + li, .board li.p3 + li { border-top: 0; }
  .board li.p1 {
    border-left-color: #ffcc33;
    background: linear-gradient(90deg, rgba(255,204,51,.26), rgba(255,204,51,.04));
    box-shadow: 0 0 14px rgba(255,204,51,.18);
  }
  .board li.p1 .nm { color: #ffe9a8; font-weight: 800; text-shadow: 0 0 10px rgba(255,204,51,.45); }
  .board li.p1 .sc { color: #ffcc33; font-size: 1.12em; font-weight: 800; text-shadow: 0 0 10px rgba(255,204,51,.4); }

  .board li.p2 {
    border-left-color: #cfd6e0;
    background: linear-gradient(90deg, rgba(207,214,224,.20), rgba(207,214,224,.03));
  }
  .board li.p2 .nm { color: #eef2f7; font-weight: 700; }
  .board li.p2 .sc { color: #dfe6ef; font-size: 1.05em; font-weight: 700; }

  .board li.p3 {
    border-left-color: #e0894a;
    background: linear-gradient(90deg, rgba(224,137,74,.20), rgba(224,137,74,.03));
  }
  .board li.p3 .nm { color: #ffd6b0; font-weight: 700; }
  .board li.p3 .sc { color: #f0a166; font-size: 1.03em; font-weight: 700; }

  .board li.p1 .rk, .board li.p2 .rk, .board li.p3 .rk { font-size: 1.15em; }
  /* 내 기록 강조 — 금·은·동 색을 덮지 않도록 테두리로만 표시 */
  .board li.me {
    outline: 2px solid rgba(255,210,63,.9);
    outline-offset: -2px;
    border-radius: 9px;
    padding: 5px 7px;
  }
  .board .empty { font-size: 13px; color: #7f8494; padding: 6px 0; }
  .board[hidden] { display: none; }
  .board.last { background: rgba(255,210,63,.09); }
  .board.last h3 { color: #ffe08a; }
  .board .note {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 11px; color: #7f8494;
  }

  /* ---- 시작 화면 이름 ---- */
  #nameBox { display: flex; align-items: center; gap: 8px; }
  #nameBox .who { font-size: 14px; color: #d5d8e2; }
  #nameBox .who b { color: #ffd23f; font-weight: 700; }
  #nameBox button, #nameEdit button {
    padding: 8px 14px; font-size: 13px; background: rgba(255,255,255,.14); color: #fff;
  }
  #nameEdit { display: none; align-items: center; gap: 8px; }
  #nameEdit.on { display: flex; }
  #nameBox.off { display: none; }
  #startName {
    font: inherit; font-size: 16px; width: 150px;
    padding: 9px 12px; border-radius: 11px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #startName:focus { outline: none; border-color: #ffd23f; }

  /* ---- 이름 등록 ---- */
  #nameRow { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #nameRow.on { display: flex; }
  #nameRow .tag {
    font-size: 14px; font-weight: 700; color: #ffd23f;
  }
  #nameForm { display: flex; gap: 8px; width: 100%; max-width: 320px; }
  #nameInput {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px;
    padding: 12px 14px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #nameInput::placeholder { color: #757a8a; }
  #nameInput:focus { outline: none; border-color: #ffd23f; }
  #btnSave { padding: 12px 20px; font-size: 15px; flex: none; }
  .screen h1 { font-size: clamp(26px, 7vw, 36px); letter-spacing: -1px; }
  .screen h2 { font-size: clamp(22px, 6vw, 30px); }
  .screen p { font-size: clamp(13px, 3.6vw, 15px); line-height: 1.6; color: #c8cbd6; }
  button {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700;
    font-size: clamp(16px, 4.4vw, 18px);
    color: #12131a; background: #ffd23f;
    padding: 14px 36px; border-radius: 999px;
    transition: transform .08s ease, filter .15s ease;
  }
  button:active { transform: scale(.96); }

  /* ---- 🌙 증강 선택 ---- */
  #augList { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
  .augCard {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 13px 15px; border-radius: 14px;
    background: rgba(255,255,255,.07);
    border: 2px solid rgba(255,255,255,.12);
    color: #fff; font: inherit; font-weight: 400;
    cursor: pointer; transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .augCard:hover { background: rgba(255,210,63,.14); border-color: #ffd23f; }
  .augCard:active { transform: scale(.97); }
  .augCard .ic { font-size: 30px; flex: none; line-height: 1; }
  .augCard .tx { flex: 1; min-width: 0; }
  .augCard .nm2 { font-size: 15px; font-weight: 700; color: #ffd23f; }
  .augCard .ds { font-size: 13px; color: #c8cbd6; margin-top: 2px; }
  .augCard .cnt {
    flex: none; font-size: 11px; font-weight: 700; color: #12131a;
    background: #ffd23f; border-radius: 999px; padding: 3px 8px;
  }
  #augScreen h2 { color: #ffd23f; }
  /* 히든 증강 — 조건을 만족했을 때만 후보에 오른다 */
  .augCard.hid {
    border-color: #c86bff;
    background: linear-gradient(90deg, rgba(200,107,255,.22), rgba(200,107,255,.06));
    box-shadow: 0 0 16px rgba(200,107,255,.25);
  }
  .augCard.hid:hover { background: rgba(200,107,255,.3); border-color: #d99cff; }
  .augCard.hid .nm2 { color: #e0b3ff; }
  .augCard .badge {
    flex: none; font-size: 10px; font-weight: 800; letter-spacing: .5px;
    color: #12131a; background: #c86bff; border-radius: 999px; padding: 3px 8px;
  }

  /* ---- 개발자 통계 패널 (제목 오른쪽 💩 → 비밀번호) ---- */
  #devDot, #testDot { cursor: pointer; }
  #testScreen { gap: 14px; }
  #testScreen h2 { font-size: 20px; color: #ffd23f; }
  #testRow { display: flex; gap: 8px; align-items: center; }
  #testPw {
    font: inherit; font-size: 16px; text-align: center; letter-spacing: 4px;
    padding: 11px 14px; border-radius: 12px; width: 160px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #testPw:focus { outline: none; border-color: #ffd23f; }
  #testGo { padding: 11px 18px; font-size: 14px; }
  #testMsg { font-size: 12px; color: #ff8f8f; min-height: 14px; }
  #btnTestEnd {
    position: absolute; right: 12px; top: 96px; z-index: 5; display: none;
    appearance: none; border: 0; cursor: pointer; font: inherit;
    font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(255,80,80,.8); border-radius: 999px; padding: 5px 11px;
  }
  #btnTestEnd.on { display: block; }
  #devScreen { justify-content: flex-start; padding-top: 28px; gap: 12px; }
  #devScreen h2 { font-size: 20px; color: #ffd23f; }
  #devPwRow { display: flex; gap: 8px; align-items: center; }
  #devPw {
    font: inherit; font-size: 16px; text-align: center; letter-spacing: 4px;
    padding: 11px 14px; border-radius: 12px; width: 160px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #devGo { padding: 11px 18px; font-size: 14px; }
  #devPw:focus { outline: none; border-color: #ffd23f; }
  #devBody { width: 100%; max-width: 340px; font-size: 12px; color: #d5d8e2; }
  #devBody .sec {
    background: rgba(255,255,255,.06); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  #devBody h4 { font-size: 12px; color: #ffd23f; margin-bottom: 6px; }
  #devBody table { width: 100%; border-collapse: collapse; }
  #devBody th, #devBody td { padding: 3px 2px; text-align: right; white-space: nowrap; }
  #devBody th { color: #8b90a0; font-weight: 600; font-size: 11px; }
  #devBody td:first-child, #devBody th:first-child { text-align: left; }
  #devBody .lft { text-align: left; white-space: normal; word-break: keep-all; }
  #devBody tr + tr td { border-top: 1px solid rgba(255,255,255,.06); }
  #devBody .num { color: #fff; font-variant-numeric: tabular-nums; }
  #devMsg { font-size: 12px; color: #ff8f8f; min-height: 14px; }
  #devBody .del {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 700;
    color: #fff; background: rgba(255,80,80,.5);
    border-radius: 7px; padding: 3px 8px;
  }
  #devBody .del:hover { background: rgba(255,80,80,.85); }
  #devBody .del:disabled { opacity: .4; cursor: default; }

  #ver {
    position: absolute;
    bottom: max(8px, env(safe-area-inset-bottom));
    right: 14px;
    font-size: 10px; letter-spacing: 1px;
    color: rgba(255,255,255,.22);
  }

  /* ─────────── 시작 화면 ─────────── */
  #startScreen { gap: clamp(8px, 1.8vh, 14px); }
  /* 화면 위쪽에 은은한 빛을 깔아 패널이 떠 보이게 한다 */
  #startScreen::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 55% at 50% 0%,   rgba(255,210,63,.14), transparent 60%),
      radial-gradient(90%  45% at 15% 30%,  rgba(120,90,255,.13), transparent 65%),
      radial-gradient(90%  45% at 85% 70%,  rgba(0,190,255,.10), transparent 65%);
  }
  #startScreen > * { position: relative; }

  #startScreen h1 {
    font-size: clamp(28px, 8vw, 40px);
    letter-spacing: -1.5px; line-height: 1.15;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  #startScreen h1 .ttl {
    background: linear-gradient(180deg, #fff 30%, #ffd98a 75%, #ffb52e 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 2px 14px rgba(255,190,60,.35));
  }
  #startScreen h1 #testDot, #startScreen h1 #devDot {
    font-size: .78em; opacity: .85;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
    transition: transform .18s ease;
  }
  #startScreen h1 #testDot:active, #startScreen h1 #devDot:active { transform: scale(.88); }

  /* 랭킹판 — 유리판 느낌 */
  #startScreen .board, #overScreen .board {
    max-width: 340px;
    padding: 14px 16px 12px;
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.09);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  #startScreen .board h3, #overScreen .board h3 {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding-bottom: 9px; margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    font-size: 12px; letter-spacing: 1px;
  }

  /* 4위 이하 순위 숫자를 동그란 배지로 */
  #startScreen .board li:not(.p1):not(.p2):not(.p3) .rk,
  #overScreen  .board li:not(.p1):not(.p2):not(.p3) .rk {
    width: 20px; height: 20px; line-height: 20px; border-radius: 50%;
    background: rgba(255,255,255,.07); color: #9aa0b4;
    font-size: 11px; font-weight: 700;
  }
  #startScreen .board li, #overScreen .board li { padding: 5px 0; }

  /* 1위 줄에 아주 느리게 빛이 흐른다 */
  .board li.p1 { position: relative; overflow: hidden; }
  .board li.p1::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.22) 46%, transparent 62%);
    transform: translateX(-120%);
    animation: shine 5.5s ease-in-out infinite;
  }
  @keyframes shine { 0%, 62% { transform: translateX(-120%); } 88%, 100% { transform: translateX(120%); } }

  .board .note {
    display: inline-block; margin-top: 10px; padding: 5px 11px;
    border: 0; border-radius: 999px;
    background: rgba(255,255,255,.055); color: #868c9e; font-size: 10.5px;
  }

  /* 플레이어 이름 — 알약 모양 */
  #nameBox {
    padding: 5px 5px 5px 14px; border-radius: 999px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.07);
  }
  #nameBox .who { font-size: 13px; color: #a8aec0; }
  #nameBox .who b { text-shadow: 0 0 12px rgba(255,210,63,.4); }
  #nameBox button, #nameEdit button { border-radius: 999px; }

  /* 시작 버튼 */
  #btnStart {
    margin-top: 2px;
    padding: 15px 46px;
    background: linear-gradient(180deg, #ffe07a, #ffc42e 55%, #f5a70f);
    box-shadow: 0 10px 26px rgba(255,180,40,.30), inset 0 1px 0 rgba(255,255,255,.7);
    letter-spacing: .5px;
    animation: breathe 3.4s ease-in-out infinite;
  }
  #btnStart:hover { filter: brightness(1.06); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 10px 26px rgba(255,180,40,.30), inset 0 1px 0 rgba(255,255,255,.7); }
    50%      { box-shadow: 0 12px 34px rgba(255,180,40,.48), inset 0 1px 0 rgba(255,255,255,.7); }
  }
  @media (prefers-reduced-motion: reduce) {
    #btnStart { animation: none; }
    .board li.p1::after { animation: none; opacity: 0; }
  }

  .big { font-size: clamp(38px, 11vw, 48px); font-weight: 800; color: #ffd23f; }
  .sub { font-size: 14px; color: #9aa0ae; }
  .hint {
    position: absolute; left: 0; right: 0;
    bottom: max(12px, env(safe-area-inset-bottom));
    font-size: 12px; color: #6d7383; text-align: center; padding: 0 16px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="btnTestEnd">테스트 종료</button>

    <div id="startScreen" class="screen">
      <div id="ver"></div>
      <h1><span id="testDot">💩</span> <span class="ttl">이피재피똥피</span> <span id="devDot">💩</span></h1>
      <div class="board">
        <h3>🏆 이번 주 TOP 10</h3>
        <ol id="boardStart"><li class="empty">불러오는 중…</li></ol>
        <div class="note" id="noteStart"></div>
      </div>
      <div class="board last" id="lastBoard" hidden>
        <h3 id="lastTitle">👑 지난주 명예의 전당</h3>
        <ol id="boardLast"></ol>
      </div>
      <div id="nameBox">
        <span class="who">플레이어 <b id="myName">-</b></span>
        <button id="btnEditName">수정</button>
      </div>
      <div id="nameEdit">
        <input id="startName" type="text" maxlength="12" placeholder="이름 (최대 12자)"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="btnSaveName">저장</button>
      </div>

      <button id="btnStart">시작하기</button>
    </div>

    <div id="devScreen" class="screen hidden">
      <h2>개발자 페이지</h2>
      <div id="devPwRow">
        <input id="devPw" type="password" inputmode="numeric" maxlength="16" autocomplete="off">
        <button id="devGo">확인</button>
      </div>
      <div id="devMsg"></div>
      <div id="devBody"></div>
      <button id="devClose">닫기</button>
    </div>

    <div id="testScreen" class="screen hidden">
      <h2>테스트 모드</h2>
      <div class="sub">목숨 무한 · 기록은 남지 않습니다</div>
      <div id="testRow">
        <input id="testPw" type="password" inputmode="numeric" maxlength="16" autocomplete="off">
        <button id="testGo">확인</button>
      </div>
      <div id="testMsg"></div>
      <button id="testClose">닫기</button>
    </div>

    <div id="augScreen" class="screen hidden">
      <h2 id="augTitle">⭐ 증강 선택 🌙</h2>
      <div id="augList"></div>
    </div>

    <div id="overScreen" class="screen hidden">
      <h2 id="overTitle">게임 오버!</h2>
      <div class="big" id="finalScore">0</div>
      <p id="rankLine"></p>

      <div id="nameRow">
        <div class="tag" id="nameTag">🎉 TOP 10 진입! 이름을 남기세요</div>
        <div id="nameForm">
          <input id="nameInput" type="text" maxlength="12" placeholder="이름 (최대 12자)"
                 autocomplete="off" autocorrect="off" spellcheck="false">
          <button id="btnSave">등록</button>
        </div>
      </div>

      <div class="board">
        <h3>🏆 이번 주 TOP 10</h3>
        <ol id="boardOver"><li class="empty">불러오는 중…</li></ol>
        <div class="note" id="noteOver"></div>
      </div>

      <button id="btnRetry">다시 하기</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* roundRect 미지원 브라우저(구형 사파리) 대비 */
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (typeof r === "number") r = [r, r, r, r];
      const [a, b, c, d] = r.length === 1 ? [r[0], r[0], r[0], r[0]] : r;
      this.moveTo(x + a, y);

      this.arcTo(x, y, x + w, y, a);
      this.closePath();
      return this;
    };

    const rect = stage.getBoundingClientRect();
    const bw = Math.max(1, rect.width), bh = Math.max(1, rect.height);
    const ratio = bw / bh;

    H = BASE_H;
    W = Math.round(H * ratio);
    if (W < MIN_W)      { W = MIN_W; H = Math.round(W / ratio); }
    else if (W > MAX_W) { W = MAX_W; H = Math.round(W / ratio); }

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);

    baseScale = dpr;

    player.x  = Math.max(player.r, Math.min(W - player.r, player.x));
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
    for (const it of items) it.x = Math.max(it.r, Math.min(W - it.r, it.x));

      ? "🌕 보름달! 증강 " + augTotal + "연속 (" + (augTotal - augRemain + 1) + "/" + augTotal + ")"
      : "⭐ 증강 선택 🌙";
    /* 보유 상한에 닿은 증강은 후보에서 빠진다.
       중첩할수록 효과가 0.7배씩 줄어서 4개쯤이면 더 먹을 이유가 없다.
       once 증강은 상한 1과 같다. */
    const pool = AUGMENTS.filter(a =>
      (augCount[a.id] || 0) < maxOf(a) && (!a.cond || a.cond()));
    // 뽑히는 가중치: 따로 지정한 값이 우선, 히든은 일반의 1/3, 나머지는 1
    const wOf = a => (a.w !== undefined ? a.w : (a.hidden ? (1 / 3) : 1));
    const picks = [];
    while (picks.length < 3 && pool.length) {
      let total = 0;
      for (const a of pool) total += wOf(a);
      let n = Math.random() * total, idx = pool.length - 1;
      for (let i = 0; i < pool.length; i++) {
        const w = wOf(pool[i]);
        if (n < w) { idx = i; break; }
        n -= w;
      }
      picks.push(pool.splice(idx, 1)[0]);
    }
    augList.innerHTML = "";
    for (const a of picks) {
      const card = document.createElement("button");
      card.className = "augCard";
      const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = a.ic;
      const tx = document.createElement("span"); tx.className = "tx";
      const nm = document.createElement("div");  nm.className = "nm2"; nm.textContent = nameOf(a);
      const ds = document.createElement("div");  ds.className = "ds";  ds.textContent = a.ds;
      tx.append(nm, ds);
      card.append(ic, tx);
      if (a.hidden) {
        card.classList.add("hid");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "히든";
        card.appendChild(badge);
      }
      if (augCount[a.id] && !a.noCount) {
        const cnt = document.createElement("span");
        cnt.className = "cnt";
        cnt.textContent = "보유 " + augCount[a.id];
        card.appendChild(cnt);
      }
      card.addEventListener("click", () => {
        const picked = nameOf(a);      // 보유 수가 오르기 전 = 카드에 적혀 있던 이름
        a.go();
        augCount[a.id] = (augCount[a.id] || 0) + 1;
        beep(900, .09, "square", .05);
        beep(1350, .13, "square", .05);
        augRemain--;
        if (augRemain > 0) {           // 보름달: 남은 횟수만큼 이어서 고른다
          showAugmentPick();
          return;

        augScreen.classList.add("hidden");
        state = STATE.PLAY;
        /* 증강을 고르는 동안 게임은 멈춰 있었지만 뚜니핑 타임·무적 시간은
           실제 시계로 재고 있어서 그대로 두면 고민한 만큼 깎여 나간다.
           멈춰 있던 시간만큼 마감 시각을 뒤로 밀어 원래 남은 시간을 돌려준다. */
        const paused = performance.now() - augPauseAt;
        if (powerUntil > 0) powerUntil += paused;
        if (invUntil  > 0) invUntil  += paused;
        if (hurtUntil > 0) hurtUntil += paused;
        // 멈춰 있던 똥이 코앞에 있을 수 있으니 0.5초 무적으로 빠져나갈 틈을 준다
        invUntil = Math.max(invUntil, performance.now() + 500);
        popText(player.x, player.y - 70, a.ic + " " + picked, "#ffd23f", 24);
      });
      augList.appendChild(card);
    }
    augScreen.classList.remove("hidden");

  let state = STATE.READY;

  /* 구름 하나하나의 생김새를 따로 만든다. 같은 덩이 세 개를 겹쳐 놓으면
     어느 구름이나 똑같아 보여서, 덩이 수와 크기·위치를 구름마다 뽑는다. */
  function reshapeCloud(c) {
    const n = 3 + Math.floor(Math.random() * 3);      // 덩이 3~5개
    c.lobes = [];
    let px = -c.s * (0.42 + Math.random() * 0.22);
    for (let i = 0; i < n; i++) {
      const mid = 1 - Math.abs(i - (n - 1) / 2) / (n / 1.6);   // 가운데가 더 봉긋하다
      c.lobes.push({
        dx: px,
        dy: (Math.random() - 0.65) * c.s * 0.16,
        r: c.s * (0.20 + 0.24 * Math.max(0.35, mid) + Math.random() * 0.10)
      });
      px += c.s * (0.24 + Math.random() * 0.20);
    }
    c.bw = c.s * (0.52 + Math.random() * 0.20);       // 바닥은 평평하게 깔린다
    c.bh = c.s * (0.14 + Math.random() * 0.09);
  }
  for (let i = 0; i < 7; i++) {
    const c = { x: Math.random() * W, y: Math.random() * H * .7,
                s: 26 + Math.random() * 64, v: 4 + Math.random() * 10 };
    reshapeCloud(c);
    clouds.push(c);
  }

  /* ---------- 스폰 ---------- */
  /* 뚜니핑 타임 낙하물 크기 등급 — 클수록 드물고 점수가 크다 */
  const FEVER_SIZES = [
    { min: 14, max: 18, score: 2,  w: 22 },
    { min: 18, max: 22, score: 3,  w: 22 },
    { min: 22, max: 26, score: 5,  w: 18 },
    { min: 26, max: 31, score: 8,  w: 14 },
    { min: 31, max: 37, score: 10, w: 11 },
    { min: 37, max: 44, score: 15, w: 8  },
    { min: 44, max: 52, score: 25, w: 5  },
    { min: 52, max: 62, score: 40, w: 3  }   // 초대형 — 가장 드물다
  ];
  // 대왕 뚜니핑 — 기존 최대(52~62)의 2배 크기, 점수는 최대 등급(75)의 3배
  const GIANT = { min: 104, max: 124, score: 110, w: 3, giant: true };
  function pickFeverSize() {
    const list = aug.giant > 0
      ? FEVER_SIZES.concat([{
          min: GIANT.min, max: GIANT.max,
          score: GIANT.score * (aug.legion ? 2 : 1),
          w: GIANT.w * aug.giant * (aug.legion ? 3 : 1),
          giant: true
        }])
      : FEVER_SIZES;
    const total = list.reduce((a, b) => a + b.w, 0);
    let n = Math.random() * total;
    for (const s of list) { if (n < s.w) return s; n -= s.w; }
    return list[0];
  }

  /* 레벨이 오를수록 좁아지는 똥 사이 간격. 바닥(상한) 없이 계속 좁아지되,
     0.13초부터는 곱셈으로 줄여서 0 아래로 내려가지 않는다. */
  function spawnGap() {
    // 레벨당 좁아지는 폭을 완화했다 (레벨 1 간격은 그대로)
    const lin = 0.512 - level * 0.03402;
    return lin > 0.13 ? lin : 0.13 * Math.pow(0.919, level - 11.23);
  }

  /* 낙하 각도. 좌우 속도를 낙하 속도에 비례시켜서 레벨이 올라도 기울기 느낌이 일정하다.
     (Math.random() - Math.random()) 은 0 근처가 흔하고 양 끝이 드문 삼각분포 →
     대부분은 적당히 기울고 일부만 크게 비스듬히 떨어진다. */
  const SPREAD_POOP  = 0.22;   // 최대 약 12도
  const SPREAD_BONUS = 0.28;   // 아이템은 조금 얌전하게 (약 16도)

  const FEVER_VY = 245;      // 뚜니핑 낙하물 기준 속도 — 레벨이 올라도 그대로 유지한다

  /* 레벨 7부터 섞여 나오는 까다로운 똥들
     split  = 내려오다 둘로 쪼개진다 (쪼개진 조각은 평범한 똥)
     zigzag = 좌우로 크게 흔들리며 내려온다
     laser  = 1초간 떨어질 자리를 깜빡여 알려준 뒤 번개처럼 내리꽂힌다
     huge   = 초대형 뚜니핑의 1.4배쯤 되는 거대한 똥, 느리게 굴러떨어진다 */
  const SPECIAL_KINDS = ["split", "zigzag", "laser", "huge"];
  const HUGE_R = 66;           // 반지름 — 초대형(52~62)의 약 1.26배
  const LASER_WARN = 1;        // 예고 시간(초)
  const LASER_VY = 4500;       // 낙하 속도 — 똥이 아니라 레이저처럼 내리꽂힌다
  let warns = [];              // 예고 중인 레이저 자리

  function spawnPoop(mul, special, forceX, forceAng) {
    const m = (mul || 1) * (H / BASE_H);   // 화면이 길면 그만큼 빨리 떨어져야 체감이 같다
    // 뚜니핑 타임에 나온 것은 외형·점수를 스스로 기억한다 → 뚜니핑 타임이 끝나도 모습이 바뀌지 않는다
    const inFever = fever;
    const cls = inFever ? pickFeverSize() : null;
    let r = (cls ? cls.min + Math.random() * (cls.max - cls.min)
                 : 12.6 + Math.random() * 11.7) * aug.poopMul;   // 기본 크기 10% 축소
    if (special === "huge") r = (HUGE_R + Math.random() * 13) * aug.poopMul;   // 초거대 똥
    r = Math.min(r, (W - 24) / 2);        // 화면보다 커지지 않게
    // 일반 똥은 레벨이 오를수록 빨라지지만, 뚜니핑 낙하물은 처음이나 나중이나 같은 속도로 떨어진다
    const baseVy = inFever ? FEVER_VY + Math.random() * 110
                           : 221 + level * 24.3 + Math.random() * 110;   // 레벨당 상승폭 완화
    let vy = baseVy * m * DIFF_F * spaceF() * bhMul() * aug.fallMul;
    if (special === "huge") vy *= 0.55;   // 덩치값 — 느릿느릿 굴러떨어진다
    let px = r + Math.random() * (W - r * 2);

    if (special === "laser") {                // 예고한 선을 그대로 따라 내려온다
      px = forceX;

      vy = sp * Math.cos(forceAng || 0);
      pvx = sp * Math.sin(forceAng || 0);

    items.push({
      type: "poop", emoji: "💩",
      x: px, y: -r - 10,
      r: r * (special === "huge" ? 0.70 : 0.82),
      vx: pvx,
      vy: vy,
      rot: special === "laser" ? 0 : Math.random() * 6.28,
      vr: special === "laser" ? 0 : (Math.random() - .5) * 5,
      size: r * 2, sz: r, fast: m > 1,
      skin: inFever ? "fever" : "poop",
      space: inSpace(),
      special: special || null,
      bumpCd: 0,                             // 정연핑과 부딪힌 직후의 무반응 시간
      phase: Math.random() * 6.28,
      splitAt: H * (0.14 + Math.random() * 0.20),   // 분열똥이 쪼개지는 높이 (화면 위쪽)
      sz0: 0,
      face: Math.floor(Math.random() * 8),   // 표정 장식 (0~1은 기본 얼굴)
      gain: cls ? cls.score : 0,
      giant: !!(cls && cls.giant)
    });
  }
  const BONUS = [
    { type: "moon",     emoji: "🌙", w: 84 },   // 증강 선택 — 가장 자주 나온다
    { type: "fullmoon", emoji: "🌕", w: 6  },   // 보름달 — 증강 3연속. 초승달의 10%
    { type: "paper",    emoji: "🧻", w: 26 },
    { type: "umbrella", emoji: "☂️", w: 22 },
    { type: "star",     emoji: "⭐", w: 73 },
    { type: "heart",    emoji: "❤️", w: 24 }   // 너무 안 나와서 상향
  ];
  /* 아이템은 종류마다 자기 타이머로 따로 굴러간다.
     각자의 평균 간격 = 기본 10초 ÷ 그 아이템의 비중 → 전체 등장 빈도는 예전과 같지만
     서로 독립이라 운이 맞으면 두세 개가 한꺼번에 쏟아진다. */
  /* 각 아이템의 평균 간격은 이 고정 기준값으로 계산한다.
     실제 가중치 합을 쓰면 별 하나를 올릴 때 다른 아이템까지 덩달아 드물어진다.
     기준을 고정해두면 별은 독립적으로 자주 나오고 나머지는 영향을 받지 않는다. */
  const BONUS_W_TOTAL = 204;
  const BONUS_BASE = 6.82;                // 아이템 전체의 평균 등장 간격(초)

  function bonusInterval(b) {
    const lvFactor = Math.max(0.5, 1 / (1 + (level - 1) * 0.06));   // 레벨이 오르면 더 자주
    // 블랙홀 안에서는 아이템도 두 배로 자주 나온다
    const mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul * lvFactor / bhMul();
    /* 평균 간격을 중심으로 ±25% 안에서만 흔들린다.
       판마다 개수가 들쭉날쭉하지 않도록 폭을 좁혔다 (별 기준 한 판에 7~9개).
       종류별로 타이머가 따로 도는 건 그대로라 여러 개가 한꺼번에 나오는 일은 여전히 생긴다.
       (0.4초 하한은 완전히 겹쳐 떨어지는 것만 막는 장치) */
    return Math.max(0.4 / bhMul(), mean * (0.75 + Math.random() * 0.50));
  }
  function resetBonusTimers() {
    // 판이 시작될 때 첫 등장까지는 편차가 큰 지수분포로 — 매판 시작이 다르게 느껴지도록
    const lvFactor = 1;
    for (const b of BONUS) {
      const mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul * lvFactor;
      b.t = Math.max(0.4, -mean * Math.log(1 - Math.random()));
    }
  }

  function spawnBonus(picked) {
    let pick = picked;
    if (pick.type === "heart" && lives >= aug.maxLives) {
      pick = BONUS.find(b => b.type === "star");    // 목숨 꽉 차면 별로 대체
    }
    const r = 20;
    // 낙하 속도에 변화를 주되, 너무 빠르면 못 먹고 지나가버려서 위쪽을 눌러 잡았다
    const vy = (110 + level * 6) * (H / BASE_H) * (0.6 + Math.random() * 0.5);
    items.push({
      type: pick.type, emoji: pick.emoji,
      x: r + Math.random() * (W - r * 2), y: -r - 10,
      r: r,
      vx: (Math.random() - Math.random()) * vy * SPREAD_BONUS,
      vy: vy,
      rot: 0, vr: 0, size: r * 2, bob: Math.random() * 6.28,
      born: elapsed          // 배고픈 정연핑이 몇 초 뒤에 출발할지 재는 기준
    });
  }

  // 점과 선분 사이의 최단 거리
  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay;
    const len2 = vx * vx + vy * vy;
    let t = len2 ? ((px - ax) * vx + (py - ay) * vy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, sp = 60 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                       life: .6 + Math.random() * .4, t: 0, c: color, r: 2 + Math.random() * 4 });
    }
  }
  function popText(x, y, text, color, size) {
    floats.push({ x, y, text, color, t: 0, life: 1, size: size || 22 });
  }

  /* ---------- 업데이트 ---------- */
  function update(dt, now) {
    for (const c of clouds) {
      c.x += c.v * dt;
      if (c.x - c.s > W) {
        c.x = -c.s * 1.6;
        c.y = Math.random() * H * .7;
        c.s = 26 + Math.random() * 64;
        c.v = 4 + Math.random() * 10;
        reshapeCloud(c);                              // 다시 나올 땐 다른 모양으로
      }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt; p.vy += 700 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.life) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt; f.y -= 40 * dt;
      if (f.t > f.life) floats.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    if (feverFlash > 0) feverFlash = Math.max(0, feverFlash - dt * 2.5);

    const wasFever = fever;
    fever = state === STATE.PLAY && now < powerUntil;
    // 겹쳐 먹어 남은 시간이 한 번 분량을 넘으면 게이지가 넘치므로 1로 묶는다
    feverT = fever ? Math.min(1, (powerUntil - now) / feverDur) : 0;
    // 뚜니핑 타임 끝나는 순간엔 화면이 똥으로 가득 차 있으니 1초 무적으로 숨 돌릴 틈을 준다
    if (wasFever && !fever && state === STATE.PLAY) {
      invUntil = Math.max(invUntil, now + 1500);
      for (let i = items.length - 1; i >= 0; i--) {
        if (items[i].giant) {                     // 대왕은 피할 수 없는 크기라 같이 사라진다
          burst(items[i].x, items[i].y, "#c86bff", 26);
          items.splice(i, 1);
        }
      }
      popText(player.x, player.y - 70, "휴… 세이프", "#fff");
      beep(520, .12, "triangle", .04);
    }

    if (state !== STATE.PLAY) return;

    elapsed += dt;
    /* 레벨 시계는 뚜니핑 타임 동안 멈춘다. 무적으로 낙하물을 줍는 시간까지
       레벨에 포함되면, 정작 실력으로 버틴 시간이 아닌데도 난이도가 올라간다. */
    if (!fever) levelTime += dt;
    level = 1 + Math.floor(levelTime / 12);   // 레벨 하나당 12초
    score += dt * Math.pow(1.7, level - 1) * aug.timeMul * scoreMul();  // 생존 점수: 레벨마다 1.7배

    // 한 단계 올라설 때마다 어디에 도착했는지 알려준다
    const zi = zoneIdx();
    if (zi !== zoneShown) {
      if (zoneShown >= 0) {
        popText(W / 2, H * 0.40, ZONES[zi].ic + " " + ZONES[zi].nm, "#cfe4ff", 30);
        beep(760, .1, "sine", .05);
        beep(1140, .14, "sine", .04);
        if (zi === SPACE_Z) {          // 공기가 없는 높이 — 우주복으로 갈아입는다
          popText(W / 2, H * 0.48, "🧑‍🚀 우주복 착용!", "#ffd23f", 26);
          beep(520, .16, "triangle", .05);
        }
        if (zi === BH_Z) {             // 빨려 들어갔다 — 모든 것이 두 배
          popText(W / 2, H * 0.48, "모든 것이 2배!", "#ff8a5c", 28);
          shake = Math.max(shake, 26);
          feverFlash = Math.max(feverFlash, 0.5);
          beep(90, .5, "sawtooth", .07);
          beep(140, .4, "square", .05);
        }
      }
      zoneShown = zi;
    }

    const kSpeed = 560 * dt;
    if (keys.ArrowLeft  || keys.a || keys.A) player.tx -= kSpeed;
    if (keys.ArrowRight || keys.d || keys.D) player.tx += kSpeed;
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));

    const prev = player.x;
    // 손가락을 반대편에 찍어도 순간이동하지 않도록 최고 속도를 제한한다
    const want = (player.tx - player.x) * Math.min(1, dt * 20);
    const maxStep = PLAYER_MAX_SPEED * dt;
    player.x += Math.max(-maxStep, Math.min(maxStep, want));
    if (player.x - prev < -0.25) facing = "left";
    else if (player.x - prev > 0.25) facing = "right";   // 멈춰 있으면 마지막 방향 유지
    player.tilt += (((player.x - prev) / Math.max(dt, .001) / 900) - player.tilt) * Math.min(1, dt * 10);
    player.tilt = Math.max(-.35, Math.min(.35, player.tilt));

    player.hy = headOffset(currentSprite(now));

    // ---- 레이저똥 예고: 2초를 세고 그 자리에 내리꽂는다 ----
    for (let k = warns.length - 1; k >= 0; k--) {
      const wn = warns[k];
      wn.t -= dt;
      if (wn.t <= 0) {
        spawnPoop(1, "laser", wn.x, wn.ang);
        beep(180, .16, "sawtooth", .06);
        warns.splice(k, 1);
      }
    }

    // ---- 유령화: 6초마다 1.5초씩 몸이 사라진다 ----
    if (aug.ghost) {
      ghostTimer -= dt;
      if (ghostTimer <= 0) {
        ghostTimer = 6;
        invUntil = Math.max(invUntil, now + 1500);
        popText(player.x, player.y - 60, "👻 유령화", "#cfe4ff");
        beep(520, .1, "sine", .04);
        beep(700, .12, "sine", .03);
      }
    }

    // ---- 우산 로켓배송: 방패가 하나도 없을 때만 시간을 재서 하나 배송한다 ----
    if (aug.steelUmb) {
      if (shields <= 0) {
        shieldTimer -= dt;
        if (shieldTimer <= 0) {
          shields = 1;
          shieldTimer = 5;
          popText(player.x, player.y - 60, "☔ 우산 도착!", "#7ec8ff");
          beep(880, .12, "triangle", .05);
        }
      } else {
        shieldTimer = 5;
      }
    }

    // ---- 도와줘 정연핑 ----
    if (aug.helper > 0) {
      // 1명이면 4초, 2명이면 5.5초, 3명이면 7초… 인원이 늘수록 주기도 함께 길어진다
      const cycle = 2.5 + 1.5 * aug.helper;
      helperTimer -= dt;
      if (helperTimer <= 0 && helperQueue <= 0) {
        helperTimer = cycle;
        helperQueue = aug.helper;                 // 이번 차례 출격 인원
        helperGap = 0;                            // 첫 명은 바로
      }
      if (helperQueue > 0) {
        helperGap -= dt;
        if (helperGap <= 0) {
          // 한 차례 안에서 인원을 고르게 나눠 내보낸다 (2명 = 4초에 2명, 3명 = 5초에 3명)
          helperGap = cycle / aug.helper;
          helperQueue--;
          const fromLeft = Math.random() < 0.5;   // 아래 좌/우에서 비스듬히 솟아오른다
          // 수직에서 8~34도 사이. 너무 눕히면 옆으로 금방 빠져나가서 범위를 좁혔다
          const speed = 744 + Math.random() * 216;   // 기존 620~800 에서 20% 빠르게
          const ang = (8 + Math.random() * 26) * Math.PI / 180;
          helpers.push({
            x: fromLeft ? -30 + Math.random() * (W * 0.45)
                        : W + 30 - Math.random() * (W * 0.45),
            y: H + 60,
            vx: (fromLeft ? 1 : -1) * speed * Math.sin(ang),
            vy: -speed * Math.cos(ang)
          });
          beep(760, .12, "triangle", .05);
          beep(1140, .14, "triangle", .04);
        }
      }
    }
    for (let k = helpers.length - 1; k >= 0; k--) {
      const hp = helpers[k];
      hp.x += hp.vx * dt;
      hp.y += hp.vy * dt;
      smashPoopsAround(hp.x, hp.y, HELPER_R * helperScale());   // 지나가는 자리의 똥
      if (hp.y < -HELPER_H - 40 || hp.x < -160 || hp.x > W + 160) helpers.splice(k, 1);
    }

    // ---- 배고픈 정연핑: 아이템이 뜨고 3초 뒤에 화면 아래 중앙에서 출발 ----
    if (aug.hungry) {
      for (const it of items) {
        if (it.type === "poop" || it.claimed) continue;
        if (elapsed - it.born >= FETCH_DELAY) {
          it.claimed = true;
          fetchers.push({ x: W / 2, y: H + 50, vx: 0, vy: -FETCH_SPEED, t: it });
          beep(660, .1, "sine", .05);
          beep(990, .12, "sine", .04);
        }
      }
    }
    for (let k = fetchers.length - 1; k >= 0; k--) {
      const f = fetchers[k];
      const alive = items.indexOf(f.t) >= 0;
      let dx = 0, dy = -1;
      if (alive) { dx = f.t.x - f.x; dy = f.t.y - f.y; }   // 목표가 사라지면 그대로 위로 빠진다
      const d = Math.hypot(dx, dy) || 1;
      f.vx = dx / d * FETCH_SPEED;
      f.vy = dy / d * FETCH_SPEED;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      smashPoopsAround(f.x, f.y, HELPER_R * helperScale());   // 가는 길의 똥도 부순다
      if (alive && Math.hypot(f.t.x - f.x, f.t.y - f.y) < HELPER_R * 0.9) {
        const idx = items.indexOf(f.t);
        if (idx >= 0) items.splice(idx, 1);
        fetchers.splice(k, 1);
        burst(f.x, f.y, "#ffd23f", 24);
        if (collectItem(f.t, now)) return;    // 달이면 화면이 멈춘다
        continue;
      }
      if (f.y < -HELPER_H * 2 || f.x < -260 || f.x > W + 260) fetchers.splice(k, 1);
    }

    const powered = now < powerUntil;      // 🔥 뚜니핑 타임

    // 화면이 좁으면 그만큼 똥도 덜 떨어지게(체감 난이도 유지)
    const widthFactor = 480 / W;
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (powered) {
        // 뚜니핑 타임: 똥이 폭포처럼 쏟아지고 속도도 2배 이상
        const n = 3 + Math.floor(Math.random() * 4);   // 스폰당 3~6개 (평균 4.5개)
        // 증강으로 낙하량이 늘면 화면 상한도 같이 올려야 늘린 만큼이 깎이지 않는다
        const cap = Math.min(220, Math.round(100 / aug.feverRateMul));
        if (items.length < cap) {
          for (let k = 0; k < n; k++) spawnPoop(2.2 + Math.random() * 0.9);
        }
        spawnTimer = (0.14 / 1.3) * aug.feverRateMul * widthFactor;   // 간격 ÷1.3 → 낙하량 +30%
      } else {
        spawnPoop();
        if (level >= 3 && Math.random() < .35) spawnPoop();
        if (level >= 6 && Math.random() < .30) spawnPoop(1.6);   // 초고속 똥
        // 까다로운 똥 — 레벨 7에 아주 드물게 시작해서 레벨마다 조금씩 늘어난다
        if (level >= 7 && Math.random() < Math.min(1, (level - 6) * 0.0293)) {
          const kind = SPECIAL_KINDS[Math.floor(Math.random() * SPECIAL_KINDS.length)];
          if (kind === "huge" && items.some(q => q.special === "huge")) {
            spawnPoop();                  // 이미 하늘에 하나 있으면 평범한 똥으로
          } else if (kind === "laser") {
            // 바로 떨어뜨리지 않고 자리를 먼저 알려준다 (예고는 동시에 여러 개도 가능)
            if (warns.length < 3) {
              /* 떨어질 지점을 먼저 정하고, 기울기를 골라 위쪽 진입점을 역산한다.
                 진입점이 화면 밖으로 너무 나가면 기울기를 그만큼 줄인다. */
              const L = H - GROUND_H;
              const tx = 30 + Math.random() * Math.max(1, W - 60);
              const ang = (Math.random() - Math.random()) * 0.62;   // 최대 약 35도
              let ex = tx - Math.tan(ang) * L;
              ex = Math.max(-20, Math.min(W + 20, ex));
              warns.push({ x: ex, ang: Math.atan((tx - ex) / L), t: LASER_WARN });
              beep(1500, .06, "sine", .03);
            }
          } else {
            spawnPoop(1, kind);
          }
        }
        spawnTimer = spawnGap() / DIFF_F / spaceF() / bhMul() * widthFactor * (0.7 + Math.random() * 0.6);
      }
    }
    if (!powered) {
      for (const b of BONUS) {           // 종류별로 따로 세다가 각자 때가 되면 떨어진다
        b.t -= dt;
        if (b.t <= 0) {
          spawnBonus(b);
          b.t = bonusInterval(b);
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.bumpCd > 0) it.bumpCd -= dt;
      if (it.special === "split") {
        // 정해진 높이까지 내려오면 둘로 쪼개진다. 조각은 평범한 똥이라 정연핑이 부술 수 있다.
        if (it.y > it.splitAt) {
          const r2 = it.sz * 0.62;
          for (const dir of [-1, 1]) {
            /* 좌우로 벌어지는 각도와 속도를 조각마다 따로 뽑는다.
               늘 같은 폭으로 갈라지면 한 번 외우면 끝이라 재미가 없다. */
            const ang = dir * (0.22 + Math.random() * Math.random() * 1.15);   // 세로 기준 12~78도
            const sp = it.vy * (0.82 + Math.random() * 0.45);
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: Math.sin(ang) * sp, vy: Math.cos(ang) * sp,
              rot: Math.random() * 6.28, vr: (Math.random() - .5) * 5,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", space: it.space, special: null, bumpCd: 0, phase: 0, splitAt: 0,
              sz0: 0, face: Math.floor(Math.random() * 8), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#c86bff", 20);
          beep(300, .08, "square", .04);
          items.splice(i, 1);
          continue;
        }
      } else if (it.special === "zigzag") {
        // 흔들리는 속도·폭도 '느린 하늘'의 영향을 받는다 (세로만 느려지면 더 촘촘해져서 어색하다)
        it.phase += dt * 3.0 * aug.fallMul;
        it.vx = Math.sin(it.phase) * 230 * aug.fallMul;
      }
      const prevX = it.x, prevY = it.y;      // 한 프레임에 크게 움직이면 스쳐 지나갈 수 있다
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.rot += it.vr * dt;
      if (it.special !== "laser") {          // 레이저는 예고한 선을 그대로 지나간다
        if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx); }
        if (it.x > W - it.r) { it.x = W - it.r; it.vx = -Math.abs(it.vx); }
      }
      if (it.bob !== undefined) it.bob += dt * 4;

      const cy = player.y + player.hy;
      const dx = it.x - player.x, dy = it.y - cy;
      if (aug.blackhole && it.type === "poop" && it.skin === "fever") {
        // 뚜니핑 낙하물은 가까이 왔을 때만 살짝 끌어당긴다 (전부 빨아들이면 너무 세다)
        const d = Math.hypot(dx, dy), R = 130;
        if (d < R && d > 1) {
          const pull = 250 * dt * (1 - d / R);
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.5;
        }
      }
      if (aug.magnet > 0 && it.type !== "poop") {
        const d = Math.hypot(dx, dy);
        if (d < aug.magnet && d > 1) {
          const pull = 520 * dt * (1 - d / aug.magnet) + 60 * dt;
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.55;
        }
      }
      /* 맞는 판정은 줍는 판정보다 좁다. 아이템은 잘 잡히면서 똥은 살짝 스쳐도 넘어가도록,
         맞는 쪽만 10% 줄여 뒀다 (.78 → .702). */
      const dmg = it.type === "poop" && !powered && it.skin !== "fever";
      // 끝점만 보면 빠른 똥이 캐릭터를 뛰어넘을 수 있어서, 이번 프레임에 지나온 선분과의 거리를 본다
      const hit = segDist(player.x, cy, prevX, prevY, it.x, it.y)
                  < it.r + player.r * (dmg ? .702 : .78) * aug.hitboxMul;

      if (hit) {
        if (it.type === "poop") {
          // 뚜니핑 타임 낙하물은 타임이 끝난 뒤에도 먹을 수 있다.
          // (끝나는 순간 화면에 떠 있던 것들이 그냥 스쳐 지나가면 아까우니까)
          if (powered || it.skin === "fever") {
            // 크기가 곧 점수. 뚜니핑 타임 중 생성된 건 자기 점수를 갖고 있고,
            // 뚜니핑 타임 전에 떨어지던 일반 똥은 크기로 환산한다.
            const gain = feverGain(it);
            let tone, burstN, note, textSize;
            if (gain >= 110)     { tone = "#c86bff"; burstN = 80; note = 2200; textSize = 48; }
            else if (gain >= 40) { tone = "#ff2170"; burstN = 54; note = 2000; textSize = 40; }
            else if (gain >= 25) { tone = "#ff3b3b"; burstN = 42; note = 1800; textSize = 34; }
            else if (gain >= 15) { tone = "#ff6a2a"; burstN = 34; note = 1650; textSize = 30; }
            else if (gain >= 10) { tone = "#ff8f3a"; burstN = 26; note = 1500; textSize = 27; }
            else if (gain >= 8)  { tone = "#ffcc33"; burstN = 18; note = 1350; textSize = 24; }
            else if (gain >= 5)  { tone = "#ffd23f"; burstN = 12; note = 1150; textSize = 22; }
            else                 { tone = "#ffe3a8"; burstN = 8;  note = 900;  textSize = 22; }
            score += gain;
            burst(it.x, it.y, tone, burstN);
            // 큰 건 항상, 중간은 절반만 표시 — 작은 건 화면이 지저분해지니 생략
            if (gain >= 8 || (gain >= 5 && Math.random() < .5)) {
              popText(it.x, it.y, "+" + gain, tone, textSize);
            }
            if (gain >= 15) {
              shake = Math.max(shake, gain >= 110 ? 32 : (gain >= 40 ? 22 : (gain >= 25 ? 16 : 10)));
            }
            items.splice(i, 1);
            if (gain >= 25 || Math.random() < .5) beep(note + Math.random() * 200, .06, "square", .04);
            continue;
          }
          /* 무적 여부는 이 자리에서 그때그때 확인해야 한다.
             프레임 앞에서 한 번만 재어 두면, 같은 프레임에 똥 두 개가 겹쳐 닿았을 때
             첫 번째로 무적이 걸렸는데도 두 번째가 그대로 들어와 방패가 두 개 깨진다. */
          if (now >= invUntil) {
            if (shields > 0) {
              shields--;
              invUntil = now + 1500;        // 목숨을 잃었을 때와 같은 무적 시간
              shake = Math.max(shake, 14);
              burst(it.x, it.y, "#7ec8ff", 20);
              popText(player.x, player.y - 60, "☂️ 방어!", "#7ec8ff");
              beep(400, .12, "triangle", .06);
              if (navigator.vibrate) navigator.vibrate(60);
            } else {
              if (!testMode) lives--;      // 테스트 모드는 맞아도 목숨이 줄지 않는다
              invUntil = now + 1500;
              hurtUntil = now + 1500;   // 무적 시간 동안 아픈 그림으로
              shake = 22; flash = 1;
              burst(it.x, it.y, "#8a5a2b", 22);
              popText(player.x, player.y - 60, "으악!", "#ff5d5d");
              beep(140, .25, "sawtooth", .07);
              if (lives <= 0) { items.splice(i, 1); return gameOver(); }
            }
            items.splice(i, 1);
            continue;
          }
        } else {
          items.splice(i, 1);
          if (collectItem(it, now)) return;   // 달이면 화면이 멈추므로 여기서 끝
          continue;
        }
      }

      if (it.y - it.r > H + 20) {
        // 뚜니핑 타임 낙하물은 워낙 많이 쏟아져서, 안 먹고 흘려보낸 것에 점수를 주면
        // 가만히 있어도 점수가 폭등한다. 뚜니핑 타임 것은 0점 — 직접 받아야만 점수가 오른다.
        if (it.type === "poop" && it.skin !== "fever") score += 3 * scoreMul();
        items.splice(i, 1);
      }
    }
  }

  /* 아이템 효과 적용. 플레이어가 직접 먹을 때와 '배고픈 정연핑'이 대신 먹을 때 모두 쓴다.
     달을 먹으면 게임이 멈추므로 true 를 돌려주고, 부른 쪽은 그 프레임 처리를 중단한다. */
  function collectItem(it, now) {
    if (it.type === "paper") {
      feverDur = 10000 + aug.feverBonus;
      // 이미 뚜니핑 중이면 남은 시간에 이어붙인다 (초기화하면 남은 시간이 버려진다)
      powerUntil = Math.max(powerUntil, now) + feverDur;
      feverFlash = 1;
      popText(player.x, player.y - 70, "🔥 뚜니핑 타임!", "#ffd23f", 26);
      beep(700, .1, "square", .05);
      beep(1100, .12, "square", .05);
      beep(1500, .18, "square", .05);
      if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
    }
    if (it.type === "umbrella") {
      shields = Math.max(shields, Math.min(shields + 1, 3));   // 아이템으로는 3개까지 누적
      popText(player.x, player.y - 60, "☂️ 방패!", "#7ec8ff");
      beep(900, .12, "triangle", .05);
    }
    if (it.type === "star") {
      // 먹을 때마다 1.5배: 1번째 1,000 → 2번째 1,500 → 3번째 2,250 → 4번째 3,375 …
      starCount++;
      const gain = Math.round(1000 * Math.pow(1.5, starCount - 1) * aug.starMul * scoreMul());
      score += gain;
      popText(it.x, it.y, "⭐×" + starCount + "  +" + gain.toLocaleString(), "#ffd23f");
      beep(1400, .1, "square", .05);
      beep(1750, .12, "square", .04);
      if (aug.starburst) {
        // 화면의 똥을 전부 없애고, 각각 제 점수의 10배를 받는다 (까다로운 똥도 함께)
        let cnt = 0, bonus = 0;
        for (let k = items.length - 1; k >= 0; k--) {
          const q = items[k];
          if (q.type !== "poop") continue;
          bonus += ((q.skin === "fever") ? feverGain(q) : 3 * scoreMul()) * 10;
          burst(q.x, q.y, "#ffe9a8", 10);
          items.splice(k, 1);
          cnt++;
        }
        if (cnt) {
          score += bonus;
          invUntil = Math.max(invUntil, now + 1500);   // 쓸어낸 직후 다시 쏟아지므로 숨 돌릴 틈
          shake = Math.max(shake, 18);
          feverFlash = Math.max(feverFlash, 0.7);
          popText(player.x, player.y - 110,
                  "🌠 " + cnt + "개 쓸어버림 +" + Math.round(bonus).toLocaleString(), "#ffe9a8", 26);
          beep(2000, .18, "square", .05);
        }
      }
    }
    if (it.type === "moon" || it.type === "fullmoon") {
      const full = it.type === "fullmoon";
      burst(it.x, it.y, full ? "#ffe9a8" : "#cfe4ff", full ? 40 : 20);
      if (full) { flash = 0; feverFlash = 1; shake = Math.max(shake, 14); }
      openAugment(full ? 3 : 1);     // 보름달은 3연속 선택
      return true;
    }
    if (it.type === "heart") {
      lives = Math.min(aug.maxLives, lives + 1);
      popText(it.x, it.y, "❤️ +1", "#ff8fb0");
      beep(1000, .15, "sine", .06);
    }
    burst(it.x, it.y, "#ffd23f", 16);
    return false;
  }

  /* 뚜니핑 낙하물 점수. 크기 등급 점수에 레벨 보정을 곱한다.
     레벨이 하나 오를 때마다 10%씩 (레벨1 기준, 레벨10이면 약 2.4배). */
  function feverGain(it) {
    const base = it.gain || (it.sz < 16.2 ? 2 : (it.sz < 20.7 ? 5 : 10));
    /* 레벨이 오를수록 낙하물 값이 커진다. 1.1배로는 생존 점수(레벨당 1.7배)에
       한참 못 미쳐서 후반에 뚜니핑 타임이 있으나 마나였다 — 1.3배로 올렸다. */
    return Math.max(1, Math.round(base * aug.feverScoreMul * scoreMul() * Math.pow(1.3, level - 1)));
  }

  // 정연핑이 지나간 자리의 똥을 부순다 (뚜니핑 낙하물은 제 점수를 그대로 준다)
  function smashPoopsAround(x, y, radius) {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.type !== "poop") continue;
      if (Math.hypot(it.x - x, it.y - y) >= radius + it.r) continue;
      if (it.special) {
        /* 까다로운 똥은 부수지 못한다. 대신 종류마다 다르게 반응하고,
           정연핑은 부딪힌 자리를 그대로 지나간다. */
        if (it.bumpCd > 0) continue;
        it.bumpCd = 0.4;
        if (it.special === "split") {
          it.splitAt = -1;                   // 그 자리에서 곧바로 쪼개진다
        } else if (it.special === "zigzag") {
          it.phase += Math.PI;               // 흔들리던 방향이 뒤집힌다
          it.vx = -it.vx;
          burst(it.x, it.y, "#46d7ff", 14);
          beep(520, .07, "square", .04);
        } else if (it.special === "huge") {
          const r2 = it.sz * 0.42;           // 셋으로 쪼개진다 (조각은 평범한 똥)
          for (const dir of [-1, 0, 1]) {
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: dir * (170 + Math.random() * 90) * aug.fallMul, vy: it.vy * 1.4,
              rot: Math.random() * 6.28, vr: (Math.random() - .5) * 5,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", space: it.space, special: null, bumpCd: 0, phase: 0, splitAt: 0,
              sz0: 0, face: Math.floor(Math.random() * 8), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#ff963c", 28);
          beep(240, .12, "square", .05);
          shake = Math.max(shake, 10);
          items.splice(i, 1);
        }
        continue;                            // 레이저는 아무 반응 없이 지나간다
      }
      if (it.skin === "fever") {
        const g = feverGain(it);
        score += g;
        burst(it.x, it.y, g >= 25 ? "#ff3b3b" : "#ffd23f", g >= 25 ? 30 : 16);
        if (g >= 15) popText(it.x, it.y, "+" + g, "#ffd23f", g >= 40 ? 30 : 24);
      } else {
        score += 3 * scoreMul();
        burst(it.x, it.y, "#ffd23f", 14);
      }
      items.splice(i, 1);
    }
  }

  function gameOver() {
    state = STATE.OVER;
    augScreen.classList.add("hidden");
    const s = Math.floor(score);
    burst(player.x, player.y, "#8a5a2b", 40);
    shake = 30;
    elFinal.textContent = s.toLocaleString();
    elTitle.textContent = "게임 오버!";
    elRank.textContent = rankOf(s);
    overScreen.classList.remove("hidden");
    beep(220, .4, "sawtooth", .06);
    if (navigator.vibrate) navigator.vibrate(120);

    logRun(s);                 // 증강 통계 수집 (화면에는 아무것도 보이지 않는다)

    // 전체 랭킹: 최신 TOP 10을 다시 받아보고 진입했으면 이름 입력을 띄운다
    pendingScore = s; pendingLevel = level;
    myRowKey = null;
    nameRow.classList.remove("on");
    btnSave.disabled = false;
    btnSave.textContent = "등록";
    nameTag.textContent = "🎉 TOP 10 진입! 이름을 남기세요";
    refreshBoards(boardOver).then(async () => {
      if (state !== STATE.OVER || !qualifies(s)) return;
      const r = topList.findIndex(v => s > v.score);
      const rank = (r < 0 ? topList.length + 1 : r + 1);
      const nm = savedName();
      if (nm) {
        // 이름을 미리 정해뒀으면 곧바로 등록한다
        nameRow.classList.add("on");
        nameForm.style.display = "none";
        nameTag.textContent = "🎉 이번 주 " + rank + "위 등록 중…";
        try {
          await submitScore(nm, pendingScore, pendingLevel);
          myRowKey = nm + "|" + pendingScore;
          await refreshBoards(boardOver);
          refreshBoards(boardStart);
          /* 한 기기당 한 줄만 남기 때문에, 예전 기록이 더 높으면 이번 판은 순위표에
             올라가지 않는다. 실제로 올라갔을 때만 달성 문구를 띄운다. */
          const at = topList.findIndex(v => v.name + "|" + Number(v.score) === myRowKey);
          if (at < 0) nameRow.classList.remove("on");
          else nameTag.textContent = "🎉 이번 주 " + (at + 1) + "위 달성! (" + nm + ")";
        } catch (e) {
          nameTag.textContent = "등록 실패 — 아래에서 다시 시도해주세요";
          nameForm.style.display = "";
          nameInput.value = nm;
        }
      } else {
        // 이름이 없으면 예전처럼 여기서 입력받는다
        nameRow.classList.add("on");
        nameForm.style.display = "";
        nameInput.value = "";
        nameTag.textContent = "🎉 " + rank + "위 진입! 이름을 남기세요";
      }
    });
  }
  /* 기기마다 한 번 만들어 저장해두는 식별자.
     같은 기기에서 여러 번 잘해도 순위표에는 가장 높은 기록 하나만 오른다. */
  const deviceId = (function () {
    try {
      let d = localStorage.getItem(LS_DEV);
      if (!d) {
        d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(LS_DEV, d);
      }
      return d;
    } catch (e) {
      return "d" + Math.random().toString(36).slice(2, 12);
    }
  })();

  /* ---------- 전체 랭킹 (Supabase) ---------- */
  // 이 게임 전용 Supabase 프로젝트 정보 (Settings → API 에서 복사)
  // 비워두면 랭킹 기능만 꺼지고 게임은 그대로 돌아간다.
  const SB_URL   = "https://osfbhhdpqdydbkgbgmat.supabase.co";
  const SB_KEY   = "sb_publishable_IOCUMux3jedTRKdTSGvDdg_1YCPmMw0";
  const SB_TABLE = "ddongpi_scores";
  const SB_RUNS  = "ddongpi_runs";     // 플레이 기록(증강 통계). 익명 키로는 쓰기만 되고 조회 불가
  const TOP_N    = 10;
  const SB_ON    = !!(SB_URL && SB_KEY);   // 설정 전에는 랭킹만 꺼지고 게임은 정상 동작

  const boardStart = document.getElementById("boardStart");
  const boardOver  = document.getElementById("boardOver");
  const nameRow    = document.getElementById("nameRow");
  const nameTag    = document.getElementById("nameTag");
  const nameInput  = document.getElementById("nameInput");
  const nameForm   = document.getElementById("nameForm");
  const btnSave    = document.getElementById("btnSave");

  let topList = [];
  let myRowKey = null;   // 방금 등록한 내 기록 강조용

  function sbHeaders(extra) {
    return Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }, extra || {});
  }

  /* 랭킹은 매주 월요일 0시(한국시간)에 새로 시작한다.
     기록을 지우는 게 아니라 '이번 주 것만' 보여주는 방식이라 초기화가 실패할 일이 없다.
     보는 사람 폰의 시간대와 무관하게 항상 한국시간 기준으로 계산한다. */
  const KST = 9 * 60 * 60 * 1000;
  function weekStartMs(weeksAgo) {                        // 0 = 이번 주, 1 = 지난주
    const k = new Date(Date.now() + KST);                 // UTC 값으로 읽으면 한국 벽시계
    const mondayIndex = (k.getUTCDay() + 6) % 7;          // 월=0 … 일=6
    const kstMidnight = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(),
                                 k.getUTCDate() - mondayIndex - (weeksAgo || 0) * 7);
    return kstMidnight - KST;                             // 실제 UTC 시각
  }
  function kstDateLabel(ms) {                             // "8.10" 형태
    const k = new Date(ms + KST);
    return (k.getUTCMonth() + 1) + "." + k.getUTCDate();
  }
  function resetNote() {
    const left = weekStartMs(0) + 7 * 24 * 3600 * 1000 - Date.now();
    const d = Math.floor(left / 86400000);
    const h = Math.floor(left / 3600000) % 24;
    const m = Math.floor(left / 60000) % 60;
    const remain = d > 0 ? d + "일 " + h + "시간" : (h > 0 ? h + "시간 " + m + "분" : m + "분");
    return "월요일 0시에 새로 시작 · 초기화까지 " + remain;
  }

  async function fetchRange(fromMs, toMs, limit) {
    // 기기별 최고 기록만 남기는 건 SQL 함수 쪽에서 처리한다 (한 사람이 순위를 도배하지 않도록)
    try {
      const res = await fetch(SB_URL + "/rest/v1/rpc/ddongpi_top", {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({
          since: new Date(fromMs).toISOString(),
          until: toMs ? new Date(toMs).toISOString() : null,
          lim: limit
        })
      });
      if (res.ok) return await res.json();
    } catch (e) { /* 아래 방식으로 넘어간다 */ }
    // 함수가 아직 없으면 예전처럼 표에서 바로 읽는다 (기기 중복 제거는 안 됨)
    let url = SB_URL + "/rest/v1/" + SB_TABLE +
      "?select=name,score,level,created_at" +
      "&created_at=gte." + encodeURIComponent(new Date(fromMs).toISOString());
    if (toMs) url += "&created_at=lt." + encodeURIComponent(new Date(toMs).toISOString());
    url += "&order=score.desc,created_at.asc&limit=" + limit;
    const r2 = await fetch(url, { headers: sbHeaders() });
    if (!r2.ok) throw new Error("HTTP " + r2.status);
    return r2.json();
  }

  function fetchTop() {
    return fetchRange(weekStartMs(0), null, TOP_N);
  }

  // 지난주 1~3위 — 기록이 있을 때만 시작 화면에 띄운다
  async function refreshLastWeek() {
    const lastBoard = document.getElementById("lastBoard");
    if (!SB_ON) return;
    const from = weekStartMs(1), to = weekStartMs(0);
    try {
      const list = await fetchRange(from, to, 3);
      if (!list.length) { lastBoard.hidden = true; return; }
      document.getElementById("lastTitle").textContent =
        "👑 지난주 명예의 전당 (" + kstDateLabel(from) + "~" + kstDateLabel(to - 1) + ")";
      renderBoard(document.getElementById("boardLast"), list);
      lastBoard.hidden = false;
    } catch (e) {
      lastBoard.hidden = true;
    }
  }

  async function submitScore(name, sc, lv) {
    // DB 제약(최대 1억점)에 걸려 등록이 실패하지 않도록 방어
    const base = {
      name: name,
      score: Math.min(100000000, Math.max(0, sc)),
      level: lv
    };
    /* 아래 두 값은 나중에 추가한 컬럼이라 DB에 아직 없을 수 있다.
       컬럼이 없으면 요청 전체가 거부되므로, 실패하면 기본 항목만으로 다시 보낸다. */
    const tries = [
      Object.assign({}, base, { device: deviceId, augs: augCount }),
      Object.assign({}, base, { device: deviceId }),
      base
    ];
    let lastErr = "";
    for (const body of tries) {
      const res = await fetch(SB_URL + "/rest/v1/" + SB_TABLE, {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify(body)
      });
      if (res.ok) return;
      lastErr = "HTTP " + res.status + " " + (await res.text()).slice(0, 120);
      if (res.status !== 400) break;      // 컬럼 문제(400)일 때만 다시 시도한다
    }
    throw new Error(lastErr);
  }

  function renderBoard(el, list, msg) {
    el.innerHTML = "";
    if (msg) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = msg;
      el.appendChild(li);
      return;
    }
    if (!list.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "이번 주 기록이 아직 없습니다. 첫 주인공이 되어보세요!";
      el.appendChild(li);
      return;
    }
    const medal = ["🥇", "🥈", "🥉"];
    list.forEach((row, i) => {
      const li = document.createElement("li");
      const cls = [];
      if (i < 3) cls.push("p" + (i + 1));                                   // 금·은·동
      if (myRowKey && row.name + "|" + row.score === myRowKey) cls.push("me");
      li.className = cls.join(" ");
      const rk = document.createElement("span");
      rk.className = "rk";
      rk.textContent = i < 3 ? medal[i] : (i + 1);
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = row.name;               // textContent → HTML 삽입 불가
      const sc = document.createElement("span");
      sc.className = "sc";
      sc.textContent = Number(row.score).toLocaleString();
      li.append(rk, nm, sc);
      el.appendChild(li);
    });
  }

  const noteStart = document.getElementById("noteStart");
  const noteOver  = document.getElementById("noteOver");

  async function refreshBoards(target) {
    const els = target ? [target] : [boardStart, boardOver];
    const note = resetNote();
    noteStart.textContent = note;
    noteOver.textContent = note;
    if (!SB_ON) {
      els.forEach(el => renderBoard(el, null, "전체 랭킹 준비 중입니다"));
      return;
    }
    try {
      topList = await fetchTop();
      els.forEach(el => renderBoard(el, topList));
    } catch (e) {
      els.forEach(el => renderBoard(el, null, "랭킹을 불러오지 못했습니다 (오프라인?)"));

  /* 판이 끝날 때 어떤 증강을 골랐는지 익명으로 남긴다.
     이름·기기 정보는 보내지 않고, 실패해도 게임에는 아무 영향이 없다. */
  function logRun(sc) {
    if (!SB_ON || testMode) return;    // 테스트 기록은 통계에 섞지 않는다
    try {
      fetch(SB_URL + "/rest/v1/" + SB_RUNS, {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify({
          score: Math.min(100000000, Math.max(0, sc)),
          level: level,
          secs: Math.round(elapsed),
          stars: starCount,
          augs: augCount,
          ver: GAME_VERSION        // 어느 버전에서 나온 기록인지
        }),
        keepalive: true          // 창을 바로 닫아도 전송되도록
      }).catch(function () {});
    } catch (e) {}
  }

  /* ---------- 개발자 통계 패널 ----------
     제목 오른쪽 💩 을 누르고 비밀번호를 넣으면 집계를 보여준다.
     원본 기록은 익명 키로 못 읽고, 비밀번호가 맞을 때만 서버 함수가 집계를 돌려준다. */
  const AUG_NAMES = {};
  for (const a of AUGMENTS) AUG_NAMES[a.id] = a.nm;   // 통계 화면에서 id 대신 이름으로 보여준다
  const devScreen = document.getElementById("devScreen");
  const devPw     = document.getElementById("devPw");
  const devBody   = document.getElementById("devBody");
  const devMsg    = document.getElementById("devMsg");

  function devRow(cells, tag) {
    const tr = document.createElement("tr");
    for (const c of cells) {
      const td = document.createElement(tag || "td");
      if (typeof c === "object") { td.textContent = c.t; td.className = c.c || ""; }
      else td.textContent = c;
      tr.appendChild(td);
    }
    return tr;
  }
  function devSection(title, head, rows) {
    const box = document.createElement("div");
    box.className = "sec";
    const h = document.createElement("h4");
    h.textContent = title;
    box.appendChild(h);
    const tb = document.createElement("table");
    if (head) tb.appendChild(devRow(head, "th"));
    for (const r of rows) tb.appendChild(devRow(r));
    box.appendChild(tb);
    return box;
  }

  // {star50:2, lucky:1} → "별빛 증폭 x2, 행운"
  function augLabel(augs) {
    const keys = Object.keys(augs || {});
    if (!keys.length) return "-";
    return keys.map(k => (AUG_NAMES[k] || k) + (augs[k] > 1 ? " x" + augs[k] : "")).join(", ");
  }

  function renderDevStats(data) {
    devBody.innerHTML = "";
    const su = data.summary || {};
    devBody.appendChild(devSection("전체 요약", null, [
      ["총 플레이", { t: (su.runs || 0) + "판", c: "num" }],
      ["평균 점수", { t: Number(su.avg_score || 0).toLocaleString(), c: "num" }],
      ["최고 점수", { t: Number(su.max_score || 0).toLocaleString(), c: "num" }],
      ["평균 생존", { t: (su.avg_secs || 0) + "초", c: "num" }],
      ["평균 별 개수", { t: su.avg_stars || 0, c: "num" }]
    ]));

    const augs = data.augs || [];
    devBody.appendChild(devSection("증강별 채택 (판수 순)",
      ["증강", "판수", "중첩", "평균점수"],
      augs.length ? augs.map(a => [
        AUG_NAMES[a.id] || a.id,
        { t: a.picks, c: "num" },
        { t: a.stack, c: "num" },
        { t: Number(a.score || 0).toLocaleString(), c: "num" }
      ]) : [["기록 없음", "", "", ""]]));

    const vers = data.vers || [];
    if (vers.length) {
      devBody.appendChild(devSection("버전별",
        ["버전", "판수", "평균점수", "평균생존"],
        vers.map(v => [
          v.ver,
          { t: v.runs, c: "num" },
          { t: Number(v.score || 0).toLocaleString(), c: "num" },
          { t: (v.secs || 0) + "초", c: "num" }
        ])));
    }

    const rec = data.recent || [];
    devBody.appendChild(devSection("최근 20판",
      ["점수", "생존", "버전", "증강"],
      rec.length ? rec.map(r => [
        { t: Number(r.score || 0).toLocaleString(), c: "num" },
        { t: (r.secs || 0) + "초", c: "num" },
        { t: r.ver || "-", c: "num" },
        { t: augLabel(r.augs), c: "lft" }
      ]) : [["기록 없음", "", "", ""]]));
  }

  function kstStamp(iso) {                      // "8.19 14:03" 형태 (한국시간)
    const k = new Date(new Date(iso).getTime() + KST);
    const p2 = n => (n < 10 ? "0" + n : "" + n);
    return (k.getUTCMonth() + 1) + "." + k.getUTCDate() + " " +
           p2(k.getUTCHours()) + ":" + p2(k.getUTCMinutes());
  }

  /* ---------- 개발자 테스트 모드 ----------
     제목 왼쪽 💩 → 비밀번호 → 목숨 무한으로 시작한다.
     비밀번호는 개발자 통계와 같은 것을 쓰고, 확인은 서버에서 한다 (코드에 적어두지 않는다). */
  const testScreen = document.getElementById("testScreen");
  const testPw     = document.getElementById("testPw");
  const testMsg    = document.getElementById("testMsg");
  const testGo     = document.getElementById("testGo");

  document.getElementById("testDot").addEventListener("click", () => {

    testPw.focus();
  });
  document.getElementById("testClose").addEventListener("click", () => {
    testScreen.classList.add("hidden");
  });
  testPw.addEventListener("keydown", e => {
    e.stopPropagation();                       // 스페이스로 게임이 시작되지 않도록
    if (e.key === "Enter") { e.preventDefault(); testStart(); }

  testGo.addEventListener("click", testStart);

  async function testStart() {
    const pw = testPw.value.trim();
    if (!pw) { testPw.focus(); return; }

    testGo.disabled = true;
    let ok = false;
    try {
      const res = await fetch(SB_URL + "/rest/v1/rpc/ddongpi_stats", {
        method: "POST",
        headers: sbHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ pw: pw })
      });
      ok = res.ok;
      if (!ok) testMsg.textContent = "비밀번호가 틀렸습니다";
    } catch (e) {
      testMsg.textContent = "확인하지 못했습니다";
    }
    testGo.disabled = false;
    if (!ok) { testPw.value = ""; testPw.focus(); return; }
    testMsg.textContent = "";
    testPw.value = "";
    testScreen.classList.add("hidden");
    reset(true);
  }

  btnTestEnd.addEventListener("click", () => {
    testMode = false;
    btnTestEnd.classList.remove("on");
    state = STATE.READY;
    augScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  });

  /* 화면에 보이는 이번 주 TOP 10 을 기준으로만 판단한다.
     내 지난 기록이 더 높든 낮든 상관없이, 지금 점수가 순위표에 들어갈 점수면 등록할 수 있다. */
  function qualifies(sc) {
    if (!SB_ON || testMode || sc <= 0) return false;   // 테스트 점수는 랭킹에 올리지 않는다
    if (topList.length < TOP_N) return true;
    return sc > topList[topList.length - 1].score;
  }

  async function saveMyScore() {
    const name = nameInput.value.trim().slice(0, 12);
    if (!name) { nameInput.focus(); return; }

      try { localStorage.setItem(LS_NAME, name); } catch (e) {}
      showNameView();

  btnSave.addEventListener("click", saveMyScore);
  nameInput.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); saveMyScore(); }
  });

  refreshBoards();
  refreshLastWeek();

  /* 칭호. 지면에서 블랙홀까지의 여정에 맞춰 다시 잡았다.
     주석의 초는 그 점수에 닿는 대략의 생존 시간(점수 모형 계산값). */
  function rankOf(s) {
    if (s < 1000)    return "🚽 똥밭에 굴렀다";           // ~28초
    if (s < 3500)    return "🧻 그래도 휴지는 챙겼다";     // ~57초
    if (s < 9000)    return "🏃 제법 잘 피하는데?";        // ~87초
    if (s < 25000)   return "🛰️ 궤도 진입 성공";           // ~122초
    if (s < 65000)   return "🌌 심우주 유영자";            // ~154초
    if (s < 180000)  return "👑 똥피하기 마스터";          // ~181초
    if (s < 600000)  return "⚫ 사건의 지평선을 넘은 자";   // ~210초
    return "💩 똥신(糞神) 강림";
  }

  /* ---------- 그리기 ---------- */
  /* 한 단계 오를 때마다 지면에서 우주로 한 층씩 올라간다.
     sky = [하늘 위, 중간, 아래] 색, gr = 발밑 지형,
     cl 구름 / st 별 / au 오로라 / mt 유성 / ea 지구 / mo 달 / nb 성운 / rk 떠도는 바위 (0~1). */
  const ZONES = [
    { nm: "잔디밭",     ic: "🌱", gr: "grass", cl: 1.00, st: 0,
      sky: [[137, 198, 255], [191, 224, 255], [233, 244, 255]] },

    { nm: "오로라 지대", ic: "🌈", gr: "metal", cl: 0.03, st: 0.78, au: 1,
      sky: [[  8,  18,  58], [ 16,  42,  94], [ 30,  72, 122]] },
    { nm: "중간권",     ic: "❄️", gr: "metal", cl: 0, st: 0.92, au: 0.35, mt: 1,
      sky: [[  6,  12,  40], [ 10,  24,  64], [ 18,  38,  86]] },
    { nm: "카르만 선",  ic: "🛰️", gr: "metal", cl: 0, st: 1, mt: 0.5, ea: 0.6,
      sky: [[  3,   6,  22], [  6,  12,  38], [ 12,  24,  58]] },
    { nm: "저궤도",     ic: "🌍", gr: "metal", cl: 0, st: 1, ea: 1,
      sky: [[  2,   4,  14], [  4,   8,  24], [  8,  16,  40]] },
    { nm: "달 궤도",    ic: "🌕", gr: "moon",  cl: 0, st: 1, mo: 1, ea: 0.25,
      sky: [[  1,   2,   8], [  2,   5,  15], [  5,   9,  24]] },
    { nm: "소행성대",   ic: "☄️", gr: "dark",  cl: 0, st: 1, rk: 1, mt: 0.6,
      sky: [[  2,   2,  10], [  5,   4,  17], [  9,   8,  26]] },
    { nm: "은하수",     ic: "🌌", gr: "dark",  cl: 0, st: 1, nb: 1, rk: 0.3,
      sky: [[ 10,   4,  30], [ 26,   9,  54], [ 44,  15,  74]] },
    { nm: "심우주",       ic: "🌑", gr: "void", cl: 0, st: 1, nb: 0.6, mt: 0.8, bh: 0.10,
      sky: [[  0,   0,   0], [  2,   2,   9], [  5,   4,  16]] },
    { nm: "어둠의 문턱",   ic: "🌒", gr: "void", cl: 0, st: 1, nb: 0.35, mt: 0.5, bh: 0.30,
      sky: [[  2,   0,   6], [  6,   2,  14], [ 12,   4,  20]] },
    { nm: "강착원반",     ic: "🌀", gr: "void", cl: 0, st: 0.8, nb: 0.15, mt: 0.3, bh: 0.55,
      sky: [[  6,   0,   6], [ 14,   3,  14], [ 26,   6,  18]] },
    { nm: "사건의 지평선", ic: "⚫", gr: "void", cl: 0, st: 0.5, mt: 0.15, bh: 0.80,
      sky: [[ 10,   0,   4], [ 22,   4,  10], [ 40,   8,  14]] },
    { nm: "블랙홀 안",    ic: "🕳️", gr: "void", cl: 0, st: 0, bh: 1.5, sw: 1,
      sky: [[  0,   0,   0], [  0,   0,   0], [  0,   0,   0]] }
  ];
  const LAST_Z = ZONES.length - 1;
  const BH_Z = LAST_Z;                 // 블랙홀 안 — 여기부터 모든 조건이 두 배
  function inBlackhole() { return zoneIdx() >= BH_Z; }
  function bhMul() { return inBlackhole() ? 2 : 1; }
  function scoreMul() { return aug.scoreMul * bhMul(); }

  function zoneIdx() { return Math.min(LAST_Z, level - 1); }
  // 지금 단계와 다음 단계 사이의 진행도 — 색이 뚝 끊기지 않고 이어지도록
  function zoneFrac() {
    const i = level - 1;
    if (i >= LAST_Z) return 0;
    return Math.max(0, Math.min(1, levelTime / 12 - i));
  }
  // 두 단계 사이를 이어 구한 값 (색이면 rgb 문자열, 숫자면 숫자)
  function zv(key, i) {
    const a = ZONES[zoneIdx()], b = ZONES[Math.min(LAST_Z, zoneIdx() + 1)], f = zoneFrac();
