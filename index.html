<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>이피재피똥피</title>
<link rel="preload" as="image" href="assets/studio.webp">
<link rel="preload" as="image" href="assets/logo.webp">
<link rel="preload" as="image" href="assets/bg/title.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='52' font-size='84' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%92%A9%3C/text%3E%3C/svg%3E">
<style>
  /* 나눔바른고딕 — 흔히 쓰는 한글 5,362자만 남겨 받아 둔 것(둘이 합쳐 426KB).
     빠진 글자는 아래 대체 글꼴이 받아 준다. 파일을 함께 올려 두어 오프라인에서도 나온다. */
  @font-face {
    font-family: "NanumBarunGothic";
    src: url("assets/fonts/nbg-400.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "NanumBarunGothic";
    src: url("assets/fonts/nbg-700.woff2") format("woff2");
    font-weight: 600 900; font-style: normal; font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #07070f;
    color: #fff;
    font-family: "NanumBarunGothic", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  body { position: fixed; inset: 0; }
  #app {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    /* 놀이판 밖(비율 여백·노치·상태표시줄 자리)은 그림 없이 네온 격자와 빛만 둔다.
       무늬가 눈에 걸리지 않아야 놀이판이 도드라진다. 위는 분홍, 아래는 하늘빛으로
       은은하게 물들여 아케이드 기계 안을 들여다보는 느낌만 준다. */
    background:
      radial-gradient(120% 55% at 50% 0%, rgba(255,62,165,.20), transparent 62%),
      radial-gradient(90% 45% at 50% 100%, rgba(53,240,255,.16), transparent 66%),
      repeating-linear-gradient(90deg, rgba(53,240,255,.06) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(0deg,  rgba(53,240,255,.05) 0 1px, transparent 1px 26px),
      #07070f;
    background-repeat: no-repeat, no-repeat, repeat, repeat, repeat;
    /* 노치·둥근 모서리·홈바에 화면이 잘리지 않도록 */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  /* 놀이판 가장자리는 아케이드 화면처럼 네온으로 두른다 */
  canvas {
    box-shadow: 0 0 0 1px rgba(53,240,255,.35), 0 0 26px rgba(53,240,255,.22);
  }
  @media (min-width: 900px) and (min-height: 700px) { #stage { border-radius: 16px; } }
  canvas {
    display: block;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(10px, 2.2vh, 16px);
    padding: calc(max(20px, env(safe-area-inset-top)) + var(--lby, 0px))
             calc(20px + var(--lbx, 0px))
             calc(max(20px, env(safe-area-inset-bottom)) + var(--lby, 0px));
    text-align: center;
    /* 아케이드 네온 — 검정 바탕에 아주 옅은 주사선 (blur 대신 불투명도로: 매 프레임 블러는 발열이 크다) */
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
      rgba(5,6,13,.93);
  }
  .screen.hidden { display: none; }
  .screen { overflow-y: auto; }

  /* ---- 랭킹판 ---- */
  .board {
    width: 100%; max-width: 460px;
    background: rgba(255,255,255,.06);
    border-radius: 14px; padding: 9px 11px;
  }
  .board h3 {
    font-size: 13px; font-weight: 700; color: #ffd23f;
    letter-spacing: .5px; margin-bottom: 5px;
  }
  .board ol { list-style: none; }
  .board li {
    display: flex; align-items: center; gap: 8px;
    font-size: clamp(12px, 3.4vw, 14px);
    padding: 4px 0; color: #d5d8e2;
  }
  .board li + li { border-top: 1px solid rgba(255,255,255,.06); }
  .board .rk { width: 22px; text-align: center; flex: none; color: #8b90a0; font-weight: 700; }
  .board .nm {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left; color: #fff;
  }
  /* 4위 이하는 굵게 하지 않는다 — 굵기는 1~3위 전용 */
  .board .sc { flex: none; font-weight: 400; color: #ffd23f; font-variant-numeric: tabular-nums; }
  .board .sc img.jic { width: 22px; height: 28px; object-fit: contain; vertical-align: -8px; margin-right: 5px; }

  /* 4~6위(셋), 7~10위(넷)는 세로 미니 카드로 한 줄에 담는다 */
  .board li.duo, .board li.five { display: flex; gap: 5px; padding: 3px 0; }
  .board .mini {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: rgba(53,240,255,.07); border: 1px solid rgba(53,240,255,.22);
    border-radius: 3px; padding: 4px 3px;
  }
  .board .mini img.jic2 { width: 22px; height: 28px; object-fit: contain; }
  .board li.five .mini img.jic2 { width: 20px; height: 25px; }
  .board .mini .mn {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 10px; color: #dfe3ee;
    /* 이모지(🍀·❤)가 섞이면 줄이 높아져 판 크기가 흔들린다 — 높이를 못 박는다 */
    line-height: 1.4; height: 1.4em;
  }
  .board .mini .mn b { color: #7f93b5; font-weight: 700; margin-right: 2px; }
  .board .mini .ms { font-size: 12px; font-weight: 700; color: #ffd23f; font-variant-numeric: tabular-nums; line-height: 1.35; height: 1.35em; }
  .board li.five .mini { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.10); }
  .board li.five .mini .mn { font-size: 10px; }
  .board li.five .mini .ms { font-size: 11px; }
  .board .mini.me { outline: 1.5px solid rgba(255,210,63,.75); background: rgba(255,210,63,.12); }

  /* 1~3위는 금·은·동으로 따로 */
  .board li.p1, .board li.p2, .board li.p3 {
    margin: 1px 0; padding: 3px 8px; border-radius: 3px;
    border-left: 3px solid;
  }
  .board li.p1 + li, .board li.p2 + li, .board li.p3 + li { border-top: 0; }
  .board li.p1 {
    border-left-color: #ffd23f;
    background: linear-gradient(90deg, rgba(255,210,63,.26), rgba(255,210,63,.03));
    box-shadow: 0 0 14px rgba(255,210,63,.22);
  }
  .board li.p1 .nm { color: #fff6cf; font-weight: 800; text-shadow: 0 0 10px rgba(255,210,63,.45); }
  .board li.p1 .sc { color: #ffd23f; font-size: 1.28em; font-weight: 800; text-shadow: 0 0 10px rgba(255,210,63,.6); }
  .board li.p1 .sc img.jic { width: 24px; height: 30px; vertical-align: -9px; }
  .board li.p2 .sc img.jic, .board li.p3 .sc img.jic { width: 21px; height: 27px; vertical-align: -8px; }

  .board li.p2 {
    border-left-color: #dfe6ef;
    background: linear-gradient(90deg, rgba(223,230,239,.26), rgba(223,230,239,.03));
    box-shadow: 0 0 12px rgba(223,230,239,.14);
  }
  .board li.p2 .nm { color: #f4f7fc; font-weight: 700; text-shadow: 0 0 10px rgba(223,230,239,.35); }
  .board li.p2 .sc { color: #e8eef7; font-size: 1.22em; font-weight: 700; }

  .board li.p3 {
    border-left-color: #cd7f32;
    background: linear-gradient(90deg, rgba(205,127,50,.20), rgba(205,127,50,.02));
  }
  .board li.p3 .nm { color: #efc79b; font-weight: 700; }
  .board li.p3 .sc { color: #d99257; font-size: 1.20em; font-weight: 700; }

  .board li.p1 .rk, .board li.p2 .rk, .board li.p3 .rk { font-size: 1.15em; }
  /* 내 기록 강조 — 금·은·동 색을 덮지 않도록 테두리로만 표시 */
  .board li.me {
    outline: 2px solid rgba(255,210,63,.9);
    outline-offset: -2px;
    border-radius: 9px;
    padding: 5px 7px;
  }
  .board .empty { font-size: 13px; color: #7f8494; padding: 6px 0; }
  /* 아직 주인이 없는 자리 — 칸은 그대로 두고 옅게만 남긴다 */
  .board li.ghost { opacity: .30; box-shadow: none; }
  .board li.ghost .nm, .board li.ghost .sc { color: #8b90a0; text-shadow: none; }
  .board .mini.ghost { opacity: .30; background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.10); }
  .board .mini.ghost .ms { color: #8b90a0; }
  /* 안내문은 칸 위에 겹쳐 띄운다 — 칸 구조가 그대로라 판 크기가 변하지 않는다 */
  .board ol { position: relative; }
  .board .boardMsg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 12px; font-size: 12.5px; color: #b8bdcc;
    background: rgba(5,6,13,.55); border-radius: 8px; word-break: keep-all;
  }
  #startScreen .board ol, #overScreen .board ol { display: flex; flex-direction: column; }
  #startScreen .board .empty, #overScreen .board .empty { margin: auto 0; text-align: center; }
  .board[hidden] { display: none; }
  .board.last,
  #startScreen .board.last, #overScreen .board.last {
    background: rgba(255,210,63,.07); padding: 7px 12px 8px;
    border: 1px solid rgba(255,210,63,.45);
    box-shadow: 0 0 14px rgba(255,210,63,.14);
  }
  .board.last h3 {
    color: #ffe08a; margin-bottom: 6px; padding-bottom: 6px;
    border-bottom-color: rgba(255,210,63,.25);
    text-shadow: 0 0 10px rgba(255,210,63,.45);
  }
  .lastRow { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .lastRow .lp {
    display: flex; align-items: center; gap: 4px;
    font-size: 10.5px; color: #eaf6ff; white-space: nowrap;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    border-radius: 3px; padding: 2px 6px;
  }
  .lastRow .lp b { color: #ffd23f; font-weight: 700; }
  .board .note {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 11px; color: #7f8494;
  }

  /* ---- 시작 화면 이름 ---- */
  #nameBox { display: flex; align-items: center; gap: 8px; }
  #nameBox .who { font-size: 14px; color: #d5d8e2; }
  #nameBox .who b { color: #ffd23f; font-weight: 700; }
  #nameBox button, #nameEdit button {
    padding: 6px 13px; font-size: 13px; background: rgba(255,255,255,.14); color: #fff;
  }
  #nameEdit { display: none; align-items: center; gap: 8px; }
  #nameEdit.on { display: flex; }
  #nameBox.off { display: none; }
  #startName {
    font: inherit; font-size: 16px; width: 150px;
    padding: 9px 12px; border-radius: 11px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #startName:focus { outline: none; border-color: #ffd23f; }

  /* ---- 직업 선택 ---- */
  #jobScreen h2 { color: #ffd23f; }
  /* 직업 카드는 2열 그리드 — 세로로 여덟 장 쌓는 것보다 캐릭터를 크게 보여 줄 수 있다 */
  #jobList {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px; width: 100%; max-width: 340px;
  }
  #jobList img.ic { width: auto; height: 78px; object-fit: contain; flex: none; }
  /* 여덟 직업이 스크롤 없이 한 화면에 들어가도록 카드를 낮춘다.
     증강 카드와 같은 .augCard 를 쓰므로 여기서만 좁힌다. */
  #jobList .augCard {
    flex-direction: column; align-items: center; text-align: center;
    padding: 9px 6px 8px; gap: 3px; border-radius: 12px;
  }
  #jobList .augCard .tx { flex: none; width: 100%; }
  #jobList .augCard .nm2 { font-size: 15px; }
  /* ---- 직업 상세 (카드를 누르면 이 화면으로) ---- */
  #jobDetail { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 340px; }
  #jobDetail.hidden { display: none; }
  #jobList.hidden { display: none; }   /* .hidden 은 .screen 에만 걸려 있어 따로 필요하다 */
  #jobCard {
    width: 100%; background: rgba(255,255,255,.06); border-radius: 14px;
    padding: 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #jobBig { height: 150px; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  #jobName { font-size: 22px; font-weight: 700; color: #ffd23f; letter-spacing: -.5px; }
  #jobTraits { display: flex; flex-direction: column; gap: 5px; width: 100%; }
  #jobTraits .tr {
    display: flex; align-items: center; gap: 8px; text-align: left;
    font-size: 12.5px; color: #d5d8e2;
    background: rgba(53,240,255,.07); border: 1px solid rgba(53,240,255,.22);
    border-radius: 6px; padding: 6px 10px;
  }
  #jobTraits .tr .dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: #9fd8ff; }
  #btnJobGo {
    padding: 10px 40px; font-size: 17px; letter-spacing: 3px;
    background: linear-gradient(180deg, #ffe07a, #ffc42e 55%, #f5a70f);
    border: 1px solid rgba(255,243,196,.85);
    box-shadow: 0 0 24px rgba(255,196,46,.55), 0 5px 0 #a8700a;
  }
  #btnJobList {
    font-size: 12.5px; padding: 7px 18px; box-shadow: none;
    background: rgba(255,255,255,.08); color: #b8bdcc; border: 1px solid rgba(255,255,255,.12);
  }
  /* 화면이 짧으면 캐릭터를 줄인다 */
  @media (max-height: 670px) {
    #jobBig { height: 120px; }
  }

  /* 지금 고른 직업 */
  #jobList .augCard.sel {
    background: rgba(255,210,63,.14); border-color: #ffd23f;
    box-shadow: 0 0 16px rgba(255,210,63,.3);
  }
  #jobScreen h2 { font-size: clamp(19px, 5vw, 24px); }
  /* 고르지 않고 나가는 길 — 직업 카드보다 눈에 덜 띄게 */
  #btnJobBack {
    margin-top: 4px; font-size: 12.5px; padding: 7px 18px;
    background: rgba(255,255,255,.08); color: #b8bdcc;
    border: 1px solid rgba(255,255,255,.12); box-shadow: none;
  }
  /* 순위표 직업 탭 — 전체 + 직업별 */
  /* 순위판 왼쪽 세로 레일 — 제목은 위에 가로로, 그 아래는 [탭 | 목록] */
  .board.withTabs {
    display: grid; grid-template-columns: 74px minmax(0, 1fr); column-gap: 8px;
    grid-template-areas: "h h" "tabs list";
    position: relative;
  }
  .board.withTabs h3 { grid-area: h; }
  .board.withTabs ol { grid-area: list; min-width: 0; }
  .board.withTabs li { min-width: 0; }
  /* 자릿수가 많은 점수는 글자를 줄여 오른쪽이 잘리지 않게 */
  .board .sc.long  { font-size: .88em; }
  .board .sc.xlong { font-size: .74em; }
  .board li.p1 .sc.long  { font-size: 1.18em; }
  .board li.p1 .sc.xlong { font-size: .96em; }
  .board li.p2 .sc.long, .board li.p3 .sc.long   { font-size: 1.12em; }
  .board li.p2 .sc.xlong, .board li.p3 .sc.xlong { font-size: .92em; }
  /* 초기화 안내는 제목 줄 오른쪽 끝에 작게 */
  .board.withTabs .note {
    position: absolute; top: 9px; right: 12px; margin: 0;
    padding: 2px 8px; font-size: 9.5px; letter-spacing: 0;
  }
  /* 직업 탭은 두 줄로 세운다 — 한 줄일 때는 칸 9개의 최소 높이가
     순위판 높이의 바닥을 잡아, 목록보다 판이 길어졌다. */
  .jobTabs {
    grid-area: tabs; display: grid; grid-template-columns: repeat(2, 1fr);
    align-content: stretch; gap: 3px; margin: 0; align-self: stretch; padding-top: 0;
  }
  .jobTab {
    display: inline-flex; align-items: center; justify-content: center;
    /* 탭은 순위표 높이를 나눠 갖는다. 최소 높이가 크면 직업이 늘어날 때
       탭 줄이 순위표보다 길어져 오른쪽 아래가 비어 버린다. */
    width: 100%; min-height: 22px; max-height: 52px; padding: 0; border-radius: 4px;
    font-size: 12px; font-weight: 700; letter-spacing: -.5px;
    background: rgba(53,240,255,.08); color: #9fb4d0;
    border: 1px solid rgba(53,240,255,.35); box-shadow: none;
  }
  .jobTab img { width: 26px; height: 80%; max-height: 32px; object-fit: contain; }
  .jobTab[data-job="all"] { grid-column: 1 / -1; }
  .jobTab.on {
    color: #05060d; background: #ffd23f; border-color: #ffd23f;
    box-shadow: 0 0 12px rgba(255,210,63,.55);
  }

  /* ---- 이름 등록 ---- */
  #nameRow { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #nameRow.on { display: flex; }
  #nameRow .tag {
    font-size: 14px; font-weight: 700; color: #ffd23f;
  }
  #nameForm { display: flex; gap: 8px; width: 100%; max-width: 380px; }
  #nameInput {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px;
    padding: 12px 14px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #nameInput::placeholder { color: #757a8a; }
  #nameInput { border-radius: 4px; }
  #nameInput:focus { outline: none; border-color: #35f0ff; box-shadow: 0 0 12px rgba(53,240,255,.35); }
  #btnSave { padding: 12px 20px; font-size: 15px; flex: none; }
  .screen h1 { font-size: clamp(26px, 7vw, 36px); letter-spacing: -1px; }
  .screen h2 { font-size: clamp(22px, 6vw, 30px); }
  .screen p { font-size: clamp(13px, 3.6vw, 15px); line-height: 1.6; color: #c8cbd6; }
  button {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700;
    font-size: clamp(16px, 4.4vw, 18px);
    color: #05060d; background: #ffd23f;
    padding: 14px 36px; border-radius: 4px;
    transition: transform .08s ease, filter .15s ease;
  }
  button:active { transform: scale(.96); }

  /* ---- 🌙 증강 선택 ---- */
  #augList { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
  .augCard {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 13px 15px; border-radius: 14px;
    background: rgba(255,255,255,.07);
    border: 2px solid rgba(255,255,255,.12);
    color: #fff; font: inherit; font-weight: 400;
    cursor: pointer; transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .augCard:hover { background: rgba(255,210,63,.14); border-color: #ffd23f; }
  .augCard:active { transform: scale(.97); }
  .augCard .ic { font-size: 30px; flex: none; line-height: 1; }
  .augCard .tx { flex: 1; min-width: 0; }
  .augCard .nm2 { font-size: 15px; font-weight: 700; color: #ffd23f; }
  .augCard .ds { font-size: 13px; color: #c8cbd6; margin-top: 2px; }
  .augCard .cnt {
    flex: none; font-size: 11px; font-weight: 700; color: #12131a;
    background: #ffd23f; border-radius: 999px; padding: 3px 8px;
  }
  #augScreen h2 { color: #ffd23f; }
  /* 다시 뽑기 — 카드 셋을 통째로 바꾼다. 남은 횟수가 없으면 사라진다 */
  #btnReroll {
    margin-top: 14px; font-size: 14px; padding: 9px 20px; border-radius: 999px;
    color: #dfe6ef; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28);
  }
  #btnReroll:hover { background: rgba(255,255,255,.16); border-color: #fff; }
  /* 히든 증강 — 조건을 만족했을 때만 후보에 오른다 */
  .augCard.hid {
    border-color: #c86bff;
    background: linear-gradient(90deg, rgba(200,107,255,.22), rgba(200,107,255,.06));
    box-shadow: 0 0 16px rgba(200,107,255,.25);
  }
  .augCard.hid:hover { background: rgba(200,107,255,.3); border-color: #d99cff; }
  .augCard.hid .nm2 { color: #e0b3ff; }
  .augCard .badge {
    flex: none; font-size: 10px; font-weight: 800; letter-spacing: .5px;
    color: #12131a; background: #c86bff; border-radius: 999px; padding: 3px 8px;
  }

  /* ---- 개발자 통계 패널 (제목 오른쪽 💩 → 비밀번호) ---- */
  #devDot, #testDot { cursor: pointer; }
  #testScreen { gap: 14px; }
  #testScreen h2 { font-size: 20px; color: #ffd23f; }
  #testRow { display: flex; gap: 8px; align-items: center; }
  #testPw {
    font: inherit; font-size: 16px; text-align: center; letter-spacing: 4px;
    padding: 11px 14px; border-radius: 12px; width: 160px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #testPw:focus { outline: none; border-color: #ffd23f; }
  #testGo { padding: 11px 18px; font-size: 14px; }
  #testMsg { font-size: 12px; color: #ff8f8f; min-height: 14px; }
  /* 일시정지 — 왼쪽 가장자리, 반투명이라 게임을 가리지 않는다 */
  #btnPause {
    position: absolute; z-index: 4; display: none;
    left: calc(12px + var(--lbx, 0px));
    bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--lby, 0px));
    width: 46px; height: 46px; padding: 0; border-radius: 50%;
    background: rgba(255,255,255,.22); color: #fff;
    font-size: 18px; opacity: .75;
  }
  #btnPause.on { display: block; }
  #btnPause:active { opacity: .9; }
  #pauseScreen h2 { color: #ffd23f; }
  #btnPauseRetry {
    font-size: 12px; padding: 7px 16px; margin-top: -2px;
    background: rgba(255,255,255,.08); color: #b8bdcc;
    border: 1px solid rgba(255,255,255,.12); box-shadow: none;
  }
  /* 조작 방식 토글 — 이름 알약 아래 */
  #ctrlBox, #sndBox {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 6px 4px 12px; border-radius: 4px;
    background: rgba(53,240,255,.06); border: 1px solid rgba(53,240,255,.28);
  }
  /* 조작과 소리를 한 줄에 나란히 — 좁으면 저절로 두 줄로 접힌다 */
  #optRow { display: flex; gap: 7px; align-items: stretch; justify-content: center; flex-wrap: wrap; }
  #sndBox { padding: 4px 6px; }
  #pauseSnd { display: flex; gap: 8px; justify-content: center; margin: 2px 0 6px; }
  #sndBox .ctrlBtn, #pauseSnd .ctrlBtn { font-size: 17px; padding: 5px 14px; line-height: 1.25; }
  #pauseSnd .ctrlBtn {
    border-radius: 3px; box-shadow: none;
    background: rgba(255,255,255,.06); color: #9fb4d0;
    border: 1px solid rgba(255,255,255,.2);
  }
  #pauseSnd .ctrlBtn.on {
    color: #05060d; background: #35f0ff; border-color: #35f0ff;
    box-shadow: 0 0 12px rgba(53,240,255,.55);
  }
  #ctrlBox .ctrlBtn, #sndBox .ctrlBtn {
    padding: 5px 11px; font-size: 12px; border-radius: 3px;
    background: rgba(255,255,255,.06); color: #9fb4d0; box-shadow: none;
    border: 1px solid rgba(255,255,255,.2);
  }
  #ctrlBox .ctrlBtn.on, #sndBox .ctrlBtn.on {
    color: #05060d; background: #35f0ff; border-color: #35f0ff;
    box-shadow: 0 0 12px rgba(53,240,255,.55);
  }

  /* 십자패드 — 오른쪽 아래, 누르고 있는 동안 이동 */
  /* 하나의 둥근 패드 — 누른 채 밀면 방향이 바로 바뀐다 (손가락을 뗄 필요가 없다) */
  #dpad {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--lby, 0px)); z-index: 4;
    display: none; width: 158px; height: 158px; border-radius: 50%;
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.20);
    opacity: .82; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #dpad.on { display: block; }
  #dpad .ar {
    position: absolute; font-size: 17px; color: #fff; opacity: .5;
    transition: opacity .08s ease, color .08s ease;
  }
  #dpad .ar.hit { opacity: 1; color: #ffd23f; text-shadow: 0 0 10px rgba(255,210,63,.6); }
  #dpad .up { top: 9px;  left: 50%; transform: translateX(-50%); }
  #dpad .dn { bottom: 9px; left: 50%; transform: translateX(-50%); }
  #dpad .lf { left: 11px;  top: 50%; transform: translateY(-50%); }
  #dpad .rt { right: 11px; top: 50%; transform: translateY(-50%); }
  #dpad .knob {
    position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px;
    border-radius: 50%; background: rgba(255,255,255,.30); pointer-events: none;
    transition: background .1s ease;
  }
  #dpad.press .knob { background: rgba(255,210,63,.55); }
  /* 좌우만 되는 직업은 가로로 긴 알약 패드 — 엄지로 좌우로 밀기 좋다 */
  #dpad.noVert {
    width: 178px; height: 68px; border-radius: 999px;
  }
  #dpad.noVert .up, #dpad.noVert .dn { display: none; }
  #dpad.noVert .lf { left: 15px; }
  #dpad.noVert .rt { right: 15px; }
  #dpad.noVert .knob {
    width: 54px; height: 54px; margin: -27px 0 0 -27px;
  }
  #btnTestEnd {
    position: absolute; right: calc(12px + var(--lbx, 0px)); top: calc(96px + var(--lby, 0px)); z-index: 5; display: none;
    appearance: none; border: 0; cursor: pointer; font: inherit;
    font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(255,80,80,.8); border-radius: 999px; padding: 5px 11px;
  }
  #btnTestEnd.on { display: block; }
  /* 테스트 모드 전용 — 레벨을 바로 올리고 내린다 */
  #testLv {
    position: absolute; right: calc(12px + var(--lbx, 0px)); top: calc(126px + var(--lby, 0px));
    z-index: 5; display: none; flex-direction: column; align-items: stretch; gap: 3px;
  }
  #testLv.on { display: flex; }
  #testLv button {
    appearance: none; border: 0; cursor: pointer; font: inherit;
    font-size: 11px; font-weight: 700; color: #05060d;
    background: rgba(53,240,255,.85); border-radius: 999px; padding: 5px 11px;
    box-shadow: none;
  }
  #testLv button:active { transform: scale(.94); }
  #lvNow {
    text-align: center; font-size: 11px; font-weight: 700; color: #9fd8ff;
    background: rgba(5,6,13,.6); border-radius: 999px; padding: 3px 0;
  }
  #devScreen { justify-content: flex-start; padding-top: 28px; gap: 12px; }
  #devScreen h2 { font-size: 20px; color: #ffd23f; }
  #devHead { display: flex; align-items: center; gap: 10px; }
  #devHome {
    padding: 7px 13px; font-size: 12px; border-radius: 999px;
    background: rgba(255,255,255,.14); color: #fff;
  }
  #devPwRow { display: flex; gap: 8px; align-items: center; }
  #devPw {
    font: inherit; font-size: 16px; text-align: center; letter-spacing: 4px;
    padding: 11px 14px; border-radius: 12px; width: 160px;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff;
  }
  #devGo { padding: 11px 18px; font-size: 14px; }
  #devPw:focus { outline: none; border-color: #ffd23f; }
  #devBody { width: 100%; max-width: 340px; font-size: 12px; color: #d5d8e2; }
  #devBody .sec {
    background: rgba(255,255,255,.06); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  #devBody h4 { font-size: 12px; color: #ffd23f; margin-bottom: 6px; }
  #devBody table { width: 100%; border-collapse: collapse; }
  #devBody th, #devBody td { padding: 3px 2px; text-align: right; white-space: nowrap; }
  #devBody th { color: #8b90a0; font-weight: 600; font-size: 11px; }
  #devBody td:first-child, #devBody th:first-child { text-align: left; }
  #devBody .lft { text-align: left; white-space: normal; word-break: keep-all; }
  #devBody tr + tr td { border-top: 1px solid rgba(255,255,255,.06); }
  #devBody .num { color: #fff; font-variant-numeric: tabular-nums; }
  #devMsg { font-size: 12px; color: #ff8f8f; min-height: 14px; }
  #devBody .del {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 700;
    color: #fff; background: rgba(255,80,80,.5);
    border-radius: 7px; padding: 3px 8px;
  }
  #devBody .del:hover { background: rgba(255,80,80,.85); }
  #devBody .del:disabled { opacity: .4; cursor: default; }
  #devBody .hid { color: #c98bff; }        /* 히든 증강은 보라색으로 구분 */
  #devBody .tbRecent th:first-child, #devBody .tbRecent td:first-child {
    max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #devBody .tbRecent th:nth-child(2), #devBody .tbRecent td:nth-child(2) {
    max-width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #devBody .tbRecent .lft { min-width: 45%; }
  #devBody .tbTop th:first-child, #devBody .tbTop td:first-child {
    width: 14px; max-width: 14px; padding: 3px 0;
  }
  #devBody .tbTop th:nth-child(2), #devBody .tbTop td:nth-child(2),
  #devBody .tbTop th:nth-child(3), #devBody .tbTop td:nth-child(3) {
    max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #devBody .tbTop .lft { min-width: 42%; }
  #devTabs {
    display: none; gap: 6px; width: 100%; max-width: 340px;
    justify-content: center; flex-wrap: wrap;
  }
  #devTabs.on { display: flex; }
  #devTabs button {
    padding: 7px 14px; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,.10); color: #b8bdcc; border-radius: 999px;
  }
  #devTabs button.on { background: #ffd23f; color: #12131a; }
  #devBody .tabPane { display: none; }
  #devBody .tabPane.on { display: block; }

  /* 시작 화면 자식에 position: relative 를 주는 규칙이 있어 그보다 우선순위를 높여 둔다 */
  #startScreen #ver {
    position: absolute;
    bottom: max(8px, env(safe-area-inset-bottom));
    right: 14px;
    font-size: 13px; letter-spacing: 1px; font-weight: 600;
    color: rgba(159,180,208,.55);
  }

  /* ─────────── 시작 화면 ─────────── */
  #startScreen {
    gap: clamp(8px, 1.8vh, 14px);
    background: rgba(10,11,16,.38);            /* 뒤 타이틀 그림이 비쳐 보이게 */
  }
  /* 화면 위쪽에 은은한 빛을 깔아 패널이 떠 보이게 한다 */
  #startScreen::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 60% at 50% -8%, rgba(255,62,165,.18), transparent 62%),
      radial-gradient(90%  45% at 12% 34%, rgba(120,90,255,.14), transparent 66%),
      radial-gradient(90%  45% at 88% 74%, rgba(53,240,255,.13), transparent 66%);
  }
  /* 바닥으로 사라지는 네온 격자 */
  #startScreen::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 190px; pointer-events: none;
    opacity: .5;
    background:
      repeating-linear-gradient(90deg, rgba(53,240,255,.16) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(0deg,  rgba(53,240,255,.13) 0 1px, transparent 1px 26px);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000);
            mask-image: linear-gradient(180deg, transparent, #000);
  }
  #startScreen > * { position: relative; }

  /* 줄간격과 순위 줄의 여백을 조금씩 줄여 아래에 자리를 만든다.
     남는 자리는 위아래로 나뉜다 (가운데 정렬). */
  #startScreen {
    gap: clamp(3px, 0.75vh, 7px);
    padding-top: calc(max(10px, env(safe-area-inset-top)) + var(--lby, 0px));
    padding-left: calc(10px + var(--lbx, 0px));
    padding-right: calc(10px + var(--lbx, 0px));
  }
  #startScreen .board li { padding: 2px 0; }
  #startScreen .board:not(.withTabs) { padding: 7px 10px; }   /* 지난주 판은 한 줄뿐이라 더 좁게 */
  #startScreen .board li.duo, #startScreen .board li.five { padding: 2px 0; }
  #startScreen .board .mini { padding: 3px 3px; }
  #startScreen h1 {
    font-size: clamp(24px, 6.5vw, 32px);
    letter-spacing: -1.5px; line-height: 1.15;
    display: flex; align-items: center; justify-content: center; gap: 2px;
  }
  /* 제목은 그림 한 장. 로고 안에 그려진 똥 두 마리가 곧 히든 버튼이다 —
     왼쪽 아래는 테스트 모드, 오른쪽 위는 통계. 누르는 자리를 그림 위에 겹쳐 둔다. */
  #startScreen h1 .logoWrap { position: relative; display: inline-block; line-height: 0; }
  #startScreen h1 img.ttl {
    display: block; width: min(59vw, 268px); height: auto;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.45));
  }
  #startScreen h1 #testDot, #startScreen h1 #devDot {
    position: absolute; display: block;
    transition: transform .18s ease;
  }
  /* 화면이 짧은 폰에서는 제목을 조금 더 줄여 스크롤이 생기지 않게 한다 */
  @media (max-height: 670px) {
    #startScreen h1 img.ttl { width: min(50vw, 232px); }
    #startScreen .board .mini { padding: 2px 3px; }   /* 이름 줄 높이를 못 박은 만큼 여백을 되돌린다 */
  }
  #startScreen h1 #testDot { left: 4%;  top: 69%; width: 19%; height: 27%; }   /* 왼쪽 아래 똥 */
  #startScreen h1 #devDot  { left: 68%; top: 5%;  width: 26%; height: 37%; }   /* 오른쪽 위 똥 */
  #startScreen h1 #testDot:active, #startScreen h1 #devDot:active { transform: scale(.88); }

  /* 랭킹판 — 유리판 느낌 */
  #startScreen .board, #overScreen .board {
    max-width: 460px;
    padding: 10px 14px 9px;
    border-radius: 4px;
    background: rgba(6,8,20,.82);
    border: 1px solid rgba(53,240,255,.75);
    box-shadow: 0 0 14px rgba(53,240,255,.28), inset 0 0 20px rgba(53,240,255,.08);
  }
  /* 대기화면은 뒤에 타이틀 그림이 있으므로 더 비쳐 보이게 한다.
     게임오버 순위판은 글씨가 잘 읽혀야 해서 그대로 둔다. */
  /* 화면 전체는 밝게 두고(.38), 글씨가 얹히는 순위판만 조금 어둡게.
     배경 그림은 표 바깥에서 충분히 보인다. */
  #startScreen .board { background: rgba(6,8,20,.32); }
  #startScreen .board h3, #overScreen .board h3 {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding-bottom: 6px; margin-bottom: 4px;
    border-bottom: 1px dashed rgba(53,240,255,.4);
    font-size: 13px; letter-spacing: 2px;
    color: #ffd23f; text-shadow: 0 0 10px rgba(255,210,63,.6);
  }

  /* 4위 이하 순위 숫자를 동그란 배지로 */
  #startScreen .board li:not(.p1):not(.p2):not(.p3) .rk,
  #overScreen  .board li:not(.p1):not(.p2):not(.p3) .rk {
    width: 20px; height: 20px; line-height: 20px; border-radius: 3px;
    background: rgba(53,240,255,.12); color: #9fd8ff;
    font-size: 11px; font-weight: 700;
  }
  #startScreen .board li, #overScreen .board li { padding: 3px 0; }
  /* 1~3위 줄은 좌우 여백을 되살린다 — 위 규칙이 덮어써서 점수가 줄 끝에 딱 붙어 잘려 보였다 */
  #startScreen .board li.p1, #startScreen .board li.p2, #startScreen .board li.p3,
  #overScreen .board li.p1, #overScreen .board li.p2, #overScreen .board li.p3 { padding: 4px 10px 4px 9px; }

  /* 1위 줄에 아주 느리게 빛이 흐른다 */
  .board li.p1 { position: relative; overflow: hidden; }
  .board li.p1::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.22) 46%, transparent 62%);
    transform: translateX(-120%);
    animation: shine 5.5s ease-in-out infinite;
  }
  @keyframes shine { 0%, 62% { transform: translateX(-120%); } 88%, 100% { transform: translateX(120%); } }

  .board .note {
    display: inline-block; margin-top: 4px; padding: 3px 9px;
    border: 0; border-radius: 3px;
    background: #35f0ff; color: #05060d; font-size: 10.5px;
    box-shadow: 0 0 12px rgba(53,240,255,.55);
  }

  /* 플레이어 이름 — 알약 모양 */
  #nameBox {
    padding: 5px 5px 5px 14px; border-radius: 4px;
    background: rgba(53,240,255,.06);
    border: 1px solid rgba(53,240,255,.28);
  }
  #nameBox .who { font-size: 13px; color: #9fb4d0; }
  #nameBox .who b { color: #35f0ff; text-shadow: 0 0 10px rgba(53,240,255,.6); }
  #nameBox button, #nameEdit button { border-radius: 3px; }

  /* 시작 버튼 */
  #btnStart {
    margin-top: 0;
    padding: 10px 40px;
    background: linear-gradient(180deg, #ffe07a, #ffc42e 55%, #f5a70f);
    border: 1px solid rgba(255,243,196,.85);
    box-shadow: 0 0 24px rgba(255,196,46,.55), 0 5px 0 #a8700a;
    letter-spacing: 3px;
    animation: breathe 3.4s ease-in-out infinite;
  }
  #btnStart:hover { filter: brightness(1.06); }
  #btnStart:active { transform: translateY(3px) scale(.98); box-shadow: 0 0 18px rgba(255,196,46,.5), 0 2px 0 #a8700a; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 24px rgba(255,196,46,.55), 0 5px 0 #a8700a; }
    50%      { box-shadow: 0 0 34px rgba(255,196,46,.85), 0 5px 0 #a8700a; }
  }
  @media (prefers-reduced-motion: reduce) {
    #btnStart { animation: none; }
    .board li.p1::after { animation: none; opacity: 0; }
  }

  .big { font-size: clamp(38px, 11vw, 48px); font-weight: 800; color: #ffd23f; }
  .sub { font-size: 14px; color: #9aa0ae; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="btnPause">⏸</button>
    <div id="dpad">
      <span class="ar up">▲</span><span class="ar lf">◀</span>
      <span class="ar rt">▶</span><span class="ar dn">▼</span>
      <span class="knob"></span>
    </div>
    <button id="btnTestEnd">테스트 종료</button>
    <div id="testLv">
      <button id="btnLvUp" title="레벨 올리기">레벨 ▲</button>
      <span id="lvNow">Lv 1</span>
      <button id="btnLvDn" title="레벨 내리기">레벨 ▼</button>
    </div>

    <div id="startScreen" class="screen">

<script>
(function () {
  "use strict";

  /* roundRect 미지원 브라우저(구형 사파리) 대비 */
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (typeof r === "number") r = [r, r, r, r];
      const [a, b, c, d] = r.length === 1 ? [r[0], r[0], r[0], r[0]] : r;
      this.moveTo(x + a, y);
      this.arcTo(x + w, y, x + w, y + h, b);
      this.arcTo(x + w, y + h, x, y + h, c);
      this.arcTo(x, y + h, x, y, d);
      this.arcTo(x, y, x + w, y, a);
      this.closePath();
      return this;
    };
  }

  const BASE_H = 720;     // 기준 논리 높이
  let H = BASE_H;         // 논리 높이 — 화면 비율에 맞춰 유동
  let W = 480;            // 논리 너비 — 화면 비율에 맞춰 유동
  let items = [], particles = [], floats = [], clouds = [];
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  // 그림을 줄여 그릴 때 가장자리가 자글거리지 않도록 보간 품질을 올린다
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  const stage = document.getElementById("stage");

  const startScreen = document.getElementById("startScreen");
  const overScreen  = document.getElementById("overScreen");
  const elFinal = document.getElementById("finalScore");
  const elTitle = document.getElementById("overTitle");

  const GAME_VERSION = "v0.6.17";   // 코드를 고칠 때마다 뒤 두 자리를 올린다
  document.getElementById("ver").textContent = GAME_VERSION;

  const LS_NAME = "epjpddongpi_name";
  const LS_DEV  = "epjpddongpi_device";   // 기기 식별자 (한 기기당 랭킹 한 줄)

  /* ---------- 화면 크기 맞추기 ---------- */
  const DRAW_R = 40;                 // 캐릭터 도안 기준 반지름
  const GROUND_H = 85;               // 잔디 높이 — 이만큼 캐릭터가 위로 올라간다
  const FOOT = 62;                   // player.y 에서 '발이 닿는 선'까지의 거리 (화면 고정)
  const PLAYER_MAX_SPEED = 780;      // 좌우 이동 최고 속도 (논리 px/초)
  const PLAYER_UP = GROUND_H + 54;   // 화면 바닥에서 캐릭터 머리 중심까지
  // r = 판정 반지름. 그림 크기도 여기서 나오므로 줄이면 몸과 판정이 함께 작아진다.
  const player = { x: 240, y: H - 139, r: 30.4, tx: 240, ty: 0, tilt: 0, hy: 0 };
  const FLY_TOP = 0.07;              // 나는 직업이 올라갈 수 있는 최고 높이 (그림이 안 잘리는 선)
  let groundY = 0;                   // 발이 땅에 닿는 기준 높이
  let flyOn = false;                 // 초전도 이재 — 위아래로도 날 수 있는 상태

  /* ---------- 직업 ---------- */
  const LS_JOB = "epjpddongpi_job";
  const JOBS = {
    none:    { nm: "백수",   ic: "🏃", ds: "시작할 때 증강 1개를 고른다" },
    gambler: { nm: "도박사", ic: "🎰", ds: "목숨 1개 + 우산 1개 시작 · 비둘기 출격 · 하트 안 나옴 · 모든 점수 2.5배" },
    levitator: { nm: "부양사", ic: "🎈", ds: "하늘 어디든 날 수 있다 · 높이 있을수록 점수 UP" },
    fit: { nm: "헬스걸", ic: "💪", ds: "목숨 5개로 시작 · 우산이 안 나온다 · 하트가 어마무시하게 잘 나온다 · 벌크업 좀 된 상태" },
    powerj: { nm: "파워J", ic: "📋", ds: "달이 잘 나온다 · 대신 증강은 계획대로 1개만" },
    /* 파워P — 파워J 의 거울. 달은 덜 오지만 올 때마다 다섯 장을 다 펼쳐 놓고 고른다.
       아이디가 powerp2 인 것은, powerp 는 무소유가 예전에 파워P 였을 때 쓰던 이름이라
       이미 차 있기 때문이다 (옛 기록과 순위표가 그 이름을 쓴다). */
    powerp2: { nm: "파워P", ic: "🎯", ds: "달이 덜 나온다 · 대신 증강을 5개 중에서 고른다" },
    powerp: { nm: "무소유", ic: "🙏", ds: "달이 아예 안 나온다 · 별이 조금 잘 나온다 · 안 맞을수록 점수가 치솟는다" },
    bangul: { nm: "방울이", ic: "🫧", ds: "목숨 대신 오염도 · 비누방울이 한 대를 대신 맞고 터진다 · 잠시 뒤 다시 맺힌다", f: "이핑재핑보다 귀엽다" }
  };
  // 직업별 캐릭터 그림(오른쪽 이동 모습) — 직업 카드와 순위표에서 함께 쓴다
  const JOB_IMG = { none: "player", gambler: "gambler", levitator: "levitator",
                    fit: "fit", powerj: "powerj", powerp: "monk", powerp2: "powerp2",
                    bangul: "bangul" };
  function spdMul() { return job === "levitator" ? 2.5 : 1; }   // 이동 속도 배율 (부양사 2.5배)
  /* 평화의 비둘기 — 활짝 펼친 날개에 깃 모양이 물결치고, 꼬리는 부채처럼 갈라진다.
     (흰 실루엣 한 덩어리로 그려야 작게 그려도 비둘기로 읽힌다) */
  function drawDove(x, y, ph, target) {
    const S = 15 * doveMul();
    const flap = Math.sin(ph);                       // -1 ~ 1
    ctx.save();
    ctx.translate(x, y);
    const ang = target ? Math.atan2(target.y - y, target.x - x) + Math.PI / 2 : 0;
    ctx.rotate(ang);
    // 오른쪽으로 날아갈 때는 좌우를 뒤집어 준다
    const mirror = target && target.x > x ? -1 : 1;
    if (doveImg) {                                   // 그림이 있으면 그걸 쓴다
      const h = S * 3.12, w = h * (doveImg.width / doveImg.height);   // 예전 2.6 에서 1.2배
      ctx.scale(mirror, 1 - Math.abs(flap) * 0.14);  // 날갯짓처럼 살짝 눌린다
      ctx.drawImage(doveImg, -w / 2, -h * 0.52, w, h);
      ctx.restore();
      return;
    }
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(0,0,0,.25)";
    ctx.shadowBlur = 4;

    // 날개 — 길고 뾰족하게 위로 뻗고, 아랫날은 깃털이 얕게 물결친다
    const up = 0.82 + 0.34 * flap;                   // 퍼덕임
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * S * 0.10, -S * 0.02);
      // 앞날 — 어깨에서 날개 끝까지 크게 휘어 오른다
      ctx.bezierCurveTo(sx * S * 0.55, -S * 0.62 * up,
                        sx * S * 1.05, -S * 1.05 * up,
                        sx * S * 1.62, -S * 1.28 * up);
      // 날개 끝에서 되돌아오는 뒷날 — 깃 세 갈래를 얕게 판다
      ctx.quadraticCurveTo(sx * S * 1.16, -S * 0.92 * up, sx * S * 1.06, -S * 0.72 * up);
      ctx.quadraticCurveTo(sx * S * 0.96, -S * 0.86 * up, sx * S * 0.78, -S * 0.50 * up);
      ctx.quadraticCurveTo(sx * S * 0.66, -S * 0.62 * up, sx * S * 0.50, -S * 0.22 * up);
      ctx.quadraticCurveTo(sx * S * 0.36, -S * 0.30 * up, sx * S * 0.10, S * 0.16);
      ctx.closePath();
      ctx.fill();
    }

    // 몸통 — 가슴이 도톰하고 아래로 갈수록 가늘어지는 물방울꼴
    ctx.beginPath();
    ctx.moveTo(0, -S * 0.60);
    ctx.bezierCurveTo(S * 0.34, -S * 0.34, S * 0.30, S * 0.24, S * 0.15, S * 0.62);
    ctx.lineTo(-S * 0.15, S * 0.62);
    ctx.bezierCurveTo(-S * 0.30, S * 0.24, -S * 0.34, -S * 0.34, 0, -S * 0.60);
    ctx.closePath();
    ctx.fill();

    // 꼬리 — 부채처럼 세 갈래로 갈라진다
    ctx.beginPath();
    ctx.moveTo(-S * 0.17, S * 0.46);
    ctx.lineTo(-S * 0.42, S * 1.02);
    ctx.lineTo(-S * 0.14, S * 0.90);
    ctx.lineTo(0, S * 1.08);
    ctx.lineTo(S * 0.14, S * 0.90);
    ctx.lineTo(S * 0.42, S * 1.02);
    ctx.lineTo(S * 0.17, S * 0.46);
    ctx.closePath();
    ctx.fill();

    // 머리 — 몸통보다 작게, 목선이 끊기지 않도록 겹쳐 그린다
    ctx.beginPath();
    ctx.moveTo(-S * 0.16, -S * 0.42);
    ctx.quadraticCurveTo(-S * 0.20, -S * 0.74, 0, -S * 0.80);
    ctx.quadraticCurveTo(S * 0.20, -S * 0.74, S * 0.16, -S * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -S * 0.62, S * 0.20, 0, 6.283);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 부리
    ctx.fillStyle = "#ffb03a";
    ctx.beginPath();
    ctx.moveTo(-S * 0.04, -S * 0.74);
    ctx.lineTo(S * 0.03, -S * 0.94);
    ctx.lineTo(S * 0.09, -S * 0.70);
    ctx.closePath();
    ctx.fill();

    // 눈
    ctx.fillStyle = "#2b2f3a";
    ctx.beginPath();
    ctx.arc(S * 0.07, -S * 0.64, S * 0.042, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }

  /* 갤러그 전투기 — 원작처럼 흰 몸통에 빨간 무늬, 파란 속날개, 뾰족한 기수 */
  /* 고무고무노 피스톨 — 총알 대신 조그만 주먹이 날아간다.
     위로 곧게 올라가므로 손등이 위를 보고, 아래에 빨간 소매가 따라붙는다.
     roundRect 는 옛 모바일 브라우저에 없어서 타원만으로 그린다. */
  function drawFist(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(255,110,90,.26)";            // 붉은 잔광
    ctx.beginPath(); ctx.arc(0, 1, 13, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#e2453c";                         // 빨간 소매 — 주먹 뒤로 살짝 보인다
    ctx.beginPath(); ctx.ellipse(0, 7, 6.6, 3.4, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#8f2f28"; ctx.lineWidth = 1; ctx.stroke();
    /* 주먹 — 손가락 마디 넷을 윤곽선 위에 얹어 한 덩어리로 그린다.
       마디를 따로 얹으면 얼굴처럼 보여서, 위쪽 테두리 자체를 울퉁불퉁하게 만들었다. */
    ctx.beginPath();
    ctx.moveTo(-7, 2.6);
    ctx.lineTo(-7, -2.6);
    for (let k = 0; k < 4; k++) ctx.arc(-5.25 + k * 3.5, -2.6, 1.75, Math.PI, 0);
    ctx.lineTo(7, 2.6);
    ctx.quadraticCurveTo(7, 6, 3.4, 6);
    ctx.lineTo(-3.4, 6);
    ctx.quadraticCurveTo(-7, 6, -7, 2.6);
    ctx.closePath();
    ctx.fillStyle = "#ffcf9e"; ctx.fill();
    ctx.strokeStyle = "#a5602f"; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.strokeStyle = "rgba(165,96,47,.8)"; ctx.lineWidth = 0.9;   // 손가락 사이 골
    for (let k = 1; k < 4; k++) {
      ctx.beginPath();
      ctx.moveTo(-7 + k * 3.5, -3.4);
      ctx.lineTo(-7 + k * 3.5, 1.2);
      ctx.stroke();
    }
    ctx.beginPath();                                   // 엄지 — 앞을 가로질러 눕는다
    ctx.ellipse(-1.6, 3.4, 4.8, 2.3, -0.16, 0, 6.283);
    ctx.fillStyle = "#ffdcb8"; ctx.fill();
    ctx.strokeStyle = "#a5602f"; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  function drawShip(x, y, t) {
    const S = 15;                                   // 반높이
    const W_ = "#f2f6ff", R = "#ff2d2d", B = "#3aa8ff";
    ctx.save();
    ctx.translate(x, y);

    // 엔진 불꽃 (아래로 깜빡)
    const f = 0.6 + 0.4 * Math.sin(t / 60);
    ctx.fillStyle = "rgba(255,170,60," + (0.5 + f * 0.35).toFixed(2) + ")";
    ctx.beginPath();
    ctx.moveTo(-S * 0.20, S * 0.86);
    ctx.lineTo(0, S * (1.05 + f * 0.45));
    ctx.lineTo(S * 0.20, S * 0.86);
    ctx.closePath(); ctx.fill();

    // 기수 — 가늘고 긴 침
    ctx.fillStyle = W_;
    ctx.fillRect(-S * 0.07, -S * 1.00, S * 0.14, S * 0.52);

    // 속날개(파랑) — 몸통 옆에 붙은 삼각
    ctx.fillStyle = B;
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * S * 0.16, -S * 0.30);
      ctx.lineTo(sx * S * 0.62, S * 0.34);
      ctx.lineTo(sx * S * 0.16, S * 0.34);
      ctx.closePath(); ctx.fill();
    }

    // 몸통 — 위는 뾰족하고 아래로 갈수록 넓어진다
    ctx.fillStyle = W_;
    ctx.beginPath();
    ctx.moveTo(0, -S * 0.62);
    ctx.lineTo(S * 0.22, -S * 0.05);
    ctx.lineTo(S * 0.26, S * 0.62);
    ctx.lineTo(-S * 0.26, S * 0.62);
    ctx.lineTo(-S * 0.22, -S * 0.05);
    ctx.closePath(); ctx.fill();

    // 가운데 빨간 화살표 무늬
    ctx.fillStyle = R;
    ctx.beginPath();
    ctx.moveTo(0, -S * 0.16);
    ctx.lineTo(S * 0.20, S * 0.30);
    ctx.lineTo(S * 0.09, S * 0.30);
    ctx.lineTo(0, S * 0.06);
    ctx.lineTo(-S * 0.09, S * 0.30);
    ctx.lineTo(-S * 0.20, S * 0.30);
    ctx.closePath(); ctx.fill();

    // 바깥 날개 — 뒤로 젖혀진 큰 날개
    ctx.fillStyle = W_;
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * S * 0.24, S * 0.10);
      ctx.lineTo(sx * S * 1.00, S * 0.60);
      ctx.lineTo(sx * S * 1.00, S * 0.92);
      ctx.lineTo(sx * S * 0.24, S * 0.66);
      ctx.closePath(); ctx.fill();
      // 날개 끝 세로 지느러미

  function shipX(k, n) {

  // 그림마다 머리·다리 비율이 달라서 이 값으로 보정해야 그림자 높이와 판정이 어긋나지 않는다.

  const RUN_FRAME_MS = 60;
  const runSpr = {};

    const fr = base.frames;
    if (!fr || !fr.length) return base;

    const img = moving ? fr[Math.floor(now / RUN_FRAME_MS) % fr.length] : fr[0];

    let cssW = bw, cssH = bw / ratio;
    if (cssH > bh) { cssH = bh; cssW = bh * ratio; }
    if (cssH > MAX_CSS_H) { cssH = MAX_CSS_H; cssW = cssH * ratio; }   // 데스크톱에서 너무 커지지 않게
    cv.style.width  = cssW + "px";

  const HELPER_H = 99;           // 화면에 그릴 높이 (110에서 10% 축소)
  const HELPER_R = 43;           // 똥을 부수는 반경 (48 → 43, 면적 20% 감소)
  function helperScale() { return aug.helperRush ? 1.2 : 1; } // 히든 '대폭주' 시 1.2배 (1.3에서 완화)
  let helpers = [];
  let helperTimer = 0;
  let fetchers = [];        // 배고픈 정연핑 — 아이템을 대신 먹으러 가는 정연핑
  const FETCH_DELAY = 1.2;  // 아이템이 보이고 몇 초 뒤에 출발하는지
  const FETCH_SPEED = 714;   // 840 에서 15% 감속
  let helperQueue = 0;      // 이번 차례에 아직 안 나온 인원
  let helperGap = 0;        // 다음 한 명까지 남은 시간
  const FETCH_REST = 2;     // 배고픈 정연핑이 다녀온 뒤 쉬는 시간(초)
  let fetchRest = 0;        // 남은 쉬는 시간

  // 뚜니핑 타임에는 똥 이모지 대신 이 이미지가 떨어진다
  let feverPoop = null, feverPoopSpace = null;
  {
    const img = new Image();
    img.onload = () => { feverPoop = img; };
    img.src = "assets/poop_fever.png";
    const si = new Image();
    si.onload = () => { feverPoopSpace = si; };
    si.src = "assets/space_poop.png";
  }

  /* ---------- 시작 화면 인트로 ----------
     게임 플레이가 아니라 '여정'을 보여주는 연출.
     잔디밭에서 블랙홀까지 한 바퀴 훑고 처음으로 돌아온다. */
  const INTRO_LOOP = 32;                    // 한 바퀴(초)
  const INTRO_TRIP = 26;                    // 이 동안 잔디밭 → 블랙홀 안까지 간다
  // 블랙홀 안에서 잔디밭으로 이어지는 웜홀 진행도 (0 = 아직, 1 = 완전히 통과)
  function introWarp() {
    return Math.max(0, Math.min(1, (introT - INTRO_TRIP) / (INTRO_LOOP - INTRO_TRIP)));
  }
  /* 아이템 그림 — Microsoft Fluent 3D 이모지(MIT). 기기마다 다르게 보이던 글자 이모지를 대신한다.
     아직 안 불러졌으면 예전처럼 글자 이모지로 그린다. */
  const ITEM_IMG = {};
  for (const [type, file] of [["moon", "crescent_moon"], ["fullmoon", "full_moon"], ["paper", "roll_of_paper"],
                              ["umbrella", "umbrella"], ["star", "star"], ["heart", "red_heart"],
                              ["poop", "poop"], ["darkpoop", "dark_poop"],
                              ["droplet", "droplet"]]) {
    const im = new Image();
    im.onload = () => { ITEM_IMG[type] = im; };
    im.src = "assets/item_" + file + ".png";
  }
  const ITEM_IMG_SCALE = 1.18;
  /* 지대 배경 그림 — 잔디밭부터 블랙홀 안까지 18장.
     전부 합쳐 140KB 남짓이라 처음에 다 받아 둔다. */
  const ZONE_IMG = [];
  for (let zi = 0; zi < 18; zi++) {
    const bi = new Image(), k = zi;
    bi.onload = () => { ZONE_IMG[k] = bi; };
    bi.src = "assets/bg/zone" + (zi + 1 < 10 ? "0" : "") + (zi + 1) + ".webp";
  }
  // 뚜니핑 타임 하늘 — 땅 위에서는 황금빛, 우주에서는 보랏빛 워프
  let feverSky = null, feverSkySpace = null;
  { const fi = new Image(); fi.onload = () => { feverSky = fi; }; fi.src = "assets/bg/fever.webp"; }
  { const fs = new Image(); fs.onload = () => { feverSkySpace = fs; };
    fs.src = "assets/bg/fever_space.webp"; }
  // 도박사의 비둘기 그림 (없으면 아래 도안으로 그린다)
  let doveImg = null;
  { const di = new Image(); di.onload = () => { doveImg = di; }; di.src = "assets/dove.png"; }

  /* 무지개똥은 일반 똥과 헷갈리지 않게 무지갯빛으로 돌면서 번쩍인다.
     seed 를 섞어 서로 다른 색으로 떨어진다. */
  function goldFx(now, seed) {
    const hue = (now * 0.42 + seed * 53) % 360;
    const puls = 0.5 + 0.5 * Math.sin(now / 85 + seed);          // 0~1 로 오가는 번쩍임
    return {
      hue: hue,
      puls: puls,
      css: "sepia(1) saturate(9) hue-rotate(" + Math.round(hue) + "deg) brightness("
           + (1.05 + puls * 0.45).toFixed(2) + ") contrast(1.35)"
    };
  }   // 그림에 여백이 있어 글자 이모지와 같은 덩치가 되게 살짝 키운다

  let introT = 0, introPoops = [], introSpawn = 0, introSuit = false, introBoom = 0;
  let introCameo = [], introCameoT = 5;     // 이따금 지나가는 정연핑·뚜니핑

  function introUpdate(dt, now) {
    introT += dt;
    if (introT >= INTRO_LOOP) {
      introT = 0; introPoops.length = 0; introSuit = false;
      introCameo.length = 0; introCameoT = 3 + Math.random() * 4;
      rollIntroJob();                       // 이번 바퀴는 다른 옷을 입고 나온다
    }
    /* 26초 동안 잔디밭 → 우주 → 블랙홀 안까지 훑고,
       남은 6초는 블랙홀 안에서 잔디밭으로 이어지는 웜홀을 통과한다. */
    levelTime = Math.min(introT / INTRO_TRIP, 1) * (LEVEL_SEC * ZONES.length);
    level = 1 + Math.floor(levelTime / LEVEL_SEC);

    const suit = inSpace();
    if (suit && !introSuit) { feverFlash = Math.max(feverFlash, .55); introBoom = 1; }
    introSuit = suit;
    if (introBoom > 0) introBoom -= dt * 1.6;

    // 스쳐 지나가는 것들 — 위로 솟구치니 아래로 흘러간다
    introSpawn -= dt;
    if (introSpawn <= 0) {
      introSpawn = 0.14 + Math.random() * 0.20;
      const r = 9 + Math.random() * 19;
      const roll = Math.random();
      introPoops.push({
        x: 16 + Math.random() * Math.max(1, W - 32), y: -r - 24,
        r: r, vy: 460 + Math.random() * 620,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * 7,
        kind: roll < .06 ? "star" : roll < .10 ? "gold" : "poop"
      });
    }
    for (let i = introPoops.length - 1; i >= 0; i--) {
      const q = introPoops[i];
      q.y += q.vy * dt;
      q.rot += q.vr * dt;
      if (q.y - q.r > H + 50) introPoops.splice(i, 1);
    }

    /* 아주 가끔 정연핑이 아래에서 위로 날아가고, 뚜니핑 낙하물이 무리지어 지나간다 */
    introCameoT -= dt;
    if (introCameoT <= 0) {
      introCameoT = 7 + Math.random() * 6;
      if (Math.random() < 0.5) {
        introCameo.push({ kind: "helper", x: 40 + Math.random() * Math.max(1, W - 80),
                          y: H + 90, vx: (Math.random() - .5) * 90, vy: -(430 + Math.random() * 180),
                          rot: 0 });
      } else {
        const n = 4 + Math.floor(Math.random() * 4);      // 뚜니핑 낙하물 한 무리
        for (let k = 0; k < n; k++) {
          introCameo.push({ kind: "fever", x: 24 + Math.random() * Math.max(1, W - 48),
                            y: -60 - k * (60 + Math.random() * 70), vx: (Math.random() - .5) * 60,
                            vy: 380 + Math.random() * 260, r: 16 + Math.random() * 26,
                            rot: Math.random() * 6.28, vr: (Math.random() - .5) * 4 });
        }
      }
    }
    for (let i = introCameo.length - 1; i >= 0; i--) {
      const c = introCameo[i];
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.vr) c.rot += c.vr * dt;
      if (c.y < -220 || c.y > H + 220) introCameo.splice(i, 1);
    }

    // 위상을 조금 밀어 두어야 루프 경계(0 교차점)에서 방향이 뒤집히지 않는다
    facing = Math.sin(introT * (6.283185 / INTRO_LOOP) * 5 + 0.4) >= 0 ? "right" : "left";
    player.hy = headOffset(currentSprite(now));
  }

  /* 블랙홀 한가운데가 열리며 그 안에 잔디밭이 드러난다.
     구멍이 화면을 다 덮은 순간 루프가 처음으로 돌아가서 이음매가 보이지 않는다. */
  function drawIntroPortal(w) {
    const cx = W / 2, cy = H * 0.30;
    const need = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 12;
    const R = Math.pow(w, 1.7) * need;
    if (R < 1) return;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 6.283);
    ctx.clip();
    /* 인트로 첫 장면과 똑같은 하늘·구름을 그린다 (땅은 인트로에서도 안 그리므로 제외).
       구멍이 화면을 다 덮은 순간이 곧 루프 시작 장면이라 이음매가 없다. */
    const sky = ZONES[0].sky;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgb(" + sky[0].join(",") + ")");
    g.addColorStop(.55, "rgb(" + sky[1].join(",") + ")");
    g.addColorStop(1, "rgb(" + sky[2].join(",") + ")");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255," + Math.min(0.80, ZONES[0].cl * 0.62).toFixed(2) + ")";
    for (const c of clouds) {
      ctx.beginPath();
      for (const L of c.lobes) {
        ctx.moveTo(c.x + L.dx + L.r, c.y + L.dy);
        ctx.arc(c.x + L.dx, c.y + L.dy, L.r, 0, 6.283);
      }
      ctx.fill();
    }
    ctx.restore();
    // 구멍 가장자리의 빛 (작을수록 진하다)
    ctx.strokeStyle = "rgba(255,238,190," + (0.9 * (1 - w * 0.75)).toFixed(2) + ")";
    ctx.lineWidth = Math.max(2, R * 0.05 * (1 - w * 0.6));
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.stroke();
  }

  function drawIntro(now) {
    const warp = introWarp();
    if (warp > 0) drawIntroPortal(warp);
    ctx.globalAlpha = 1 - warp;                     // 스쳐 가던 것들은 웜홀에서 옅어진다
    // 위로 솟구치는 속도선
    ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) {
      const x = ((i * 173 + introT * 30) % (W + 60)) - 30;
      const y = ((i * 271 + introT * 1100) % (H + 260)) - 130;
      ctx.strokeStyle = "rgba(255,255,255," + (inSpace() ? .16 : .10) + ")";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + (inSpace() ? 120 : 60)); ctx.stroke();
    }

    // 스쳐 가는 똥·별·무지개똥
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const q of introPoops) {
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.translate(q.x, q.y);
      ctx.rotate(q.rot);
      if (q.kind === "gold") {
        const fx = goldFx(performance.now(), q.x);
        const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, q.r * 1.9);
        gg.addColorStop(0, "hsla(" + fx.hue + ",100%,72%," + (0.75 + fx.puls * 0.25).toFixed(2) + ")");
        gg.addColorStop(0.45, "hsla(" + ((fx.hue + 60) % 360) + ",100%,60%,.4)");
        gg.addColorStop(1, "hsla(" + ((fx.hue + 120) % 360) + ",100%,55%,0)");
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(0, 0, q.r * 1.9, 0, 6.283); ctx.fill();
        if (ctx.filter !== undefined) ctx.filter = fx.css;
      }
      const qi = q.kind === "star" ? ITEM_IMG.star : ITEM_IMG.poop;
      if (qi) {
        const d = q.r * 2 * ITEM_IMG_SCALE;
        ctx.drawImage(qi, -d / 2, -d / 2, d, d);
      } else {
        ctx.fillStyle = "#fff";
        ctx.font = (q.r * 2) + "px serif";
        ctx.fillText(q.kind === "star" ? "⭐" : "💩", 0, 0);
      }
      if (ctx.filter !== undefined) ctx.filter = "none";
      ctx.restore();
    }

    // 카메오 — 정연핑과 뚜니핑 낙하물
    for (const c of introCameo) {
      ctx.save();
      ctx.translate(c.x, c.y);
      if (c.kind === "helper") {
        const pic = helperPic();
        if (pic) {
          const hh = HELPER_H, hw = hh * helperAspect();
          ctx.drawImage(pic, -hw / 2, -hh / 2, hw, hh);
        }
      } else {
        ctx.rotate(c.rot);
        const fp = (inSpace() && feverPoopSpace) ? feverPoopSpace : feverPoop;
        if (fp) ctx.drawImage(fp, -c.r, -c.r, c.r * 2, c.r * 2);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // 주인공 — 빨려 들어갔다가, 열린 구멍 안 잔디밭으로 다시 나온다.
    const spr = currentSprite(now);
    if (!spr) return;
    /* 좌우로 넓게 훑고 위아래로도 크게 흔들린다.
       주파수를 모두 한 바퀴(32초)의 정수배로 잡아, 루프가 돌아도 위치가 이어진다. */
    const w0 = 6.283185 / INTRO_LOOP;
    const swayX = Math.sin(introT * w0 * 3) * 0.72 + Math.sin(introT * w0 * 7 + 1.1) * 0.24;
    const swayY = Math.sin(introT * w0 * 4 + 0.6) * 0.62 + Math.sin(introT * w0 * 9) * 0.22;
    const bx = W / 2 + swayX * W * 0.34;
    // 점수판에 가리지 않게 화면 아래쪽에서 논다 (위아래 흔들림도 그만큼 줄인다)
    const by = H * 0.845 + swayY * H * 0.075;
    const px = W / 2, py = H * 0.30;                       // 구멍 한가운데
    const suck = Math.min(1, warp / 0.45);                 // 빨려 들어가는 정도
    const out  = Math.max(0, (warp - 0.5) / 0.5);          // 구멍 안에서 다시 나오는 정도
    let cx, cy;
    if (out > 0) { cx = px + (bx - px) * out; cy = py + (by - py) * out; }
    else         { cx = bx + (px - bx) * suck; cy = by + (py - by) * suck; }
    const scale = 1.15 * Math.max(0, (1 - suck) + out);
    if (scale < 0.01) return;
    const sh = spriteHeight(spr) * scale, sw = sh * spr.aspect;

    ctx.save();
    ctx.translate(cx, cy);
    // 빨려들 땐 빙글빙글, 빠져나오면서 다시 곧게 선다
    ctx.rotate(Math.sin(introT * w0 * 8) * 0.10 + suck * 9 * (1 - out));
    // 뒤로 번지는 빛
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, sh * 0.95);
    const glow = introBoom > 0 ? .45 : .20;
    g.addColorStop(0, "rgba(255,210,63," + glow.toFixed(2) + ")");
    g.addColorStop(1, "rgba(255,210,63,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, sh * 0.95, 0, 6.283); ctx.fill();
    if (facing === "left") ctx.scale(-1, 1);
    ctx.drawImage(spr.img, -sw * spr.cx, -sh * spr.cy, sw, sh);
    ctx.restore();
  }

  /* ---------- 사운드 ---------- */
  let ac = null;
  /* 소리 끄기 — 배경음과 효과음을 따로 끈다. 브라우저에 기억시킨다.
     예전에는 하나로 묶여 있었으므로, 그때 꺼 둔 사람은 둘 다 꺼진 채로 이어받는다. */
  const LS_MUTE = "epjpddongpi_mute";      // 옛 키
  const LS_BGM = "epjpddongpi_bgmoff";
  const LS_SFX = "epjpddongpi_sfxoff";
  let bgmOff = false, sfxOff = false;
  try {
    const old = localStorage.getItem(LS_MUTE) === "1";
    bgmOff = localStorage.getItem(LS_BGM) === "1" || old;
    sfxOff = localStorage.getItem(LS_SFX) === "1" || old;
  } catch (e) {}
  function beep(freq, dur, type, vol) {
    if (sfxOff) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      loadSfx();   // 첫 소리가 나는 순간부터 받아 둔다 (첫 효과음이 삐 소리로 새지 않게)
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, ac.currentTime);
      g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  /* ---------- 효과음 ----------
     소리마다 녹음 크기가 제각각이라 배율로 귀에 맞춰 뒀다 (하트는 원본이 유독 작다).
     오디오 문맥이 열린 뒤에 한 번만 받아 두고, 아직 안 받았거나 실패했으면
     false 를 돌려주어 부르는 쪽이 예전 삐 소리로 대신하게 한다. */
  /* 루도 소리는 파일마다 녹음 크기가 달라서, 최대치를 재어 비슷한 체감이 되게 맞춘 값 */
  const SFX_GAIN = { star: 3.4, aug: 0.9, fever: 0.8, hurt: 0.8,
                     over: 0.8, gold: 2.0, heart: 1.0, shield: 0.9,
                     moon: 2.8, bubble: 0.8, break: 0.6, helper: 0.45, fetch: 0.5,
                     galaga: 0.35, dove: 0.3, clone: 1.6, burst: 0.8,
                     angry: 0.8, laser: 0.9, fpick: 1.2, giant: 1.0, magnet: 0.55,
                     dodge: 0.9, boing: 0.9, wakboom: 0.9, reroll: 0.7 };
  const SFX_VOL = 0.55;              // 전체 크기
  const sfxBuf = {};
  let sfxAsked = false;
  function loadSfx() {
    if (sfxAsked || !ac) return;
    sfxAsked = true;
    for (const k in SFX_GAIN) {
      fetch("assets/sfx/" + k + ".mp3")
        .then(r => r.arrayBuffer())
        .then(b => ac.decodeAudioData(b))
        .then(buf => { sfxBuf[k] = buf; })
        .catch(() => {});
    }
  }
  function sfx(name, vol) {
    if (sfxOff) return true;         // 껐으면 삐 소리로도 대신하지 않는다
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      loadSfx();
      const buf = sfxBuf[name];
      if (!buf) return false;
      const src = ac.createBufferSource(), g = ac.createGain();
      src.buffer = buf;
      g.gain.value = SFX_VOL * (SFX_GAIN[name] || 1) * (vol === undefined ? 1 : vol);
      src.connect(g); g.connect(ac.destination);
      src.start();
      return true;
    } catch (e) { return false; }
  }

  /* 자석 소리 — 한 번 울리고 마는 다른 효과음과 달리 끌리는 내내 이어진다.
     그래서 반복 재생을 켜 두고 음량만 바꾼다. 목표 음량으로 조금씩 다가가므로
     아이템이 여러 개 드나들어도 소리가 툭툭 끊기지 않는다. */
  let magSrc = null, magGain = null, magLvl = 0;
  function magHum(target) {
    if (sfxOff || !ac || !sfxBuf.magnet) {
      if (magSrc) { try { magSrc.stop(); } catch (e) {} magSrc = null; magGain = null; magLvl = 0; }
      return;
    }
    if (!magSrc) {
      if (target <= 0.002) return;             // 끌리는 게 없으면 아예 켜지 않는다
      magSrc = ac.createBufferSource();
      magGain = ac.createGain();
      magSrc.buffer = sfxBuf.magnet;
      magSrc.loop = true;
      magGain.gain.value = 0;
      magSrc.connect(magGain); magGain.connect(ac.destination);
      magSrc.start();
      magLvl = 0;
    }
    magLvl += (target - magLvl) * 0.14;        // 목표로 부드럽게 따라간다
    magGain.gain.value = SFX_VOL * (SFX_GAIN.magnet || 1) * magLvl;
    if (target <= 0.002 && magLvl < 0.004) {   // 다 잦아들면 끈다
      try { magSrc.stop(); } catch (e) {}
      magSrc = null; magGain = null; magLvl = 0;
    }

  /* ---------- 배경음악 ----------
     곡 하나가 수백KB라 필요할 때 한 곡씩 받는다 (음소거면 아예 받지 않는다).
     대기화면·게임오버는 menu, 게임 중은 play, 우주는 space, 블랙홀은 blackhole,
     뚜니핑 타임에는 fever.

     한 곡을 두 벌 만들어 두고, 끝나기 3.5초 전부터 다른 벌을 처음부터 겹쳐 튼다.
     브라우저의 loop 로 그냥 되감으면 mp3 앞뒤 여백만큼 소리가 비고 마디도 뚝 끊기는데,
     겹쳐 넘기면 그 자리가 크로스페이드로 메워진다. */
  const BGM_VOL = { menu: 0.42, play: 0.34, space: 0.36, blackhole: 0.40, fever: 0.42 };
  const BGM_LOOP_X = 3.5;            // 곡 끝과 처음을 겹치는 시간(초)
  const BGM_SWAP_X = 0.45;           // 다른 곡으로 갈아탈 때 겹치는 시간(초)
  const bgmPair = {};                // 이름 -> 같은 곡 두 벌
  let bgmName = null;                // 지금 울려야 할 곡 이름
  let bgmCur = null;                 // 그 곡에서 실제로 재생 중인 쪽
  let bgmOut = [];                   // 물러나는 중인 것들
  let bgmRetryAt = 0;
  function bgmGet(name) {
    if (!bgmPair[name]) {
      bgmPair[name] = [0, 1].map(() => {
        const a = new Audio("assets/bgm/" + name + ".mp3");
        a.loop = false;              // 되감기는 우리가 직접 한다
        a.preload = "auto"; a.volume = 0; a.__nm = name;
        return a;
      });
    }
    return bgmPair[name];
  }
  function bgmStart(a) {
    try { a.currentTime = 0; } catch (e) {}
    a.volume = 0;
    const pr = a.play();
    /* 브라우저는 사용자가 화면을 한 번 만지기 전에는 소리를 막는다.
       막히면 이름을 비워 두고 잠시 뒤 다시 시도한다. */
    if (pr && pr.catch) pr.catch(() => { bgmName = null; bgmRetryAt = Date.now() + 800; });
  }
  function bgmFadeOut(el, len) {
    if (!el) return;
    bgmOut.push({ el: el, t: len, len: len, v0: el.volume });
  }
  function playBgm(name) {
    bgmFadeOut(bgmCur, BGM_SWAP_X);
    bgmCur = null;
    bgmName = name;
    if (bgmOff || !name) return;
    const el = bgmGet(name)[0];
    bgmStart(el);
    bgmCur = el;
  }
  /* 매 프레임 — 물러나는 곡을 줄이고, 지금 곡은 키우거나 다음 바퀴로 넘긴다 */
  function bgmTick(dt) {
    for (let i = bgmOut.length - 1; i >= 0; i--) {
      const f = bgmOut[i];
      f.t -= dt;
      if (f.t <= 0) { f.el.pause(); f.el.volume = 0; bgmOut.splice(i, 1); }
      else f.el.volume = f.v0 * (f.t / f.len);
    }
    if (bgmOff || !bgmCur || !bgmName) return;
    const V = BGM_VOL[bgmName] || 0.4;
    const d = bgmCur.duration;
    if (!d || !isFinite(d)) { bgmCur.volume = V; return; }   // 아직 길이를 모른다
    const left = d - bgmCur.currentTime;
    if (left > BGM_LOOP_X) {
      bgmCur.volume = Math.min(V, bgmCur.volume + dt / BGM_SWAP_X * V);
      return;
    }
    const pair = bgmPair[bgmName];
    const other = pair[0] === bgmCur ? pair[1] : pair[0];
    if (other.paused) bgmStart(other);
    const k = Math.max(0, left / BGM_LOOP_X);      // 1 에서 0 으로
    bgmCur.volume = V * k;
    other.volume = V * (1 - k);
    if (left <= 0.06) { bgmFadeOut(bgmCur, 0.15); bgmCur = other; }
  }
  function syncBgm() {
    const inGame = state === STATE.PLAY || state === STATE.AUG || state === STATE.PAUSE;
    const want = inGame
      ? (fever ? "fever"
               : (inBlackhole() ? "blackhole" : (inSpace() ? "space" : "play")))
      : "menu";
    if (want === bgmName || bgmOff) return;
    if (bgmName === null && Date.now() < bgmRetryAt) return;   // 막힌 직후에는 잠깐 쉰다
    playBgm(want);
  }
  function setSnd(kind, off) {

    } else {

      if (bgmOff) {
        for (const k in bgmPair) for (const a of bgmPair[k]) { a.pause(); a.volume = 0; }
        bgmOut = [];
        bgmCur = null;
        bgmName = null;
      } else {
        bgmRetryAt = 0;
        syncBgm();
      }
    }
    try { localStorage.removeItem(LS_MUTE); } catch (e) {}   // 옛 키는 더 쓰지 않는다
    syncSoundUI();

  function eatStar(x, y) {

    starCount++;

  function closeAugScreen() {

    const paused = performance.now() - augPauseAt;

  function showAugmentPick() {
    augRound++;                        // 이번이 몇 번째 선택 차례인지

    const pool = AUGMENTS.filter(a =>
      (augCount[a.id] || 0) < maxOf(a) && (!a.cond || a.cond()));
    /* 뽑히는 가중치: 따로 지정한 값이 우선, 히든은 일반의 1/4, 나머지는 1.

         안 고른 두 장 — 바로 다음 차례 1/2, 그 뒤로는 원래대로 */
    const pj = job === "powerj";      // 파워J는 한 장뿐이라 거절이 안 되니 더 세게 누른다
    const wOf = a => {
      const base = (a.w !== undefined ? a.w : (a.hidden ? (1 / 4) : 1));
      const gapT = augRound - (augTook[a.id] || -9);      // 골랐던 차례와의 간격
      const gapS = augSeen[a.id] || -9;                   // 후보로만 떴던 차례
      let m = 1;
      if (gapT === 1) m = pj ? 1 / 8 : 1 / 3;
      else if (gapT === 2) m = pj ? 1 / 4 : 1 / 2;
      else if (gapT === 3) { if (pj) m = 1 / 2; }
      else if (augRound - gapS === 1) m = 1 / 2;
      return base * m;
    };
    const picks = [];
    // 파워J 는 계획이 하나면 충분하고, 파워P 는 다섯 장을 다 펼쳐 놓고 고른다
    const nPick = job === "powerj" ? 1 : (job === "powerp2" ? 5 : 3);
    while (picks.length < nPick && pool.length) {
      let total = 0;
      for (const a of pool) total += wOf(a);
      let n = Math.random() * total, idx = pool.length - 1;
      for (let i = 0; i < pool.length; i++) {
        const w = wOf(pool[i]);
        if (n < w) { idx = i; break; }
        n -= w;
      }
      picks.push(pool.splice(idx, 1)[0]);
    }
    for (const a of picks) augSeen[a.id] = augRound;   // 이번에 보여준 것들을 기억해 둔다
    if (!picks.length) {

      const times = augRemain;
      augRemain = 0;
      for (let k = 0; k < times; k++)
        eatStar(player.x, player.y - 60 - k * 28);
      closeAugScreen();
      return;

    augList.innerHTML = "";
    for (const a of picks) {
      const card = document.createElement("button");
      card.className = "augCard";
      const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = a.ic;
      const tx = document.createElement("span"); tx.className = "tx";

      const ds = document.createElement("div");  ds.className = "ds";  ds.textContent = a.dsFn ? a.dsFn() : a.ds;

  }
  let state = STATE.READY;

  function testJumpLevel(d) {

  let score = 0, lives = 3, level = 1, elapsed = 0, starCount = 0;
  /* 방울이 전용 — 목숨 대신 오염도로 버틴다. 0 에서 시작해 맞을 때마다 DIRT_HIT 씩
     차오르고 100 이면 끝. 빗방울을 먹으면 DIRT_WASH 만큼 씻긴다. */
  const DIRT_MAX = 100, DIRT_HIT = 25, DIRT_WASH = 35;

  let dirtShown = 0;

  function dirtJob() { return job === "bangul"; }
  let levelTime = 0;               // 레벨이 오르는 시계 — 뚜니핑 타임에는 멈춰 있다
  const LEVEL_SEC = 13;            // 레벨 한 칸의 길이(초). 지대 하나의 길이이기도 하다
  let spawnTimer = 0;
  let invUntil = 0, powerUntil = 0;

  let shieldTimer = UMB_SEC;       // 다음 하나까지 남은 시간

  let doves = [], moveDist = 0;
  let bullets = [], shipClock = 0;   // 갤러그: 날아가는 총알과 편대 공용 시계
  let ghosts = [];                   // 그건 제 잔상입니다만? — 피한 자리에 남는 잔상
  let wakBooms = [];                 // 고무고무노 피스톨 — 똥끼리 부딪혀 터진 자리의 고리
  /* 우주선 한 대가 다시 쏘기까지. 대수가 늘수록 각자 느긋해진다 —
     1대 0.6초 · 2대 0.8초 · 3대 1.0초 … (겹칠수록 총 화력의 상승폭이 줄어든다) */
  const SHIP_GAP = 0.6, SHIP_GAP_STEP = 0.2;

  function doveMul()   { return aug.doveWhat ? 1.5 : 1; }

  let roidT = 0;                   // 스테로이드 과다 복용: 남은 약발 시간(초)
  let hurtUntil = 0;               // 똥에 맞은 직후 (아픈 그림 표시)
  let zoneShown = -1;              // 도착 안내를 이미 띄운 단계
  let shake = 0, flash = 0, feverFlash = 0;

     연달아 맞는 자리에서는 지켜 주지 못한다. */
  const BUBBLE_SEC = 15;             // 터진 뒤 다시 맺히기까지
  let bubbleOn = false, bubbleT = 0;
  /* 점수판은 실제 점수를 곧바로 따라가지 않고 뒤에서 굴러 오른다.

  let scoreShown = 0, scorePunch = 0, prevScore = 0;

  let bubPops = [];                  // 터진 비누방울 — 테두리가 퍼지고 물방울이 튄다
  const BUB_TONES = ["#ffffff", "#cfefff", "#ffd2f2", "#d6fff2", "#e6dcff"];
  let fever = false, feverT = 0, feverDur = 10000;

  let last = 0;

  window.addEventListener("keyup", e => { keys[e.key] = false; });

  /* 터치: 손가락을 화면 어디에 대도 좌우로 끌어서 조작 */
  function pointerX(e) {
    const r = cv.getBoundingClientRect();
    const cx = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - r.left;
    return cx / r.width * W;
  }
  function pointerY(e) {
    const r = cv.getBoundingClientRect();
    const cy = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY) - r.top;
    return cy / r.height * H;
  }
  function movePointer(e) {
    if (state !== STATE.PLAY) return;
    /* 화면(증강·직업 선택)을 누른 손가락이 그대로 게임 조작으로 새는 걸 막는다.
       화면이 닫힌 뒤 브라우저가 같은 자리에 흉내내는 마우스 이벤트를 흘려보낸다. */
    if (performance.now() < inputHoldUntil) { if (e.cancelable) e.preventDefault(); return; }
    if (ctrlMode === "pad") { if (e.cancelable) e.preventDefault(); return; }
    player.tx = Math.max(player.r, Math.min(W - player.r, pointerX(e)));
    if (flyOn) {
      /* 캐릭터가 손가락·커서보다 위에 떠 있도록 한다.
         손에 캐릭터가 가려지지 않아 조작감이 훨씬 낫다. */
      const want = pointerY(e) - 90;
      player.ty = Math.max(H * FLY_TOP, Math.min(groundY, want));
    }
