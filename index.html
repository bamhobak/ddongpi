  }
  cv.addEventListener("mousemove", movePointer);
  cv.addEventListener("touchstart", movePointer, { passive: false });
  cv.addEventListener("touchmove", movePointer, { passive: false });

  /* ---------- 조작 방식: 터치 따라가기 / 십자패드 ----------
     십자패드는 누르고 있는 동안 키보드 방향키와 같은 신호를 낸다. */
  const LS_CTRL = "epjpddongpi_ctrl";
  let ctrlMode = "touch";
  try { ctrlMode = localStorage.getItem(LS_CTRL) === "pad" ? "pad" : "touch"; } catch (e) {}
  const dpad = document.getElementById("dpad");
  function syncPad() {   // 게임 중 + 십자패드 모드일 때만 보인다
    const on = ctrlMode === "pad" && btnPause.classList.contains("on");
    dpad.classList.toggle("on", on);
    dpad.classList.toggle("noVert", !flyOn);
    if (!on) padClear();
  }
  /* 소리 버튼도 생김새를 맞추려고 같은 클래스를 쓰므로, 조작 쪽은 제 상자 안만 본다.
     (예전에는 전체를 훑어서 서로를 꺼 버렸다) */
  function showCtrl() {
    for (const b of document.querySelectorAll("#ctrlBox .ctrlBtn"))
      b.classList.toggle("on", b.dataset.ctrl === ctrlMode);
  }
  for (const b of document.querySelectorAll("#ctrlBox .ctrlBtn")) {
    b.addEventListener("click", () => {
      ctrlMode = b.dataset.ctrl;
      try { localStorage.setItem(LS_CTRL, ctrlMode); } catch (e) {}
      showCtrl();
      beep(760, .06, "square", .03);
    });
  }
  showCtrl();
  /* 패드 안에서 누른 지점의 방향으로 움직인다. 손가락을 떼지 않고 밀기만 해도 방향이 바뀌고,
     가운데로 돌아오면 멈춘다. 대각선도 된다. */
  const padKnob = dpad.querySelector(".knob");
  /* 패드를 민 정도(0~1). 키보드로 조작할 때는 항상 1이라 예전과 똑같다. */
  let padAmpX = 1, padAmpY = 1;
  const PAD_MIN = 0.10;          // 살짝만 밀었을 때의 최소 속도 비율
  const PAD_STEPS = 16;          // 최소~최대 사이를 이만큼의 단계로 나눈다
  const PAD_RANGE = 105;         // 이 거리(px)까지 밀어야 최고 속도 — 패드 밖으로 나가도 이어진다
  /* 느린 구간을 넓게 잡아 섬세하게 다루고, 끝까지 밀었을 때만 최고 속도가 나온다.
     빠른 캐릭터(부양사)일수록 저속 구간이 더 넓어야 조준이 된다. */
  function padAmp(v, dead) {
    const t = Math.max(0, Math.min(1, (Math.abs(v) - dead) / (PAD_RANGE - dead)));
    const e = 1.6 + (spdMul() - 1) * 0.5;        // 빠른 직업은 더 완만하게
    const q = Math.round(Math.pow(t, e) * PAD_STEPS) / PAD_STEPS;
    return PAD_MIN + (1 - PAD_MIN) * q;
  }
  const padArrow = {
    ArrowUp: dpad.querySelector(".up"), ArrowDown: dpad.querySelector(".dn"),
    ArrowLeft: dpad.querySelector(".lf"), ArrowRight: dpad.querySelector(".rt")
  };
  function padSet(l, r, u, d) {
    keys.ArrowLeft = l; keys.ArrowRight = r; keys.ArrowUp = u; keys.ArrowDown = d;
    padArrow.ArrowLeft.classList.toggle("hit", l);
    padArrow.ArrowRight.classList.toggle("hit", r);
    padArrow.ArrowUp.classList.toggle("hit", u);
    padArrow.ArrowDown.classList.toggle("hit", d);
  }
  function padClear() {
    padAmpX = padAmpY = 1;
    padSet(false, false, false, false);
    dpad.classList.remove("press");
    padKnob.style.transform = "";
  }
  function padMove(e) {
    const r = dpad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const flat = dpad.classList.contains("noVert");   // 좌우 전용 알약 패드
    if (flat) {
      // 가로로만 움직인다. 가운데 12px 안쪽은 정지 구역.
      const max = r.width / 2 - 34;
      const kx = Math.max(-max, Math.min(max, dx));
      padKnob.style.transform = "translateX(" + kx.toFixed(1) + "px)";
      if (Math.abs(dx) < 5) { padSet(false, false, false, false); return; }
      padAmpX = padAmp(dx, 5);
      padSet(dx < 0, dx > 0, false, false);
      return;
    }
    const dist = Math.hypot(dx, dy);
    const max = r.width / 2 - 16;
    const k = dist > max ? max / dist : 1;         // 손잡이는 패드 안에서만 움직인다
    padKnob.style.transform = "translate(" + (dx * k).toFixed(1) + "px," + (dy * k).toFixed(1) + "px)";
    if (dist < 7) { padSet(false, false, false, false); return; }    // 가운데는 정지
    // 가로·세로 성분 중 확실히 큰 쪽만 켠다. 둘이 비슷하면(2배 이내) 대각선.
    const horiz = Math.abs(dx) >= Math.abs(dy) * 0.5;
    const vert  = flyOn && Math.abs(dy) >= Math.abs(dx) * 0.5;
    // 민 거리에 비례한 세기 — 축마다 따로 잰다 (대각선에서도 자연스럽게)
    padAmpX = padAmp(dx, 4);
    padAmpY = padAmp(dy, 4);
    padSet(horiz && dx < 0, horiz && dx > 0, vert && dy < 0, vert && dy > 0);
  }
  dpad.addEventListener("pointerdown", e => {
    dpad.classList.add("press");
    try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
    padMove(e);
    if (e.cancelable) e.preventDefault();
  });
  dpad.addEventListener("pointermove", e => {
    if (!dpad.classList.contains("press")) return;
    padMove(e);
    if (e.cancelable) e.preventDefault();
  });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) dpad.addEventListener(ev, padClear);
  dpad.addEventListener("contextmenu", e => e.preventDefault());

  /* ---------- 플레이어 이름 ----------
     시작 화면에서 미리 정해두고, 게임이 끝나면 조건을 만족할 때 자동으로 등록된다. */
  const nameBox   = document.getElementById("nameBox");
  const nameEdit  = document.getElementById("nameEdit");
  const myNameEl  = document.getElementById("myName");
  const startName = document.getElementById("startName");

  function savedName() {
    try { return (localStorage.getItem(LS_NAME) || "").trim(); } catch (e) { return ""; }
  }
  function showNameView() {
    const n = savedName();
    myNameEl.textContent = n || "-";
    if (n) { nameBox.classList.remove("off"); nameEdit.classList.remove("on"); }
    else   { nameBox.classList.add("off");    nameEdit.classList.add("on"); }
  }
  function startEditName() {
    startName.value = savedName();
    nameBox.classList.add("off");
    nameEdit.classList.add("on");
    startName.focus();
  }
  function saveName() {
    const n = startName.value.trim().slice(0, 5);
    if (!n) { startName.focus(); return; }
    try { localStorage.setItem(LS_NAME, n); } catch (e) {}
    showNameView();
  }
  document.getElementById("btnEditName").addEventListener("click", startEditName);
  document.getElementById("btnSaveName").addEventListener("click", saveName);
  startName.addEventListener("keydown", e => {
    e.stopPropagation();                       // 스페이스로 게임이 시작되지 않도록
    if (e.key === "Enter") { e.preventDefault(); saveName(); }
  });
  showNameView();

  /* ---------- 일시정지 ----------
     멈춘 동안의 시간은 뚜니핑·무적 마감에서 빼 주고,
     풀 때는 3초를 세고 나서 다시 움직인다. */
  const btnPause = document.getElementById("btnPause");
  const pauseScreen = document.getElementById("pauseScreen");
  let pauseAt = 0, resumeCountEnd = 0;

  function doPause() {
    if (state !== STATE.PLAY) return;
    state = STATE.PAUSE;
    pauseAt = performance.now();
    resumeCountEnd = 0;
    btnPause.classList.remove("on"); syncPad();
    pauseScreen.classList.remove("hidden");
    beep(500, .08, "sine", .04);
  }
  btnPause.addEventListener("click", doPause);
  startScreen.style.visibility = "hidden";      // 스플래시가 끝나면 드러난다
  for (const ev of ["pointerdown", "keydown"])
    window.addEventListener(ev, () => endSplash(), { passive: true });
  for (const b of document.querySelectorAll(".sndBtn")) {
    b.addEventListener("click", () => setSnd(b.dataset.snd,
      b.dataset.snd === "bgm" ? !bgmOff : !sfxOff));
  }
  syncSoundUI();

  document.getElementById("btnResume").addEventListener("click", () => {
    pauseScreen.classList.add("hidden");
    resumeCountEnd = performance.now() + 3000;   // 3초 세고 나서 재개
    beep(700, .08, "sine", .04);
  });

  // 일시정지에서 다시하기 — 이번 판은 기록 없이 버리고 직업 선택부터 다시
  document.getElementById("btnPauseRetry").addEventListener("click", () => {
    pauseScreen.classList.add("hidden");
    resumeCountEnd = 0;
    state = STATE.OVER;
    beep(520, .08, "square", .04);
    openJobSelect();
  });

  function finishResume(now) {
    const paused = now - pauseAt;
    if (powerUntil > 0) powerUntil += paused;
    if (invUntil  > 0) invUntil  += paused;
    if (hurtUntil > 0) hurtUntil += paused;
    resumeCountEnd = 0;
    state = STATE.PLAY;
    btnPause.classList.add("on"); syncPad();
    beep(950, .1, "square", .05);
  }

  /* ---------- 직업 선택 화면 ----------
     시작하기·다시하기를 누르면 먼저 직업을 고른다. 카드를 누르면 바로 시작하지 않고
     그 직업을 크게 보여 주고, '이걸로 시작'을 눌러야 판이 시작된다. */
  const jobScreen = document.getElementById("jobScreen");
  const jobList   = document.getElementById("jobList");
  const jobDetail = document.getElementById("jobDetail");
  const btnJobBack = document.getElementById("btnJobBack");
  let jobTestMode = false;              // 테스트 모드로 들어왔는지 (상세를 거쳐도 유지)

  /* 긴 설명을 가운뎃점으로 끊어 줄 단위로 보여 준다 */
  function jobTraitLines(j) {
    return String(j.ds).split("·").map(t => t.trim()).filter(Boolean);
  }
  function showJobDetail(id) {
    job = id;
    try { localStorage.setItem(LS_JOB, job); } catch (e) {}
    const j = JOBS[id];
    document.getElementById("jobBig").src = "assets/" + JOB_IMG[id] + "_right.png";
    document.getElementById("jobBig").alt = j.nm;
    document.getElementById("jobName").textContent = j.nm;
    const tr = document.getElementById("jobTraits");
    tr.innerHTML = "";
    for (const line of jobTraitLines(j)) {
      const d = document.createElement("div");
      d.className = "tr";
      const dot = document.createElement("span");
      dot.className = "dot";
      d.appendChild(dot);
      d.appendChild(document.createTextNode(line));   // textContent → HTML 삽입 불가
      tr.appendChild(d);
    }
    if (j.f) {                                // 직업마다 붙는 한마디 — 모양은 위와 같게
      const d = document.createElement("div");
      d.className = "tr";
      const dot = document.createElement("span");
      dot.className = "dot";
      d.appendChild(dot);
      d.appendChild(document.createTextNode(j.f));
      tr.appendChild(d);
    }
    jobList.classList.add("hidden");
    jobDetail.classList.remove("hidden");
    btnJobBack.hidden = true;              // 상세에서는 '다른 직업 보기'로만 빠져나간다
  }
  function showJobList() {
    jobDetail.classList.add("hidden");
    jobList.classList.remove("hidden");
    btnJobBack.hidden = false;
    for (const c of jobList.children) c.classList.toggle("sel", c.dataset.job === job);
  }
  function openJobSelect(test) {           // test === true 면 고른 뒤 테스트 모드로 시작
    const list = document.getElementById("jobList");
    list.innerHTML = "";
    // 카드 앞에는 이모지 대신 그 직업의 이재(오른쪽 이동 모습)를 보여준다
    for (const id in JOBS) {
      const j = JOBS[id];
      const card = document.createElement("button");
      card.className = "augCard";
      const ic = document.createElement("img"); ic.className = "ic";
      ic.src = "assets/" + JOB_IMG[id] + "_right.png"; ic.alt = j.ic;
      const tx = document.createElement("div"); tx.className = "tx";
      const nm = document.createElement("div"); nm.className = "nm2"; nm.textContent = j.nm;
      card.title = j.ds;                       // 설명은 눌러 보기 전 도움말로만
      if (id === job) card.classList.add("sel");
      tx.append(nm);
      card.append(ic, tx);
      card.dataset.job = id;
      card.addEventListener("click", () => {
        beep(900, .08, "square", .05);
        showJobDetail(id);               // 바로 시작하지 않고 먼저 보여 준다
      });
      list.appendChild(card);
    }
    jobTestMode = test === true;
    showJobList();
    startScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    jobScreen.classList.remove("hidden");
  }

  document.getElementById("btnJobGo").addEventListener("click", () => {
    jobScreen.classList.add("hidden");
    beep(900, .08, "square", .05);
    reset(jobTestMode);
  });
  document.getElementById("btnJobList").addEventListener("click", () => {
    beep(520, .06, "square", .04);
    showJobList();
  });

  // 직업을 고르지 않고 시작화면으로 되돌아간다 (테스트 종료와 같은 길)
  btnJobBack.addEventListener("click", () => {
    beep(520, .06, "square", .04);
    jobScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
    state = STATE.READY;                 // 시작화면 데모가 다시 돌게
  });

  document.getElementById("btnStart").addEventListener("click", () => {
    if (!savedName()) { startEditName(); return; }   // 이름부터 정하고 시작
    openJobSelect();
  });
  document.getElementById("btnRetry").addEventListener("click", () => openJobSelect());

  function reset(test) {
    testMode = (test === true);    // 정확히 true 일 때만 테스트 모드 (이벤트 객체가 새어들지 않게)
    btnTestEnd.classList.toggle("on", testMode);
    testLv.classList.toggle("on", testMode);
    lvNow.textContent = "Lv 1";
    layout();
    items = []; particles = []; floats = []; warns = []; introPoops = []; introT = 0;
    // 테스트 모드는 어차피 목숨이 안 줄어드니, 목숨 조건 증강(당근거래·분신술)을
    // 바로 시험해볼 수 있게 1부터 시작한다.
    score = 0; lives = testMode ? 1 : 3; level = 1; elapsed = 0; levelTime = 0; starCount = 0;
    dirt = 0; dirtShown = 0;
    spawnTimer = 0;
    invUntil = 0; powerUntil = 0; hurtUntil = 0; shields = 0;
    shake = 0; flash = 0; feverFlash = 0; fever = false; feverT = 0; feverBanner = 0;
    scoreShown = 0; scorePunch = 0; prevScore = 0; rings = []; bubPops = [];
    scoreSrc = {};
    bubbleOn = (job === "bangul"); bubbleT = 0;   // 방울이는 방울을 두르고 시작한다
    zoneShown = -1;
    augCount = {};
    aug.feverBonus = 0; aug.starMul = 1; aug.timeMul = 1;
    aug.feverScoreMul = 1; aug.fallMul = 1; aug.hitboxMul = 1; aug.poopMul = 1;
    aug.steelUmb = false; aug.starburst = false; aug.scoreMul = 1;
    aug.dodge = 0; aug.wak = false; aug.dungy = false; aug.momMeal = false;
    rerolls = REROLLS; ghosts = []; wakBooms = [];
    aug.blackhole = false; aug.legion = false; roidT = 0;
    aug.doveWhat = false;
    flyOn = false;
    aug.angryUmb = false; aug.goldChance = 0; aug.inter = false; aug.goldLord = false;
    augRound = 0;
    for (const k in augSeen) delete augSeen[k];
    for (const k in augTook) delete augTook[k];
    aug.clone = false;
    spawnHold = 0; umbBlast = null; bulletT = 0; interTimer = 8;
    noHitSec = 0;
    clones = []; cloneTimer = 0;
    doves = []; moveDist = 0;
    bullets = []; shipClock = 0; aug.galaga = 0;
    shieldTimer = UMB_SEC;
    aug.itemRateMul = 1; aug.feverRateMul = 1; aug.giant = 0; aug.magnet = 0;
    resetBonusTimers();          // 증강 배율을 되돌린 뒤라야 첫 타이머가 제대로 잡힌다
    aug.helper = 0; aug.helperRush = false; aug.hungry = false; aug.galaga = 0;
    helpers = []; fetchers = [];
    helperTimer = 0; helperQueue = 0; helperGap = 0; fetchRest = 0; aug.maxLives = 5;
    // ---- 직업 효과 ----
    if (job === "gambler") {
      lives = 1;
      aug.maxLives = 1;               // 하트는 애초에 별로 대체되어 떨어진다
      shields = 1;                    // 대신 우산 1개를 쥐여 준다
      aug.scoreMul *= 2.5;            // 모든 점수 2.5배
    }
    if (job === "levitator") {
      flyOn = true;                   // 처음부터 하늘을 난다 (몸 크기는 그대로)
      player.ty = groundY;
    }
    if (job === "fit") {
      lives = 5;
      aug.maxLives = 30;              // 하트를 쌓아 올리는 직업
      aug.hitboxMul *= 1.3;           // 몸이 커서 잘 맞는다
    }
    augScreen.classList.add("hidden");
    facing = "right";
    player.x = player.tx = W / 2;
    player.y = player.ty = groundY;
    state = STATE.PLAY;
    startScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    nameRow.classList.remove("on");
    beep(660, .1, "square", .04);
    inputHoldUntil = performance.now() + 350;   // 직업 카드를 누른 손가락이 조작으로 새지 않게
    btnPause.classList.add("on"); syncPad();
    pauseScreen.classList.add("hidden");
    resumeCountEnd = 0;
    if (job === "none") openAugment(1);   // 백수의 소소한 복지 — 시작하자마자 증강 1개
  }

  /* 구름 하나하나의 생김새를 따로 만든다. 같은 덩이 세 개를 겹쳐 놓으면
     어느 구름이나 똑같아 보여서, 덩이 수와 크기·위치를 구름마다 뽑는다. */
  function reshapeCloud(c) {
    const n = 3 + Math.floor(Math.random() * 3);      // 덩이 3~5개
    c.lobes = [];
    let px = -c.s * (0.42 + Math.random() * 0.22);
    for (let i = 0; i < n; i++) {
      const mid = 1 - Math.abs(i - (n - 1) / 2) / (n / 1.6);   // 가운데가 더 봉긋하다
      c.lobes.push({
        dx: px,
        dy: (Math.random() - 0.65) * c.s * 0.16,
        r: c.s * (0.20 + 0.24 * Math.max(0.35, mid) + Math.random() * 0.10)
      });
      px += c.s * (0.24 + Math.random() * 0.20);
    }
    c.bw = c.s * (0.52 + Math.random() * 0.20);       // 바닥은 평평하게 깔린다
    c.bh = c.s * (0.14 + Math.random() * 0.09);
  }
  for (let i = 0; i < 7; i++) {
    const c = { x: Math.random() * W, y: Math.random() * H * .7,
                s: 26 + Math.random() * 64, v: 4 + Math.random() * 10 };
    reshapeCloud(c);
    clouds.push(c);
  }

  /* ---------- 스폰 ---------- */
  /* 뚜니핑 타임 낙하물 크기 등급 — 클수록 드물고 점수가 크다 */
  const FEVER_SIZES = [
    { min: 18, max: 22, score: 3,  w: 22 },
    { min: 22, max: 26, score: 5,  w: 18 },
    { min: 26, max: 31, score: 8,  w: 14 },
    { min: 31, max: 37, score: 10, w: 11 },
    { min: 37, max: 44, score: 15, w: 8  },
    { min: 44, max: 52, score: 25, w: 5  },
    { min: 52, max: 62, score: 40, w: 3  }   // 초대형 — 가장 드물다
  ];
  // 대왕 뚜니핑 — 기존 최대(52~62)의 2배 크기, 점수는 최대 등급(75)의 3배
  const GIANT = { min: 104, max: 124, score: 138, w: 3, giant: true };
  function pickFeverSize() {
    const list = aug.giant > 0
      ? FEVER_SIZES.concat([{
          min: GIANT.min, max: GIANT.max,
          score: GIANT.score * (aug.legion ? 2 : 1),
          w: GIANT.w * aug.giant * (aug.legion ? 3 : 1),
          giant: true
        }])
      : FEVER_SIZES;
    const total = list.reduce((a, b) => a + b.w, 0);
    let n = Math.random() * total;
    for (const s of list) { if (n < s.w) return s; n -= s.w; }
    return list[0];
  }

  /* 후반 가속 — Lv10까지는 기존 그대로, Lv11부터 레벨당 +1.5%,
     블랙홀(Lv17) 이후에는 거기에 레벨당 +5%를 더 얹는다.
     낙하 속도에는 그대로, 생성 빈도에는 제곱근만큼 나눠 곱한다. */
  function lateMul() {
    let m = 1;
    if (level > 10) m *= Math.pow(1.015, level - 10);
    if (level > 17) m *= Math.pow(1.025, level - 17);   // 블랙홀 뒤 레벨당 (예전 +5%)
    return m;
  }

  /* 레벨이 오를수록 좁아지는 똥 사이 간격. 바닥(상한) 없이 계속 좁아지되,
     0.13초부터는 곱셈으로 줄여서 0 아래로 내려가지 않는다. */
  function spawnGap() {
    // 레벨당 좁아지는 폭을 완화했다 (레벨 1 간격은 그대로)
    const lin = 0.50707 - level * 0.029087;
    // 0.765 로 나눠 간격을 벌린다 → 떨어지는 똥이 예전보다 10% + 다시 15% 줄어든다
    return (lin > 0.13 ? lin : 0.13 * Math.pow(0.9271, level - 12.37)) / 0.765 / Math.sqrt(lateMul());
  }

  /* 낙하 각도. 좌우 속도를 낙하 속도에 비례시켜서 레벨이 올라도 기울기 느낌이 일정하다.
     (Math.random() - Math.random()) 은 0 근처가 흔하고 양 끝이 드문 삼각분포 →
     대부분은 적당히 기울고 일부만 크게 비스듬히 떨어진다. */
  const SPREAD_POOP  = 0.1780; // 최대 약 10도 (9도에서 1도 더 벌렸다)
  const SPREAD_BONUS = 0.28;   // 아이템은 조금 얌전하게 (약 16도)

  const FEVER_VY = 245;      // 뚜니핑 낙하물 기준 속도 — 레벨이 올라도 그대로 유지한다
  /* 뚜니핑 낙하물이 터질 때 쓰는 색 — 점수와 무관하게 무작위로 골라 폭죽처럼 보이게 한다 */
  const FEVER_TONES = [
    "#ff4d6d", "#ff7a45", "#ffd23f", "#8bde5a", "#35f0ff", "#4d8bff",
    "#c86bff", "#ff5ec7", "#ffffff", "#7dffcf", "#ffe3a8", "#a0ff4d"
  ];

  /* 레벨 7부터 섞여 나오는 까다로운 똥들
     split  = 내려오다 둘로 쪼개진다 (쪼개진 조각은 평범한 똥)
     zigzag = 좌우로 크게 흔들리며 내려온다
     laser  = 1초간 떨어질 자리를 깜빡여 알려준 뒤 번개처럼 내리꽂힌다
     huge   = 초대형 뚜니핑의 1.4배쯤 되는 거대한 똥, 느리게 굴러떨어진다 */
  const SPECIAL_KINDS = ["split", "zigzag", "laser", "huge"];
  const HUGE_R = 50.35;        // 반지름 — 66 → 53 (20%) → 다시 5% 축소
  /* 까다로운 똥이 나올 확률 — 레벨 7에서 SPEC_BASE 로 시작해 레벨마다 SPEC_STEP 씩 오른다.
     상한 SPEC_CAP — 절반까지만. 나머지 절반은 언제나 평범한 똥이다. */
  const SPEC_FROM = 7, SPEC_BASE = 0.023, SPEC_STEP = 0.04, SPEC_CAP = 0.5;
  const LASER_WARN = 1;        // 예고 시간(초)
  const LASER_VY = 4500;       // 낙하 속도 — 똥이 아니라 레이저처럼 내리꽂힌다
  let warns = [];              // 예고 중인 레이저 자리

  /* 꾸밈 고르기 — 0·1 은 민얼굴이라 셋 중 하나쯤은 장식이 없다. */
  function randFace() { return Math.floor(Math.random() * 14); }
  /* 눈·입은 따로 굴려서 장식과 조합된다 (0 = 그림 그대로) */
  function randEye() { const r = Math.random(); return r < 0.42 ? 0 : 1 + Math.floor(Math.random() * 9); }
  function randMouth() { const r = Math.random(); return r < 0.55 ? 0 : 1 + Math.floor(Math.random() * 3); }
  // 눈을 통째로 덮는 장식(선글라스·X눈·하트눈·별눈·안대)이면 눈 변형은 건너뛴다
  const EYE_COVER = { 3: 1, 4: 1, 8: 1, 9: 1, 12: 1 };

  function spawnPoop(mul, special, forceX, forceAng, forceDark) {
    if (spawnHold > 0) return;              // 성난 우산 직후에는 똥이 나오지 않는다
    const m = (mul || 1) * (H / BASE_H);   // 화면이 길면 그만큼 빨리 떨어져야 체감이 같다
    // 뚜니핑 타임에 나온 것은 외형·점수를 스스로 기억한다 → 뚜니핑 타임이 끝나도 모습이 바뀌지 않는다
    const inFever = fever;
    const cls = inFever ? pickFeverSize() : null;
    /* 다크똥 — 뚜니핑 낙하물과 무지개똥을 뺀 나머지가 대상이다.
       특수똥이면 그대로 '다크특수똥'이 된다 (성질은 유지하고 무적만 얹는다). */
    const dark = forceDark !== undefined ? !!forceDark
               : (!inFever && Math.random() < darkChance());
    // 무지개똥 연금술 — 맞아도 무해하고 먹으면 점수 (특수똥은 위협으로 남아야 해서 제외)
    let gold = false;
    if (!inFever && !dark && !special && aug.goldChance > 0 && Math.random() < aug.goldChance) {
      gold = true;
    }
    // 뚜니핑 낙하물은 크기가 곧 점수라서 '작아진 똥'의 영향을 받지 않는다
    let r = cls ? cls.min + Math.random() * (cls.max - cls.min)
                // 5% 줄이되 제일 작은 똥(12.6)보다 작아지지는 않는다
                : Math.max(12.6, (12.6 + Math.random() * 11.7) * 0.95) * aug.poopMul;
    if (special === "huge") r = (HUGE_R + Math.random() * 10) * aug.poopMul;   // 초거대 똥
    r = Math.min(r, (W - 24) / 2);        // 화면보다 커지지 않게
    // 일반 똥은 레벨이 오를수록 빨라지지만, 뚜니핑 낙하물은 처음이나 나중이나 같은 속도로 떨어진다
    const baseVy = inFever ? FEVER_VY + Math.random() * 110
                           : 207.0 + level * 11.452 + Math.random() * 99;   // 레벨당 상승분을 15% 더 완화
    /* 뚜니핑 낙하물은 언제나 같은 속도로 떨어진다 — 레벨·지대·증강(느린 하늘·도파민)
       어느 것에도 영향받지 않는다. 화면 높이 보정(m)만 그대로 둔다. */
    let vy = inFever ? baseVy * m
                     : baseVy * m * DIFF_F * spaceF() * bhDiff() * aug.fallMul * lateMul();
    if (special === "huge") vy *= 0.55;   // 덩치값 — 느릿느릿 굴러떨어진다
    let px = r + Math.random() * (W - r * 2);
    let pvx = (Math.random() - Math.random()) * vy * SPREAD_POOP;
    if (special === "laser") {                // 예고한 선을 그대로 따라 내려온다
      px = forceX;
      const sp = LASER_VY * (H / BASE_H) * aug.fallMul;
      vy = sp * Math.cos(forceAng || 0);
      pvx = sp * Math.sin(forceAng || 0);
    }
    items.push({
      type: "poop", emoji: "💩",
      x: px, y: -r - 10,
      r: r * (special === "huge" ? 0.70 : 0.82),
      vx: pvx,
      vy: vy,
      /* 회전 대신 살랑인다. 시작 각도는 ±90도 안에서 제각각이고,
         거기서 ±12도씩 천천히 오간다 (레이저는 예고선을 따라야 해서 고정). */
      rot: special === "laser" ? 0 : (Math.random() - Math.random()) * 1.571,
      vr: 0,
      swayA: special === "laser" ? 0 : 0.14 + Math.random() * 0.07,   // 흔들 폭 (약 8~12도)
      swayW: 1.1 + Math.random() * 1.1,                               // 흔드는 속도
      swayP: Math.random() * 6.28,
      size: r * 2, sz: r, fast: m > 1,
      skin: inFever ? "fever" : "poop",
      space: inSpace(),
      gold: gold,
      dark: dark,                            // 폭발·밀림이 통하지 않는다
      special: special || null,
      bumpCd: 0,                             // 정연핑과 부딪힌 직후의 무반응 시간
      phase: Math.random() * 6.28,
      splitAt: H * (0.14 + Math.random() * 0.20),   // 분열똥이 쪼개지는 높이 (화면 위쪽)
      sz0: 0,
      face: randFace(),                      // 표정 장식 (0~1은 기본 얼굴)
      eye: randEye(), mouth: randMouth(),    // 눈·입 변형
      gain: cls ? cls.score : 0,
      giant: !!(cls && cls.giant)
    });
  }
  /* w 는 등장 빈도에 그대로 비례한다 (간격 = 기준값 ÷ (w / 204)).
     아래는 전체를 10% 올리고, 하트·우산만 20% 올린 값이다. */
  const BONUS = [
    { type: "moon",     emoji: "🌙", w: 92.4 },  // 84 x1.1 — 증강 선택, 가장 자주 나온다
    { type: "fullmoon", emoji: "🌕", w: 6.6 },   // 6 x1.1 — 증강 3연속. 초승달의 10%
    { type: "paper",    emoji: "🧻", w: 27.17 }, // 26 x1.1 후 5% 하향
    { type: "umbrella", emoji: "☂️", w: 26.4 },  // 22 x1.2
    { type: "star",     emoji: "⭐", w: 72.52 }, // 69.4 x1.1 후 5% 하향
    { type: "heart",    emoji: "❤️", w: 28.8 },  // 24 x1.2 (방울이는 빗방울로 바뀐다)
    /* 엄마의 밥상 — 별과 똑같은 비중. 증강을 먹기 전에는 아예 나오지 않으므로
       다른 아이템의 등장 빈도에는 영향을 주지 않는다 (기준값이 고정이라 더욱 그렇다). */
    { type: "meal",     emoji: "🍚", w: 72.52 }
  ];
  /* 아이템은 종류마다 자기 타이머로 따로 굴러간다.
     각자의 평균 간격 = 기본 10초 ÷ 그 아이템의 비중 → 전체 등장 빈도는 예전과 같지만
     서로 독립이라 운이 맞으면 두세 개가 한꺼번에 쏟아진다. */
  /* 각 아이템의 평균 간격은 이 고정 기준값으로 계산한다.
     실제 가중치 합을 쓰면 별 하나를 올릴 때 다른 아이템까지 덩달아 드물어진다.
     기준을 고정해두면 별은 독립적으로 자주 나오고 나머지는 영향을 받지 않는다. */
  const BONUS_W_TOTAL = 204;
  const BONUS_BASE = 6.82;                // 아이템 전체의 평균 등장 간격(초)

  // 이 아이템이 지금 평균 몇 초마다 나오는지 (흔들림을 뺀 값)
  function bonusMean(b) {
    // 엄마의 밥상은 '엄마는 우리 딸 믿어'를 먹기 전에는 영영 오지 않는다
    if (b.type === "meal" && !aug.momMeal) return Infinity;
    /* 레벨은 아이템 등장에 전혀 관여하지 않는다 — 처음부터 끝까지 같은 확률.
       예전에는 레벨이 오를수록 잦아지고(최대 2배), 대신 Lv15부터 달만 뜸해졌다. */
    let mean = BONUS_BASE / (b.w / BONUS_W_TOTAL) * aug.itemRateMul;
    if (b.type === "heart" && job === "fit") mean /= 5;  // 헬스걸 — 하트 5배
    if (b.type === "umbrella" && job === "gambler") mean /= 1.5;  // 도박사 — 우산 1.5배
    if ((b.type === "moon" || b.type === "fullmoon") && job === "powerj") mean /= 2;    // 파워J — 달 2배
    // 파워P — 달이 평소의 75%만 나온다 (한 번 볼 때 다섯 장을 고르는 대가)
    if ((b.type === "moon" || b.type === "fullmoon") && job === "powerp2") mean /= 0.75;
    if (b.type === "star" && job === "powerp") mean /= 1.5;  // 무소유 — 별 1.5배
    return mean;
  }
  /* 다음 하나까지의 시간 — 레벨 1에서 평균의 80~120%, 레벨마다 2%p 씩 벌어진다.
     뒤로 갈수록 언제 올지 읽기 어려워진다. 평균 간격은 그대로라 개수는 변하지 않는다.
     50%에서 멈춘다 (레벨 16). 그 뒤로는 더 벌어지지 않는다.
     (0.4초 하한은 완전히 겹쳐 떨어지는 것만 막는 장치) */
  function bonusSpread() { return Math.min(0.50, 0.20 + 0.02 * (level - 1)); }
  function bonusInterval(b) {
    const w = bonusSpread();
    return Math.max(0.4, bonusMean(b) * (1 - w + Math.random() * 2 * w));
  }
  /* 무엇이 떨어질지 새로 뽑는다. 지금 이 순간의 등장 빈도(= 1 / 평균간격)에 비례하므로
     직업·증강이 걸어 둔 배율이 그대로 살아 있고, 긴 눈으로 본 종류별 비율도 변하지 않는다.
     달라지는 건 '다음에 뭐가 올지 읽히지 않는다'는 것뿐이다. */
  function pickBonus() {
    let tot = 0;
    for (const b of BONUS) tot += 1 / bonusMean(b);
    let n = Math.random() * tot;
    for (const b of BONUS) {
      n -= 1 / bonusMean(b);
      if (n <= 0) return b;
    }
    return BONUS[BONUS.length - 1];
  }
  /* 타이머가 가리킨 것 대신 새로 뽑을 확률 — 레벨 1에서 10%, 레벨마다 1.5%p 씩.
     드물게 나오는 종류는 한 번 건너뛰면 간격이 두 배가 되어, 이 값이 곧 들쭉날쭉함이다.
     비율대로 다시 뽑는 것이라 종류별 등장 비율은 그대로다. 50%에서 멈춘다 (레벨 28). */
  function bonusSwap() { return Math.min(0.50, 0.10 + 0.015 * (level - 1)); }
  function resetBonusTimers() {
    /* 첫 등장까지의 시간. 예전에는 편차가 큰 지수분포라 어떤 판은 별이 한참 안 나왔다.
       평균의 25~85% 사이로만 잡아 매판 초반 흐름이 비슷하게 흘러가도록 했다. */
    for (const b of BONUS) b.t = Math.max(0.4, bonusMean(b) * (0.25 + Math.random() * 0.60));
  }

  function spawnBonus(picked) {
    let pick = picked;
    if ((pick.type === "moon" || pick.type === "fullmoon") && job === "powerp") return;   // 무소유 — 무계획 무증강
    if (pick.type === "umbrella" && job === "fit") {
      pick = BONUS.find(b => b.type === "heart");   // 헬스걸 — 우산 자리에 하트
    }
    /* 방울이 — 하트 자리에 빗방울이 온다. 오염도가 0 이어도 그냥 떨어진다
       (먹어도 아무 일이 없을 뿐, 하트처럼 별로 바뀌지는 않는다). */
    let asDrop = false;
    if (pick.type === "heart" && dirtJob()) asDrop = true;
    if (pick.type === "heart" && job === "gambler") return;   // 도박사에겐 하트가 아예 안 나온다
    if (pick.type === "heart" && !asDrop && lives >= aug.maxLives) {
      pick = BONUS.find(b => b.type === "star");    // 목숨 꽉 차면 별로 대체
    }
    const r = asDrop ? 24 : 20;      // 빗방울은 조금 크게
    // 낙하 속도에 변화를 주되, 너무 빠르면 못 먹고 지나가버려서 위쪽을 눌러 잡았다
    const vy = (110 + level * 6) * (H / BASE_H) * (0.6 + Math.random() * 0.5);
    items.push({
      type: asDrop ? "droplet" : pick.type, emoji: asDrop ? "💧" : pick.emoji,
      x: r + Math.random() * (W - r * 2), y: -r - 10,
      r: r,
      vx: (Math.random() - Math.random()) * vy * SPREAD_BONUS,
      vy: vy,
      rot: 0, vr: 0, size: r * 2, bob: Math.random() * 6.28,
      born: elapsed          // 배고픈 정연핑이 몇 초 뒤에 출발할지 재는 기준
    });
  }

  // 점과 선분 사이의 최단 거리
  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay;
    const len2 = vx * vx + vy * vy;
    let t = len2 ? ((px - ax) * vx + (py - ay) * vy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, sp = 60 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                       life: .6 + Math.random() * .4, t: 0, c: color, r: 2 + Math.random() * 4 });
    }
  }
  function popText(x, y, text, color, size) {
    floats.push({ x, y, text, color, t: 0, life: 1, size: size || 22 });
  }
  /* 점수를 딴 순간은 액수만큼 크게 말한다.
     푼돈은 조용히 떠오르고, 큰돈은 고리가 퍼지면서 화면이 흔들린다. */
  /* gain 은 이제 화면에 적지 않는다 — 글씨 크기·고리·화면 흔들림으로만 크기를 전한다.
     문턱은 똥 한 개 값을 기준으로 잡아 레벨이 올라도 등급이 밀리지 않는다. */
  function popGain(x, y, gain, text, color) {
    const w = gain / Math.max(1, poopGain());
    const tier = w >= 60 ? 2 : w >= 8 ? 1 : 0;
    floats.push({
      x, y, text, color: color || "#ffd23f", t: 0,
      life: [1, 1.15, 1.35][tier], size: [22, 28, 36][tier], tier, pop: 1,
      vx: (Math.random() - Math.random()) * 14
    });
    if (tier >= 1) {
      rings.push({ x, y, t: 0, life: 0.46 + tier * 0.14,
                   r1: 74 + tier * 62, color: color || "#ffd23f" });
      shake = Math.max(shake, 6 + tier * 6);
    }
  }

  /* ---------- 업데이트 ---------- */
  function update(dt, now) {
    /* 인터스텔라 불릿타임 — 캐릭터를 뺀 세상 전부가 이 배율로 느려진다.
       똥·아이템·정연핑·비둘기·분신·미사일·구름과 그것들이 나오는 시계까지 모두 포함.
       점수·레벨 시계와 캐릭터 조작은 dt 그대로라 나만 제 속도로 움직인다. */
    const tsc = (bulletT > 0 && !fever) ? 0.4 : 1;   // 불릿타임 — 세상이 60% 느려진다
    for (const c of clouds) {
      c.x += c.v * dt * tsc;
      if (c.x - c.s > W) {
        c.x = -c.s * 1.6;
        c.y = Math.random() * H * .7;
        c.s = 26 + Math.random() * 64;
        c.v = 4 + Math.random() * 10;
        reshapeCloud(c);                              // 다시 나올 땐 다른 모양으로
      }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt; p.vy += 700 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.life) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt; f.y -= 40 * dt; f.x += (f.vx || 0) * dt;
      if (f.t > f.life) floats.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.t += dt;
      if (rg.t > rg.life) rings.splice(i, 1);
    }
    for (let i = bubPops.length - 1; i >= 0; i--) {
      const bp = bubPops[i];
      bp.t += dt;
      if (bp.t > bp.life) bubPops.splice(i, 1);
    }

    /* 점수판 — 한 번에 '똥 몇 개어치'를 벌었는지로 잰다.
       레벨·직업·증강 배율이 똥 한 개 값에도 똑같이 들어가 있으므로,
       판 초반이든 후반이든 같은 크기의 사건에 같은 세기로 튄다.
         똥 하나 = 1 · 무지개똥 ≈ 10 · 별 ≈ 136 · 별핑별 = 부순 개수 x4
       생존 점수는 한 프레임에 0.07 개어치라 문턱을 넘지 못한다. */
    const dScore = score - prevScore;
    const worth = dScore / Math.max(1, poopGain());
    if (worth >= 4) {
      scorePunch = Math.min(1, scorePunch + 0.30 + Math.min(0.70, Math.log10(worth / 4) * 0.62));
    }
    prevScore = score;
    if (scorePunch > 0) scorePunch = Math.max(0, scorePunch - dt * 2.6);
    scoreShown += (score - scoreShown) * Math.min(1, dt * 6);
    if (score - scoreShown < 1) scoreShown = score;      // 마지막 한 자리는 붙여 놓는다
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    if (feverFlash > 0) feverFlash = Math.max(0, feverFlash - dt * 2.5);
    if (feverBanner > 0) feverBanner = Math.max(0, feverBanner - dt / 1.1);
    // 방울이 — 터진 방울이 다시 맺힌다
    if (job === "bangul" && state === STATE.PLAY && !bubbleOn) {
      bubbleT += dt;
      if (bubbleT >= BUBBLE_SEC) {
        bubbleT = 0; bubbleOn = true;
        burst(player.x, player.y + player.hy, "#bfe9ff", 10);
        beep(1180, .09, "sine", .04);
      }
    }

    const wasFever = fever;
    fever = state === STATE.PLAY && now < powerUntil;
    if (!wasFever && fever) feverBanner = 1;      // 막 시작했다
    // 겹쳐 먹어 남은 시간이 한 번 분량을 넘으면 게이지가 넘치므로 1로 묶는다
    feverT = fever ? Math.min(1, (powerUntil - now) / feverDur) : 0;
    // 뚜니핑 타임 끝나는 순간엔 화면이 똥으로 가득 차 있으니 1초 무적으로 숨 돌릴 틈을 준다
    if (wasFever && !fever && state === STATE.PLAY) {
      invUntil = Math.max(invUntil, now + 1500);
      /* 대왕 뚜니핑도 다른 낙하물처럼 그대로 남겨 둔다. 뚜니핑 낙하물은
         타임이 끝나도 피해를 주지 않으니(dmg 판정에서 fever 껍질은 빠진다)
         떠 있는 동안 마저 먹을 수 있다. */
      beep(520, .12, "triangle", .04);          // 무적이 걸렸다는 건 소리로만 알린다
    }

    if (state === STATE.READY) {
      /* 타이틀 그림을 쓰는 동안에는 인트로를 돌리지 않는다.
         인트로가 우주복으로 갈아입는 순간 feverFlash 를 켜서 화면이 하얗게 번쩍였다. */
      if (titleArt) { flash = 0; feverFlash = 0; }
      else introUpdate(dt, now);
      return;
    }
    if (dirtShown !== dirt) {              // 막대가 진짜 값을 뒤따라간다
      const gap = dirt - dirtShown;
      const move = Math.max(DIRT_SLIDE, Math.abs(gap) * 5) * dt;
      dirtShown = Math.abs(gap) <= move ? dirt : dirtShown + Math.sign(gap) * move;
    }
    if (state !== STATE.PLAY) return;

    elapsed += dt;
    noHitSec += dt;                          // 안 맞고 버틴 시간 (피격 시 1/4 감소)
    /* 레벨 시계는 뚜니핑 타임 동안 멈춘다. 무적으로 낙하물을 줍는 시간까지
       레벨에 포함되면, 정작 실력으로 버틴 시간이 아닌데도 난이도가 올라간다. */
    if (!fever) levelTime += dt;
    level = 1 + Math.floor(levelTime / LEVEL_SEC);
    if (testMode && lvNow.textContent !== "Lv " + level) lvNow.textContent = "Lv " + level;
    score += sc("생존", dt * 50 * level * aug.timeMul * scoreMul());   // 생존 점수: 초당 50 × 레벨

    // 한 단계 올라설 때마다 어디에 도착했는지 알려준다
    const zi = zoneIdx();
    if (zi !== zoneShown) {
      if (zoneShown >= 0) {
        popText(W / 2, H * 0.40, ZONES[zi].ic + " " + ZONES[zi].nm, "#cfe4ff", 30);
        beep(760, .1, "sine", .05);
        beep(1140, .14, "sine", .04);
        if (zi === SPACE_Z) {          // 공기가 없는 높이 — 우주복으로 갈아입는다
          popText(W / 2, H * 0.48, "🧑‍🚀 우주복 착용!", "#ffd23f", 26);
          beep(520, .16, "triangle", .05);
        }
        if (zi === BH_Z) {             // 빨려 들어갔다 — 모든 것이 두 배
          popText(W / 2, H * 0.48, "모든 것이 2배!", "#ff8a5c", 28);
          shake = Math.max(shake, 26);
          feverFlash = Math.max(feverFlash, 0.5);
          beep(90, .5, "sawtooth", .07);
          beep(140, .4, "square", .05);
        }
      }
      zoneShown = zi;
    }

    const kSpeed = 560 * spdMul() * dt;
    // 패드는 민 정도만큼 속도가 붙는다 (키보드는 늘 최고 속도)
    const kx = kSpeed * (ctrlMode === "pad" ? padAmpX : 1);
    const ky = kSpeed * (ctrlMode === "pad" ? padAmpY : 1);
    if (keys.ArrowLeft  || keys.a || keys.A) player.tx -= kx;
    if (keys.ArrowRight || keys.d || keys.D) player.tx += kx;
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
    if (flyOn) {
      if (keys.ArrowUp   || keys.w || keys.W) player.ty -= ky;
      if (keys.ArrowDown || keys.s || keys.S) player.ty += ky;
      player.ty = Math.max(H * FLY_TOP, Math.min(groundY, player.ty));
    }

    const prev = player.x;
    // 손가락을 반대편에 찍어도 순간이동하지 않도록 최고 속도를 제한한다
    const want = (player.tx - player.x) * Math.min(1, dt * 20);
    const maxStep = PLAYER_MAX_SPEED * spdMul() * dt;
    player.x += Math.max(-maxStep, Math.min(maxStep, want));
    if (job === "gambler" && state === STATE.PLAY) {
      moveDist += Math.abs(player.x - prev);
      const need = doveEvery();
      if (moveDist >= need) {
        moveDist -= need;
        // 머리 위쪽에서 가장 가까운 똥을 노린다 (없으면 그냥 위로 날아간다)
        const py = player.y + player.hy;
        let best = null, bd = -1e9;
        for (const q of items) {
          if (q.type !== "poop" || q.blast || q.dark) continue;
          if (q.y > player.y - 40) continue;          // 이미 지나친 똥은 무시
          /* 머리 위 부채꼴 안에서 '가장 멀리 있는' 똥을 노린다.
             바로 앞 똥만 잡으면 금방 터져 버려서 날아가는 맛이 없다. */
          const dy = py - q.y, dx = Math.abs(q.x - player.x);
          if (dx > 90 + dy * 0.75) continue;
          const d = dy - dx * 0.35;                   // 높이 있을수록, 옆으로 덜 치우칠수록
          if (d > bd) { bd = d; best = q; }
        }
        // 몸이 아니라 머리 위쪽에서 날아오른다
        doves.push({ x: player.x, y: py - player.r * hitMul() - 26, t: best, ph: Math.random() * 6.28 });
        if (!sfx("dove")) { beep(1500, .06, "sine", .035); beep(1900, .07, "sine", .03); }
      }
    }
    if (player.x - prev < -0.25) facing = "left";
    else if (player.x - prev > 0.25) facing = "right";   // 멈춰 있으면 마지막 방향 유지
    player.tilt += (((player.x - prev) / Math.max(dt, .001) / 900) - player.tilt) * Math.min(1, dt * 10);
    player.tilt = Math.max(-.35, Math.min(.35, player.tilt));

    // 위아래 이동 — 가로보다 조금 느리게 따라간다 (붕 뜬 느낌)
    if (flyOn) {
      const wantY = (player.ty - player.y) * Math.min(1, dt * 14);
      const stepY = PLAYER_MAX_SPEED * 0.72 * spdMul() * dt;
      player.y += Math.max(-stepY, Math.min(stepY, wantY));
    } else if (player.y !== groundY) {
      player.y += (groundY - player.y) * Math.min(1, dt * 10);
      if (Math.abs(player.y - groundY) < 0.5) player.y = groundY;
    }

    player.hy = headOffset(currentSprite(now));

    // ---- 레이저똥 예고: 2초를 세고 그 자리에 내리꽂는다 ----
    for (let k = warns.length - 1; k >= 0; k--) {
      const wn = warns[k];
      wn.t -= dt * tsc;
      if (wn.t <= 0) {
        spawnPoop(1, "laser", wn.x, wn.ang, wn.dark);
        beep(180, .16, "sawtooth", .06);
        warns.splice(k, 1);
      }
    }

    // ---- 스테로이드 과다 복용: 약발이 도는 동안 몸이 2배, 똥이 튕겨 나간다 ----
    if (roidT > 0) {
      roidT -= dt;
      if (roidT <= 0) {
        roidT = 0;
        popText(player.x, player.y - 70, "💉 약발 끝", "#ff8f8f", 22);
        beep(300, .12, "sine", .04);
      }
    }

    if (spawnHold > 0) spawnHold -= dt * tsc;
    if (umbBlast) { umbBlast.t -= dt * tsc; if (umbBlast.t <= 0) umbBlast = null; }
    for (let k = ghosts.length - 1; k >= 0; k--) {
      ghosts[k].t += dt;
      if (ghosts[k].t >= ghosts[k].life) ghosts.splice(k, 1);
    }
    for (let k = wakBooms.length - 1; k >= 0; k--) {
      wakBooms[k].t += dt * tsc;
      if (wakBooms[k].t >= 0.35) wakBooms.splice(k, 1);
    }

    // ---- 인터스텔라: 10초마다 2초씩 세상만 느려진다 (점수 시계는 그대로) ----
    if (aug.inter) {
      if (bulletT > 0) bulletT -= dt;
      else if (!fever) {
        interTimer -= dt;
        if (interTimer <= 0) {
          interTimer = 8; bulletT = 2;
          popText(W / 2, H * 0.35, "🕰️ 인터스텔라", "#9fd4ff", 26);
          beep(320, .14, "sine", .05);
          beep(210, .2, "sine", .05);
        }
      }
    }

    // ---- 벼랑 끝 분신술: 작은 이재가 가장 가까운 똥에게 날아가 자폭한다 ----
    if (aug.clone) {
      cloneTimer -= dt * tsc;
      if (cloneTimer <= 0) {
        let best = null, bd = 1e9;
        const py = player.y + player.hy;
        for (const q of items) {
          if (q.type !== "poop" || q.dark) continue;   // 무지개똥·특수똥도 표적 (다크똥만 제외)
          if (q.y > player.y - 40) continue;          // 이미 지나친 똥은 무시
          /* 머리 위쪽 좁은 부채꼴 안에서만 고른다. 옆으로 멀리 날아가면
             분신이 가로로 새는 것처럼 보여서, 가로 거리에 벌점을 준다. */
          const dy = py - q.y, dx = Math.abs(q.x - player.x);
          if (dx > 70 + dy * 0.55) continue;          // 위로 갈수록 조금씩만 넓어진다 (약 29도)
          const d = Math.hypot(dx, dy) + dx * 1.4;
          if (d < bd) { bd = d; best = q; }
        }
        if (best) {
          clones.push({ x: player.x, y: player.y + player.hy, t: best, life: 3 });
          cloneTimer = 1.5;                           // 1.5초마다 한 명 출격
          beep(740, .08, "square", .04);
        } else cloneTimer = 0.5;
      }
    }
    for (let k = clones.length - 1; k >= 0; k--) {
      const c = clones[k];
      c.life -= dt * tsc;
      const alive = items.indexOf(c.t) >= 0;
      const tx2 = alive ? c.t.x : c.x, ty2 = alive ? c.t.y : c.y - 120;
      const dx2 = tx2 - c.x, dy2 = ty2 - c.y, d2 = Math.hypot(dx2, dy2) || 1;
      c.x += dx2 / d2 * 1200 * dt * tsc;
      c.y += dy2 / d2 * 1200 * dt * tsc;
      if ((alive && d2 < (c.t.r || 20) + 16) || c.life <= 0) {
        smashPoopsAround(c.x, c.y, 110, true);        // 폭발 반경 110px (특수똥까지 부순다)
        burst(c.x, c.y, "#ffd23f", 26);
        shake = Math.max(shake, 8);
        if (!sfx("clone")) beep(240, .12, "square", .05);
        clones.splice(k, 1);
      }
    }

      // ---- 갤러그 — 땅에 늘어선 우주선이 저마다 제 주기로 총알을 쏘아 올린다 ----
    if (aug.galaga > 0) {
      /* 우주선마다 제 박자가 있다 — 다 같이 쏘면 여러 대라도 한 발처럼 보인다.
         한 대는 shipGap(n) 마다 쏘되, k 번째는 그 주기를 n 등분한 만큼 늦게 쏜다.
         시계 하나로 재기 때문에 대수가 바뀌어도 박자가 저절로 다시 갈린다. */
      const n = aug.galaga, was = shipClock, gap = shipGap(n);
      shipClock += dt * tsc;
      for (let k = 0; k < n; k++) {
        const ph = gap * k / n;
        if (Math.floor((shipClock - ph) / gap) === Math.floor((was - ph) / gap)) continue;
        bullets.push({ x: shipX(k, n), y: H - GROUND_H * 0.55 - 14, vy: -760 });
        // 소리는 한 바퀴에 한 번만 — 대수만큼 울리면 귀가 아프다
        if (k === 0 && !sfx("galaga")) beep(1250, .05, "square", .03);
      }
    }
    for (let k = bullets.length - 1; k >= 0; k--) {
      const bu = bullets[k];
      bu.y += bu.vy * dt * tsc;
      let hit = false;
      for (let j = items.length - 1; j >= 0; j--) {
        const q = items[j];
        if (q.type !== "poop" || q.blast || q.bounced || q.dark) continue;
        if (Math.hypot(q.x - bu.x, q.y - bu.y) > q.r + 6) continue;
        if (aug.wak && !q.gold && q.skin !== "fever") {
          /* 고무고무노 피스톨 — 부수지 않고 위로 튕겨 올린다. 날아가는 똥은 사람을 해치지 않고,
             처음 부딪히는 똥과 함께 반경 50px 로 터진다 (아래 wak 처리).
             무지개똥·뚜니핑은 튕기면 먹을 기회가 날아가니 예전처럼 그 자리에서 부순다. */
          q.vx = (q.x - bu.x) * 5 + (Math.random() - .5) * 140;
          q.vy = -(520 + Math.random() * 140);      // 0.7~0.9초 뒤 꼭대기, 200px 남짓 오른다
          q.vr = (Math.random() - .5) * 12;
          q.swayA = 0; q.special = null;
          q.bounced = true; q.wak = true;
          burst(bu.x, bu.y, "#ff8a6a", 8);
          if (!sfx("boing")) beep(520, .06, "square", .04);
        } else {
          smashPoopsAround(bu.x, bu.y, 8, true);    // 맞은 똥 하나만 부순다
          burst(bu.x, bu.y, "#9fe8ff", 10);
        }
        hit = true;
        break;
      }
      if (hit || bu.y < -20) bullets.splice(k, 1);
    }

    // ---- 도박사의 비둘기 — 목표에 부딪히면 반경 50px 로 터진다 ----
    for (let k = doves.length - 1; k >= 0; k--) {
      const c = doves[k];
      c.ph += dt * tsc * 14;                            // 날갯짓
      /* 표적이 사라지면 위쪽에서 새 표적을 찾는다. 없으면 계속 위로 난다 —
         부딪힐 때까지는 스스로 터지지 않는다. */
      if (items.indexOf(c.t) < 0) {
        let best = null, bd = -1e9;
        for (const q of items) {
          if (q.type !== "poop" || q.blast || q.dark) continue;
          const dy = c.y - q.y, dx = Math.abs(q.x - c.x);
          if (dy < 0) continue;                         // 이미 지나친 똥은 무시
          if (dx > 90 + dy * 0.75) continue;
          const d = dy - dx * 0.35;                     // 멀리(위쪽) 있는 똥을 우선
          if (d > bd) { bd = d; best = q; }
        }
        c.t = best;
      }
      const alive = !!c.t;
      const tx2 = alive ? c.t.x : c.x, ty2 = alive ? c.t.y : c.y - 160;
      const dx2 = tx2 - c.x, dy2 = ty2 - c.y, d2 = Math.hypot(dx2, dy2) || 1;
      const dm = doveMul();
      c.x += dx2 / d2 * 300 * dm * dt * tsc;
      c.y += dy2 / d2 * 300 * dm * dt * tsc;
      /* 표적이 아니어도 가는 길에 닿은 똥이 있으면 그 자리에서 터진다 */
      let bump = false;
      for (const q of items) {
        if (q.type !== "poop" || q.blast || q.dark || q === c.t) continue;
        if (Math.hypot(q.x - c.x, q.y - c.y) < q.r + 14 * dm) { bump = true; break; }
      }
      if (bump || (alive && d2 < (c.t.r || 20) + 14 * dm) || c.y < -40) {
        // 비둘기가 부순 똥은 똥점수 5배
        smashPoopsAround(c.x, c.y, 50 * dm, true, 5);   // 폭발 반경 50px
        burst(c.x, c.y, "#eaf6ff", 18);
        shake = Math.max(shake, 6);
        beep(300, .1, "square", .045);
        doves.splice(k, 1);
      }
    }

    // ---- 우산 로켓배송: 방패가 하나도 없을 때만 시간을 재서 하나 배송한다 ----
    if (aug.steelUmb) {
      if (shields <= 0) {
        shieldTimer -= dt * tsc;
        if (shieldTimer <= 0) {
          shieldTimer = UMB_SEC;
          shields = 1;
          popText(player.x, player.y - 60, "☔ 우산 도착!", "#7ec8ff");
          beep(880, .12, "triangle", .05);
        }
      } else {
        shieldTimer = UMB_SEC;
      }
    }

    // ---- 도와줘 정연핑 ----
    if (aug.helper > 0) {
      // 1명이면 4.5초, 2명이면 5.5초, 3명이면 6.5초… 인원이 늘수록 주기가 1초씩 길어진다
      const cycle = 4.0 + 1.0 * aug.helper;   // 3.5 → 4.0, 출격이 조금 뜸해진다
      helperTimer -= dt * tsc;
      if (helperTimer <= 0 && helperQueue <= 0) {
        helperTimer = cycle;
        helperQueue = aug.helper;                 // 이번 차례 출격 인원
        helperGap = 0;                            // 첫 명은 바로
      }
      if (helperQueue > 0) {
        helperGap -= dt * tsc;
        if (helperGap <= 0) {
          // 한 차례 안에서 인원을 고르게 나눠 내보낸다 (2명 = 4초에 2명, 3명 = 5초에 3명)
          helperGap = cycle / aug.helper;
          helperQueue--;
          const fromLeft = Math.random() < 0.5;   // 아래 좌/우에서 비스듬히 솟아오른다
          // 수직에서 8~34도 사이. 너무 눕히면 옆으로 금방 빠져나가서 범위를 좁혔다
          const speed = 744 + Math.random() * 216;   // 기존 620~800 에서 20% 빠르게
          const ang = (8 + Math.random() * 26) * Math.PI / 180;
          helpers.push({
            x: fromLeft ? -30 + Math.random() * (W * 0.45)
                        : W + 30 - Math.random() * (W * 0.45),
            y: H + 60,
            vx: (fromLeft ? 1 : -1) * speed * Math.sin(ang),
            vy: -speed * Math.cos(ang)
          });
          if (!sfx("helper")) {
            beep(760, .12, "triangle", .05);
            beep(1140, .14, "triangle", .04);
          }
        }
      }
    }
    for (let k = helpers.length - 1; k >= 0; k--) {
      const hp = helpers[k];
      hp.x += hp.vx * dt * tsc;
      hp.y += hp.vy * dt * tsc;
      smashPoopsAround(hp.x, hp.y, HELPER_R * helperScale());   // 지나가는 자리의 똥
      if (hp.y < -HELPER_H - 40 || hp.x < -160 || hp.x > W + 160) helpers.splice(k, 1);
    }

    // ---- 배고픈 정연핑: 아이템이 뜨고 3초 뒤에 화면 아래 중앙에서 출발 ----
    /* 배고픈 정연핑 — 한 번에 한 명만 나간다. 아이템이 여럿이라고 우르르 몰려가면
       아이템을 통째로 쓸어가 버려서, 다녀온 뒤 FETCH_REST 만큼 쉬었다 다시 나간다. */
    if (fetchRest > 0) fetchRest -= dt * tsc;
    if (aug.hungry && !fetchers.length && fetchRest <= 0) {
      let pick = null;
      for (const it of items) {                 // 가장 오래 떠 있던 것 하나만
        if (it.type === "poop" || it.claimed) continue;
        if (elapsed - it.born < FETCH_DELAY) continue;
        if (!pick || it.born < pick.born) pick = it;
      }
      if (pick) {
        pick.claimed = true;
        fetchers.push({ x: W / 2, y: H + 50, vx: 0, vy: -FETCH_SPEED, t: pick });
        if (!sfx("fetch")) {
          beep(660, .1, "sine", .05);
          beep(990, .12, "sine", .04);
        }
      }
    }
    for (let k = fetchers.length - 1; k >= 0; k--) {
      const f = fetchers[k];
      const alive = items.indexOf(f.t) >= 0;
      let dx = 0, dy = -1;
      if (alive) { dx = f.t.x - f.x; dy = f.t.y - f.y; }   // 목표가 사라지면 그대로 위로 빠진다
      const d = Math.hypot(dx, dy) || 1;
      f.vx = dx / d * FETCH_SPEED;
      f.vy = dy / d * FETCH_SPEED;
      f.x += f.vx * dt * tsc;
      f.y += f.vy * dt * tsc;
      smashPoopsAround(f.x, f.y, HELPER_R * helperScale());   // 가는 길의 똥도 부순다
      if (alive && Math.hypot(f.t.x - f.x, f.t.y - f.y) < HELPER_R * 0.9) {
        const idx = items.indexOf(f.t);
        if (idx >= 0) items.splice(idx, 1);
        fetchers.splice(k, 1);
        fetchRest = FETCH_REST;
        burst(f.x, f.y, "#ffd23f", 24);
        if (collectItem(f.t, now)) return;    // 달이면 화면이 멈춘다
        continue;
      }
      if (f.y < -HELPER_H * 2 || f.x < -260 || f.x > W + 260) { fetchers.splice(k, 1); fetchRest = FETCH_REST; }
    }

    magNear = 0;                          // 이번 프레임에 가장 세게 끌린 정도
    const powered = now < powerUntil;      // 🔥 뚜니핑 타임

    // 화면이 좁으면 그만큼 똥도 덜 떨어지게(체감 난이도 유지)
    const widthFactor = 480 / W;
    spawnTimer -= dt * tsc;
    if (spawnTimer <= 0) {
      if (powered) {
        // 뚜니핑 타임: 똥이 폭포처럼 쏟아지고 속도도 2배 이상
        const n = 3 + Math.floor(Math.random() * 4);   // 스폰당 3~6개 (평균 4.5개)
        // 증강으로 낙하량이 늘면 화면 상한도 같이 올려야 늘린 만큼이 깎이지 않는다
        const cap = Math.min(280, Math.round(165 / aug.feverRateMul));
        if (items.length < cap) {
          for (let k = 0; k < n; k++) spawnPoop(2.09 + Math.random() * 0.855);
        }
        /* 한 번에 평균 4.5개 → 초당 55개.
           59 로 나누는 것은 아래 widthFactor(480/W) 때문이다 — 실제 캔버스가 446 언저리라
           480 기준으로 계산하면 초당 51개까지 내려간다. 실측으로 맞춘 값.
           '=' 가 아니라 '+=' 인 이유: 넘긴 만큼을 다음 차례로 넘겨야 한 프레임(1/60초)
           단위로 올림되며 새지 않는다. 예전에는 이 손실로 초당 45개까지 내려갔다. */
        spawnTimer += (4.5 / 59) * aug.feverRateMul * widthFactor;
      } else {
        spawnPoop();
        if (level >= 3 && Math.random() < .35) spawnPoop();
        if (level >= 6 && Math.random() < .30) spawnPoop(1.6);   // 초고속 똥
        // 까다로운 똥 — 레벨 7에 아주 드물게 시작해서 레벨마다 조금씩 늘어난다
        if (level >= SPEC_FROM && Math.random() < Math.min(SPEC_CAP, SPEC_BASE + (level - SPEC_FROM) * SPEC_STEP)) {
          const kind = SPECIAL_KINDS[Math.floor(Math.random() * SPECIAL_KINDS.length)];
          if (kind === "huge" && items.some(q => q.special === "huge")) {
            spawnPoop();                  // 이미 하늘에 하나 있으면 평범한 똥으로
          } else if (kind === "laser") {
            // 바로 떨어뜨리지 않고 자리를 먼저 알려준다 (예고는 동시에 여러 개도 가능)
            if (warns.length < 3) {
              /* 떨어질 지점을 먼저 정하고, 기울기를 골라 위쪽 진입점을 역산한다.
                 진입점이 화면 밖으로 너무 나가면 기울기를 그만큼 줄인다. */
              const L = H - GROUND_H;
              const tx = 30 + Math.random() * Math.max(1, W - 60);
              const ang = (Math.random() - Math.random()) * 0.62;   // 최대 약 35도
              let ex = tx - Math.tan(ang) * L;
              ex = Math.max(-20, Math.min(W + 20, ex));
              /* 예고 모양을 다크로 바꾸려면 떨어질 똥이 다크인지 지금 정해야 한다 */
              warns.push({ x: ex, ang: Math.atan((tx - ex) / L), t: LASER_WARN,
                           dark: Math.random() < darkChance() });
              if (!sfx("laser")) beep(1500, .06, "sine", .03);
            }
          } else {
            spawnPoop(1, kind);
          }
        }
        spawnTimer = spawnGap() / DIFF_F / spaceF() / bhDiff() * widthFactor * (0.7 + Math.random() * 0.6);
      }
    }
    if (!powered) {
      for (const b of BONUS) {           // 종류별로 따로 세다가 각자 때가 되면 떨어진다
        b.t -= dt * tsc;
        if (b.t <= 0) {
          spawnBonus(Math.random() < bonusSwap() ? pickBonus() : b);
          b.t = bonusInterval(b);
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      /* 별핑별·성난 우산처럼 순회 도중 목록을 무더기로 지우는 일이 있으면
         인덱스가 새 길이를 넘어설 수 있다 — 그 칸은 건너뛴다 (없으면 게임이 멈춘다) */
      if (!it) continue;
      if (it.bumpCd > 0) it.bumpCd -= dt * tsc;
      if (it.special === "split") {
        // 정해진 높이까지 내려오면 둘로 쪼개진다. 조각은 평범한 똥이라 정연핑이 부술 수 있다.
        if (it.y > it.splitAt) {
          const r2 = it.sz * 0.80;          // 조각을 더 크게 (잘 보이게)
          for (const dir of [-1, 1]) {
            /* 좌우로 벌어지는 각도와 속도를 조각마다 따로 뽑는다.
               늘 같은 폭으로 갈라지면 한 번 외우면 끝이라 재미가 없다. */
            const ang = dir * (0.22 + Math.random() * Math.random() * 0.65);   // 세로 기준 12~50도 (가로로 눕지 않게)
            const sp = it.vy * (0.50 + Math.random() * 0.28);   // 쪼개진 뒤엔 확 느려진다
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: Math.sin(ang) * sp, vy: Math.cos(ang) * sp,
              rot: (Math.random() - Math.random()) * 1.571, vr: 0,
              swayA: 0.14 + Math.random() * 0.07, swayW: 1.1 + Math.random() * 1.1,
              swayP: Math.random() * 6.28,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", space: it.space, special: null, bumpCd: 0, phase: 0, splitAt: 0,
              sz0: 0, face: randFace(), eye: randEye(), mouth: randMouth(), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#c86bff", 20);
          beep(300, .08, "square", .04);
          items.splice(i, 1);
          continue;
        }
      } else if (it.special === "zigzag") {
        // 흔들리는 속도·폭도 '느린 하늘'의 영향을 받는다 (세로만 느려지면 더 촘촘해져서 어색하다)
        it.phase += dt * tsc * 3.0 * aug.fallMul;
        it.vx = Math.sin(it.phase) * 230 * aug.fallMul;
      }
      const prevX = it.x, prevY = it.y;      // 한 프레임에 크게 움직이면 스쳐 지나갈 수 있다
      /* 주먹에 맞은 똥은 포물선을 그린다 — 올라갔다가 똥밭을 되짚어 내려오며
         부딪힐 기회를 두 번 갖는다. 곧장 위로 날려 보내면 대부분 아무것도 못 만나고 사라졌다. */
      if (it.wak) it.vy += 760 * dt * tsc;
      it.x += it.vx * dt * tsc;
      it.y += it.vy * dt * tsc;
      if (it.swayA) {                       // 살랑임 — 처음 각도를 중심으로 오간다
        it.swayP += dt * tsc * it.swayW;
        it.rot = (it.rot0 === undefined ? (it.rot0 = it.rot) : it.rot0) + Math.sin(it.swayP) * it.swayA;
      } else it.rot += it.vr * dt * tsc;
      if (it.special !== "laser" && (!it.bounced || it.wak)) {   // 레이저·튕긴 똥은 벽에 막히지 않는다 (주먹에 맞은 똥은 벽에 튕긴다)
        if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx); }
        if (it.x > W - it.r) { it.x = W - it.r; it.vx = -Math.abs(it.vx); }
      }
      if (it.bob !== undefined) it.bob += dt * tsc * 4;

      const cy = player.y + player.hy;
      const dx = it.x - player.x, dy = it.y - cy;
      if ((aug.blackhole || job === "levitator") && it.type === "poop" && it.skin === "fever") {
        // 뚜니핑 낙하물은 가까이 왔을 때만 끌어당긴다 (전부 빨아들이면 너무 세다)
        // 부양사 기본치는 블랙홀의 절반 반경·45% 힘
        const d = Math.hypot(dx, dy), R = aug.blackhole ? 195 : 98;
        if (d < R && d > 1) {
          const pull = (aug.blackhole ? 481 : 216) * dt * (1 - d / R);
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.5;
        }
      }
      /* 부양사는 자석이 없어도 기본 흡인(자석의 약 20%)을 갖고 시작한다.
         자석 증강을 먹으면 온전한 자석으로 덮어쓴다. */
      const magR = aug.magnet > 0 ? aug.magnet : (job === "levitator" ? 110 : 0);
      const magF = aug.magnet > 0 ? 1 : 0.45;
      if (magR > 0 && (it.type !== "poop" || it.gold)) {
        const d = Math.hypot(dx, dy);
        // 무지개똥은 아이템의 절반 반경·절반 힘 — 수집가라면 그 2배(아이템과 동일)
        const goldF = it.gold ? (aug.goldLord ? 1 : 0.5) : 1;
        const R = magR * goldF;
        if (d < R && d > 1) {
          const near = 1 - d / R;              // 가장자리 0, 코앞 1
          const pull = (676 * near + 78) * dt * magF * goldF;
          it.x -= dx / d * pull;
          it.y -= dy / d * pull * 0.55;
          // 가장 가까이 끌려오는 것 하나가 소리 크기를 정한다
          if (near > magNear) magNear = near;
        }
      }
      /* 맞는 판정은 줍는 판정보다 좁다. 아이템은 잘 잡히면서 똥은 살짝 스쳐도 넘어가도록
         맞는 쪽만 줄여 뒀다 (.78 → .702 → .632). */
      const dmg = it.type === "poop" && !powered && it.skin !== "fever";
      // 끝점만 보면 빠른 똥이 캐릭터를 뛰어넘을 수 있어서, 이번 프레임에 지나온 선분과의 거리를 본다
      const hit = !it.bounced && !it.ghost && segDist(player.x, cy, prevX, prevY, it.x, it.y)
                  < it.r + player.r * (dmg ? .632 : .78) * hitMul();

      if (hit) {
        if (it.type === "poop") {
          if (it.gold) {                    // 무지개똥 — 먹으면 점수 (레벨이 오를수록 값지다)
            const g = Math.round(120 * (aug.goldLord ? 2 : 1) * scoreMul() * level);
            score += sc("무지개똥", g);
            burst(it.x, it.y, "hsl(" + Math.round(goldFx(now, it.x).hue) + ",100%,62%)", 20);
            popGain(it.x, it.y, g, "🌈", "#ffe07a");
            if (!sfx("gold")) beep(1250, .1, "square", .05);
            items.splice(i, 1);
            continue;
          }
          // 뚜니핑 타임 낙하물은 타임이 끝난 뒤에도 먹을 수 있다.
          // (끝나는 순간 화면에 떠 있던 것들이 그냥 스쳐 지나가면 아까우니까)
          if (powered || it.skin === "fever") {
            // 크기가 곧 점수. 뚜니핑 타임 중 생성된 건 자기 점수를 갖고 있고,
            // 뚜니핑 타임 전에 떨어지던 일반 똥은 크기로 환산한다.
            const gain = feverGain(it);
            /* 터지는 색은 점수와 무관하게 매번 무작위 — 무지갯빛 폭죽처럼 보이게 한다.
               입자 수·소리는 크기를 따른다. 점수로 나누면 레벨당 1.3배씩 부풀어
               후반엔 작은 것 하나에도 80개씩 터졌다 (화면이 덮이고 발열도 심했다). */
            const tone = FEVER_TONES[Math.floor(Math.random() * FEVER_TONES.length)];
            const sz = it.sz;
            let burstN, note;
            if (it.giant)     { burstN = 80; note = 2200; }
            else if (sz >= 52) { burstN = 66; note = 2100; }
            else if (sz >= 44) { burstN = 54; note = 2000; }
            else if (sz >= 37) { burstN = 42; note = 1800; }
            else if (sz >= 31) { burstN = 34; note = 1650; }
            else if (sz >= 26) { burstN = 26; note = 1500; }
            else if (sz >= 22) { burstN = 18; note = 1350; }
            else if (sz >= 18) { burstN = 12; note = 1150; }
            else               { burstN = 8;  note = 900;  }
            score += sc("뚜니핑", gain);
            burst(it.x, it.y, tone, burstN);
            // 낙하물은 개당 점수를 띄우지 않는다 (한꺼번에 쏟아져서 화면이 지저분해진다)
            /* 흔들림은 점수가 아니라 크기로 정한다.
               점수는 레벨당 1.3배씩 부풀어서, 후반엔 제일 작은 뚜니핑 하나에도
               화면이 최대로 흔들렸다. 대왕 뚜니핑(반지름 104~124)이 기준이고,
               작은 것들은 거의 흔들리지 않는다 — 터지는 입자와 소리로 충분하다. */
            const sh = it.giant
              ? 26 + Math.min(1, (it.sz - GIANT.min) / (GIANT.max - GIANT.min)) * 6
              : Math.max(0, (it.sz - 26) / 36) * 14;
            if (sh >= 1) shake = Math.max(shake, sh);
            items.splice(i, 1);
            /* 초당 수십 개가 쏟아지므로 소리를 아껴 쓴다.
               큰 것(44 이상)만 진짜 소리를 내고, 작은 것은 절반만 짧은 삐 소리로 둔다.
               작은 것까지 음원을 겹치면 뭉개져서 잡음처럼 들린다. */
            if (it.giant) { if (!sfx("giant")) beep(note, .14, "square", .05); }
            else if (sz >= 44) { if (!sfx("fpick")) beep(note + Math.random() * 200, .06, "square", .04); }
            else if (Math.random() < .5) beep(note + Math.random() * 200, .06, "square", .04);
            continue;
          }
          if (roidT > 0 && !it.dark) {          // 다크똥은 튕겨 나가지 않는다
            /* 스테로이드 — 몸에 닿은 똥이 위로 튕겨 나간다. 피한 것과 같은 점수를 받고,
               특수 성질(분열·지그재그·레이저)은 튕기는 순간 사라진다. */
            score += sc("똥", poopGain());
            const away = it.x - player.x;
            it.vx = away * 5 + (Math.random() - .5) * 160;
            it.vy = -(Math.abs(it.vy) * 0.6 + 320);
            it.vr = (Math.random() - .5) * 12;
            it.special = null; it.bounced = true;
            burst(it.x, it.y, "#ff6a6a", 10);
            shake = Math.max(shake, 5);
            beep(560 + Math.random() * 200, .05, "square", .035);
            continue;
          }
          /* 무적 여부는 이 자리에서 그때그때 확인해야 한다.
             프레임 앞에서 한 번만 재어 두면, 같은 프레임에 똥 두 개가 겹쳐 닿았을 때
             첫 번째로 무적이 걸렸는데도 두 번째가 그대로 들어와 방패가 두 개 깨진다. */
          if (now >= invUntil) {
            /* 방울이 우산보다 먼저 터진다 — 방울은 저절로 다시 차지만
               우산은 주워야 생기니, 공짜인 쪽을 먼저 쓰는 게 이롭다. */
            if (bubbleOn) {
              bubbleOn = false; bubbleT = 0;
              invUntil = now + 900;          // 터진 직후 잠깐은 안 맞는다
              shake = Math.max(shake, 10);
              /* 방울이 터지는 자리에서 테두리가 확 퍼지고 물방울이 사방으로 튄다.
                 (똥이 닿은 자리가 아니라 방울 자리에서 터져야 방울이 터진 것처럼 보인다) */
              const bg2 = bubbleGeom(now);
              const dots = [];
              for (let k = 0; k < 14; k++) {
                dots.push({
                  a: (k / 14) * 6.283 + Math.random() * 0.4,
                  sp: 90 + Math.random() * 190,
                  rr: 1.6 + Math.random() * 3.2,
                  c: BUB_TONES[Math.floor(Math.random() * BUB_TONES.length)]
                });
              }
              bubPops.push({ x: bg2.x, y: bg2.y, r: bg2.r, t: 0, life: 0.5, dots: dots });
              popText(player.x, player.y - 60, "🫧 방울 팡!", "#bfe9ff");
              if (!sfx("bubble")) beep(760, .12, "sine", .05);
              if (navigator.vibrate) navigator.vibrate(40);
              items.splice(i, 1);
              continue;
            }
            if (shields > 0) {
              shields--;                     // 우산이 막아준 건 '맞은 것'으로 치지 않는다
              invUntil = now + 1000;        // 목숨을 잃었을 때와 같은 무적 시간
              shake = Math.max(shake, 14);
              burst(it.x, it.y, "#7ec8ff", 20);
              popText(player.x, player.y - 60, "☂️ 방어!", "#7ec8ff");
              if (!sfx("break")) beep(400, .12, "triangle", .06);
              if (navigator.vibrate) navigator.vibrate(60);
              if (aug.angryUmb) {
                /* 성난 우산 — 우산이 터지면서 넓게 퍼지는 폭발이 똥을 쓸어낸다.
                   반경은 화면의 2/3 넘게 덮도록 잡는다 (까다로운 똥도 함께 부순다).
                   지금 부딪힌 똥(i)은 바로 아래 공용 splice 가 지우므로 건드리지 않는다. */
                const bx = player.x, by = player.y + player.hy;
                const bR = Math.sqrt(4 * W * H / (3 * Math.PI)) * 1.0;   // 1.15 → 1.0 (반경 13% 축소)
                for (let k = items.length - 1; k >= 0; k--) {
                  const q = items[k];
                  if (q.type !== "poop" || k === i || q.blast || q.dark) continue;
                  const dx = q.x - bx, dy = q.y - by, d = Math.hypot(dx, dy);
                  if (d > bR + q.r) continue;                 // 폭발 밖은 그대로 떨어진다
                  /* 부수지 않고 바깥으로 날려 보낸다. 날아가는 똥은 사람을 해치지 않고,
                     내려오던 다른 똥과 부딪히면 둘 다 터진다. */
                  const sp = 620 + (1 - Math.min(1, d / bR)) * 520;
                  const ux = d > 1 ? dx / d : (Math.random() - .5), uy = d > 1 ? dy / d : -1;
                  q.vx = ux * sp;
                  q.vy = uy * sp - 260;                       // 조금 위로 뜨면서 퍼진다
                  q.vr = (Math.random() - .5) * 10;
                  q.swayA = 0;                                // 살랑임 대신 실제로 회전
                  q.special = null;
                  q.bounced = true; q.blast = true;
                  burst(q.x, q.y, "#9fd4ff", 5);
                }
                warns = [];
                umbBlast = { x: bx, y: by, r: bR, t: 0.42 };
                shake = Math.max(shake, 26);
                feverFlash = Math.max(feverFlash, 0.4);
                popText(player.x, player.y - 95, "💢 성난 우산!", "#7ec8ff", 26);
                if (!sfx("angry")) beep(190, .22, "square", .06);
              }
            } else {
              /* 그건 제 잔상입니다만? — 똥은 잔상을 뚫고 그냥 지나간다.
                 방울·우산이 다 떨어져 목숨(방울이는 오염도)이 걸린 자리에서만 굴린다.
                 막아 줄 것이 남아 있을 땐 아껴 두는 편이 이롭기 때문이다.
                 이 똥은 다시 판정하지 않는다 (다음 프레임에 또 걸리지 않게). */
              if (aug.dodge > 0 && Math.random() < aug.dodge) {
                it.ghost = true;
                const spr = currentSprite(now), fl = sprFlipped(now), dir = fl ? 1 : -1;
                for (let k = 0; k < 3; k++)
                  ghosts.push({ x: player.x + dir * k * 16, y: player.y, tilt: player.tilt,
                                flip: fl, spr: spr, t: -k * 0.04, life: 0.5 });
                burst(player.x, cy, "#cbb8ff", 10);
                popText(player.x, player.y - 60, "그건 제 잔상입니다만?", "#cbb8ff", 18);
                if (!sfx("dodge")) beep(880, .06, "sine", .04);
                continue;
              }
              if (!testMode) {             // 테스트 모드는 맞아도 줄지 않는다
                if (dirtJob()) dirt = Math.min(DIRT_MAX, dirt + DIRT_HIT);
                else lives--;
              }
              noHitSec *= 3 / 4;           // 무소유 무피격 배율 — 맞으면 1/4 만 잃는다
              invUntil = now + 1000;
              hurtUntil = now + 1000;   // 무적 시간 동안 아픈 그림으로
              shake = 22; flash = 1;
              burst(it.x, it.y, "#8a5a2b", 22);
              popText(player.x, player.y - 60, "으악!", "#ff5d5d");
              if (!sfx("hurt")) beep(140, .25, "sawtooth", .07);
              if (dirtJob() ? dirt >= DIRT_MAX : lives <= 0) { items.splice(i, 1); return gameOver(); }
            }
            items.splice(i, 1);
            continue;
          }
        } else {
          items.splice(i, 1);
          if (collectItem(it, now)) return;   // 달이면 화면이 멈추므로 여기서 끝
          continue;
        }
      }

      /* 튕겨 나간 똥은 화면 밖으로 나가면 사라진다 (위·좌우 어디로든).
         주먹에 맞은 똥만은 예외 — 주먹은 대개 똥이 막 태어나는 맨 위에서 맞히므로, 위로 나가는
         걸 지우면 거의 다 사라져 버린다. 화면 위로 올라갔다가 중력에 되돌아오게 둔다. */
      if (it.bounced && ((it.y + it.r < -40 && !it.wak) || it.y < -900 || it.x < -70 || it.x > W + 70)) { items.splice(i, 1); continue; }
      if (it.y - it.r > H + 20) {
        // 뚜니핑 타임 낙하물은 워낙 많이 쏟아져서, 안 먹고 흘려보낸 것에 점수를 주면
        // 가만히 있어도 점수가 폭등한다. 뚜니핑 타임 것은 0점 — 직접 받아야만 점수가 오른다.
        if (it.type === "poop" && it.skin !== "fever") score += sc("똥", poopGain());
        items.splice(i, 1);
      }
    }

    /* 성난 우산에 날아간 똥은 부딪히는 똥을 관통하며 계속 부순다 (연쇄 청소).
       주먹에 맞은 똥은 처음 부딪히는 똥과 함께 반경 50px 로 터진다. */
    let boom = false;
    const waks = [];
    for (const a of items) {
      if (!(a.blast || a.wak) || a.dead) continue;
      for (const q of items) {
        if (q === a || q.dead || q.blast || q.dark || q.type !== "poop") continue;
        if (Math.hypot(a.x - q.x, a.y - q.y) > a.r + q.r) continue;
        if (a.wak) {                              // 둘이 같이 터진다 — 폭발은 아래에서
          a.dead = true;
          score += sc("똥", poopGain());          // 날아간 똥 제 몫
          waks.push({ x: (a.x + q.x) / 2, y: (a.y + q.y) / 2 });
          break;
        }
        q.dead = true; boom = true;               // 날아가는 똥은 살아서 계속 나아간다
        score += sc("똥", poopGain());
        burst(q.x, q.y, "#9fd4ff", 16);
      }
    }
    if (boom || waks.length) items = items.filter(q => !q.dead);
    if (boom) {
      shake = Math.max(shake, 8);
      beep(300, .07, "square", .04);
    }
    for (const w of waks) {
      smashPoopsAround(w.x, w.y, 50, true);       // 부딪힌 똥과 반경 안의 똥이 함께 터진다
      burst(w.x, w.y, "#ff8a6a", 30);
      wakBooms.push({ x: w.x, y: w.y, t: 0 });
      shake = Math.max(shake, 10);
      if (!sfx("wakboom")) beep(220, .1, "square", .05);
    }
  }

  /* 아이템 효과 적용. 플레이어가 직접 먹을 때와 '배고픈 정연핑'이 대신 먹을 때 모두 쓴다.
     달을 먹으면 게임이 멈추므로 true 를 돌려주고, 부른 쪽은 그 프레임 처리를 중단한다. */
  function collectItem(it, now) {
    if (it.type === "paper") {
      feverDur = 7000 + aug.feverBonus;
      // 이미 뚜니핑 중이면 남은 시간에 이어붙인다 (초기화하면 남은 시간이 버려진다)
      powerUntil = Math.max(powerUntil, now) + feverDur;
      feverFlash = 1;
      popText(player.x, player.y - 70, "🔥 뚜니핑 타임!", "#ffd23f", 26);
      if (!sfx("fever")) {
        beep(700, .1, "square", .05);
        beep(1100, .12, "square", .05);
        beep(1500, .18, "square", .05);
      }
      if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
    }
    if (it.type === "umbrella") {
      shields = Math.max(shields, Math.min(shields + 1, 5));   // 아이템으로도 5개까지 누적
      popText(player.x, player.y - 60, "☂️ 방패!", "#7ec8ff");
      if (!sfx("shield")) beep(900, .12, "triangle", .05);
    }
    if (it.type === "star") {
      const gain = eatStar(it.x, it.y);
      if (aug.starburst) {
        /* 화면의 똥을 전부 없애고 개당 똥 점수의 6배를 받는다 (까다로운 똥도 함께).
           뚜니핑 낙하물은 주우라고 떨어지는 것이라 건드리지 않는다. */
        let cnt = 0, bonus = 0;
        for (let k = items.length - 1; k >= 0; k--) {
          const q = items[k];
          // 무지개똥은 주우면 훨씬 값지므로 쓸어버리지 않고 남긴다
          if (q.type !== "poop" || q.skin === "fever" || q.gold || q.dark) continue;
          bonus += poopGain() * 6;
          burst(q.x, q.y, "#ffe9a8", 10);
          items.splice(k, 1);
          cnt++;
        }
        if (cnt) {
          bonus = Math.round(bonus);
          score += sc("별핑별", bonus);
          spawnHold = Math.max(spawnHold, 1);   // 쓸어낸 뒤 1초는 새 똥이 없다
          shake = Math.max(shake, 18);
          feverFlash = Math.max(feverFlash, 0.7);
          popGain(player.x, player.y - 110, bonus,
                  "🌠 " + cnt + "개 쓸어버림", "#ffe9a8");
          if (!sfx("burst")) beep(2000, .18, "square", .05);
        }
      }
    }
    if (it.type === "moon" || it.type === "fullmoon") {
      const full = it.type === "fullmoon";
      burst(it.x, it.y, full ? "#ffe9a8" : "#cfe4ff", full ? 40 : 20);
      if (full) { flash = 0; feverFlash = 1; shake = Math.max(shake, 14); }
      openAugment(full ? 3 : 1);     // 보름달은 3연속 선택
      return true;
    }
    if (it.type === "meal") {
      /* 엄마의 밥상 — 그 순간 점수의 10%. 판이 무르익을수록 한 상이 커진다.
         모든 점수에 곱하는 배율(scoreMul)은 얹지 않는다. 이미 배율이 반영된
         점수에서 떼어 오는 것이라, 또 곱하면 두 번 먹는 셈이 된다. */
      const gain = Math.round(score * 0.10);
      score += sc("밥상", gain);
      popGain(it.x, it.y, gain, "🍚 엄마의 밥상", "#ffd7a8");
      if (!sfx("star")) { beep(680, .12, "triangle", .05); beep(900, .16, "triangle", .045); }
      if (navigator.vibrate) navigator.vibrate(40);
    }
    if (it.type === "heart") {
      lives = Math.min(aug.maxLives, lives + 1);
      popText(it.x, it.y, "❤️ +1", "#ff8fb0");
      if (!sfx("heart")) beep(1000, .15, "sine", .06);
    }
    if (it.type === "droplet") {                    // 방울이 — 오염도를 씻어낸다
      if (dirt > 0) {
        dirt = Math.max(0, dirt - DIRT_WASH);
        popText(it.x, it.y, "💧", "#8fe3ff");     // 얼마나 씻겼는지는 막대가 보여 준다
        if (!sfx("heart")) beep(1000, .15, "sine", .06);
      } else {
        popText(it.x, it.y, "💧", "#bfe9ff");        // 깨끗하면 아무 일도 없다
        if (!sfx("bubble")) beep(760, .09, "sine", .04);
      }
    }
    burst(it.x, it.y, "#ffd23f", 16);
    return false;
  }

  /* 뚜니핑 낙하물 점수 — 크기 등급 점수 × 0.7 × 레벨.
     초당 수십 개가 쏟아지므로 한 개의 몫은 다른 것보다 작게 잡았다. */
  function feverGain(it) {
    const base = it.gain || (it.sz < 20.7 ? 3 : (it.sz < 26 ? 5 : 10));
    return Math.max(1, Math.round(base * aug.feverScoreMul * scoreMul() * level));
  }

  /* 점수를 항목별로도 모은다. 테스트 모드에서는 화면에 띄우고,
     실제 플레이에서는 판이 끝날 때 비중만 익명으로 남겨 통계에 쓴다. */
  const SRC_KEYS = ["별", "별핑별", "뚜니핑", "무지개똥", "똥", "생존"];
  // 서버에는 한글 대신 짧은 영문 키로 보낸다 (칸 이름이 지저분해지지 않게)
  const SRC_CODE = { "별": "star", "별핑별": "burst", "뚜니핑": "fever",
                     "무지개똥": "gold", "똥": "poop", "생존": "time" };
  let scoreSrc = {};
  function sc(key, v) {
    scoreSrc[key] = (scoreSrc[key] || 0) + v;
    return v;
  }

  /* 똥 한 개의 점수 — 10 × 레벨.
     흘려보낸 것, 스테로이드로 튕겨낸 것, 부순 것이 모두 같은 값을 받는다. */
  function poopGain() { return 10 * scoreMul() * level; }

  /* 정연핑이 지나간 자리의 똥을 부순다 (뚜니핑 낙하물은 제 점수를 그대로 준다)
     gainMul — 부순 것의 점수 배율. 비둘기는 5배를 준다
     (일반 똥·까다로운 똥·무지개똥·뚜니핑 낙하물에 모두 걸린다). */
  function smashPoopsAround(x, y, radius, force, gainMul) {
    const gm = gainMul || 1;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.type !== "poop" || it.dark) continue;   // 다크똥은 무엇으로도 부술 수 없다
      if (Math.hypot(it.x - x, it.y - y) >= radius + it.r) continue;
      if (it.gold) {                         // 무지개똥 — 부수면 직접 먹은 것과 같은 점수
        const g = Math.round(120 * (aug.goldLord ? 2 : 1) * scoreMul() * level * gm);
        score += sc("무지개똥", g);
        burst(it.x, it.y, "#ffd23f", 18);
        popText(it.x, it.y, "🌈", "#ffe07a");   // 액수는 적지 않는다
        items.splice(i, 1);
        continue;
      }
      if (it.special && force) {              // 분신 폭발은 까다로운 똥도 부순다
        score += sc("똥", poopGain() * gm);
        burst(it.x, it.y, "#ffd23f", 16);
        items.splice(i, 1);
        continue;
      }
      if (it.special) {
        /* 까다로운 똥은 부수지 못한다. 대신 종류마다 다르게 반응하고,
           정연핑은 부딪힌 자리를 그대로 지나간다. */
        if (it.bumpCd > 0) continue;
        it.bumpCd = 0.4;
        if (it.special === "split") {
          it.splitAt = -1;                   // 그 자리에서 곧바로 쪼개진다
        } else if (it.special === "zigzag") {
          it.phase += Math.PI;               // 흔들리던 방향이 뒤집힌다
          it.vx = -it.vx;
          burst(it.x, it.y, "#46d7ff", 14);
          beep(520, .07, "square", .04);
        } else if (it.special === "huge") {
          const r2 = it.sz * 0.33;           // 셋으로 쪼개진다 (조각은 평범한 똥)
          for (const dir of [-1, 0, 1]) {
            items.push({
              type: "poop", emoji: "💩",
              x: it.x, y: it.y, r: r2 * 0.82,
              vx: dir * (170 + Math.random() * 90) * aug.fallMul, vy: it.vy * 1.4,
              rot: (Math.random() - Math.random()) * 1.571, vr: 0,
              swayA: 0.14 + Math.random() * 0.07, swayW: 1.1 + Math.random() * 1.1,
              swayP: Math.random() * 6.28,
              size: r2 * 2, sz: r2, fast: false,
              skin: "poop", space: it.space, special: null, bumpCd: 0, phase: 0, splitAt: 0,
              sz0: 0, face: randFace(), eye: randEye(), mouth: randMouth(), gain: 0, giant: false
            });
          }
          burst(it.x, it.y, "#ff963c", 28);
          beep(240, .12, "square", .05);
          shake = Math.max(shake, 10);
          items.splice(i, 1);
        }
        continue;                            // 레이저는 아무 반응 없이 지나간다
      }
      if (it.skin === "fever") {
        // 뚜니핑 낙하물은 직접 먹을 때와 똑같이 — 점수 표시 없이, 색은 무작위로 터진다
        const g = Math.round(feverGain(it) * gm);
        score += sc("뚜니핑", g);
        burst(it.x, it.y, FEVER_TONES[Math.floor(Math.random() * FEVER_TONES.length)], g >= 25 ? 30 : 16);
      } else {
        score += sc("똥", poopGain() * gm);
        burst(it.x, it.y, "#ffd23f", 14);
      }
      items.splice(i, 1);
    }
  }

  function gameOver() {
    state = STATE.OVER;
    btnPause.classList.remove("on"); syncPad();
    augScreen.classList.add("hidden");
    const s = Math.floor(score);
    burst(player.x, player.y, "#8a5a2b", 40);
    shake = 30;
    elFinal.textContent = s.toLocaleString();
    elTitle.textContent = "게임 오버!";
    overScreen.classList.remove("hidden");
    if (!sfx("over")) beep(220, .4, "sawtooth", .06);
    if (navigator.vibrate) navigator.vibrate(120);

    logRun(s);                 // 증강 통계 수집 (화면에는 아무것도 보이지 않는다)

    // 전체 랭킹: 최신 TOP 10을 다시 받아보고 진입했으면 이름 입력을 띄운다
    pendingScore = s; pendingLevel = level;
    myRowKey = null;
    nameRow.classList.remove("on");
    btnSave.disabled = false;
    btnSave.textContent = "등록";
    nameTag.textContent = "🎉 TOP 10 진입! 이름을 남기세요";
    // 게임오버 순위표는 이번 판 직업 탭으로 연다 (전체 TOP 10에 들면 아래에서 전체 탭으로 바꾼다)
    boardJob = job;
    syncBoardTitle();
    for (const t of document.querySelectorAll(".jobTab")) t.classList.toggle("on", t.dataset.job === job);
    refreshBoards(boardOver).then(async () => {
      if (state !== STATE.OVER) return;
      const nm = savedName();
      /* 이름이 있으면 전체 TOP 10에 못 들어도 등록한다 — 직업별 순위표는 전체와 별개라서
         전체 기준으로만 걸러 버리면 직업별 판이 비게 된다. 이름이 없으면 예전처럼 진입했을 때만 묻는다. */
      if (!(nm ? canSubmit(s) : qualifies(s))) return;
      const r = topList.findIndex(v => s > v.score);
      const rank = (r < 0 ? topList.length + 1 : r + 1);
      if (nm) {
        // 이름을 미리 정해뒀으면 곧바로 등록한다
        nameRow.classList.add("on");
        nameForm.style.display = "none";
        nameTag.textContent = qualifies(s) ? "🎉 이번 주 " + rank + "위 등록 중…" : "기록 등록 중…";
        try {
          await submitScore(nm, pendingScore, pendingLevel);
          myRowKey = nm + "|" + pendingScore;
          await refreshBoards(boardOver);
          refreshBoards(boardStart);
          /* 한 기기당 한 줄만 남기 때문에, 예전 기록이 더 높으면 이번 판은 순위표에
             올라가지 않는다. 실제로 올라갔을 때만 달성 문구를 띄운다. */
          const at = topList.findIndex(v => v.name + "|" + Number(v.score) === myRowKey);
          if (at >= 0) {
            nameTag.textContent = "🎉 이번 주 " + (at + 1) + "위 달성! (" + nm + ")";
            setBoardJob("all");                 // 전체 순위에 들었으니 전체 탭으로
          } else {
            // 전체엔 못 들어도 직업별 TOP 10엔 들어갔을 수 있다
            let jat = -1;
            try {
              const jl = await fetchRange(weekStartMs(0), null, TOP_N, job);
              jobLists[job] = jl;
              jat = jl.findIndex(v => v.name + "|" + Number(v.score) === myRowKey);
            } catch (e) {}
            if (jat >= 0) nameTag.textContent = "🎉 이번 주 " + JOBS[job].nm + " " + (jat + 1) + "위 달성! (" + nm + ")";
            else nameRow.classList.remove("on");
          }
        } catch (e) {
          nameTag.textContent = "등록 실패 — 아래에서 다시 시도해주세요";
          nameForm.style.display = "";
          nameInput.value = nm;
        }
      } else {
        // 이름이 없으면 예전처럼 여기서 입력받는다
        nameRow.classList.add("on");
        nameForm.style.display = "";
        nameInput.value = "";
        nameTag.textContent = "🎉 " + rank + "위 진입! 이름을 남기세요";
      }
    });
  }
  /* 기기마다 한 번 만들어 저장해두는 식별자.
     같은 기기에서 여러 번 잘해도 순위표에는 가장 높은 기록 하나만 오른다. */
  const deviceId = (function () {

  /* ---------- 전체 랭킹 (Supabase) ---------- */
  // 이 게임 전용 Supabase 프로젝트 정보 (Settings → API 에서 복사)
  // 비워두면 랭킹 기능만 꺼지고 게임은 그대로 돌아간다.
  const SB_URL   = "https://osfbhhdpqdydbkgbgmat.supabase.co";
  const SB_KEY   = "sb_publishable_IOCUMux3jedTRKdTSGvDdg_1YCPmMw0";
  const SB_TABLE = "ddongpi_scores";
  const SB_RUNS  = "ddongpi_runs";     // 플레이 기록(증강 통계). 익명 키로는 쓰기만 되고 조회 불가
  const TOP_N    = 10;
  const SB_ON    = !!(SB_URL && SB_KEY);   // 설정 전에는 랭킹만 꺼지고 게임은 정상 동작

  let topList = [];
