    { nm: "은하수",     ic: "🌌", gr: "dark",  cl: 0, st: 1, nb: 1, rk: 0.3,
      sky: [[ 10,   4,  30], [ 26,   9,  54], [ 44,  15,  74]] },
    { nm: "심우주",       ic: "🌑", gr: "void", cl: 0, st: 1, nb: 0.6, mt: 0.8, bh: 0.10,
      sky: [[  0,   0,   0], [  2,   2,   9], [  5,   4,  16]] },
    { nm: "어둠의 문턱",   ic: "🌒", gr: "void", cl: 0, st: 1, nb: 0.35, mt: 0.5, bh: 0.30,
      sky: [[  2,   0,   6], [  6,   2,  14], [ 12,   4,  20]] },
    { nm: "강착원반",     ic: "🌀", gr: "void", cl: 0, st: 0.8, nb: 0.15, mt: 0.3, bh: 0.55,
      sky: [[  6,   0,   6], [ 14,   3,  14], [ 26,   6,  18]] },
    { nm: "사건의 지평선", ic: "⚫", gr: "void", cl: 0, st: 0.5, mt: 0.15, bh: 0.80,
      sky: [[ 10,   0,   4], [ 22,   4,  10], [ 40,   8,  14]] },
    { nm: "블랙홀 안",    ic: "🕳️", gr: "void", cl: 0, st: 0, bh: 1.5, sw: 1,
      sky: [[  0,   0,   0], [  0,   0,   0], [  0,   0,   0]] }
  ];
  const LAST_Z = ZONES.length - 1;
  const BH_Z = LAST_Z;                 // 블랙홀 안 — 마지막 지대
  function inBlackhole() { return zoneIdx() >= BH_Z; }
  /* 다크똥 — 블랙홀에 들어선 뒤로 섞여 떨어진다. 처음 8%, 레벨마다 +6%p, 85%에서 멈춘다.
     폭발·밀림 어느 것도 통하지 않아, 후반에 화력으로 버티는 길을 막는다. */
  const DARK_BASE = 0.08, DARK_STEP = 0.06, DARK_CAP = 0.85;
  function darkChance() {
    if (!inBlackhole()) return 0;
    return Math.min(DARK_CAP, DARK_BASE + DARK_STEP * (level - 1 - BH_Z));
  }
  function bhMul() { return inBlackhole() ? 2 : 1; }   // 블랙홀 안 점수 배율
  /* 블랙홀 안의 '난이도' 배율 — 점수 배율(2배)과 달리 낙하 속도·똥 수량에만 쓴다.
     속도와 빈도 양쪽에 걸리므로, 우주(SPACE_DIFF)와 같이 제곱근을 나눠 걸어
     둘을 합친 체감이 정확히 BH_DIFF 가 되게 한다 (예전에는 1.5 를 양쪽에 그대로
     걸어 체감이 2.25배였다). */
  const BH_DIFF = 1.5;
  const BH_DIFF_F = Math.sqrt(BH_DIFF);
  function bhDiff() { return inBlackhole() ? BH_DIFF_F : 1; }
  /* 부양사 — 높이 날수록 모든 점수가 커진다. 바닥 +0%, 중간 +50%, 꼭대기 +100%. */
  function levMul() {
    if (job !== "levitator" || !flyOn) return 1;
    const air = Math.max(0, Math.min(1, (groundY - player.y) / Math.max(1, groundY - H * FLY_TOP)));
    return 1 + 1.0 * air;
  }
  /* 무소유 — 증강이 없는 대신, 안 맞고 버틴 시간만큼 배율이 오른다 (초당 +15%, 상한 없음).
     레벨 배수는 곱하지 않는다 — 점수 자체가 이미 레벨에 비례하므로 두 번 세는 셈이 된다.
     목숨을 잃으면 무피격 시간의 1/3 만 깎인다 (우산 방어는 무피격 유지). */
  function monkMul() {
    if (job !== "powerp") return 1;
    return 1 + 0.15 * noHitSec;
  }
  /* 점수 눈금 — 모든 점수가 여기를 지나므로, 이 값만 바꾸면
     항목 사이의 균형은 그대로 두고 자릿수만 키우거나 줄일 수 있다. */
  const SCORE_SCALE = 3;
  /* 똥묻히기 — 지금 오염도에 비례해 점수가 오른다. 0%면 1배, 100%면 2배.
     한 번만 먹는 증강이고, 빗방울로 씻으면 배율도 같이 내려간다.
     (100% 는 곧 끝이라, 실제로 누리는 최대는 75% = 1.75배다) */
  function dungyMul() { return aug.dungy ? 1 + (dirt / DIRT_MAX) : 1; }
  function scoreMul() { return SCORE_SCALE * aug.scoreMul * bhMul() * levMul() * monkMul() * dungyMul(); }

  function zoneIdx() { return Math.min(LAST_Z, level - 1); }
  // 지금 단계와 다음 단계 사이의 진행도 — 색이 뚝 끊기지 않고 이어지도록
  function zoneFrac() {
    const i = level - 1;
    if (i >= LAST_Z) return 0;
    return Math.max(0, Math.min(1, levelTime / LEVEL_SEC - i));
  }
  // 두 단계 사이를 이어 구한 값 (색이면 rgb 문자열, 숫자면 숫자)
  function zv(key, i) {
    const a = ZONES[zoneIdx()], b = ZONES[Math.min(LAST_Z, zoneIdx() + 1)], f = zoneFrac();
    if (i === undefined) return (a[key] || 0) + ((b[key] || 0) - (a[key] || 0)) * f;
    const ca = a.sky[i], cb = b.sky[i];
    return "rgb(" + Math.round(ca[0] + (cb[0] - ca[0]) * f) + ","
                  + Math.round(ca[1] + (cb[1] - ca[1]) * f) + ","
                  + Math.round(ca[2] + (cb[2] - ca[2]) * f) + ")";
  }
  function skyColor(i) { return zv(null, i); }

  /* 올라갈수록 드러나는 별. 위치는 매판 고정이고 반짝임만 움직인다.
     크기·밝기·색·반짝이는 속도를 제각각으로 흩어 놓아야 하늘처럼 보인다. */
  const STARS = [];
  for (let i = 0; i < 120; i++) {
    const t = (i % 9) / 8;
    STARS.push({
      fx: (i * 0.6180339887) % 1,
      fy: ((i * 0.7548776662) % 1) * 0.94,
      r: 0.45 + t * t * 2.1,                       // 대부분 작고 가끔 크다
      ph: i * 1.7,
      sp: 620 + (i % 7) * 320,                     // 반짝이는 주기도 제각각
      dim: 0.35 + ((i * 37) % 100) / 155,          // 별마다 기본 밝기가 다르다
      col: (i % 19 === 0) ? "255,226,180"          // 드물게 노란 별
         : (i % 11 === 0) ? "200,220,255"          // 드물게 푸른 별
         : "255,255,255",
      // 대부분은 점, 가끔 네 갈래 반짝이, 아주 드물게 빛살이 뻗는 큰 별
      kind: (i % 24 === 0) ? 2 : (i % 5 === 0) ? 1 : 0
    });
  }
  /* 배경 그림 한 장 — 비율을 지킨 채 화면을 덮도록 키워서 가운데 맞춘다.
     기기마다 세로 비율이 달라서, 남는 쪽은 잘려 나간다. */
  /* 배경은 위에서 아래로만 흐른다 — 그래야 주인공이 계속 올라가는 것처럼 보인다.
     그림은 화면보다 세로로 길어 위아래가 잘려 있고, prog 0 일 때 그 여유분의
     맨 위(그림의 아래쪽이 보이는 자리)에서 시작해 1 일 때 맨 아래까지 내려온다.
     되돌아가는 지점은 지대가 바뀌며 두 그림이 겹쳐 녹는 순간이라 보이지 않는다. */
  function drawZoneImg(im, a, prog) {
    if (!im || a <= 0.004) return;
    const sc = Math.max(W / im.width, H / im.height);
    const dw = im.width * sc, dh = im.height * sc;
    const amp = Math.min(Math.max(0, dh - H) / 2, 130);
    const pg = Math.max(0, Math.min(1, prog || 0));
    const dy = (H - dh) / 2 - amp + 2 * amp * pg;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(im, (W - dw) / 2, dy, dw, dh);
    ctx.restore();
  }

  /* ---------- 제작사 스플래시 ----------
     대기화면 앞에 2.8초. 루도로 만든 로고가 통 튀어 오른다.
     화면을 누르면 바로 건너뛴다. 이 동안에는 게임도 배경음악도 시작하지 않는다. */
  const SPLASH_SEC = 2.8;
  let splashT = 0, splashOn = true, studioImg = null, splashRang = false;
  /* 인트로 소리 — 효과음 꾸러미와 따로 두는 이유는 스플래시가 뜨는 순간
     아직 그 꾸러미를 다 받지 못했기 때문이다. 오디오 요소는 바로 틀 수 있다.
     브라우저는 화면을 한 번 만지기 전에는 소리를 막으므로, 막히면 조용히 넘어간다. */
  const introSnd = new Audio("assets/sfx/intro.mp3");
  introSnd.preload = "auto";
  introSnd.volume = 0.5;
  {
    const t = new Image();
    t.onload = () => { studioImg = t; };
    t.onerror = () => { splashOn = false; };   // 못 받으면 그냥 건너뛴다
    t.src = "assets/studio.webp";
  }
  function endSplash() {
    if (!splashOn) return;
    splashOn = false;
    try { introSnd.pause(); } catch (e) {}   // 건너뛰면 소리도 함께 멈춘다
    startScreen.style.visibility = "";
  }
  const SPLASH_FALL = 0.40;                 // 떨어지는 데 걸리는 시간
  const SPLASH_SHINE = SPLASH_FALL + 0.34;  // 빛줄기가 지나가기 시작하는 때
  const SPLASH_SHINE_DUR = 0.52;
  let splashBits = [], splashLanded = false, shineCv = null, shineCx = null;

  /* 글자 안에서만 빛나는 빛줄기 — 로고를 딴 판에 그린 뒤 그 위에 흰 띠를
     source-atop 으로 얹으면 글자 바깥으로 새어 나가지 않는다. */
  function shineImage(k) {
    if (!shineCv) {
      shineCv = document.createElement("canvas");
      shineCv.width = studioImg.width; shineCv.height = studioImg.height;
      shineCx = shineCv.getContext("2d");
    }
    const w = shineCv.width, h = shineCv.height;
    shineCx.setTransform(1, 0, 0, 1, 0, 0);
    shineCx.clearRect(0, 0, w, h);
    shineCx.globalCompositeOperation = "source-over";
    shineCx.drawImage(studioImg, 0, 0);
    shineCx.globalCompositeOperation = "source-atop";
    const bw = w * 0.30;                     // 띠 너비
    const x = -bw + k * (w + bw * 2);
    shineCx.save();
    shineCx.translate(x, h / 2);
    shineCx.rotate(-0.32);                   // 비스듬히 지나간다
    const g = shineCx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.5, "rgba(255,255,255,.78)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    shineCx.fillStyle = g;
    shineCx.fillRect(-bw / 2, -h * 1.4, bw, h * 2.8);
    shineCx.restore();
    shineCx.globalCompositeOperation = "source-over";
    return shineCv;
  }

  function drawSplash(dt) {
    if (!splashRang) {
      splashRang = true;
      if (!sfxOff) { const pr = introSnd.play(); if (pr && pr.catch) pr.catch(() => {}); }
    }
    splashT += dt;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b0f1c");
    g.addColorStop(1, "#141a2e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const cy = H * 0.44;
    const after = splashT - SPLASH_FALL;      // 착지하고 나서 흐른 시간
    const fade = Math.min(1, splashT / 0.18) * Math.min(1, (SPLASH_SEC - splashT) / 0.45);

    /* 착지하는 순간 딱 한 번 — 별가루를 흩뿌린다 */
    if (!splashLanded && after >= 0) {
      splashLanded = true;
      const TONE = ["#ffd23f", "#35f0ff", "#ff6ab0", "#ffffff", "#9fd8ff"];
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * 6.283 + Math.random() * 0.35;
        const sp = 170 + Math.random() * 330;
        splashBits.push({ x: W / 2, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.62 - 90,
                          r: 2.4 + Math.random() * 4.2, rot: Math.random() * 6.283,
                          vr: (Math.random() - .5) * 14, life: 0.75 + Math.random() * 0.5, t: 0,
                          c: TONE[Math.floor(Math.random() * TONE.length)] });
      }
    }

    /* 떨어지는 동안엔 크고 기울어 있다가, 착지하면 가로로 눌렸다가 튕겨 오른다.
       (감쇠 진동이라 두어 번 출렁이고 저절로 멎는다) */
    let sx = 1, sy = 1, rot = 0, dy = 0, alpha = 1;
    if (after < 0) {
      const k = Math.max(0, splashT / SPLASH_FALL), e = k * k;   // 점점 빨라지며 내리꽂힌다
      sx = sy = 1.95 - 0.95 * e;
      rot = -0.26 * (1 - e);
      dy = -H * 0.40 * (1 - e);
      alpha = Math.min(1, k * 2.4);
    } else {
      const d = Math.exp(-after * 8.5);
      const w = Math.cos(after * 21);
      sx = 1 + 0.30 * d * w;
      sy = 1 - 0.30 * d * w;
      rot = 0.055 * Math.exp(-after * 6.5) * Math.sin(after * 17);
      dy = -6 * d * w;
      const br = 1 + 0.014 * Math.sin(splashT * 3.4);   // 자리 잡은 뒤의 숨결
      sx *= br; sy *= br;
      rot += 0.014 * Math.sin(splashT * 1.6);
    }
    /* 마지막에는 앞으로 튀어나오면서 사라진다 */
    const out = Math.max(0, (splashT - (SPLASH_SEC - 0.45)) / 0.45);
    if (out > 0) { sx *= 1 + 0.13 * out; sy *= 1 + 0.13 * out; dy -= 20 * out * out; }

    /* 착지 충격 — 화면이 짧게 흔들리고 흰 고리가 퍼진다 */
    let shx = 0, shy = 0;
    if (after >= 0 && after < 0.3) {
      const amp = 11 * Math.exp(-after * 13);
      shx = (Math.random() - .5) * amp; shy = (Math.random() - .5) * amp;
    }
    if (after >= 0 && after < 0.5) {
      const rk = after / 0.5;
      ctx.save();
      ctx.globalAlpha = (1 - rk) * 0.5 * fade;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5 * (1 - rk) + 1;
      ctx.beginPath();
      ctx.ellipse(W / 2, cy, 30 + rk * 250, (30 + rk * 250) * 0.34, 0, 0, 6.283);
      ctx.stroke();
      ctx.restore();
    }
    if (after >= 0 && after < 0.16) {         // 착지 섬광
      ctx.save();
      ctx.globalAlpha = (1 - after / 0.16) * 0.16;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (studioImg) {
      const bw = Math.min(W * 0.86, 360);
      const bh = studioImg.height / studioImg.width * bw;
      const sk = (splashT - SPLASH_SHINE) / SPLASH_SHINE_DUR;
      const img = (sk >= 0 && sk <= 1) ? shineImage(sk) : studioImg;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade) * alpha;
      ctx.translate(W / 2 + shx, cy + dy + shy);
      ctx.rotate(rot);
      ctx.scale(sx, sy);
      ctx.drawImage(img, -bw / 2, -bh / 2, bw, bh);
      ctx.restore();
    }

    /* 튀어 나간 별가루 — 중력을 받아 떨어지며 사라진다 */
    for (let i = splashBits.length - 1; i >= 0; i--) {
      const b = splashBits[i];
      b.t += dt;
      if (b.t >= b.life) { splashBits.splice(i, 1); continue; }
      b.vy += 900 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      const k = 1 - b.t / b.life;
      ctx.save();
      ctx.globalAlpha = k * fade;
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.beginPath();                         // 네 갈래 반짝이
      for (let j = 0; j < 4; j++) {
        const a0 = j * Math.PI / 2;
        ctx.lineTo(Math.cos(a0) * b.r * 2.3, Math.sin(a0) * b.r * 2.3);
        ctx.lineTo(Math.cos(a0 + Math.PI / 4) * b.r * 0.66, Math.sin(a0 + Math.PI / 4) * b.r * 0.66);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (splashT >= SPLASH_SEC) endSplash();
  }

  /* 대기화면 전용 그림 — 이핑이와 방울이가 함께 있는 한 장.
     이 그림은 무지개가 위, 두 캐릭터가 3분의 2 지점, 꽃밭이 아래를 채운다.
     두 캐릭터가 조금 오른쪽에 있어 9px 왼쪽으로 옮긴다.
     1.07배는 그만큼 옮기고도 좌우로 흔들릴(±4px) 자리를 남기는 데 필요한 값이고,
     위를 1.2%만 덜어 무지개를 살리면서 방울이가 시작 버튼 위에 오게 했다.

     그림 한 장이지만 가만히 있지는 않는다. 26초에 걸쳐 아주 천천히 다가갔다 물러나고,
     그 위로 색종이와 반짝임이 흐른다. 확대 폭을 1.5%로 묶은 것은, 위를 맞춰 두었기 때문에
     커진 만큼이 전부 아래로 밀려 발이 잘릴 수 있어서다.
     모두 그때그때 계산해 그리므로 받아 둘 파일은 없다. */
  const TITLE_CONF = ["#ff6b8a", "#ffd23f", "#6ee7ff", "#9be36b", "#c88bff", "#fff1a8"];
  function drawTitleArt(now) {
    const t = now / 1000;
    // 0 에서 1 사이를 왕복하는 아주 느린 물결 — 26초에 한 바퀴
    const breathe = 0.5 - 0.5 * Math.cos(t * (6.2832 / 26));
    const sc = Math.max(W / titleArt.width, H / titleArt.height) * 1.07 * (1 + 0.015 * breathe);
    const dw = titleArt.width * sc, dh = titleArt.height * sc;
    ctx.drawImage(titleArt, (W - dw) / 2 - 9 + Math.sin(t * 0.11) * 4, -dh * 0.012, dw, dh);

    /* 벚꽃잎 — 뱅글 돌며 좌우로 크게 흔들려 떨어진다.
       가로로 눌린 타원을 기울여 그리면 뒤집힐 때마다 도톰해 보인다. */
    for (let i = 0; i < 20; i++) {
      const sp = 22 + (i % 6) * 6;
      const y = ((i * 167 + t * sp) % (H + 90)) - 45;
      const x = ((i * 211 + 43) % W) + Math.sin(t * 0.55 + i * 0.9) * 34;
      const r = 4.6 + (i % 4) * 1.3;
      const spin = t * (0.9 + (i % 5) * 0.3) + i;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(spin);
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = i % 3 === 0 ? "#fff0f5" : (i % 3 === 1 ? "#ffd0e0" : "#ffb7d2");
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * Math.abs(Math.cos(spin * 0.7)) * 0.62 + r * 0.18, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }

    // 색종이 — 좌우로 살랑이며 천천히 내려온다
    for (let i = 0; i < 28; i++) {
      const sp = 17 + (i % 5) * 7;
      const y = ((i * 149 + t * sp) % (H + 80)) - 40;
      const x = ((i * 173) % W) + Math.sin(t * 0.7 + i * 1.3) * 16;
      const w = 5 + (i % 3) * 2;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * (0.5 + (i % 4) * 0.22) + i);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = TITLE_CONF[i % TITLE_CONF.length];
      ctx.fillRect(-w / 2, -w * 0.35, w, w * 0.7);
      ctx.restore();
    }

    // 반짝임 — 제자리에서 커졌다 작아지는 네 갈래 별
    for (let i = 0; i < 20; i++) {
      const ph = (t * 0.55 + i * 0.41) % 1;
      const k = Math.sin(ph * Math.PI);            // 0 에서 1 로 떴다가 다시 0
      if (k <= 0.02) continue;
      const x = (i * 97 + 37) % W;
      const y = (i * 211 + 61) % Math.round(H * 0.72);
      const r = (3.5 + (i % 3) * 2.2) * k;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = 0.85 * k;
      ctx.fillStyle = i % 4 === 0 ? "#fff1a8" : "#ffffff";
      ctx.beginPath();
      ctx.moveTo(0, -r * 2.4); ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.quadraticCurveTo(0, 0, 0, r * 2.4);
      ctx.quadraticCurveTo(0, 0, -r, 0);
      ctx.quadraticCurveTo(0, 0, 0, -r * 2.4);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  /* 타이틀 그림이 오기 전 잠깐 깔아 두는 하늘 — 그림의 색에서 뽑았다.
     이게 없으면 그 사이에 지대 배경과 달리는 인트로가 스쳐 지나간다. */
  function drawTitleWait() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#4aa8e8");
    g.addColorStop(0.62, "#bfe4f7");
    g.addColorStop(1, "#a9d67e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  function drawBackground(now) {
    if (state === STATE.READY) {
      if (titleArt) {
        /* 도착한 직후에는 기다림 하늘 위로 0.3초에 걸쳐 떠오른다 —
           두 하늘의 파랑이 조금 달라 그냥 바꾸면 툭 튄다. */
        const k = Math.min(1, (performance.now() - titleAt) / 300);
        if (k < 1) drawTitleWait();
        ctx.globalAlpha = k;
        drawTitleArt(now);
        ctx.globalAlpha = 1;
        return;
      }
      if (!titleGaveUp) { drawTitleWait(); return; }
    }
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const spaceFever = fever && inSpace();
    if (spaceFever) {                      // 우주에서는 불꽃 대신 워프하는 하늘
      const p = 0.5 + Math.sin(now / 70) * 0.5;
      g.addColorStop(0, "#12002e");
      g.addColorStop(.5, p > .5 ? "#5a1490" : "#7a1aa8");
      g.addColorStop(1, "#d22bb0");
    } else if (fever) {
      const p = 0.5 + Math.sin(now / 70) * 0.5;
      g.addColorStop(0, "#ff5a2e");
      g.addColorStop(.5, p > .5 ? "#ff9d2e" : "#ffb92e");
      g.addColorStop(1, "#ffe08a");
    } else {
      g.addColorStop(0, skyColor(0));
      g.addColorStop(.55, skyColor(1));
      g.addColorStop(1, skyColor(2));
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 지대 배경 그림. 다음 지대로 넘어가는 동안 두 장을 겹쳐 녹여서
       색만 이어지던 때처럼 끊김 없이 바뀐다.
       (뚜니핑 타임에는 불꽃 하늘이 주인공이라 그림을 걷는다) */
    let bgShown = false;
    if (fever) {
      /* 뚜니핑 하늘은 흐르지 않고 가만히 있는다.
         겹쳐 먹으면 시간이 늘어나 남은 시간을 진행도로 쓸 수 없어 시계로 흘렸는데,
         그러면 한 바퀴 돌 때마다 그림이 260px 씩 되감겨 튀면서 경계처럼 보였다. */
      const fsky = spaceFever ? feverSkySpace : feverSky;
      drawZoneImg(fsky, 1, 0.5);
      bgShown = !!fsky;
    } else {
      const i0 = zoneIdx(), i1 = Math.min(LAST_Z, i0 + 1);
      /* 그 지대 안에서의 진행도가 곧 배경이 내려온 정도다.
         마지막 지대는 진행도가 늘 0 이라 다 내려온 자리에서 멈춘다 —
         되감으면 뚜니핑 하늘과 같은 이유로 튄다.
         시작화면에서는 아예 흐르지 않는다. 아무것도 안 하고 보고 있는데
         배경만 계속 내려오면 어지럽다. 지대가 겹쳐 녹는 것은 그대로 둔다. */
      const idle = state === STATE.READY;
      drawZoneImg(ZONE_IMG[i0], 1, idle ? 0.5 : zoneFrac());
      if (i1 !== i0) drawZoneImg(ZONE_IMG[i1], zoneFrac(), idle ? 0.5 : 0);
      bgShown = !!ZONE_IMG[i0];
    }

    // 뚜니핑 타임 속도선 — 우주에서는 길게 늘어진 별빛으로
    if (fever) {
      const n = spaceFever ? 26 : 14, len = spaceFever ? 170 : 70;
      ctx.lineWidth = spaceFever ? 2 : 3;
      for (let i = 0; i < n; i++) {
        const x = ((i * 137 + now * 0.05) % (W + 40)) - 20;
        const y = ((i * 311 + now * (spaceFever ? 2.6 : 1.6)) % (H + 260)) - 130;
        ctx.strokeStyle = spaceFever
          ? (i % 5 === 0 ? "rgba(255,190,255,.55)" : "rgba(255,255,255,.55)")
          : "rgba(255,255,255,.35)";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
      }
    }

    if (!fever) {
      const nb = zv("nb"), st = zv("st"), mo = zv("mo"), au = zv("au"),
            ea = zv("ea"), rk = zv("rk"), mt = zv("mt");
      /* 별·성운·달·지구·오로라·소행성·블랙홀은 배경 그림 안에 이미 있다.
         그림이 올라와 있으면 겹쳐 그리지 않는다.
         운석만 남긴다 — 그림은 멈춰 있어서 움직이는 것이 하나는 있어야 한다. */
      if (!bgShown) {
        if (nb > 0.01) drawNebula(nb, now);
        if (st > 0.01) drawStars(st, now);
        const bh = zv("bh"), sw = zv("sw");
        if (sw > 0.01) drawSwirl(sw, now);
        if (bh > 0.01) drawBlackhole(bh, now);
        if (mo > 0.01) drawMoon(mo);
        if (au > 0.01) drawAurora(au, now);
        if (rk > 0.01) drawRocks(rk, now);
        if (ea > 0.01) drawEarth(ea);
      }
      if (mt > 0.01) drawMeteors(mt, now);
    }

    // 구름 — 올라갈수록 옅어지다 사라진다
    const cl = bgShown ? 0
             : fever ? (spaceFever ? 0 : 0.75)
                     : Math.min(0.80, zv("cl") * 0.62);
    if (cl > 0.02) {
      ctx.fillStyle = "rgba(255,255,255," + cl.toFixed(2) + ")";
      for (const c of clouds) {
        /* 덩이를 한 덩어리로 묶어 한 번에 칠한다.
           따로따로 칠하면 겹친 자리가 진해져서 동그라미 여러 개로 보인다. */
        ctx.beginPath();
        for (const L of c.lobes) {
          ctx.moveTo(c.x + L.dx + L.r, c.y + L.dy);
          ctx.arc(c.x + L.dx, c.y + L.dy, L.r, 0, 6.283);
        }
        ctx.moveTo(c.x + c.bw, c.y + c.bh * 0.4);
        ctx.ellipse(c.x, c.y + c.bh * 0.4, c.bw, c.bh, 0, 0, 6.283);
        ctx.fill();
      }
    }

    /* 발밑에서 튀어 오르는 빛 — 잔디밭이면 초록, 바위면 갈색, 달이면 잿빛.
       배경이 하늘 그림뿐이라 지금 무엇 위에 서 있는지 읽히지 않는다.
       바닥 바로 위에 그 지대의 바닥색을 얇게 깔아 두면 공기가 이어져 보인다. */
    if (bgShown && state !== STATE.READY) {
      const gt2 = GROUND_TINT[ZONES[zoneIdx()].gr];
      if (gt2) {
        const gh = 190, gy = H - GROUND_H - gh;
        const gg = ctx.createLinearGradient(0, gy, 0, H - GROUND_H);
        gg.addColorStop(0, "rgba(" + gt2 + ",0)");
        gg.addColorStop(1, "rgba(" + gt2 + ",.26)");
        ctx.fillStyle = gg;
        ctx.fillRect(0, gy, W, gh);
      }
    }

    // 발밑 — 단계가 바뀌는 동안 다음 지형이 겹쳐 올라온다
    if (state !== STATE.READY) {          // 인트로에서는 발판 없이 날아간다
      const za = ZONES[zoneIdx()], zb = ZONES[Math.min(LAST_Z, zoneIdx() + 1)], zf = zoneFrac();
      drawGround(za.gr, 1);
      if (zb.gr !== za.gr && zf > 0.45) drawGround(zb.gr, Math.min(1, (zf - 0.45) / 0.35));
    }
  }

  /* ---- 배경 조각들 ---- */
  function drawStars(a, now) {
    for (const st of STARS) {
      const tw = st.dim + (1 - st.dim) * Math.abs(Math.sin(now / st.sp + st.ph));
      const al = a * tw;
      if (al < 0.02) continue;
      const x = st.fx * W, y = st.fy * H;
      ctx.fillStyle = "rgba(" + st.col + "," + al.toFixed(3) + ")";
      if (st.kind === 0) {                         // 평범한 점
        ctx.beginPath();
        ctx.arc(x, y, st.r, 0, 6.283);
        ctx.fill();
      } else {                                     // 네 갈래로 뾰족한 반짝이
        const R = st.r * (st.kind === 2 ? 3.4 : 2.3), k = R * 0.16;
        ctx.beginPath();
        ctx.moveTo(x, y - R);
        ctx.quadraticCurveTo(x + k, y - k, x + R, y);
        ctx.quadraticCurveTo(x + k, y + k, x, y + R);
        ctx.quadraticCurveTo(x - k, y + k, x - R, y);
        ctx.quadraticCurveTo(x - k, y - k, x, y - R);
        ctx.fill();
        if (st.kind === 2) {                       // 큰 것은 빛무리까지
          const gg = ctx.createRadialGradient(x, y, 0, x, y, R * 1.5);
          gg.addColorStop(0, "rgba(" + st.col + "," + (al * 0.30).toFixed(3) + ")");
          gg.addColorStop(1, "rgba(" + st.col + ",0)");
          ctx.fillStyle = gg;
          ctx.beginPath(); ctx.arc(x, y, R * 1.5, 0, 6.283); ctx.fill();
        }
      }
    }
  }

  function drawNebula(a, now) {           // 은하수 — 커다란 색 얼룩 몇 개
    const blobs = [[0.28, 0.24, "255,120,220"], [0.74, 0.40, "120,150,255"], [0.48, 0.66, "180,110,255"]];
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i];
      const cx = b[0] * W + Math.sin(now / 9000 + i) * 18;
      const cy = b[1] * H + Math.cos(now / 11000 + i) * 14;
      const r = W * (0.42 + i * 0.06);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, "rgba(" + b[2] + "," + (a * 0.14).toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + b[2] + ",0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawBlackhole(a, now) {        // 다가갈수록 커지는 블랙홀
    const cx = W * 0.5, cy = H * 0.30;
    let R = Math.min(W, H) * (0.05 + a * a * 0.52);
    /* 마지막 단계에서는 지평선이 화면을 통째로 삼켜서 완전한 암흑이 된다.
       화면 구석까지 닿는 반지름을 구해 그보다 크게 잡는다. */
    if (a >= 1.3) {
      const need = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 10;
      R = Math.max(R, need);
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.26);
    for (let i = 0; i < 3; i++) {         // 강착원반 — 납작하게 누운 불의 고리
      const rr = R * (1.30 + i * 0.34);
      const g = ctx.createRadialGradient(0, 0, R * 0.98, 0, 0, rr);
      g.addColorStop(0, "rgba(255,186,90," + (0.42 * a).toFixed(3) + ")");
      g.addColorStop(0.5, "rgba(255,96,40," + (0.20 * a).toFixed(3) + ")");
      g.addColorStop(1, "rgba(120,16,60,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, 0, rr, rr * (0.30 + i * 0.05), 0, 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(255,222,158," + (0.8 * a).toFixed(3) + ")";   // 빛이 휘는 고리
    ctx.lineWidth = Math.max(1.5, R * 0.05);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.07, 0, 6.283); ctx.stroke();
    ctx.fillStyle = "#000";                                              // 사건의 지평선
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();
  }

  function drawSwirl(a, now) {            // 블랙홀 안 — 빨려 들어가는 빛줄기
    const cx = W * 0.5, cy = H * 0.30, far = Math.max(W, H);
    ctx.save();
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (let i = 0; i < 30; i++) {
      const r0 = 60 + ((i * 137 + now * 0.16) % (far * 1.05));
      const r1 = r0 * 0.74;
      const ang = i * 0.71 + now / 1400 + r0 * 0.004;
      const fade = a * Math.max(0, 1 - r0 / far) * 0.65;
      if (fade < 0.02) continue;
      ctx.strokeStyle = "rgba(255," + (130 + (i % 5) * 24) + ",90," + fade.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0 * 0.72);
      ctx.lineTo(cx + Math.cos(ang + 0.40) * r1, cy + Math.sin(ang + 0.40) * r1 * 0.72);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
    ctx.restore();
  }

  function drawMoon(a) {                  // 달 궤도 — 크게 떠 있는 달
    ctx.globalAlpha = a;
    const cx = W * 0.74, cy = H * 0.20, r = Math.min(W, H) * 0.15;
    ctx.fillStyle = "rgba(255,245,220,.10)";
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#ded8c8";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(160,152,136,.55)";
    const cr = [[-.34, -.22, .20], [.26, -.06, .15], [-.10, .34, .17], [.34, .38, .11]];
    for (const c of cr) {
      ctx.beginPath();
      ctx.arc(cx + c[0] * r, cy + c[1] * r, c[2] * r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawAurora(a, now) {           // 흐르는 오로라 커튼
    for (let b = 0; b < 3; b++) {
      const base = H * 0.13 + b * 30;
      const g = ctx.createLinearGradient(0, base, 0, base + 96);
      const col = b === 1 ? "120,255,190" : "160,130,255";
      g.addColorStop(0, "rgba(" + col + "," + (a * 0.24).toFixed(3) + ")");
      g.addColorStop(1, "rgba(" + col + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-20, base);
      for (let x = -20; x <= W + 20; x += 20) ctx.lineTo(x, base + Math.sin(x / 90 + now / 1500 + b * 2) * 24);
      for (let x = W + 20; x >= -20; x -= 20) ctx.lineTo(x, base + 96 + Math.sin(x / 90 + now / 1500 + b * 2) * 24);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawMeteors(a, now) {          // 스쳐 가는 별똥별 — 밝은 머리에 꼬리가 옅어진다
    ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const T = ((now / 1000) + i * 0.83) % 3.4;
      if (T > 1.15) continue;
      const q = T / 1.15;
      const fade = Math.sin(Math.PI * q);          // 스르르 나타났다 스르르 사라진다
      if (fade < 0.03) continue;
      const vx = W * (0.34 + (i % 3) * 0.16), vy = H * (0.62 + (i % 2) * 0.22);
      const d = Math.hypot(vx, vy);
      const hx = ((i * 151) % Math.max(1, W)) + q * vx;   // 머리 위치
      const hy = -60 + q * vy;
      const len = 86 + (i % 3) * 52;                      // 꼬리는 날아온 쪽으로 눕는다
      const tx = hx - vx / d * len, ty = hy - vy / d * len;
      const g = ctx.createLinearGradient(hx, hy, tx, ty);
      g.addColorStop(0, "rgba(255,255,255," + (a * fade * 0.92).toFixed(3) + ")");
      g.addColorStop(0.30, "rgba(206,228,255," + (a * fade * 0.34).toFixed(3) + ")");
      g.addColorStop(1, "rgba(170,200,255,0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(hx, hy); ctx.lineTo(tx, ty);
      ctx.stroke();
      const gh = ctx.createRadialGradient(hx, hy, 0, hx, hy, 8);
      gh.addColorStop(0, "rgba(255,255,255," + (a * fade).toFixed(3) + ")");
      gh.addColorStop(0.4, "rgba(220,235,255," + (a * fade * 0.35).toFixed(3) + ")");
      gh.addColorStop(1, "rgba(200,225,255,0)");
      ctx.fillStyle = gh;
      ctx.beginPath(); ctx.arc(hx, hy, 8, 0, 6.283); ctx.fill();
    }
    ctx.lineCap = "butt";
  }

  function drawRocks(a, now) {            // 소행성대 — 천천히 흘러가는 바위
    for (let i = 0; i < 7; i++) {
      const y = (((now * 0.014 * (1 + (i % 3))) + i * 137) % (H + 140)) - 70;
      const x = (i * 97 + 40) % Math.max(1, W);
      const r = 7 + (i % 4) * 5;
      ctx.fillStyle = "rgba(120,124,142," + (a * 0.75).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(80,84,100," + (a * 0.7).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(x + r * .3, y + r * .25, r * .4, 0, 6.283); ctx.fill();
    }
  }

  function drawEarth(a) {                 // 저궤도 — 발밑에 걸린 지구의 곡선
    ctx.globalAlpha = a;
    const R = W * 1.55, cy = H - GROUND_H + R - 30;
    ctx.fillStyle = "rgba(150,210,255,.28)";
    ctx.beginPath(); ctx.arc(W / 2, cy, R + 12, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#2f6bb5";
    ctx.beginPath(); ctx.arc(W / 2, cy, R, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.30)";
    const cl = [[-.30, .06], [.12, .02], [.40, .10]];
    for (const c of cl) {
      ctx.beginPath();
      ctx.ellipse(W / 2 + c[0] * W, cy - R + 14 + c[1] * 40, W * .18, 9, 0, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- 발밑 지형 ---- */
  // 바닥에서 튀어 오르는 빛의 색 (drawGround 의 바닥색에서 뽑았다)
  const GROUND_TINT = {
    grass: "126,200,90", rock: "170,120,70", cloud: "214,230,250",
    metal: "120,150,200", moon: "200,192,175", dark: "80,86,120", void: "120,150,255"
  };
  function drawGround(kind, a) {
    const y = H - GROUND_H;
    ctx.save();
    ctx.globalAlpha = a;
    if (kind === "grass") {
      ctx.fillStyle = "#7bbf6a"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#6aad5b"; ctx.fillRect(0, y, W, 6);
    } else if (kind === "rock") {
      ctx.fillStyle = "#8b6b4c"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#a9855f"; ctx.fillRect(0, y, W, 7);
      ctx.fillStyle = "rgba(0,0,0,.13)";
      for (let i = 0; i < 7; i++) ctx.fillRect((i * 89) % Math.max(1, W), y + 20 + ((i * 37) % 44), 28, 7);
    } else if (kind === "cloud") {
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillRect(0, y + 14, W, GROUND_H - 14);
      for (let x = -10; x < W + 50; x += 44) {
        ctx.beginPath(); ctx.arc(x, y + 16, 24, 0, 6.283); ctx.fill();
      }
      ctx.fillStyle = "rgba(190,210,235,.55)";
      ctx.fillRect(0, y + 40, W, GROUND_H - 40);
    } else if (kind === "metal") {
      // 위가 밝고 아래로 어두워지는 금속판. 촘촘한 세로줄은 실로폰처럼 보여서 뺐다.
      const mg = ctx.createLinearGradient(0, y, 0, H);
      mg.addColorStop(0, "#525d7d");
      mg.addColorStop(0.35, "#3a4260");
      mg.addColorStop(1, "#232838");
      ctx.fillStyle = mg; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#9fb4e0"; ctx.fillRect(0, y, W, 4);            // 밝은 난간
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, y + 4, W, 2);
      ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fillRect(0, y + 30, W, 1);
      ctx.fillStyle = "rgba(140,190,255,.55)";                        // 활주로 유도등
      for (let x = 34; x < W; x += 132) {
        ctx.beginPath(); ctx.arc(x, y + 17, 2.6, 0, 6.283); ctx.fill();
      }
    } else if (kind === "moon") {
      ctx.fillStyle = "#b3ada0"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#cdc7b8"; ctx.fillRect(0, y, W, 7);
      ctx.fillStyle = "rgba(120,114,102,.55)";
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc((i * 103 + 30) % Math.max(1, W), y + 26 + ((i * 29) % 34), 9 + (i % 3) * 5, 0, 6.283);
        ctx.fill();
      }
    } else if (kind === "dark") {
      ctx.fillStyle = "#2b2f40"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "#434964"; ctx.fillRect(0, y, W, 6);
      ctx.fillStyle = "rgba(0,0,0,.28)";
      for (let i = 0; i < 6; i++) ctx.fillRect((i * 79) % Math.max(1, W), y + 24 + ((i * 41) % 40), 34, 6);
    } else {                                  // void — 빛나는 발판만 남는다
      ctx.fillStyle = "rgba(16,18,30,.92)"; ctx.fillRect(0, y, W, GROUND_H);
      ctx.fillStyle = "rgba(150,190,255,.85)"; ctx.fillRect(0, y, W, 3);
      ctx.fillStyle = "rgba(120,170,255,.16)"; ctx.fillRect(0, y + 3, W, 16);
    }
    ctx.restore();
  }

  function drawPlayer(now) {
    const hurting = now < hurtUntil && sprSet().hurt.img;
    const blink = now < invUntil && Math.floor(now / 90) % 2 === 0;
    const spr = currentSprite(now);

    for (const g of ghosts) {             // 잔상 — 뒤쪽일수록 늦게 나타나 옅게 남는다
      if (!g.spr || g.t < 0) continue;
      const k = 1 - g.t / g.life;
      const gh = spriteHeight(g.spr), gw = gh * g.spr.aspect;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.tilt * 0.35 * (g.flip ? -1 : 1));
      ctx.globalAlpha = 0.5 * k;
      ctx.scale(1 + (1 - k) * 0.1, 1 + (1 - k) * 0.1);
      if (g.flip) ctx.scale(-1, 1);
      ctx.drawImage(g.spr.img, -gw * g.spr.cx, FOOT - gh, gw, gh);
      ctx.restore();
    }

    if (spr) {
      // 머리 지름을 판정원 지름과 일치시킨다 — 그림마다 머리 비율이 달라 각자의 값을 쓴다
      const sh = spriteHeight(spr);   // 판정이 작아지면 그림도 같이 작아진다
      const sw = sh * spr.aspect;
      ctx.save();
      ctx.translate(player.x, player.y);
      // 맞은 직후엔 제자리에서 아파하는 그림이라 기울이지 않는다
      const flip = sprFlipped(now);
      ctx.rotate(hurting ? 0 : player.tilt * 0.35 * (flip ? -1 : 1));
      // 아픈 그림은 잘 보이도록 깜빡임을 약하게
      ctx.globalAlpha = blink ? (hurting ? .62 : .35) : 1;

      /* 발밑 그림자 — 그림이 떠올라도 그림자는 땅에 남는다.
         높이 뜰수록 작고 옅어져서 얼마나 떠 있는지 눈으로 읽힌다. */
      const air = Math.max(0, Math.min(1, (groundY - player.y) / Math.max(1, groundY - H * FLY_TOP)));
      ctx.save();
      ctx.globalAlpha *= .22 * (1 - air * .62);
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(0, FOOT - 4 + (groundY - player.y), sw * .3 * (1 - air * .34), 7 * (1 - air * .34), 0, 0, 6.283);
      ctx.fill();
      ctx.restore();

      // 발이 항상 FOOT 선에 닿도록 아래를 기준으로 그린다 (작아져도 뜨지 않는다)
      if (flip) { ctx.save(); ctx.scale(-1, 1); }
      ctx.drawImage(spr.img, -sw * spr.cx, FOOT - sh, sw, sh);
      if (flip) ctx.restore();

      if (roidT > 0) {                      // 스테로이드 — 붉게 달아오른 근육 오라
        ctx.globalAlpha = .18 + Math.sin(now / 70) * .08;
        ctx.fillStyle = "#ff4b4b";
        ctx.beginPath(); ctx.arc(0, player.hy, player.r * hitMul() + 18, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "rgba(255,90,90,.9)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, player.hy, player.r * hitMul() + 18, 0, 6.283); ctx.stroke();
      }
      if (bubbleOn) {                       // 비누방울 보호막 — 몸에 딱 맞춘다
        const hasB = spr.brr !== undefined;
        const br = hasB ? sh * spr.brr : player.r * hitMul() + 20;
        const bcx2 = hasB ? sw * (spr.bcx - spr.cx) * (flip ? -1 : 1) : 0;
        const bcy2 = hasB ? (FOOT - sh + sh * spr.bcy) : player.hy;
        const wob = Math.sin(now / 260) * 0.04;       // 말랑하게 숨 쉰다
        ctx.save();
        ctx.translate(bcx2, bcy2);
        ctx.scale(1 + wob, 1 - wob);
        const bgd = ctx.createRadialGradient(-br * .3, -br * .35, br * .1, 0, 0, br);
        bgd.addColorStop(0, "rgba(255,255,255,.30)");
        bgd.addColorStop(.62, "rgba(190,230,255,.10)");
        bgd.addColorStop(1, "rgba(255,190,240,.22)");
        ctx.fillStyle = bgd;
        ctx.beginPath(); ctx.arc(0, 0, br, 0, 6.283); ctx.fill();
        ctx.lineWidth = 2.4; ctx.strokeStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(0, 0, br, 0, 6.283); ctx.stroke();
        ctx.lineWidth = 3.4;                          // 무지갯빛이 도는 테두리 조각
        ctx.strokeStyle = "rgba(150,225,255,.95)";
        ctx.beginPath(); ctx.arc(0, 0, br - 1, -2.5, -1.1); ctx.stroke();
        ctx.strokeStyle = "rgba(255,175,235,.85)";
        ctx.beginPath(); ctx.arc(0, 0, br - 1, 0.5, 1.7); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.9)";       // 반짝이는 점
        ctx.beginPath();
        ctx.ellipse(-br * .42, -br * .46, br * .13, br * .08, -0.6, 0, 6.283);
        ctx.fill();
        ctx.restore();
      }
      if (now < powerUntil) {
        ctx.beginPath();
        ctx.arc(0, player.hy, player.r * hitMul() + 14 + Math.sin(now / 90) * 3, 0, 6.283);
        ctx.strokeStyle = "rgba(255,255,255,.85)";
        ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
        ctx.lineDashOffset = -now / 20;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = .22 + feverT * .18;
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(0, player.hy, player.r * hitMul() + 14, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      drawShields(player.y + player.hy - player.r * hitMul() - 21);
      return;
    }

    /* ---- 이미지가 없을 때: 코드로 그린 기본 캐릭터 ---- */
    const R = DRAW_R;                      // 원본 도안 기준 반지름
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);
    ctx.scale(player.r * hitMul() / R, player.r * hitMul() / R); // 실제 크기로 축소
    ctx.globalAlpha = blink ? .35 : 1;

    ctx.save();
    ctx.globalAlpha *= .25;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, R + 26, R * .8, 9, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#f4f1ea";
    ctx.strokeStyle = "#d8d3c7";
    ctx.lineWidth = 2;
    const bw = R * 1.35, bh = 52;
    ctx.beginPath(); ctx.roundRect(-bw / 2, R * .55, bw, bh, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-bw / 2 - 13, R * .7, 14, 34, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(bw / 2 - 1, R * .7, 14, 34, 8); ctx.fill(); ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, 6.283);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = "#ffe0bd";
    ctx.fillRect(-R, -R, R * 2, R * 2);
    ctx.fillStyle = "#3b2a1d";
    ctx.beginPath(); ctx.arc(-13, -6, 4.5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -6, 4.5, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#3b2a1d"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0, 6, 12, .2, Math.PI - .2); ctx.stroke();
    ctx.fillStyle = "#6b4a2f";
    ctx.beginPath(); ctx.arc(0, -R * .55, R * .95, Math.PI, 0); ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(0, 0, R, 0, 6.283);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.stroke();

    if (now < powerUntil) {
      const t = feverT;
      ctx.beginPath();
      ctx.arc(0, 6, R + 16 + Math.sin(now / 90) * 3, 0, 6.283);
      ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -now / 20;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = .25 + t * .2;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, 6, R + 16, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    drawShields(player.y - player.r - 21);
  }

  // 머리 위에 남은 방패 수만큼 우산을 나란히 그린다
  function drawShields(y) {
    if (shields <= 0) return;
    const size = 30 * hitMul();
    const gap = size * 0.78;
    ctx.save();
    ctx.translate(player.x, y);
    ctx.font = size + "px serif";
    ctx.fillStyle = "#fff";                    // 이모지가 앞의 투명도를 물려받지 않게
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    /* 5개까지는 한 줄, 그보다 많으면 두 줄로 나눠 머리 위에 얹는다.
       (아랫줄이 원래 자리, 윗줄이 그 위) */
    const rows = shields > 5 ? 2 : 1;
    const perRow = Math.ceil(shields / rows);
    const d = size * ITEM_IMG_SCALE;
    let k = 0;
    for (let r = 0; r < rows; r++) {
      const n = Math.min(perRow, shields - k);       // 윗줄이 모자라면 그만큼만
      const start = -(n - 1) * gap / 2;
      const ry = (rows - 1 - r) * -gap * 0.82;       // 위로 한 줄씩 쌓는다
      for (let i = 0; i < n; i++, k++) {
        if (ITEM_IMG.umbrella) ctx.drawImage(ITEM_IMG.umbrella, start + i * gap - d / 2, ry - d / 2, d, d);
        else ctx.fillText("☂️", start + i * gap, ry);
      }
    }
    ctx.restore();
  }

  // 원본 그림이 '오른쪽 → 왼쪽' 방향이라, 왼쪽 → 오른쪽으로 날 때만 좌우를 뒤집는다
  function drawHelperAt(x, y, vx, vy) {
    const hh = HELPER_H * helperScale(), hw = hh * helperAspect();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(vx, -vy) * 0.8);   // 진행 방향으로 기울이기
    if (vx > 0) ctx.scale(-1, 1);            // 오른쪽으로 갈 때 반전
    ctx.drawImage(helperPic(), -hw / 2, -hh / 2, hw, hh);
    ctx.restore();
  }

  function drawHelpers() {
    if (!helperPic()) return;
    for (const hp of helpers) drawHelperAt(hp.x, hp.y, hp.vx, hp.vy);
    for (const f of fetchers) drawHelperAt(f.x, f.y, f.vx, f.vy);
  }

  /* 똥 위에 덧그리는 표정. 이모지 폰트가 기기마다 달라서 눈·입을 새로 그리는 대신
     어느 폰트에서나 자연스럽게 얹히는 장식(선글라스·눈썹·홍조 등)으로 표현한다. */
  /* 눈·입 변형 — 그림의 흰자가 순백이라 눈동자를 흰색으로 덮고 다시 그리면 이음매가 없다.
     (좌표는 assets/item_poop.png 를 픽셀 단위로 재어 넣은 값)
     입은 자홍색 영역 안에 이빨·혀를 얹기만 하므로 지울 필요가 없다. (모두 실측 좌표) */
  const SCL_R = 0.122;                  // 흰자 반지름 / 그림 크기 (새 그림 실측)
  const PUP_R = 0.078;                  // 원래 눈동자 반지름
  const PUP_C = "#141414";              // 원래 눈동자 색
  const MOU_TOP = 0.327, MOU_BOT = 0.383, MOU_HW = 0.060;   // 입 범위

  function eyeBase(S) {                 // 흰자만 남기고 눈동자를 지운다
    ctx.fillStyle = "#fff";
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(sx * EYE_X * S, EYE_Y * S, SCL_R * S * 0.99, 0, 6.283);
      ctx.fill();
    }
  }
  function pupil(S, sx, dx, dy, r) {    // 흰자 안에서만 움직이도록 가둔다
    const cx = sx * EYE_X * S, cy = EYE_Y * S;
    const lim = (SCL_R - r) * S;
    const ox = Math.max(-lim, Math.min(lim, dx * S));
    const oy = Math.max(-lim, Math.min(lim, dy * S));
    ctx.fillStyle = PUP_C;
    ctx.beginPath(); ctx.arc(cx + ox, cy + oy, r * S, 0, 6.283); ctx.fill();
  }
  /* 0 = 그림 그대로. 1~9 는 눈동자를 다시 그린다. */
  function drawPoopEyes(kind, S) {
    if (!kind) return;
    ctx.save();
    if (kind === 7 || kind === 8) {                 // 감은 눈 / 윙크
      eyeBase(S);
      ctx.strokeStyle = PUP_C;
      ctx.lineWidth = Math.max(2, S * 0.035);
      ctx.lineCap = "round";
      for (const sx of [-1, 1]) {
        if (kind === 8 && sx > 0) { pupil(S, sx, 0, 0, PUP_R); continue; }   // 윙크는 한쪽만 감는다
        const cx = sx * EYE_X * S, cy = EYE_Y * S, r = SCL_R * S * 0.72;
        ctx.beginPath();
        ctx.arc(cx, cy + r * 0.55, r, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
    eyeBase(S);
    switch (kind) {
      case 1: for (const sx of [-1, 1]) pupil(S, sx, -0.09, 0, PUP_R); break;        // 왼쪽 곁눈질
      case 2: for (const sx of [-1, 1]) pupil(S, sx,  0.09, 0, PUP_R); break;        // 오른쪽 곁눈질
      case 3: for (const sx of [-1, 1]) pupil(S, sx, 0, -0.08, PUP_R); break;        // 위 보기
      case 4: pupil(S, -1, 0.10, 0, PUP_R); pupil(S, 1, -0.10, 0, PUP_R); break;     // 사팔뜨기
      case 5: for (const sx of [-1, 1]) pupil(S, sx, 0, 0.02, PUP_R * 0.5); break;   // 콩눈
      case 6: for (const sx of [-1, 1]) pupil(S, sx, 0, 0, PUP_R * 1.45); break;     // 부릅뜬 눈
      case 9: pupil(S, -1, 0, 0, PUP_R * 1.4); pupil(S, 1, 0.03, 0.02, PUP_R * 0.55); break;   // 짝눈
    }
    ctx.restore();
  }

  /* 입 — 원래 입 안에 덧그리기만 한다. 0 = 그림 그대로. */
  function drawPoopMouth(kind, S) {
    if (!kind) return;
    ctx.save();
    const top = MOU_TOP * S, bot = MOU_BOT * S, hw = MOU_HW * S;
    if (kind === 1) {                       // 윗니
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.roundRect(-hw * 0.72, top + S * 0.004, hw * 1.44, (bot - top) * 0.34, S * 0.012);
      ctx.fill();
    } else if (kind === 2) {                // 혀
      ctx.fillStyle = "#ff7ab0";
      ctx.beginPath();
      ctx.ellipse(0, bot - (bot - top) * 0.22, hw * 0.52, (bot - top) * 0.34, 0, 0, 6.283);
      ctx.fill();
    } else if (kind === 3) {                // 송곳니
      ctx.fillStyle = "#fff";
      for (const sx of [-1, 1]) {
        const x = sx * hw * 0.52;
        ctx.beginPath();
        ctx.moveTo(x - hw * 0.13, top + S * 0.004);
        ctx.lineTo(x + hw * 0.13, top + S * 0.004);
        ctx.lineTo(x, top + (bot - top) * 0.52);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  /* 어두운 우주에서는 똥이 배경에 묻힌다. 그림의 흰 실루엣을 한 번 만들어 두고,
     그릴 때 조금 크게 뒤에 깔아 테두리처럼 보이게 한다.
     (그림자 흐림은 폰이 뜨거워져서 쓰지 않는다 — 이 방식은 그리기 한 번이면 된다) */
  const RIM_CACHE = new Map();
  const RIM_CACHE_DARK = new Map();          // 다크똥은 검은 테두리를 쓴다
  function rimOf(img, dark) {
    const cache = dark ? RIM_CACHE_DARK : RIM_CACHE;
    let c = cache.get(img);
    if (c) return c;
    c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = "source-in";   // 그림이 있는 자리만 한 가지 색으로
    g.fillStyle = dark ? "#07030f" : "#ffffff";
    g.fillRect(0, 0, c.width, c.height);
    cache.set(img, c);
    return c;
  }
  /* 지대별 배경 밝기 — 배경 그림 18장에서 실제로 잰 값.
     잔디밭 0.67 … 소행성대 0.18 … 블랙홀 안 0.20 */
  const ZONE_LUM = [0.67, 0.83, 0.83, 0.51, 0.69, 0.74, 0.61, 0.31, 0.40,
                    0.33, 0.31, 0.18, 0.46, 0.32, 0.18, 0.39, 0.41, 0.20];
  function rimPower() {                    // 0 = 테두리 없음, 1 = 가장 세게
    if (fever) return 0;                   // 뚜니핑 하늘은 눈부시게 밝다
    const a = ZONE_LUM[zoneIdx()], b = ZONE_LUM[Math.min(LAST_Z, zoneIdx() + 1)];
    const l = a + (b - a) * zoneFrac();
    return Math.max(0, Math.min(1, (0.52 - l) / 0.28));
  }
  function drawRim(img, d, rp, dark) {
    const k = Math.max(2, d * (dark ? 0.065 : 0.05));   // 검은 테두리는 조금 더 두껍게
    ctx.save();
    ctx.globalAlpha *= dark ? Math.max(rp, 0.9) : rp * 0.85;
    ctx.drawImage(rimOf(img, dark), -d / 2 - k, -d / 2 - k, d + k * 2, d + k * 2);
    ctx.restore();
  }

  /* 똥 꾸밈. 3D 그림의 눈은 가운데보다 조금 아래(y +0.124S), 좌우 ±0.221S 에 있고
     눈 반지름은 0.13S 쯤 된다 — 아래 좌표는 전부 그 실측값에 맞춰 두었다. */
  const EYE_X = 0.185, EYE_Y = 0.126, EYE_R = 0.116;
  function drawPoopFace(kind, S) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const ex = EYE_X * S, ey = EYE_Y * S, er = EYE_R * S;
    switch (kind) {
      case 2: {  // 성난 눈썹
        ctx.strokeStyle = "#2b1a10";
        ctx.lineWidth = Math.max(2, S * 0.05);
        ctx.beginPath();
        ctx.moveTo(-ex - er * 0.9, ey - er * 1.5); ctx.lineTo(-ex + er * 0.5, ey - er * 0.75);
        ctx.moveTo( ex + er * 0.9, ey - er * 1.5); ctx.lineTo( ex - er * 0.5, ey - er * 0.75);
        ctx.stroke();
        break;
      }
      case 3: {  // 선글라스
        const w = ex + er * 1.35, h = er * 1.5;
        ctx.fillStyle = "#15161c";
        ctx.beginPath();
        ctx.roundRect(-w, ey - h * 0.62, w * 2, h * 1.24, h * 0.4);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.45)";           // 렌즈 반사
        ctx.beginPath();
        ctx.roundRect(-ex - er * 0.7, ey - h * 0.42, er * 0.75, h * 0.32, h * 0.16);
        ctx.fill();
        break;
      }
      case 4: {  // 뿅 간 눈 (X) — 눈동자를 지우고 X 만 남긴다
        eyeBase(S);
        ctx.strokeStyle = "#2b1a10";
        ctx.lineWidth = Math.max(2, S * 0.045);
        for (const sx of [-1, 1]) {
          const cx = sx * ex, d = er * 0.85;
          ctx.beginPath();
          ctx.moveTo(cx - d, ey - d); ctx.lineTo(cx + d, ey + d);
          ctx.moveTo(cx + d, ey - d); ctx.lineTo(cx - d, ey + d);
          ctx.stroke();
        }
        break;
      }
      case 5: {  // 발그레한 볼
        ctx.fillStyle = "rgba(255,120,140,.6)";
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(sx * (ex + er * 1.35), ey + er * 1.15, er * 0.6, er * 0.4, 0, 0, 6.283);
          ctx.fill();
        }
        break;
      }
      case 6: {  // 식은땀
        ctx.fillStyle = "#8fd4ff";
        const x = ex + er * 1.5, y = ey - er * 2.1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + er * 0.55, y + er * 0.95, x, y + er * 1.2);
        ctx.quadraticCurveTo(x - er * 0.55, y + er * 0.95, x, y);
        ctx.fill();
        break;
      }
      case 7: {  // 분노 표시
        ctx.strokeStyle = "#ff3b3b";
        ctx.lineWidth = Math.max(2, S * 0.04);
        for (const off of [[0, 0], [er * 0.55, er * 0.4]]) {
          const x = ex + er * 0.9 + off[0], y = ey - er * 2.3 + off[1];
          ctx.beginPath();
          ctx.moveTo(x, y); ctx.lineTo(x + er * 0.5, y + er * 0.45); ctx.lineTo(x, y + er * 0.9);
          ctx.stroke();
        }
        break;
      }
      case 8: {  // 하트 눈 — 원래 눈동자는 지우고 하트만 남긴다
        eyeBase(S);
        ctx.fillStyle = "#ff3d68";
        for (const sx of [-1, 1]) {
          const cx = sx * ex, cy = ey, r = er * 1.05;
          ctx.beginPath();
          ctx.moveTo(cx, cy + r * 0.75);
          ctx.bezierCurveTo(cx - r * 1.3, cy - r * 0.25, cx - r * 0.5, cy - r * 1.2, cx, cy - r * 0.35);
          ctx.bezierCurveTo(cx + r * 0.5, cy - r * 1.2, cx + r * 1.3, cy - r * 0.25, cx, cy + r * 0.75);
          ctx.fill();
        }
        break;
      }
      case 9: {  // 별 눈 — 원래 눈동자는 지우고 별만 남긴다
        eyeBase(S);
        ctx.fillStyle = "#ffd23f";
        for (const sx of [-1, 1]) {
          const cx = sx * ex, cy = ey, r = er * 1.15;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const rr = i % 2 ? r * 0.45 : r;
            const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.closePath(); ctx.fill();
        }
        break;
      }
      case 10: {  // 왕관
        const y = ey - er * 3.0, w = ex * 1.15, h = er * 1.5;
        ctx.fillStyle = "#ffd23f";
        ctx.beginPath();
        ctx.moveTo(-w, y + h);
        ctx.lineTo(-w, y); ctx.lineTo(-w * 0.45, y + h * 0.5); ctx.lineTo(0, y - h * 0.28);
        ctx.lineTo(w * 0.45, y + h * 0.5); ctx.lineTo(w, y); ctx.lineTo(w, y + h);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ff5d8f";
        ctx.beginPath(); ctx.arc(0, y + h * 0.55, h * 0.2, 0, 6.283); ctx.fill();
        break;
      }
      case 11: {  // 리본
        const x = -ex - er * 0.55, y = ey - er * 2.15, r = er * 0.8;
        ctx.fillStyle = "#ff5d8f";
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0 + x, y);
          ctx.quadraticCurveTo(x + sx * r * 1.7, y - r, x + sx * r * 1.5, y + r * 0.35);
          ctx.quadraticCurveTo(x + sx * r * 0.9, y + r * 0.7, x, y);
          ctx.fill();
        }
        ctx.fillStyle = "#ffd23f";
        ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, 6.283); ctx.fill();
        break;
      }
      case 12: {  // 안대
        ctx.strokeStyle = "#1b1c22";
        ctx.lineWidth = Math.max(1.5, S * 0.028);
        ctx.beginPath();
        ctx.moveTo(-ex - er * 1.15, ey - er * 1.35); ctx.lineTo(ex + er * 0.85, ey - er * 0.3);
        ctx.stroke();
        ctx.fillStyle = "#1b1c22";
        ctx.beginPath();
        ctx.ellipse(-ex, ey, er * 1.25, er * 1.1, -0.15, 0, 6.283);
        ctx.fill();
        break;
      }
      case 13: {  // 콧수염
        ctx.fillStyle = "#3a2415";
        const y = ey + er * 1.5, w = er * 1.5;
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.quadraticCurveTo(sx * w * 0.6, y - er * 0.55, sx * w * 1.35, y - er * 0.15);
          ctx.quadraticCurveTo(sx * w * 0.7, y + er * 0.5, 0, y + er * 0.3);
          ctx.fill();
        }
        break;
      }
    }
    ctx.restore();
  }

  /* ⚠ 글자는 글자칸 한가운데에 그려도 잉크(실제 칠해진 부분)의 중심이 거기 있지 않다.
     기기마다 쓰는 이모지 글꼴이 달라 값을 박아 둘 수 없어, 처음 한 번 직접 재어 둔다.
     돌려주는 값은 글자 크기 대비 비율이라 크기가 바뀌어도 그대로 쓴다. */
  let warnInk = null;
  function warnInkOffset() {
    if (warnInk) return warnInk;
    warnInk = { dx: 0, dy: 0 };
    try {
      const S = 64, c = document.createElement("canvas");
      c.width = c.height = S * 2;
      const g = c.getContext("2d");
      g.font = "700 " + S + "px NanumBarunGothic, system-ui, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillStyle = "#fff";
      g.fillText("⚠", S, S);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          if (d[(y * c.width + x) * 4 + 3] > 24) {
            if (x < x0) x0 = x;
            if (x > x1) x1 = x;
            if (y < y0) y0 = y;
            if (y > y1) y1 = y;
          }
        }
      }
      if (x1 >= x0) warnInk = { dx: (S - (x0 + x1) / 2) / S, dy: (S - (y0 + y1) / 2) / S };
    } catch (e) {}                            // 못 재면 그냥 글자칸 기준으로 둔다
    return warnInk;
  }

  // 레이저가 떨어질 자리를 미리 깜빡여 알려준다 (막판일수록 빠르게)
  function drawWarnings(now) {
    const L = H - GROUND_H;
    for (const wn of warns) {
      const left = wn.t / LASER_WARN;                 // 1 → 0
      const speed = 90 + (1 - left) * 240;            // 남을수록 느리게, 임박하면 빠르게
      const on = Math.floor(now / speed) % 2 === 0;
      ctx.save();
      ctx.translate(wn.x, 0);
      ctx.rotate(-(wn.ang || 0));                     // 실제 낙하 궤적과 같은 기울기
      /* 넓은 띠는 항상 같은 밝기로 깔아둔다. 띠까지 깜빡이면 그 뒤를 지나는
         다른 똥들이 함께 깜빡이는 것처럼 보인다. 깜빡이는 건 가운데 선과 ⚠ 뿐. */
      /* 다크 레이저는 띠를 두 배 가까이 넓히고 보랏빛으로 깐다 —
         부술 수 없는 것이 온다는 걸 미리 알아보게 한다. */
      const dk = !!wn.dark;
      const halfW = dk ? 30 : 17;
      const g = ctx.createLinearGradient(0, 0, 0, L);
      g.addColorStop(0, dk ? "rgba(150,60,255,.34)" : "rgba(255,60,60,.20)");
      g.addColorStop(1, dk ? "rgba(40,0,80,.12)" : "rgba(255,60,60,.05)");
      ctx.fillStyle = g;
      ctx.fillRect(-halfW, 0, halfW * 2, L / Math.cos(wn.ang || 0));
      if (dk) {                                       // 양 끝을 진하게 둘러 테두리를 만든다
        ctx.strokeStyle = "rgba(190,110,255," + (on ? 0.8 : 0.35) + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(-halfW, 0, halfW * 2, L / Math.cos(wn.ang || 0));
      }
      ctx.strokeStyle = dk ? "rgba(210,150,255," + (on ? 1 : 0.4) + ")"
                           : "rgba(255,80,80," + (on ? 0.9 : 0.3) + ")";
      ctx.lineWidth = dk ? 5 : 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, L / Math.cos(wn.ang || 0));
      ctx.stroke();
      /* 경고 표시는 화면 맨 위가 아니라 예고선 중간쯤에 크게 띄운다.
         선을 따라 기울어진 자리로 옮긴 뒤, 글자만 다시 세운다. */
      const mid = (L / Math.cos(wn.ang || 0)) * 0.45;
      ctx.translate(0, mid);
      ctx.rotate(wn.ang || 0);
      ctx.globalAlpha = on ? 1 : 0.35;
      const fs = dk ? 56 : 46, rr = dk ? 38 : 32;
      ctx.font = "700 " + fs + "px NanumBarunGothic, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.beginPath();                       // 어두운 배경에서도 눈에 띄게 뒤에 원을 깐다
      ctx.arc(0, 0, rr, 0, 6.283);
      ctx.fillStyle = dk ? "rgba(18,0,38,.75)" : "rgba(60,0,0,.45)";
      ctx.fill();
      if (dk) {
        ctx.strokeStyle = "rgba(190,110,255,.9)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.283); ctx.stroke();
      }
      ctx.fillStyle = dk ? "#d9a8ff" : "#ff5d5d";
      const ink = warnInkOffset();           // 잉크 중심을 원 한가운데에 맞춘다
      ctx.fillText("⚠", ink.dx * fs, ink.dy * fs);
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawItems(now) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const it of items) {
      ctx.save();
      /* 떨어지는 것들은 어떤 경우에도 비쳐 보이지 않게 한다.
         앞서 그린 배경이 남긴 흐림·투명도가 여기까지 따라오지 않도록 매번 초기화한다. */
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      ctx.shadowColor = "rgba(0,0,0,0)";
      if (ctx.filter !== undefined) ctx.filter = "none";
      const bob = it.bob !== undefined ? Math.sin(it.bob) * 4 : 0;
      ctx.translate(it.x, it.y + bob);
      if (it.special === "laser") {
        ctx.rotate(Math.atan2(it.vx, it.vy));   // 굴러떨어지지 않고 진행 방향으로 눕는다
      } else {
        ctx.rotate(it.rot);
      }
      if (it.special && it.special !== "huge") {
        // 종류마다 다른 색 기운 — 미리 알아보고 피하라고 (초거대는 덩치로 이미 눈에 띈다)
        ctx.fillStyle = it.special === "split" ? "rgba(200,107,255,.34)"
                      : it.special === "zigzag" ? "rgba(70,215,255,.32)"
                      : "rgba(255,60,60,.40)";
        ctx.beginPath();
        ctx.arc(0, 0, it.size * 0.60, 0, 6.283);
        ctx.fill();
      }
      const rp = rimPower();
      const fp = (it.space && feverPoopSpace) ? feverPoopSpace : feverPoop;
      if (it.skin === "fever" && fp) {
        if (rp > 0.03) drawRim(fp, it.size, rp);
        ctx.drawImage(fp, -it.size / 2, -it.size / 2, it.size, it.size);
      } else {
        /* 색 이모지도 fillStyle 의 투명도를 그대로 따라간다.
           바로 앞에 그린 구름의 반투명 흰색이 남아 있으면 똥까지 비쳐 보인다. */
        if (it.gold) {                       // 무지개똥 — 무지갯빛으로 돌며 번쩍인다
          const fx = goldFx(now, it.x);
          const R = it.size * (0.95 + fx.puls * 0.18);
          const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
          gg.addColorStop(0, "hsla(" + fx.hue + ",100%,72%," + (0.75 + fx.puls * 0.25).toFixed(2) + ")");
          gg.addColorStop(0.42, "hsla(" + ((fx.hue + 60) % 360) + ",100%,60%," + (0.34 + fx.puls * 0.2).toFixed(2) + ")");
          gg.addColorStop(1, "hsla(" + ((fx.hue + 120) % 360) + ",100%,55%,0)");
          ctx.fillStyle = gg;
          ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();
          if (ctx.filter !== undefined) ctx.filter = fx.css;
        }
        if (it.dark) {
          /* 다크똥 — 뒤에 보랏빛 기운을 얹는다. 몸이 검어서 어두운 배경에 묻히므로,
             안쪽부터 진하게 깔아 큰 놈(대왕 다크똥)도 확실히 눈에 들게 한다. */
          const pu = 0.5 + 0.5 * Math.sin(now / 260 + it.phase);
          const R = it.size * (0.86 + pu * 0.10);
          const dg = ctx.createRadialGradient(0, 0, R * 0.52, 0, 0, R);
          dg.addColorStop(0, "rgba(178,102,255," + (0.55 + pu * 0.25).toFixed(2) + ")");
          dg.addColorStop(0.75, "rgba(120,40,220," + (0.26 + pu * 0.16).toFixed(2) + ")");
          dg.addColorStop(1, "rgba(60,0,130,0)");
          ctx.fillStyle = dg;
          ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();
        }
        if (it.wak) {                        // 주먹에 맞은 똥 — 붉은 테두리 (사람을 해치지 않는다)
          ctx.fillStyle = "rgba(255,110,90,.30)";
          ctx.beginPath(); ctx.arc(0, 0, it.size * 0.72, 0, 6.283); ctx.fill();
          ctx.strokeStyle = "rgba(255,180,150,.9)"; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(0, 0, it.size * 0.72, 0, 6.283); ctx.stroke();
        }
        // 똥도 같은 3D 그림 (무지개똥 필터는 그림에도 먹는다). 다크똥만 제 그림을 쓴다.
        const ii = it.dark ? (ITEM_IMG.darkpoop || ITEM_IMG[it.type]) : ITEM_IMG[it.type];
        if (ii) {
          const d = it.size * ITEM_IMG_SCALE;
          // 무지개똥은 저 혼자 번쩍여서 테두리가 필요 없다
          if ((rp > 0.03 || it.dark) && !it.gold) drawRim(ii, d, rp, it.dark);
          ctx.drawImage(ii, -d / 2, -d / 2, d, d);
        } else {
          ctx.fillStyle = "#fff";
          ctx.font = it.size + "px serif";
          ctx.fillText(it.emoji, 0, 0);
        }
        if (ctx.filter !== undefined) ctx.filter = "none";
        if (it.type === "poop" && it.size >= 28 && !it.gold && !it.dark) {
          if (!EYE_COVER[it.face]) drawPoopEyes(it.eye || 0, it.size);
          drawPoopMouth(it.mouth || 0, it.size);
          if (it.face > 1) drawPoopFace(it.face, it.size);
        }
      }
      ctx.restore();
    }
  }

  // 위쪽 두 봉우리가 둥글고 아래가 뾰족한 통통한 하트
  function heartPath(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + r * 1.00);
    ctx.bezierCurveTo(cx - r * 0.62, cy + r * 0.45, cx - r * 1.32, cy - r * 0.05, cx - r * 1.32, cy - r * 0.52);
    ctx.bezierCurveTo(cx - r * 1.32, cy - r * 1.06, cx - r * 0.72, cy - r * 1.28, cx - r * 0.34, cy - r * 0.92);
    ctx.bezierCurveTo(cx - r * 0.16, cy - r * 0.75, cx - r * 0.05, cy - r * 0.60, cx, cy - r * 0.50);
    ctx.bezierCurveTo(cx + r * 0.05, cy - r * 0.60, cx + r * 0.16, cy - r * 0.75, cx + r * 0.34, cy - r * 0.92);
    ctx.bezierCurveTo(cx + r * 0.72, cy - r * 1.28, cx + r * 1.32, cy - r * 1.06, cx + r * 1.32, cy - r * 0.52);
    ctx.bezierCurveTo(cx + r * 1.32, cy - r * 0.05, cx + r * 0.62, cy + r * 0.45, cx, cy + r * 1.00);
    ctx.closePath();
  }

  function drawHud() {
    ctx.save();
    const top = 14;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = "700 21px NanumBarunGothic, system-ui, sans-serif";
    // 100점 단위로만 바뀐다 — 생존 점수 때문에 뒷자리가 계속 떨리는 것을 막는다
    const stxt = (Math.floor(scoreShown / 100) * 100).toLocaleString();
    const pk = scorePunch;
    ctx.save();
    ctx.translate(16, top);
    if (pk > 0.01) {
      ctx.scale(1 + pk * 0.15, 1 + pk * 0.15);   // 더 키우면 아래 지대 이름을 덮는다
      ctx.shadowColor = "rgba(255,196,60," + (0.9 * pk).toFixed(2) + ")";
      ctx.shadowBlur = 6 + pk * 18;
    }
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillText(stxt, 1, 1);
    ctx.fillStyle = "rgb(255," + Math.round(255 - 45 * pk) + ","
                              + Math.round(255 - 192 * pk) + ")";
    ctx.fillText(stxt, 0, 0);
    ctx.restore();


    ctx.font = "600 13px NanumBarunGothic, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(ZONES[zoneIdx()].ic + " " + ZONES[zoneIdx()].nm, 17, top + 32);


    // 목숨은 이모지 대신 직접 그린다.
    // iOS 이모지는 지정한 상단선보다 위로 튀어나와서 화면 밖으로 잘리는 문제가 있었다.
    if (testMode) {
      ctx.font = "700 12px NanumBarunGothic, system-ui, sans-serif";
      ctx.fillStyle = "#ff7b7b";
      ctx.fillText("TEST  목숨 ∞", 17, top + 54);
      /* 점수가 어디서 왔는지 — 많이 준 것부터. 어느 축이 세고 약한지 바로 보인다. */
      const rows = SRC_KEYS.filter(k => scoreSrc[k] > 0)
                           .sort((a, b) => scoreSrc[b] - scoreSrc[a]);
      const sum = rows.reduce((t, k) => t + scoreSrc[k], 0) || 1;
      ctx.font = "700 11px NanumBarunGothic, system-ui, sans-serif";
      if (rows.length) {                     // 낙하물이 지나가도 읽히도록 받침을 깐다
        let wide = 0;
        for (const k of rows) {
          const t2 = Math.round(scoreSrc[k]).toLocaleString() + "  "
                   + Math.round(scoreSrc[k] / sum * 100) + "%";
          wide = Math.max(wide, 54 + ctx.measureText(t2).width);
        }
        ctx.fillStyle = "rgba(8,14,28,.55)";
        ctx.beginPath();
        ctx.roundRect(13, top + 66, wide + 18, rows.length * 14 + 8, 6);
        ctx.fill();
      }
      let sy = top + 72;
      for (const k of rows) {
        ctx.fillStyle = "#9fd4ff";
        ctx.fillText(k, 18, sy);
        ctx.fillStyle = "#fff";
        ctx.fillText(Math.round(scoreSrc[k]).toLocaleString() + "  "
                     + Math.round(scoreSrc[k] / sum * 100) + "%", 72, sy);
        sy += 14;
      }
    }
    // 보유 증강 — 오른쪽 위 하트 아래에 붙인다 (우산은 머리 위에 이미 보이므로 제외)
    const owned = AUGMENTS.filter(a => augCount[a.id] && !a.noCount);
    if (owned.length) {
      // 오른쪽에 붙되 화면 절반을 넘지 않는다 — 넘치면 아랫줄로 접는다
      const augLeft = W * 0.5;
      let x = W - 16, ay = top + (lives > 20 ? 82 : lives > 10 ? 62 : 44);   // 하트 줄 수만큼 아래로
      for (let i = owned.length - 1; i >= 0; i--) {
        const a = owned[i], n = augCount[a.id];
        const wItem = n > 1 ? 30 : 21;
        if (x - wItem < augLeft) { x = W - 16; ay += 21; }   // 한 줄에 안 들어가면 아랫줄로
        x -= wItem;
        ctx.font = "15px serif";
        ctx.fillStyle = "#fff";
        ctx.fillText(a.ic, x, ay);
        if (n > 1) {
          ctx.font = "700 10px NanumBarunGothic, system-ui, sans-serif";
          ctx.fillStyle = "#ffd23f";
          ctx.fillText("x" + n, x + 16, ay + 4);
        }
      }
    }

    // 하트가 많으면 작게 그리고 10개 단위로 줄을 바꾼다 (헬스걸은 최대 20개)
    if (job === "powerp") {                 // 무소유 — 무피격으로 버틴 시간
      ctx.textAlign = "right";
      ctx.font = "700 13px NanumBarunGothic, system-ui, sans-serif";
      ctx.fillStyle = "#ffe08a";
      ctx.fillText("🧘 " + Math.floor(noHitSec) + "초", W - 16, top + 44);
      ctx.textAlign = "left";
    }
    if (dirtJob()) {                        // 방울이 — 하트 대신 오염도 막대
      const bw = 96, bh = 12, bx = W - 16 - bw, by = top + 9;
      const k = Math.max(0, Math.min(1, dirtShown / DIRT_MAX));
      ctx.fillStyle = "rgba(5,8,20,.55)";
      ctx.beginPath(); ctx.roundRect(bx - 2, by - 2, bw + 4, bh + 4, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.14)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill();
      if (k > 0) {                          // 깨끗할수록 파랗고, 더러울수록 탁한 갈색
        const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
        g.addColorStop(0, "#6ea86a");
        g.addColorStop(1, k > 0.7 ? "#7a4a22" : "#b08a3c");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.roundRect(bx, by, Math.max(4, bw * k), bh, 5); ctx.fill();
      }
      ctx.strokeStyle = "rgba(255,255,255,.30)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.stroke();
    }
    const hr = lives > 5 ? 7.5 : 10.5, hgap = lives > 5 ? 18 : 30;
    for (let i = 0; dirtJob() ? false : i < lives; i++) {
      const cx = W - 18 - hr * 1.32 - (i % 10) * hgap;
      const hy = top + 16 + Math.floor(i / 10) * 19;
      ctx.fillStyle = "rgba(70,8,20,.32)";                // 그림자
      heartPath(cx, hy + 2.5, hr * 1.06);
      ctx.fill();
      ctx.fillStyle = "#ff3d6a";
      heartPath(cx, hy, hr);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.7)";             // 광택
      ctx.beginPath();
      ctx.ellipse(cx - hr * 0.55, hy - hr * 0.62, hr * 0.30, hr * 0.20, -0.56, 0, 6.283);
      ctx.fill();
    }

    /* 뚜니핑 타임 — 예전엔 한가운데에 글자와 막대를 놓아서 정작 똥이
       쏟아지는 자리를 가렸다. 남은 시간은 위쪽 알약 하나로 줄이고,
       크게 알리는 일은 시작하는 순간 한 번만 한다. */
    const tn = performance.now();
    if (fever) {
      /* 화면 한가운데. 예전처럼 글자와 막대를 따로 두지 않고 하나로 합쳐,
         가로로 길고 세로로 얇게 눕혀서 가리는 넓이를 줄였다.
         남은 시간은 양쪽에서 가운데로 좁혀 들어온다 — 끝이 다가오는 게 보인다. */
      const sp = inSpace();
      const bh = 20, br = bh / 2;
      const bw = Math.min(304, W - 56), bx = (W - bw) / 2;
      const by = Math.round(H / 2 - bh / 2);
      const pulse = 0.5 + 0.5 * Math.sin(tn / 150);
      const lw = bw * feverT, lx = W / 2 - lw / 2;   // 가운데를 기준으로 좁혀진다

      ctx.save();                                    // 바깥 번짐
      ctx.shadowColor = sp ? "rgba(226,110,255,.85)" : "rgba(255,168,42,.85)";
      ctx.shadowBlur = 10 + pulse * 12;
      ctx.fillStyle = "rgba(20,9,3,.42)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, br); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, br); ctx.clip();
      const fg = ctx.createLinearGradient(bx, by, bx + bw, by);
      if (sp) { fg.addColorStop(0, "#7ad4ff"); fg.addColorStop(.5, "#c65cff");
                fg.addColorStop(1, "#ff5ae0"); }
      else    { fg.addColorStop(0, "#ffe98a"); fg.addColorStop(.5, "#ffb32e");
                fg.addColorStop(1, "#ff6a2e"); }
      ctx.fillStyle = fg;
      ctx.fillRect(lx, by, lw, bh);
      // 훑고 지나가는 빛 — 멈춰 있지 않다는 표시
      const shx = ((tn / 5) % (bw + 120)) - 60;
      const sg = ctx.createLinearGradient(bx + shx - 40, 0, bx + shx + 40, 0);
      sg.addColorStop(0, "rgba(255,255,255,0)");
      sg.addColorStop(.5, "rgba(255,255,255,.42)");
      sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sg;
      ctx.fillRect(lx, by, lw, bh);
      ctx.fillStyle = "rgba(255,255,255,.18)";       // 위쪽 광택
      ctx.fillRect(bx, by, bw, bh * 0.44);
      ctx.restore();

      ctx.lineWidth = 1.4;
      ctx.strokeStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.roundRect(bx + .7, by + .7, bw - 1.4, bh - 1.4, br); ctx.stroke();

      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "800 12px NanumBarunGothic, system-ui, sans-serif";
      ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(46,12,0,.66)";
      ctx.strokeText("뚜니핑 타임", W / 2, by + bh / 2 + 0.5);
      ctx.fillStyle = "#fff";
      ctx.fillText("뚜니핑 타임", W / 2, by + bh / 2 + 0.5);
      ctx.textBaseline = "top";
    }

    // 시작하는 순간에만 크게 터진다 — 튀어나왔다가 사라진다
    if (feverBanner > 0) {
      const pr = 1 - feverBanner;                          // 0 → 1
      const pop = Math.min(1, pr / 0.22);
      const sc = 0.62 + 0.55 * (1 - Math.pow(1 - pop, 3)); // 0.62 → 1.17
      const al = Math.min(1, feverBanner / 0.32);          // 끝에서 스르르 사라진다
      const by = H * 0.30;
      ctx.save();
      ctx.globalAlpha = al;
      ctx.translate(W / 2, by);
      ctx.scale(sc, sc);
      const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 160);
      gl.addColorStop(0, inSpace() ? "rgba(210,110,255,.45)" : "rgba(255,190,70,.45)");
      gl.addColorStop(1, "rgba(255,190,70,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0, 0, 160, 0, 6.283); ctx.fill();

      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "900 34px NanumBarunGothic, system-ui, sans-serif";
      ctx.lineWidth = 8; ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(52,14,0,.7)";
      ctx.strokeText("뚜니핑 타임!", 0, 0);
      const tg = ctx.createLinearGradient(0, -20, 0, 20);
      tg.addColorStop(0, "#fffdf0");
      tg.addColorStop(1, inSpace() ? "#ffb0f4" : "#ffd23f");
      ctx.fillStyle = tg;
      ctx.fillText("뚜니핑 타임!", 0, 0);
      ctx.restore();
      ctx.textBaseline = "top";
    }
    ctx.restore();
  }

  function drawEffects() {
    // 성난 우산 폭발 — 퍼져 나가는 파동
    if (umbBlast) {
      const k = 1 - umbBlast.t / 0.42;                 // 0 → 1
      const rr = umbBlast.r * (0.25 + 0.75 * k);
      ctx.save();
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.strokeStyle = "#9fd4ff";
      ctx.lineWidth = 8 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(umbBlast.x, umbBlast.y, rr, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = (1 - k) * 0.28;
      const g = ctx.createRadialGradient(umbBlast.x, umbBlast.y, rr * 0.55, umbBlast.x, umbBlast.y, rr);
      g.addColorStop(0, "rgba(126,200,255,0)");
      g.addColorStop(1, "rgba(126,200,255,.85)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(umbBlast.x, umbBlast.y, rr, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    // 벼랑 끝 분신술 — 작은 이재가 날아간다
    if (clones.length) {
      const S = sprSet();
      const ci = (S.right && S.right.img) ? S.right : (SPR.right.img ? SPR.right : null);
      for (const c of clones) {
        if (ci) {
          const h = 69, w = h * ci.aspect;      // 1.5배 키움
          ctx.drawImage(ci.img, c.x - w / 2, c.y - h / 2, w, h);
        } else {
          ctx.font = "39px serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillStyle = "#fff";
          ctx.fillText("🏃", c.x, c.y);
        }
      }
    }
    // 갤러그 — 총알과 우주선
    if (bullets.length) {
      if (aug.wak) {                              // 고무고무노 피스톨 — 조그만 주먹
        for (const bu of bullets) drawFist(bu.x, bu.y);
      } else {
        ctx.fillStyle = "#9fe8ff";
        for (const bu of bullets) ctx.fillRect(bu.x - 2, bu.y - 9, 4, 18);
      }
    }
    for (const b of wakBooms) {                   // 주먹 폭발 — 50px 까지 퍼지는 고리
      const k = b.t / 0.35;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = "#ff8a6a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, 50 * (0.3 + 0.7 * k), 0, 6.283); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (aug.galaga > 0) {
      const sy = H - GROUND_H * 0.55, tn = performance.now();   // drawEffects 에는 now 가 없다
      for (let k = 0; k < aug.galaga; k++) drawShip(shipX(k, aug.galaga), sy, tn + k * 137);
    }
    // 도박사의 비둘기
    for (const c of doves) drawDove(c.x, c.y, c.ph, c.t);
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    // 터진 비누방울 — 테두리가 얇아지며 퍼지고, 물방울이 사방으로 튄다
    for (const bp of bubPops) {
      const k = bp.t / bp.life;
      const rr = bp.r * (1 + 0.52 * k);
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.lineWidth = 3.2 * (1 - k) + 0.4;
      ctx.strokeStyle = "rgba(255,255,255,.92)";
      ctx.beginPath(); ctx.arc(bp.x, bp.y, rr, 0, 6.283); ctx.stroke();
      ctx.strokeStyle = "rgba(170,232,255,.85)";      // 무지갯빛이 남는 조각
      ctx.beginPath(); ctx.arc(bp.x, bp.y, rr, -2.5, -1.1); ctx.stroke();
      ctx.strokeStyle = "rgba(255,186,238,.8)";
      ctx.beginPath(); ctx.arc(bp.x, bp.y, rr, 0.5, 1.7); ctx.stroke();
      for (const dt2 of bp.dots) {                    // 튀는 물방울
        const d = bp.r * 0.92 + dt2.sp * bp.t;
        const px = bp.x + Math.cos(dt2.a) * d;
        const py = bp.y + Math.sin(dt2.a) * d + 460 * bp.t * bp.t;
        ctx.fillStyle = dt2.c;
        ctx.beginPath();
        ctx.arc(px, py, dt2.rr * (1 - k * 0.55), 0, 6.283);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // 퍼지는 고리 — 큰 점수가 터진 자리
    for (const rg of rings) {
      const k = rg.t / rg.life;
      const rr = rg.r1 * (0.14 + 0.86 * (1 - Math.pow(1 - k, 2)));
      ctx.globalAlpha = (1 - k) * 0.7;
      ctx.strokeStyle = rg.color;
      ctx.lineWidth = 1 + 5 * (1 - k);
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rr, 0, 6.283); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, 1 - Math.pow(f.t / f.life, 2));
      /* 튀어나왔다가 제자리로 — 눈이 먼저 글자를 잡게 만든다 */
      let sc = 1;
      if (f.pop) {
        if (f.t < 0.16) sc = 0.5 + 1.75 * f.t;                    // 0.50 → 1.28
        else if (f.t < 0.34) sc = 1.28 - 1.556 * (f.t - 0.16);    // 1.28 → 1.00
      }
      ctx.save();
      ctx.translate(f.x, f.y);
      if (sc !== 1) ctx.scale(sc, sc);
      ctx.font = "800 " + (f.size || 22) + "px NanumBarunGothic, system-ui, sans-serif";
      ctx.lineWidth = f.tier >= 1 ? 6 : 4;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(0,0,0,.42)";
      ctx.strokeText(f.text, 0, 0);
      if (f.tier >= 1) {                       // 큰 것만 금빛이 흐른다
        const tg = ctx.createLinearGradient(0, -f.size * 0.6, 0, f.size * 0.6);
        tg.addColorStop(0, "#fffdf0");
        tg.addColorStop(1, f.color);
        ctx.fillStyle = tg;
      } else {
        ctx.fillStyle = f.color;
      }
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (bulletT > 0) {                    // 인터스텔라 — 세상이 파랗게 잠긴다
      ctx.fillStyle = "rgba(110,170,255,.08)";
      ctx.fillRect(0, 0, W, H);
    }
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,60,60," + (flash * .35) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (feverFlash > 0) {
      ctx.fillStyle = "rgba(255,240,180," + (feverFlash * .6) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* 화면이 멈춰 있거나 메뉴일 때는 초당 그리는 장수를 줄여 발열·배터리를 아낀다.
     게임 중(PLAY)은 예전 그대로 60fps. */
  let lastPaint = 0;
  function frameCap() {
    if (state === STATE.PLAY) return 0;                       // 제한 없음
    if (state === STATE.PAUSE) return resumeCountEnd ? 0 : 10; // 카운트다운 중에는 부드럽게
    if (state === STATE.AUG) return 10;                        // 증강 고르는 중
    return 30;                                                 // 인트로·게임오버 화면
  }

  function frame(now) {
    const cap = frameCap();
    if (cap && now - lastPaint < 1000 / cap - 1) { requestAnimationFrame(frame); return; }
    lastPaint = now;
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (splashOn) {            // 제작사 스플래시가 끝나기 전에는 게임을 돌리지 않는다
      ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
      drawSplash(dt);
      requestAnimationFrame(frame);
      return;
    }

    update(dt, now);
    magHum(state === STATE.PLAY ? magNear * magNear : 0);   // 가까울수록 가파르게 커진다
    syncBgm();                 // 화면이 바뀌면 배경음악도 따라 바뀐다
    bgmTick(dt);               // 곡이 끝나갈 때 처음과 겹쳐 이어 붙인다

    ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawBackground(now);
    if (state === STATE.READY) {
      if (!titleArt && titleGaveUp) drawIntro(now);   // 정말 못 받았을 때만 예전 인트로로
    } else {
      drawWarnings(now);
      drawItems(now);
      drawHelpers();
      if (state !== STATE.OVER) drawPlayer(now);
    }
    drawEffects();
    ctx.restore();
    if (state === STATE.PLAY || state === STATE.PAUSE) drawHud();
    if (dpad.classList.contains("on")) dpad.classList.toggle("noVert", !flyOn);

    // 일시정지 해제 카운트다운 — 3, 2, 1 을 크게 세고 나서 움직인다
    if (state === STATE.PAUSE && resumeCountEnd > 0) {
      const leftMs = resumeCountEnd - now;
      if (leftMs <= 0) {
        finishResume(now);
      } else {
        const n = Math.ceil(leftMs / 1000);
        const frac = 1 - ((leftMs % 1000) / 1000);        // 숫자마다 커졌다 사라진다
        ctx.save();
        ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
        ctx.fillStyle = "rgba(0,0,0,.35)";
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1 - frac * 0.6;
        ctx.fillStyle = "#ffd23f";
        ctx.font = "800 " + Math.round(90 + frac * 40) + "px NanumBarunGothic, system-ui, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(n, W / 2, H * 0.45);
        ctx.restore();
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
